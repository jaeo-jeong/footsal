                for (let c = 0; c < this.COLS; c++) {
                    let r = 0;
                    while (r < this.ROWS) {
                        const t = this.grid[r][c];
                        if (!t || t.blocker) { r++; continue; }
                        let len = 1;
                        while (r + len < this.ROWS && this.grid[r+len][c] && !this.grid[r+len][c].blocker && this.grid[r+len][c].type === t.type) len++;
                        if (len >= 3) {
                            const cells = [];
                            for (let i = 0; i < len; i++) cells.push({ r: r + i, c });
                            groups.push({ cells, dir: 'v', type: t.type, len });
                        }
                        r += Math.max(1, len);
                    }
                }
                return groups;
            },

            // ===== GAME LOOP =====
            gameLoop(ts) {
                if (this.gameOver) return;
                if(this.paused)return;
                const dt = Math.min((ts - this._lastTime) / 1000, 0.05);
                this._lastTime = ts; this._frame++;
                this.elapsed += dt;

                // Donghyun advances
                const level = this.getLevel();
                if (level > this._maxLevel) this._maxLevel = level;
                const speed = this.getAdvanceSpeed();
                const canAct=['idle','swapping','reverting'].includes(this.animState);
                if(!this.feverActive&&canAct){
                    this.position = Math.min(100, this.position + speed * dt);
                }
                // Danger check
                if (this.position >= 95) {
                    if(canAct)this._dangerTimer += dt;
                    if (this._dangerTimer >= 3) { this.failGame(); return; }
                } else {
                    this._dangerTimer = 0;
                }
                // Fever decay
                if (this.feverActive) {
                    this.feverTimer -= dt;
                    this._feverFlash += dt;
                    if (this.feverTimer <= 0) { this.feverActive = false; this.feverGauge = 0; this._feverFlash = 0; }
                } else {
                    this.feverGauge = Math.max(0, this.feverGauge - 3 * dt);
                }
                // Animation state machine
                if (this.animState !== 'idle') {
                    this.animProgress += dt / this.animDuration;
                    if (this.animProgress >= 1) { this.animProgress = 1; this._advanceState(); }
                }
                // Timers
                if (this._shakeTime > 0) this._shakeTime = Math.max(0, this._shakeTime - dt);
                if (this._chainTimer > 0) this._chainTimer -= dt;
                if (this._shuffleTimer > 0) this._shuffleTimer -= dt;
                if (this._speechTimer > 0) this._speechTimer -= dt;
                this._posDisplay += (this.position - this._posDisplay) * 5 * dt;
                // Special FX timers
                this._specialFx = this._specialFx.filter(fx => { fx.t -= dt; return fx.t > 0; });
                // Random speech
                if (Math.random() < 0.002 * dt * 60) {
                    this._speechText = this.speeches[Math.floor(Math.random() * this.speeches.length)];
                    this._speechTimer = 2;
                }
                // Check valid moves (only when grid changed, not every frame)
                if (this.animState === 'idle' && this._needsValidCheck) {
                    this._needsValidCheck = false;
                    if (!this._hasValidMoves()) {
                        this._shuffleGrid();
                        this._needsValidCheck = true; // re-check after shuffle
                    }
                }
                // Blocker spawning
                if (this.animState === 'idle' && level >= 2) {
                    this._lastBlockerSpawn += dt;
                    if(this._lastBlockerSpawn>FootballGameRules.puzzle(this.elapsed).blockerInterval){this._lastBlockerSpawn=0;this._maybeSpawnBlockers();}
                }

                const pressing=this.elapsed>=45&&(this.elapsed-45)%18<4;
                if(pressing&&!this._pressureActive){this._speechText='전방 압박! 연쇄로 밀어내!';this._speechTimer=3;}
                this._pressureActive=pressing;
                this._render();
                ParticleSystem.update(dt);
                this.updateHud();
                this._rafId = requestAnimationFrame(t => this.gameLoop(t));
            },

            // ===== ANIMATION STATE MACHINE =====
            _advanceState() {
                switch (this.animState) {
                    case 'swapping': {
                        const {r1,c1,r2,c2} = this._swapData;
                        [this.grid[r1][c1], this.grid[r2][c2]] = [this.grid[r2][c2], this.grid[r1][c1]];
                        const groups = this._findMatchGroups();
                        if(!groups.length&&(this.grid[r1][c1]?.special||this.grid[r2][c2]?.special))groups.push({cells:[{r:r1,c:c1},{r:r2,c:c2}],dir:r1===r2?'h':'v',type:this.grid[r1][c1].type,len:2});
                        if (groups.length > 0) {
                            this.chainCount = 1;
                            this._startMatching(groups);
                        } else {
                            [this.grid[r1][c1], this.grid[r2][c2]] = [this.grid[r2][c2], this.grid[r1][c1]];
                            this.animState = 'reverting'; this.animProgress = 0; this.animDuration = 0.15;
                        }
                        break;
                    }
                    case 'reverting':
                        this.animState = 'idle'; this.selected = null;
                        break;
                    case 'matching': {
                        this._completeMatch();
                        this._startFalling();
                        break;
                    }
                    case 'falling': {
                        this._completeFalling();
                        this._startRefilling();
                        break;
                    }
                    case 'refilling': {
                        this._completeRefilling();
                        const groups = this._findMatchGroups();
                        if (groups.length > 0) {
                            this.chainCount++;
                            if (this.chainCount > this.maxChain) this.maxChain = this.chainCount;
                            this._startMatching(groups);
                        } else {
                            this.chainCount = 0;
                            this.animState = 'idle';
                            this._needsValidCheck = true;
                        }
                        break;
                    }
                }
            },

            _startMatching(groups) {
                this.animState = 'matching'; this.animProgress = 0; this.animDuration = 0.25;
                if (groups.length > 0) this._lastMatchedType = groups[0].type;
                const allCells = new Set();
                const cellGroupCount = {};
                groups.forEach(g => {
                    g.cells.forEach(cell => {
                        const key = cell.r + ',' + cell.c;
                        allCells.add(key);
                        cellGroupCount[key] = (cellGroupCount[key] || 0) + 1;
                    });
                });
                // Determine specials (only use swap data for first chain, not cascade chains)
                this._pendingSpecials = [];
                const swp = this.chainCount === 1 ? this._swapData : null;
                for (const g of groups) {
                    if (g.len >= 5) {
                        const pos = (swp && allCells.has(swp.r2+','+swp.c2)) ? {r:swp.r2,c:swp.c2} : g.cells[Math.floor(g.len/2)];
                        this._pendingSpecials.push({ ...pos, special: 'bomb' });
                    } else if (g.len === 4) {
                        const pos = (swp && allCells.has(swp.r2+','+swp.c2)) ? {r:swp.r2,c:swp.c2} : g.cells[1];
                        this._pendingSpecials.push({ ...pos, special: g.dir === 'h' ? 'lineH' : 'lineV' });
                    }
                }
                // L/T cross detection
                for (const [key, cnt] of Object.entries(cellGroupCount)) {
                    if (cnt >= 2) {
                        const [r,c] = key.split(',').map(Number);
                        if (!this._pendingSpecials.some(s => s.r === r && s.c === c)) {
                            this._pendingSpecials.push({ r, c, special: 'cross' });
                        }
                    }
                }
                this._matchedCells = [...allCells].map(k => { const [r,c] = k.split(',').map(Number); return {r,c}; });
                // Expanded explosions may reach another special; each tile fires once.
                const activated=new Set();
                for(let i=0;i<this._matchedCells.length;i++){
                    const {r,c}=this._matchedCells[i],key=r+','+c;
                    const tile = this.grid[r][c];
                    if(tile?.special&&!tile.blocker&&!activated.has(key)){activated.add(key);this._activateSpecial(r,c,tile.special);}
                }
                // Damage adjacent blockers
                const blockerDamaged = new Set();
                this._matchedCells.forEach(({r,c}) => {
                    [[r-1,c],[r+1,c],[r,c-1],[r,c+1]].forEach(([nr,nc]) => {
                        if (nr >= 0 && nr < this.ROWS && nc >= 0 && nc < this.COLS) {
                            const t = this.grid[nr][nc];
                            if (t && t.blocker && !blockerDamaged.has(nr+','+nc)) {
                                blockerDamaged.add(nr+','+nc);
                                t.blockerHP--;
                                if (t.blockerHP <= 0) {
                                    t.blocker = null; t.blockerHP = 0;
                                    t.type = this.TYPES[Math.floor(Math.random() * this.TYPES.length)];
                                    this.blockerCleared++;
                                    this.score += 40;
                                }
                            }
                        }
                    });
                });
                // Scoring & pushback
                const matchCount = this._matchedCells.length;
                let pushback = 0;
                groups.forEach(g => {
                    if (g.len >= 5) pushback += 18;
                    else if (g.len === 4) pushback += 10;
                    else pushback += 5;
                });
                const chainMult = 1 + (this.chainCount - 1) * 0.5;
                pushback = Math.round(pushback * chainMult);
                if (this.feverActive) pushback *= 2;
                this.position = Math.max(0, this.position - pushback);
                if(this.position<95)this._dangerTimer=0;
                // Score
                let basePoints = 0;
                groups.forEach(g => { basePoints += g.len >= 5 ? 100 : g.len === 4 ? 60 : 30; });
                basePoints = Math.round(basePoints * chainMult);
                if (this.feverActive) basePoints *= 3;
                this.score += basePoints;
                this.totalMatches += groups.length;
                // Fever charge
                this.addFever(this.chainCount * 8 + (this._pendingSpecials.length > 0 ? 15 : 0));
                // Effects
                SoundManager.play(this.chainCount >= 3 ? 'combo' : this.chainCount >= 2 ? 'streak' : 'click');
                if (this.chainCount >= 2) {
                    this._chainText = 'x' + this.chainCount + ' 체인!';
                    this._chainTimer = 1;
                    this._shakeTime = 0.2; this._shakeIntensity = 2 + this.chainCount;
                }
                // Particles
                const ts = this.tileSize;
                this._matchedCells.forEach(({r,c}) => {
                    const px = this.gridX + c * ts + ts / 2, py = this.gridY + r * ts + ts / 2;
                    ParticleSystem.emit('sparkle', px, py, 4, 0.8);
                });
            },

            _activateSpecial(r, c, type) {
                this.specialsUsed++;
                this.addFever(15);
                this.score += 80;
                const ts = this.tileSize;
                const cx = this.gridX + c * ts + ts / 2, cy = this.gridY + r * ts + ts / 2;
                if (type === 'lineH') {
                    for (let cc = 0; cc < this.COLS; cc++) {
                        if (!this._matchedCells.some(m => m.r === r && m.c === cc)) {
                            this._matchedCells.push({r, c: cc});
                        }
                    }
                    this._specialFx.push({ type: 'lineH', r, t: 0.4 });
                    ParticleSystem.emit('impact', cx, cy, 10, 2);
                } else if (type === 'lineV') {
                    for (let rr = 0; rr < this.ROWS; rr++) {
                        if (!this._matchedCells.some(m => m.r === rr && m.c === c)) {
                            this._matchedCells.push({r: rr, c});
                        }
                    }
                    this._specialFx.push({ type: 'lineV', c, t: 0.4 });
                    ParticleSystem.emit('impact', cx, cy, 10, 2);
                } else if (type === 'bomb') {
                    for (let dr = -1; dr <= 1; dr++) for (let dc = -1; dc <= 1; dc++) {
                        const nr = r + dr, nc = c + dc;
                        if (nr >= 0 && nr < this.ROWS && nc >= 0 && nc < this.COLS) {
                            if (!this._matchedCells.some(m => m.r === nr && m.c === nc)) {
                                this._matchedCells.push({r: nr, c: nc});
                            }
                        }
                    }
                    this._specialFx.push({ type: 'bomb', r, c, t: 0.4 });
                    ParticleSystem.emit('fire', cx, cy, 20, 1.5);
                    this._shakeTime = 0.3; this._shakeIntensity = 6;
                } else if (type === 'cross') {
                    for (let cc = 0; cc < this.COLS; cc++) {
                        if (!this._matchedCells.some(m => m.r === r && m.c === cc)) this._matchedCells.push({r, c: cc});
                    }
                    for (let rr = 0; rr < this.ROWS; rr++) {
                        if (!this._matchedCells.some(m => m.r === rr && m.c === c)) this._matchedCells.push({r: rr, c});
                    }
                    this._specialFx.push({ type: 'cross', r, c, t: 0.4 });
                    ParticleSystem.emit('impact', cx, cy, 15, 2);
                    this._shakeTime = 0.35; this._shakeIntensity = 7;
                }
                SoundManager.play('combo');
            },

            _completeMatch() {
                // Remove matched cells (skip blockers), place specials
                const specialPositions = new Set(this._pendingSpecials.map(s => s.r + ',' + s.c));
                this._matchedCells.forEach(({r,c}) => {
                    const key = r + ',' + c;
                    if (specialPositions.has(key)) return; // Will be replaced with special
                    if (this.grid[r][c] && !this.grid[r][c].blocker) {
                        this.grid[r][c] = null;
                    }
                });
                // Place specials
                this._pendingSpecials.forEach(sp => {
                    const existing = this.grid[sp.r][sp.c];
                    if (existing && !existing.blocker) {
                        this.grid[sp.r][sp.c] = { type: existing.type || this.TYPES[0], special: sp.special, blocker: null, blockerHP: 0, fromY: -1, scale: 1, alpha: 1 };
                    } else if (!existing) {
                        // 이미 null로 제거된 경우에도 특수 타일 배치
                        const matchGroup = this._matchedCells.find(m => m.r === sp.r && m.c === sp.c);
                        const fallbackType = matchGroup ? (this._lastMatchedType || this.TYPES[0]) : this.TYPES[0];
                        this.grid[sp.r][sp.c] = { type: fallbackType, special: sp.special, blocker: null, blockerHP: 0, fromY: -1, scale: 1, alpha: 1 };
                    }
                });
                this._pendingSpecials = [];
            },

            _startFalling() {
                this.animState = 'falling'; this.animProgress = 0; this.animDuration = 0.2;
                this._fallingTiles = [];
                for (let c = 0; c < this.COLS; c++) {
                    // Blockers are immovable - gravity works in segments between blockers
                    let emptyRow = this.ROWS - 1;
                    for (let r = this.ROWS - 1; r >= 0; r--) {
                        const cell = this.grid[r][c];
                        if (cell !== null) {
                            if (cell.blocker) {
                                // Blocker stays in place; start new compaction segment above it
                                emptyRow = r - 1;
                            } else {
                                if (r !== emptyRow) {
                                    this.grid[emptyRow][c] = cell;
                                    cell.fromY = r;
                                    this.grid[r][c] = null;
                                    this._fallingTiles.push({ r: emptyRow, c, fromR: r });
                                }
                                emptyRow--;
                            }
                        }
                    }
                    // Mark remaining nulls at the top of current segment (don't overwrite blockers)
                    for (let r = emptyRow; r >= 0; r--) {
                        if (this.grid[r][c] && this.grid[r][c].blocker) continue;
                        this.grid[r][c] = null;
                    }
                }
            },

            _completeFalling() {
                this._fallingTiles.forEach(ft => {
                    if (this.grid[ft.r][ft.c]) this.grid[ft.r][ft.c].fromY = -1;
                });
                this._fallingTiles = [];
            },

            _startRefilling() {
                this.animState = 'refilling'; this.animProgress = 0; this.animDuration = 0.15;
                this._fallingTiles = [];
                for (let c = 0; c < this.COLS; c++) {
                    // Fill each segment above a blocker (or column top) independently
                    // Segments: [top..blockerRow-1], [blockerRow+1..nextBlockerRow-1], etc.
                    let segStart = 0;
                    for (let r = 0; r <= this.ROWS; r++) {
                        const isBlockerOrEnd = r === this.ROWS || (this.grid[r][c] && this.grid[r][c].blocker);
                        if (isBlockerOrEnd) {
                            // Fill nulls in segment [segStart..r-1] from the top
                            let emptyCount = 0;
                            for (let rr = segStart; rr < r; rr++) {
                                if (this.grid[rr][c] === null) emptyCount++;
                            }
                            let fillIdx = 0;
                            for (let rr = segStart; rr < r; rr++) {
                                if (this.grid[rr][c] === null) {
                                    const tile = this._newTile(rr, c);
                                    tile.fromY = segStart - (emptyCount - fillIdx);
                                    this.grid[rr][c] = tile;
                                    this._fallingTiles.push({ r: rr, c, fromR: tile.fromY });
                                    fillIdx++;
                                }
                            }
                            segStart = r + 1;
                        }
                    }
                }
            },

            _completeRefilling() {
                this._fallingTiles.forEach(ft => {
                    if (this.grid[ft.r][ft.c]) this.grid[ft.r][ft.c].fromY = -1;
                });
                this._fallingTiles = [];
            },

            // ===== INPUT =====
            _pixelToGrid(px, py) {
                const c = Math.floor((px - this.gridX) / this.tileSize);
                const r = Math.floor((py - this.gridY) / this.tileSize);
                if (r >= 0 && r < this.ROWS && c >= 0 && c < this.COLS) return { r, c };
                return null;
            },

            handlePointerDown(e) {
                if (this._usedTouch) return;
                if (this.animState !== 'idle' || this.gameOver || this.paused) return;
                const rect = this.canvas.getBoundingClientRect();
                const scaleX = this.canvas.width / rect.width, scaleY = this.canvas.height / rect.height;
                const px = (e.clientX - rect.left) * scaleX, py = (e.clientY - rect.top) * scaleY;
                const cell = this._pixelToGrid(px, py);
                if (!cell) return;
                if (this.grid[cell.r][cell.c] && this.grid[cell.r][cell.c].blocker) return;
                if(this.grid[cell.r][cell.c]?.special){this._useSpecial(cell.r,cell.c);return;}
                if (this.selected) {
                    const dr = Math.abs(cell.r - this.selected.r), dc = Math.abs(cell.c - this.selected.c);
                    if ((dr === 1 && dc === 0) || (dr === 0 && dc === 1)) {
                        this._trySwap(this.selected.r, this.selected.c, cell.r, cell.c);
                    } else {
                        this.selected = cell;
                    }
                } else {
                    this.selected = cell;
                }
            },
            handlePointerUp(e) {},

            handleTouchStart(e) {
                e.preventDefault();
                this._usedTouch = true;
                if (this.animState !== 'idle' || this.gameOver || this.paused) return;
                const touch = e.touches[0];
                const rect = this.canvas.getBoundingClientRect();
                const scaleX = this.canvas.width / rect.width, scaleY = this.canvas.height / rect.height;
                const px = (touch.clientX - rect.left) * scaleX, py = (touch.clientY - rect.top) * scaleY;
                this._touchStartX = px; this._touchStartY = py;
                const cell = this._pixelToGrid(px, py);
                if (cell) { this._touchR = cell.r; this._touchC = cell.c; }
                else { this._touchR = -1; this._touchC = -1; }
            },
            handleTouchEnd(e) {
                e.preventDefault();
                if (this._touchR < 0 || this.animState !== 'idle' || this.gameOver || this.paused) return;
                const touch = e.changedTouches[0];
                const rect = this.canvas.getBoundingClientRect();
                const scaleX = this.canvas.width / rect.width, scaleY = this.canvas.height / rect.height;
                const ex = (touch.clientX - rect.left) * scaleX, ey = (touch.clientY - rect.top) * scaleY;
                const dx = ex - this._touchStartX, dy = ey - this._touchStartY;
                const dist = Math.sqrt(dx * dx + dy * dy);
                if (dist > 15) {
                    // Swipe
                    let dr = 0, dc = 0;
                    if (Math.abs(dx) > Math.abs(dy)) dc = dx > 0 ? 1 : -1;
                    else dr = dy > 0 ? 1 : -1;
                    const nr = this._touchR + dr, nc = this._touchC + dc;
                    if (nr >= 0 && nr < this.ROWS && nc >= 0 && nc < this.COLS) {
                        if (this.grid[this._touchR][this._touchC] && !this.grid[this._touchR][this._touchC].blocker &&
                            this.grid[nr][nc] && !this.grid[nr][nc].blocker) {
                            this._trySwap(this._touchR, this._touchC, nr, nc);
                        }
                    }
                } else {
                    // Tap (click-select)
                    const cell = this._pixelToGrid(ex, ey);
                    if(cell&&this.grid[cell.r][cell.c]?.special&&!this.grid[cell.r][cell.c].blocker){this._useSpecial(cell.r,cell.c);this._touchR=-1;this._touchC=-1;return;}
                    if (cell && this.grid[cell.r][cell.c] && !this.grid[cell.r][cell.c].blocker) {
                        if (this.selected) {
                            const ddr = Math.abs(cell.r - this.selected.r), ddc = Math.abs(cell.c - this.selected.c);
                            if ((ddr === 1 && ddc === 0) || (ddr === 0 && ddc === 1)) {
                                this._trySwap(this.selected.r, this.selected.c, cell.r, cell.c);
                            } else { this.selected = cell; }
                        } else { this.selected = cell; }
                    }
                }
                this._touchR = -1; this._touchC = -1;
            },

            _trySwap(r1, c1, r2, c2) {
                if(this.gameOver||this.paused||this.animState!=='idle'||![r1,r2].every(r=>Number.isInteger(r)&&r>=0&&r<this.ROWS)||![c1,c2].every(c=>Number.isInteger(c)&&c>=0&&c<this.COLS)||Math.abs(r1-r2)+Math.abs(c1-c2)!==1||!this.grid[r1][c1]||!this.grid[r2][c2]||this.grid[r1][c1].blocker||this.grid[r2][c2].blocker)return;
                this.movesMade++;
                this.selected = null;
                this._swapData = { r1, c1, r2, c2 };
                this.animState = 'swapping'; this.animProgress = 0; this.animDuration = 0.2;
                SoundManager.play('click');
            },
            _useSpecial(r,c) {
                if(this.gameOver||this.paused||this.animState!=='idle'||!this.grid[r]?.[c]?.special||this.grid[r][c].blocker)return;
                this.movesMade++;this.selected=null;this._swapData=null;this.chainCount=1;
                this._startMatching([{cells:[{r,c}],dir:'h',type:this.grid[r][c].type,len:1}]);
            },

            // ===== RENDERING =====
            _render() {
                const ctx = this.ctx, ts = this.tileSize, W = this.canvas.width, H = this.canvas.height;
                ctx.clearRect(0, 0, W, H);

                // Screen shake
                ctx.save();
                if (this._shakeTime > 0) {
                    const i = this._shakeIntensity;
                    ctx.translate((Math.random() - 0.5) * i * 2, (Math.random() - 0.5) * i * 2);
                }

                // Background
                this._drawBackground(ctx, W, H);

                // Grid cells
                const gx = this.gridX, gy = this.gridY;
                for (let r = 0; r < this.ROWS; r++) {
                    for (let c = 0; c < this.COLS; c++) {
                        const tile = this.grid[r][c];
                        if (!tile) continue;
                        let px = gx + c * ts, py = gy + r * ts;
                        let scale = 1, alpha = 1;

                        // Swap animation
                        if (this.animState === 'swapping' && this._swapData) {
                            const {r1,c1,r2,c2} = this._swapData;
                            const t = this._easeInOut(this.animProgress);
                            if (r === r1 && c === c1) {
                                px = gx + (c1 + (c2 - c1) * t) * ts;
                                py = gy + (r1 + (r2 - r1) * t) * ts;
                            } else if (r === r2 && c === c2) {
                                px = gx + (c2 + (c1 - c2) * t) * ts;
                                py = gy + (r2 + (r1 - r2) * t) * ts;
                            }
                        }
                        // Revert animation
                        if (this.animState === 'reverting' && this._swapData) {
                            const {r1,c1,r2,c2} = this._swapData;
                            const t = this._easeInOut(this.animProgress);
                            if (r === r1 && c === c1) {
                                px = gx + (c2 + (c1 - c2) * t) * ts;
                                py = gy + (r2 + (r1 - r2) * t) * ts;
                            } else if (r === r2 && c === c2) {
                                px = gx + (c1 + (c2 - c1) * t) * ts;
                                py = gy + (r1 + (r2 - r1) * t) * ts;
                            }
                        }
                        // Match animation
                        if (this.animState === 'matching' && this._matchedCells) {
                            if (this._matchedCells.some(m => m.r === r && m.c === c)) {
                                const t = this.animProgress;
                                scale = t < 0.3 ? 1 + t * 0.7 : Math.max(0, 1.21 - (t - 0.3) * 1.73);
                                alpha = Math.max(0, 1 - t * t);
                            }
                        }
                        // Falling animation
                        if ((this.animState === 'falling' || this.animState === 'refilling') && tile.fromY !== -1) {
                            const t = this._easeOut(this.animProgress);
                            py = gy + (tile.fromY + (r - tile.fromY) * t) * ts;
                        }

                        this._drawTile(ctx, tile, px, py, ts, scale, alpha);
                    }
                }

                // Selection highlight
                if (this.selected && this.animState === 'idle') {
                    const sr = this.selected.r, sc = this.selected.c;
                    ctx.strokeStyle = '#ffd700';
                    ctx.lineWidth = 2.5;
                    ctx.shadowColor = '#ffd700'; ctx.shadowBlur = 8;
                    GameSprites._rrect(ctx, gx + sc * ts + 1, gy + sr * ts + 1, ts - 2, ts - 2, 7);
                    ctx.stroke();
                    ctx.shadowBlur = 0;
                }

                // Special FX overlays
                this._specialFx.forEach(fx => {
                    ctx.save();
                    ctx.globalAlpha = Math.min(1, fx.t * 3);
                    if (fx.type === 'lineH') {
                        const cy = gy + fx.r * ts + ts / 2;
                        ctx.strokeStyle = '#00E5FF'; ctx.lineWidth = 3;
                        ctx.shadowColor = '#00E5FF'; ctx.shadowBlur = 12;
                        ctx.beginPath(); ctx.moveTo(gx, cy); ctx.lineTo(gx + this.COLS * ts, cy); ctx.stroke();
                        ctx.shadowBlur = 0;
                    } else if (fx.type === 'lineV') {
                        const cx = gx + fx.c * ts + ts / 2;
                        ctx.strokeStyle = '#FF9100'; ctx.lineWidth = 3;
                        ctx.shadowColor = '#FF9100'; ctx.shadowBlur = 12;
                        ctx.beginPath(); ctx.moveTo(cx, gy); ctx.lineTo(cx, gy + this.ROWS * ts); ctx.stroke();
                        ctx.shadowBlur = 0;
                    } else if (fx.type === 'bomb') {
                        const bx = gx + fx.c * ts + ts / 2, by = gy + fx.r * ts + ts / 2;
                        const rad = ts * 1.5 * (1 - fx.t * 2);
                        ctx.strokeStyle = '#FF1744'; ctx.lineWidth = 3;
                        ctx.shadowColor = '#FF1744'; ctx.shadowBlur = 15;
                        ctx.beginPath(); ctx.arc(bx, by, Math.max(0, rad), 0, Math.PI * 2); ctx.stroke();
                        ctx.shadowBlur = 0;
                    } else if (fx.type === 'cross') {
                        const bx = gx + fx.c * ts + ts / 2, by = gy + fx.r * ts + ts / 2;
                        ctx.strokeStyle = '#AA00FF'; ctx.lineWidth = 3;
                        ctx.shadowColor = '#AA00FF'; ctx.shadowBlur = 12;
                        ctx.beginPath(); ctx.moveTo(gx, by); ctx.lineTo(gx + this.COLS * ts, by); ctx.stroke();
                        ctx.beginPath(); ctx.moveTo(bx, gy); ctx.lineTo(bx, gy + this.ROWS * ts); ctx.stroke();
                        ctx.shadowBlur = 0;
                    }
                    ctx.restore();
                });

                // Particles
                ParticleSystem.draw(ctx);

                // Position bar
                this._drawPositionBar(ctx, W, H);

                // Fever bar (bottom)
                this._drawFeverBar(ctx, W, H);

                // Fever overlay with particle shimmer
                if (this.feverActive) {
                    ctx.save();
                    // Golden overlay
                    ctx.globalAlpha = 0.06 + 0.04 * Math.sin(this._feverFlash * 8);
                    const feverGrad = ctx.createRadialGradient(W / 2, H / 2, 0, W / 2, H / 2, Math.max(W, H) * 0.6);
                    feverGrad.addColorStop(0, '#ffeb3b');
                    feverGrad.addColorStop(0.5, '#ffd700');
                    feverGrad.addColorStop(1, '#ff8f00');
                    ctx.fillStyle = feverGrad;
                    ctx.fillRect(0, 0, W, H);
                    // Sparkle shimmer lines at edges
                    ctx.globalAlpha = 0.15 + 0.1 * Math.sin(this._feverFlash * 6);
                    ctx.strokeStyle = '#ffd700';
                    ctx.lineWidth = 2;
                    ctx.strokeRect(2, 2, W - 4, H - 4);
                    // Floating sparkle particles
                    for (let si = 0; si < 6; si++) {
                        const sx = (W * 0.1 + si * W * 0.15 + this._feverFlash * 30) % W;
                        const sy = H * 0.2 + Math.sin(this._feverFlash * 3 + si * 1.2) * H * 0.3;
                        ctx.globalAlpha = 0.3 + Math.sin(this._feverFlash * 5 + si) * 0.2;
                        ctx.fillStyle = '#ffd700';
                        ctx.beginPath();
                        const ss = 3;
                        ctx.moveTo(sx, sy - ss);
                        ctx.lineTo(sx + ss * 0.3, sy - ss * 0.3);
                        ctx.lineTo(sx + ss, sy);
                        ctx.lineTo(sx + ss * 0.3, sy + ss * 0.3);
                        ctx.lineTo(sx, sy + ss);
                        ctx.lineTo(sx - ss * 0.3, sy + ss * 0.3);
                        ctx.lineTo(sx - ss, sy);
                        ctx.lineTo(sx - ss * 0.3, sy - ss * 0.3);
                        ctx.closePath();
                        ctx.fill();
                    }
                    ctx.restore();
                }

                // Danger overlay with vignette
                if (this.position >= 85) {
                    ctx.save();
                    const dAlpha = Math.min(0.3, (this.position - 85) / 15 * 0.3) * (0.5 + 0.5 * Math.sin(this._frame * 0.15));
                    // Red vignette from edges
                    const dangerGrad = ctx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.15, W / 2, H / 2, Math.max(W, H) * 0.55);
                    dangerGrad.addColorStop(0, 'rgba(255,50,50,0)');
                    dangerGrad.addColorStop(0.6, `rgba(255,50,50,${dAlpha * 0.4})`);
                    dangerGrad.addColorStop(1, `rgba(255,30,30,${dAlpha})`);
                    ctx.fillStyle = dangerGrad;
                    ctx.fillRect(0, 0, W, H);
                    // Pulsing red border
                    ctx.strokeStyle = `rgba(255,50,50,${dAlpha * 1.5})`;
                    ctx.lineWidth = 3;
                    ctx.strokeRect(1, 1, W - 2, H - 2);
                    ctx.restore();
                }
                // Danger countdown
                if (this._dangerTimer > 0) {
                    ctx.save();
                    const bw = 150, bh = 56;
                    // Glowing background
                    ctx.shadowColor = '#ff0000';
                    ctx.shadowBlur = 15;
                    ctx.fillStyle = 'rgba(160,0,0,0.9)';
                    GameSprites._rrect(ctx, W / 2 - bw / 2, H / 2 - bh / 2, bw, bh, 14);
                    ctx.fill();
                    ctx.shadowBlur = 0;
                    ctx.strokeStyle = '#ff4757'; ctx.lineWidth = 2; ctx.stroke();
                    // Inner glow line
                    ctx.strokeStyle = 'rgba(255,100,100,0.3)'; ctx.lineWidth = 1;
                    GameSprites._rrect(ctx, W / 2 - bw / 2 + 3, H / 2 - bh / 2 + 3, bw - 6, bh - 6, 11);
                    ctx.stroke();
                    ctx.fillStyle = '#fff'; ctx.font = 'bold 15px sans-serif';
                    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                    ctx.fillText('⚠️ DANGER', W / 2, H / 2 - 10);
                    ctx.fillStyle = '#ffd700'; ctx.font = 'bold 20px sans-serif';
                    ctx.shadowColor = '#ffd700'; ctx.shadowBlur = 8;
                    ctx.fillText(Math.ceil(3 - this._dangerTimer) + '', W / 2, H / 2 + 13);
                    ctx.shadowBlur = 0;
                    ctx.restore();
                }

                // Chain banner
                if (this._chainTimer > 0 && this._chainText) {
                    ctx.save();
                    const gridCX = gx + this.COLS * ts / 2, gridCY = gy + this.ROWS * ts / 2;
                    const chainAlpha = Math.min(1, this._chainTimer * 3);
                    ctx.globalAlpha = chainAlpha;
                    // Background stripe
                    const stripGrad = ctx.createLinearGradient(gx, gridCY - 18, gx + this.COLS * ts, gridCY - 18);
                    stripGrad.addColorStop(0, 'rgba(0,0,0,0)');
                    stripGrad.addColorStop(0.2, 'rgba(0,0,0,0.5)');
                    stripGrad.addColorStop(0.8, 'rgba(0,0,0,0.5)');
                    stripGrad.addColorStop(1, 'rgba(0,0,0,0)');
                    ctx.fillStyle = stripGrad;
                    ctx.fillRect(gx, gridCY - 18, this.COLS * ts, 36);
                    // Decorative lines
                    ctx.strokeStyle = '#ffd700'; ctx.lineWidth = 1; ctx.globalAlpha = chainAlpha * 0.5;
                    ctx.beginPath();
                    ctx.moveTo(gx, gridCY - 18); ctx.lineTo(gx + this.COLS * ts, gridCY - 18);
                    ctx.moveTo(gx, gridCY + 18); ctx.lineTo(gx + this.COLS * ts, gridCY + 18);
                    ctx.stroke();
                    // Text with glow
                    ctx.globalAlpha = chainAlpha;
                    const scaleChain = chainAlpha > 0.85 ? 1 + (1 - (chainAlpha - 0.85) / 0.15) * 0.2 : 1;
                    ctx.font = `bold ${Math.floor(22 * scaleChain)}px sans-serif`;
                    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                    ctx.shadowColor = '#ffd700'; ctx.shadowBlur = 10;
                    ctx.fillStyle = '#ffd700';
                    ctx.fillText(this._chainText, gridCX, gridCY);
                    ctx.shadowBlur = 0;
                    ctx.restore();
                }

                // Shuffle banner
                if (this._shuffleTimer > 0) {
                    ctx.save();
                    const gridCX = gx + this.COLS * ts / 2, gridCY = gy + this.ROWS * ts / 2;
                    ctx.globalAlpha = Math.min(1, this._shuffleTimer * 2);
                    // Darker pill bg
                    ctx.shadowColor = 'rgba(0,0,0,0.4)'; ctx.shadowBlur = 8;
                    ctx.fillStyle = 'rgba(0,0,0,0.8)';
                    GameSprites._rrect(ctx, gridCX - 65, gridCY - 18, 130, 36, 12);
                    ctx.fill();
                    ctx.shadowBlur = 0;
                    ctx.strokeStyle = 'rgba(255,255,255,0.2)'; ctx.lineWidth = 1;
                    GameSprites._rrect(ctx, gridCX - 65, gridCY - 18, 130, 36, 12);
                    ctx.stroke();
                    ctx.fillStyle = '#fff'; ctx.font = 'bold 15px sans-serif';
                    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                    ctx.fillText('🔀 셔플!', gridCX, gridCY);
                    ctx.restore();
                }

                // Speech bubble
                if (this._speechTimer > 0 && this._speechText) {
                    ctx.save();
                    const bx = this._charRenderX || (gx + this.COLS * ts + 6 + this.barW / 2);
                    const sCharY = this._charRenderY || (gy + this.ROWS * ts * (1 - this._posDisplay / 100));
                    const by = Math.max(20, sCharY - 30);
                    ctx.globalAlpha = Math.min(1, this._speechTimer * 2);
                    ctx.font = '600 10px sans-serif';
                    ctx.fillStyle = '#fff';
                    const textW = ctx.measureText(this._speechText).width || 80;
                    const bw = Math.min(textW + 16, 130), bhh = 22;
                    GameSprites._rrect(ctx, bx - bw / 2, by - bhh / 2, bw, bhh, 8);
                    ctx.fill();
                    ctx.fillStyle = '#333';
                    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                    ctx.fillText(this._speechText.substring(0, 14), bx, by);
                    ctx.restore();
                }

                ctx.restore(); // end shake
            },

            _bgGrassCache: null,
            _drawBackground(ctx, W, H) {
                const fc = GameSprites.getThemeFieldColors();
                // Deeper gradient for modern look
                const g = ctx.createLinearGradient(0, 0, 0, H);
                g.addColorStop(0, fc.field); g.addColorStop(0.35, fc.fieldLight);
                g.addColorStop(0.65, fc.fieldLight); g.addColorStop(1, fc.field);
                ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
                // Grass texture overlay (cached)
                if (!this._bgGrassCache || this._bgGrassCache.width !== W || this._bgGrassCache.height !== H) {
                    const gc = document.createElement('canvas');
                    gc.width = W; gc.height = H;
                    const gctx = gc.getContext('2d');
                    gctx.globalAlpha = 0.08;
                    gctx.strokeStyle = fc.fieldLight;
                    gctx.lineWidth = 0.5;
                    for (let i = 0; i < 50; i++) {
                        const bx = (i * 17.3) % W, by = (i * 13.7) % H;
                        const cx1 = ((i * 7 + 3) % 8 - 4) * 0.5;
                        const cx2 = ((i * 5 + 1) % 4 - 2) * 0.5;
                        gctx.beginPath();
                        gctx.moveTo(bx, by);
                        gctx.quadraticCurveTo(bx + cx1, by - 4, bx + cx2, by - 8);
                        gctx.stroke();
                    }
                    gctx.globalAlpha = 1;
                    this._bgGrassCache = gc;
                }
                ctx.drawImage(this._bgGrassCache, 0, 0);
                // Stripes
                ctx.fillStyle = 'rgba(255,255,255,0.03)';
                for (let y = 0; y < H; y += 10) ctx.fillRect(0, y, W, 5);
                // Grid area background (glassmorphism)
                const gx = this.gridX, gy = this.gridY, gw = this.COLS * this.tileSize, gh = this.ROWS * this.tileSize;
                ctx.fillStyle = 'rgba(0,0,0,0.22)';
                GameSprites._rrect(ctx, gx - 3, gy - 3, gw + 6, gh + 6, 12); ctx.fill();
                // Subtle inner glow
                ctx.save();
                ctx.strokeStyle = 'rgba(255,255,255,0.08)'; ctx.lineWidth = 1;
                GameSprites._rrect(ctx, gx - 2, gy - 2, gw + 4, gh + 4, 11); ctx.stroke();
                ctx.restore();
                // Grid lines
                ctx.strokeStyle = 'rgba(255,255,255,0.06)'; ctx.lineWidth = 0.5;
                for (let r = 1; r < this.ROWS; r++) {
                    ctx.beginPath(); ctx.moveTo(gx, gy + r * this.tileSize); ctx.lineTo(gx + gw, gy + r * this.tileSize); ctx.stroke();
                }
                for (let c = 1; c < this.COLS; c++) {
                    ctx.beginPath(); ctx.moveTo(gx + c * this.tileSize, gy); ctx.lineTo(gx + c * this.tileSize, gy + gh); ctx.stroke();
                }
                // Enhanced vignette
                const vg = ctx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.2, W / 2, H / 2, Math.max(W, H) * 0.65);
                vg.addColorStop(0, 'transparent'); vg.addColorStop(1, 'rgba(0,0,0,0.4)');
                ctx.fillStyle = vg; ctx.fillRect(0, 0, W, H);
            },

            _drawTile(ctx, tile, px, py, sz, scale, alpha) {
                if (!tile) return;
                ctx.save();
                if (scale !== 1 || alpha !== 1) {
                    ctx.globalAlpha = Math.max(0, alpha);
                    ctx.translate(px + sz / 2, py + sz / 2);
                    ctx.scale(scale, scale);
                    ctx.translate(-(px + sz / 2), -(py + sz / 2));
                }
                // Draw blocker
                if (tile.blocker === 'grass') {
                    GameSprites.drawTileGrass(ctx, px, py, sz);
                } else if (tile.blocker === 'mud') {
                    GameSprites.drawTileMud(ctx, px, py, sz, tile.blockerHP);
                } else {
                    // Normal tile
                    const drawFn = {
                        ball: 'drawTileBall', jersey: 'drawTileJersey', boot: 'drawTileBoot',
                        trophy: 'drawTileTrophy', goal: 'drawTileGoal', card: 'drawTileCard'
                    }[tile.type];
                    if (drawFn && GameSprites[drawFn]) GameSprites[drawFn](ctx, px, py, sz);
                    // Glossy highlight overlay (modern mobile game style)
                    const hlG = ctx.createLinearGradient(px, py, px, py + sz);
                    hlG.addColorStop(0, 'rgba(255,255,255,0.18)');
                    hlG.addColorStop(0.35, 'rgba(255,255,255,0.06)');
                    hlG.addColorStop(0.5, 'rgba(255,255,255,0)');
                    hlG.addColorStop(1, 'rgba(0,0,0,0.08)');
                    ctx.fillStyle = hlG;
                    GameSprites._rrect(ctx, px + 1, py + 1, sz - 2, sz - 2, 5); ctx.fill();
                    // Special overlay
                    if (tile.special) {
                        GameSprites.drawSpecialOverlay(ctx, px, py, sz, tile.special, this._frame);
                    }
                }
                ctx.restore();
            },

            _drawPositionBar(ctx, W, H) {
                ctx.save();
                const barX = this.gridX + this.COLS * this.tileSize + 6;
                const barY = this.gridY;
                const barH = this.ROWS * this.tileSize;
                const bw = this.barW - 6;
                const cx = barX + bw / 2;
                const pad = 3;

                // === FUTSAL FIELD BACKGROUND ===
                const fg = ctx.createLinearGradient(barX, barY, barX + bw, barY + barH);
                fg.addColorStop(0, '#1a6830'); fg.addColorStop(0.3, '#1f8038');
                fg.addColorStop(0.5, '#22903e'); fg.addColorStop(0.7, '#1f8038'); fg.addColorStop(1, '#1a6830');
                ctx.fillStyle = fg;
                GameSprites._rrect(ctx, barX, barY, bw, barH, 8); ctx.fill();

                // Grass stripe pattern
                ctx.save();
                GameSprites._rrect(ctx, barX, barY, bw, barH, 8); ctx.clip();
                const stripeH = barH / 16;
                for (let i = 0; i < 16; i++) {
                    if (i % 2 === 0) { ctx.fillStyle = 'rgba(0,0,0,0.04)'; ctx.fillRect(barX, barY + i * stripeH, bw, stripeH); }
                }
                ctx.restore();

                // Outer field border with glow
                ctx.save();
                ctx.shadowColor = 'rgba(255,255,255,0.25)'; ctx.shadowBlur = 6;
                ctx.strokeStyle = 'rgba(255,255,255,0.9)'; ctx.lineWidth = 1.5;
                GameSprites._rrect(ctx, barX + pad, barY + pad, bw - pad * 2, barH - pad * 2, 5); ctx.stroke();
                ctx.restore();

                // Field inner dimensions
                const fL = barX + pad + 2, fR = barX + bw - pad - 2, fW = fR - fL;
                const fT = barY + pad + 2, fB = barY + barH - pad - 2, fH = fB - fT;

                // === CENTER MARKINGS ===
                const centerY = fT + fH / 2;
                ctx.strokeStyle = 'rgba(255,255,255,0.55)'; ctx.lineWidth = 1;
                ctx.beginPath(); ctx.moveTo(fL, centerY); ctx.lineTo(fR, centerY); ctx.stroke();
                const circR = Math.min(fW / 2 - 3, 13);
                ctx.beginPath(); ctx.arc(cx, centerY, circR, 0, Math.PI * 2); ctx.stroke();
                ctx.fillStyle = 'rgba(255,255,255,0.7)';
                ctx.beginPath(); ctx.arc(cx, centerY, 1.8, 0, Math.PI * 2); ctx.fill();

                // === TOP GOAL (opponent's - where donghyun runs to) ===
                const gaW = fW * 0.72, gaH = fH * 0.11, gaX = cx - gaW / 2;
                ctx.strokeStyle = 'rgba(255,255,255,0.45)'; ctx.lineWidth = 1;
                ctx.strokeRect(gaX, fT, gaW, gaH);
                // Goal net
                const netW = gaW * 0.55, netH = 8, netX = cx - netW / 2;
                ctx.fillStyle = 'rgba(220,220,220,0.15)'; ctx.fillRect(netX, fT, netW, netH);
                ctx.strokeStyle = 'rgba(255,255,255,0.18)'; ctx.lineWidth = 0.5;
                for (let x = netX + 3; x < netX + netW; x += 3.5) { ctx.beginPath(); ctx.moveTo(x, fT); ctx.lineTo(x, fT + netH); ctx.stroke(); }
                for (let y = fT + 2.5; y < fT + netH; y += 2.5) { ctx.beginPath(); ctx.moveTo(netX, y); ctx.lineTo(netX + netW, y); ctx.stroke(); }
                // Goal posts & crossbar
                ctx.strokeStyle = 'rgba(255,255,255,0.95)'; ctx.lineWidth = 2;
                ctx.beginPath(); ctx.moveTo(netX, fT); ctx.lineTo(netX, fT + netH); ctx.stroke();
                ctx.beginPath(); ctx.moveTo(netX + netW, fT); ctx.lineTo(netX + netW, fT + netH); ctx.stroke();
                ctx.beginPath(); ctx.moveTo(netX, fT); ctx.lineTo(netX + netW, fT); ctx.stroke();
                // Label
                ctx.fillStyle = 'rgba(255,180,180,0.55)'; ctx.font = 'bold 7px "Pretendard Variable",sans-serif';
                ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                ctx.fillText('상대', cx, fT + netH + gaH * 0.5);
                // Penalty arc
                ctx.strokeStyle = 'rgba(255,255,255,0.3)'; ctx.lineWidth = 0.8;
                ctx.beginPath(); ctx.arc(cx, fT + gaH, 7, 0.2 * Math.PI, 0.8 * Math.PI); ctx.stroke();

                // === BOTTOM GOAL (our team's - safe zone) ===
                ctx.strokeStyle = 'rgba(255,255,255,0.45)'; ctx.lineWidth = 1;
                ctx.strokeRect(gaX, fB - gaH, gaW, gaH);
                ctx.fillStyle = 'rgba(220,220,220,0.15)'; ctx.fillRect(netX, fB - netH, netW, netH);
                ctx.strokeStyle = 'rgba(255,255,255,0.18)'; ctx.lineWidth = 0.5;
                for (let x = netX + 3; x < netX + netW; x += 3.5) { ctx.beginPath(); ctx.moveTo(x, fB - netH); ctx.lineTo(x, fB); ctx.stroke(); }
                for (let y = fB - netH + 2.5; y < fB; y += 2.5) { ctx.beginPath(); ctx.moveTo(netX, y); ctx.lineTo(netX + netW, y); ctx.stroke(); }
                ctx.strokeStyle = 'rgba(255,255,255,0.95)'; ctx.lineWidth = 2;
                ctx.beginPath(); ctx.moveTo(netX, fB - netH); ctx.lineTo(netX, fB); ctx.stroke();
                ctx.beginPath(); ctx.moveTo(netX + netW, fB - netH); ctx.lineTo(netX + netW, fB); ctx.stroke();
                ctx.beginPath(); ctx.moveTo(netX, fB); ctx.lineTo(netX + netW, fB); ctx.stroke();
                ctx.fillStyle = 'rgba(180,220,255,0.55)'; ctx.font = 'bold 7px "Pretendard Variable",sans-serif';
                ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                ctx.fillText('우리', cx, fB - netH - gaH * 0.5);
                ctx.strokeStyle = 'rgba(255,255,255,0.3)'; ctx.lineWidth = 0.8;
                ctx.beginPath(); ctx.arc(cx, fB - gaH, 7, 1.2 * Math.PI, 1.8 * Math.PI); ctx.stroke();

                // === CORNER ARCS ===
                ctx.strokeStyle = 'rgba(255,255,255,0.3)'; ctx.lineWidth = 0.7;
                ctx.beginPath(); ctx.arc(fL, fT, 4, 0, 0.5 * Math.PI); ctx.stroke();
                ctx.beginPath(); ctx.arc(fR, fT, 4, 0.5 * Math.PI, Math.PI); ctx.stroke();
                ctx.beginPath(); ctx.arc(fL, fB, 4, 1.5 * Math.PI, 2 * Math.PI); ctx.stroke();
                ctx.beginPath(); ctx.arc(fR, fB, 4, Math.PI, 1.5 * Math.PI); ctx.stroke();

                // === ZONE OVERLAYS (danger/safe glow) ===
                ctx.save();
                GameSprites._rrect(ctx, barX, barY, bw, barH, 8); ctx.clip();
                if (this._posDisplay >= 50) {
                    const intensity = Math.min(1, (this._posDisplay - 50) / 50);
                    const pulse = this._posDisplay >= 85 ? 0.12 * Math.sin(this._frame * 0.15) : 0;
                    const da = intensity * 0.22 + pulse;
                    const dH = barH * (0.12 + intensity * 0.18);
                    const dg = ctx.createLinearGradient(barX, barY, barX, barY + dH);
                    dg.addColorStop(0, 'rgba(255,20,20,' + Math.max(0, da) + ')');
                    dg.addColorStop(1, 'rgba(255,20,20,0)');
                    ctx.fillStyle = dg; ctx.fillRect(barX, barY, bw, dH);
                }
                if (this._posDisplay <= 35) {
                    const sAlpha = (35 - this._posDisplay) / 35 * 0.18;
                    const sH = barH * 0.12;
                    const sg = ctx.createLinearGradient(barX, barY + barH - sH, barX, barY + barH);
                    sg.addColorStop(0, 'rgba(0,255,100,0)');
                    sg.addColorStop(1, 'rgba(0,255,100,' + sAlpha + ')');
                    ctx.fillStyle = sg; ctx.fillRect(barX, barY + barH - sH, bw, sH);
                }
                ctx.restore();

                // === DONGHYUN CHARACTER ===
                const charMinY = fT + gaH + 14, charMaxY = fB - gaH - 14;
                const rawPosY = charMaxY - (charMaxY - charMinY) * (this._posDisplay / 100);
                const bobY = Math.sin(this._frame * 0.15) * 1.2;
                const charPosY = rawPosY + bobY;
                this._charRenderY = charPosY; this._charRenderX = cx;

                // Shadow
                ctx.save(); ctx.globalAlpha = 0.2; ctx.fillStyle = '#000';
                ctx.beginPath(); ctx.ellipse(cx, charPosY + 10, 8, 3, 0, 0, Math.PI * 2); ctx.fill();
                ctx.restore();

                // Motion trail (afterimages below = running upward)
                const advSpeed = this.getAdvanceSpeed();
                if (this._posDisplay > 2) {
                    ctx.save();
                    const tc = Math.min(4, 1 + Math.floor(advSpeed));
                    for (let i = 1; i <= tc; i++) {
                        const ty = charPosY + i * 6;
                        if (ty > charMaxY + 5) break;
                        ctx.globalAlpha = 0.06 * (tc + 1 - i) / tc;
                        ctx.fillStyle = '#e74c3c';
                        const ox = ((i * 7 + 3) % 5 - 2.5) * 0.4;
                        ctx.beginPath(); ctx.arc(cx + ox, ty, 6 - i * 0.7, 0, Math.PI * 2); ctx.fill();
                    }
                    ctx.restore();
                }

                // Speed lines (when fast)
                if (advSpeed >= 2.5) {
                    ctx.save(); ctx.strokeStyle = 'rgba(255,255,255,0.15)'; ctx.lineWidth = 1;
                    const lc = Math.min(4, Math.floor(advSpeed));
                    for (let i = 0; i < lc; i++) {
                        const lx = cx + ((i * 11 + 5) % Math.floor(bw * 0.6) - bw * 0.3);
                        const ly = charPosY + 12 + i * 3;
                        ctx.beginPath(); ctx.moveTo(lx, ly); ctx.lineTo(lx, ly + 6 + i * 2); ctx.stroke();
                    }
                    ctx.restore();
                }

                // Player with dynamic glow (green→yellow→red based on danger)
                const dl = this._posDisplay / 100;
                const glowR = Math.floor(255 * Math.min(1, dl * 1.5));
                const glowG = Math.floor(255 * Math.max(0, 1 - dl * 1.5));
                const glowB = Math.floor(80 * Math.max(0, 1 - dl));
                const glowColor = 'rgb(' + glowR + ',' + glowG + ',' + glowB + ')';
                ctx.save(); ctx.shadowColor = glowColor;
                ctx.shadowBlur = 7 + 4 * Math.sin(this._frame * 0.08);
                if (window.FootballArcade) {
                    FootballArcade.drawMascot(ctx, cx, charPosY-2, 28, {role:'player', pose:'running', animationTime:this.elapsed});
                } else if (this._playerImg && this._playerImg.complete) {
                    ctx.drawImage(this._playerImg, cx - 13, charPosY - 15, 26, 26);
                } else {
                    ctx.fillStyle = glowColor;
                    ctx.beginPath(); ctx.arc(cx, charPosY, 8, 0, Math.PI * 2); ctx.fill();
                }
                ctx.restore();

                // Direction arrow (pulsing, pointing up)
                if (this._posDisplay > 2 && this._posDisplay < 98) {
                    ctx.save();
                    ctx.globalAlpha = 0.3 + 0.25 * Math.sin(this._frame * 0.1);
                    ctx.fillStyle = '#fff';
                    const ay = charPosY - 20;
                    ctx.beginPath(); ctx.moveTo(cx, ay - 5); ctx.lineTo(cx - 4, ay + 1); ctx.lineTo(cx + 4, ay + 1); ctx.closePath(); ctx.fill();
                    ctx.restore();
                }

                // === STATUS LABELS ===
                let zoneText, zoneColor;
                if (this._posDisplay >= 90) { zoneText = 'DANGER!'; zoneColor = '#ff4757'; }
                else if (this._posDisplay >= 55) { zoneText = '공격진영'; zoneColor = '#ffa502'; }
                else if (this._posDisplay >= 40) { zoneText = '중앙'; zoneColor = 'rgba(255,255,255,0.65)'; }
                else if (this._posDisplay >= 10) { zoneText = '수비진영'; zoneColor = '#2ecc71'; }
                else { zoneText = 'SAFE!'; zoneColor = '#2ecc71'; }
                ctx.fillStyle = zoneColor; ctx.font = 'bold 8px "Pretendard Variable",sans-serif';
                ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                ctx.fillText(zoneText, cx, barY - 5);
                ctx.fillStyle = '#fff'; ctx.font = 'bold 10px "Pretendard Variable",sans-serif';
                ctx.fillText(Math.round(this._posDisplay) + '%', cx, barY + barH + 10);
                ctx.restore();
            },

            _drawFeverBar(ctx, W, H) {
                ctx.save();
                const gy = this.gridY + this.ROWS * this.tileSize + 4;
                const gw = this.COLS * this.tileSize;
                const bh = 14;
                // Background with inner shadow
                ctx.fillStyle = 'rgba(0,0,0,0.35)';
                GameSprites._rrect(ctx, this.gridX, gy, gw, bh, 5); ctx.fill();
                ctx.save();
                ctx.strokeStyle = 'rgba(0,0,0,0.2)'; ctx.lineWidth = 1;
                GameSprites._rrect(ctx, this.gridX, gy, gw, bh, 5); ctx.stroke();
                ctx.restore();
                if (this.feverGauge > 0) {
                    const fw = gw * Math.min(1, this.feverGauge / 100);
                    const fg = ctx.createLinearGradient(this.gridX, gy, this.gridX + fw, gy);
                    if (this.feverActive) {
                        fg.addColorStop(0, '#ffd700');
                        fg.addColorStop(0.5, '#ffeb3b');
                        fg.addColorStop(1, '#ffa500');
                    } else {
                        fg.addColorStop(0, '#ff6b35');
                        fg.addColorStop(0.5, '#ff8c42');
                        fg.addColorStop(1, '#e74c3c');
                    }
                    ctx.fillStyle = fg;
                    GameSprites._rrect(ctx, this.gridX, gy, fw, bh, 5); ctx.fill();
                    // Glossy highlight on top
                    ctx.save();
                    const hlGrad = ctx.createLinearGradient(this.gridX, gy, this.gridX, gy + bh);
                    hlGrad.addColorStop(0, 'rgba(255,255,255,0.3)');
                    hlGrad.addColorStop(0.4, 'rgba(255,255,255,0.05)');
                    hlGrad.addColorStop(1, 'rgba(0,0,0,0.1)');
                    ctx.fillStyle = hlGrad;
                    GameSprites._rrect(ctx, this.gridX, gy, fw, bh, 5); ctx.fill();
                    ctx.restore();
                    if (this.feverActive) {
                        ctx.strokeStyle = '#ffd700'; ctx.lineWidth = 1.5;
                        ctx.shadowColor = '#ffd700'; ctx.shadowBlur = 8;
                        GameSprites._rrect(ctx, this.gridX, gy, fw, bh, 5); ctx.stroke();
                        ctx.shadowBlur = 0;
                    }
                }
                ctx.fillStyle = this.feverActive ? '#fff' : 'rgba(255,255,255,0.75)';
                ctx.font = `bold ${this.feverActive ? '9' : '8'}px sans-serif`;
                ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
                if (this.feverActive) {
                    ctx.shadowColor = '#ffd700'; ctx.shadowBlur = 4;
                }
                ctx.fillText(this.feverActive ? '⚡ FEVER!' : '⚡ ' + Math.floor(this.feverGauge) + '%', this.gridX + 4, gy + bh / 2);
                ctx.restore();
            },

            _easeInOut(t) { return t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2; },
            _easeOut(t) { return 1 - (1 - t) * (1 - t); },

            // ===== DIFFICULTY =====
            getLevel() { return FootballGameRules.puzzle(this.elapsed).level; },
            getAdvanceSpeed() {
                const profile=FootballGameRules.puzzle(this.elapsed);
                return profile.speed*(profile.pressure&&(this.elapsed-45)%18<4?1.3:1);
            },

            // ===== FEVER =====
            addFever(amount) {
                if (this.feverActive) return;
                this.feverGauge = Math.min(100, this.feverGauge + amount);
                if (this.feverGauge >= 100) this._activateFever();
            },
            _activateFever() {
                this.feverActive = true; this.feverTimer = 5; this._feverFlash = 0;
                this.feverCount++;
                SoundManager.play('perfect');
                this._shakeTime = 0.4; this._shakeIntensity = 7;
                const gx = this.gridX, gy = this.gridY, ts = this.tileSize;
                const cx = gx + this.COLS * ts / 2, cy = gy + this.ROWS * ts / 2;
                ParticleSystem.emit('confetti', cx, cy, 45, 4);
                // Burst from corners
                ParticleSystem.emit('confetti', gx, gy, 10, 2);
                ParticleSystem.emit('confetti', gx + this.COLS * ts, gy, 10, 2);
                ParticleSystem.emit('confetti', gx, gy + this.ROWS * ts, 10, 2);
                ParticleSystem.emit('confetti', gx + this.COLS * ts, gy + this.ROWS * ts, 10, 2);
            },

            // ===== SHUFFLE =====
            _hasValidMoves() {
                if(this.grid.some(row=>row.some(tile=>tile?.special&&!tile.blocker)))return true;
                for (let r = 0; r < this.ROWS; r++) {
                    for (let c = 0; c < this.COLS; c++) {
                        if (!this.grid[r][c] || this.grid[r][c].blocker) continue;
                        // Try swap right
                        if (c + 1 < this.COLS && this.grid[r][c+1] && !this.grid[r][c+1].blocker) {
                            [this.grid[r][c], this.grid[r][c+1]] = [this.grid[r][c+1], this.grid[r][c]];
                            const has = this._findMatchGroups().length > 0;
                            [this.grid[r][c], this.grid[r][c+1]] = [this.grid[r][c+1], this.grid[r][c]];
                            if (has) return true;
                        }
                        // Try swap down
                        if (r + 1 < this.ROWS && this.grid[r+1][c] && !this.grid[r+1][c].blocker) {
                            [this.grid[r][c], this.grid[r+1][c]] = [this.grid[r+1][c], this.grid[r][c]];
                            const has = this._findMatchGroups().length > 0;
                            [this.grid[r][c], this.grid[r+1][c]] = [this.grid[r+1][c], this.grid[r][c]];
                            if (has) return true;
                        }
                    }
                }
                return false;
            },
            _shuffleGrid() {
                const nonBlockers = [];
                for (let r = 0; r < this.ROWS; r++) for (let c = 0; c < this.COLS; c++) {
                    if (this.grid[r][c] && !this.grid[r][c].blocker) nonBlockers.push({ r, c, tile: this.grid[r][c] });
                }
                // Fisher-Yates on tile types
                for (let i = nonBlockers.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [nonBlockers[i].tile.type, nonBlockers[j].tile.type] = [nonBlockers[j].tile.type, nonBlockers[i].tile.type];
                    [nonBlockers[i].tile.special, nonBlockers[j].tile.special] = [nonBlockers[j].tile.special, nonBlockers[i].tile.special];
                }
                // Remove any accidental matches
                let safe = 0;
                while (this._findMatchGroups().length > 0 && safe++ < 50) {
                    const gs = this._findMatchGroups();
                    for (const g of gs) for (const cell of g.cells) {
                        if (!this.grid[cell.r][cell.c].blocker) {
                            this.grid[cell.r][cell.c].type = this.TYPES[Math.floor(Math.random() * this.TYPES.length)];
                        }
                    }
                }
                this._shuffleTimer = 1.5;
            },

            // ===== BLOCKERS =====
            _maybeSpawnBlockers() {
                const level = this.getLevel();
                const profile=FootballGameRules.puzzle(this.elapsed),maxBlockers=profile.maxBlockers;
                let current = 0;
                for (let r = 0; r < this.ROWS; r++) for (let c = 0; c < this.COLS; c++) {
                    if (this.grid[r][c] && this.grid[r][c].blocker) current++;
                }
                if (current >= maxBlockers) return;
                const toSpawn=Math.min(maxBlockers-current,profile.blockerCount);
                this._needsValidCheck=true;
                for (let i = 0; i < toSpawn; i++) {
                    let attempts = 0;
                    while (attempts++ < 20) {
                        const r = Math.floor(Math.random() * this.ROWS), c = Math.floor(Math.random() * this.COLS);
                        if (this.grid[r][c] && !this.grid[r][c].blocker && !this.grid[r][c].special) {
                            const useMud=profile.armored&&Math.random()<.4;
                            this.grid[r][c] = { type: null, special: null, blocker: useMud ? 'mud' : 'grass', blockerHP: useMud ? 2 : 1, fromY: -1, scale: 1, alpha: 1 };
                            break;
                        }
                    }
                }
            },

            // ===== GAME END =====
            failGame() {
                if(this.gameOver)return;
                this.gameOver = true;
                this.cleanup();
                SoundManager.play('miss');
                const elapsed = this.elapsed;
                const timeBonus = Math.floor(elapsed * 15);
                const chainBonus = this.maxChain * 200;
                const feverBonus = this.feverCount * 500;
                const levelBonus = this._maxLevel * 300;
                this.score += timeBonus + chainBonus + feverBonus + levelBonus;

                mgManager.showResult('donghyun', this.score, {
                    _summary: `골 허용! 생존: ${elapsed.toFixed(1)}초 (Lv${this._maxLevel})`,
                    cleared: false, elapsed,
                    maxLevel: this._maxLevel,
                    totalMatches: this.totalMatches,
                    maxChain: this.maxChain,
                    movesMade: this.movesMade,
                    feverCount: this.feverCount,
                    specialsUsed: this.specialsUsed,
                    blockerCleared: this.blockerCleared
                });
            },

            // ===== SYSTEM =====
            updateHud() {
                const hud = document.getElementById('mgHud');
                if (!hud) return;
                const level = this.getLevel();
                const feverText = this.feverActive ? '<span style="color:#ffd700;font-weight:700;text-shadow:0 0 8px rgba(255,215,0,0.6);">⚡FEVER!</span>' : '';
                const lvColors = ['#2ecc71','#2ecc71','#f1c40f','#f39c12','#e67e22','#e74c3c','#c0392b','#8e44ad'];
                const lvColor = lvColors[Math.min(level, lvColors.length - 1)];
                hud.innerHTML = `
                    <div style="display:flex;align-items:center;gap:4px;background:rgba(0,0,0,0.3);border-radius:8px;padding:3px 8px;">
                        <span style="font-size:0.8em;">⏱️</span>
                        <span style="color:#70a1ff;font-size:1em;font-weight:700;">${this.elapsed.toFixed(1)}s</span>
                    </div>
                    <div style="flex:1;text-align:center;">
                        <span style="color:#ffd700;font-weight:700;font-size:1.15em;text-shadow:0 1px 3px rgba(0,0,0,0.4);">${this.score.toLocaleString()}</span>
                        <span style="color:rgba(255,255,255,0.5);font-size:0.8em;">점</span>
                        ${feverText}
                    </div>
                    <div style="background:linear-gradient(135deg,${lvColor},${lvColor}cc);color:white;border-radius:6px;padding:3px 8px;font-size:0.8em;font-weight:700;box-shadow:0 2px 6px rgba(0,0,0,0.3);">Lv${level}</div>`;
            },
            pause() {
                this.paused=true;this.selected=null;
                if(this._rafId){cancelAnimationFrame(this._rafId);this._rafId=null;}
            },
            resume() {
                if (this.gameOver) return;
                this.paused = false;
                this._lastTime = performance.now();
                this._doResize?.();
                this._rafId=requestAnimationFrame(t=>this.gameLoop(t));
            },
            cleanup() {
                this.gameOver=true;
                if (this._rafId) { cancelAnimationFrame(this._rafId); this._rafId = null; }
                if (this.canvas) {
                    this.canvas.removeEventListener('mousedown', this._onMD);
                    this.canvas.removeEventListener('mouseup', this._onMU);
                    this.canvas.removeEventListener('touchstart', this._onTS);
                    this.canvas.removeEventListener('touchend', this._onTE);
                    this.canvas.removeEventListener('touchmove', this._onTM);
                }
                if (this._resizeHandler) {
                    window.removeEventListener('resize', this._resizeHandler);
                    this._resizeHandler = null;
                }
                if (this._orientationHandler) {
                    window.removeEventListener('orientationchange', this._orientationHandler);
                    this._orientationHandler = null;
                }
                if (this._resizeDebounce) { clearTimeout(this._resizeDebounce); this._resizeDebounce = null; }
                ParticleSystem.clear();
            }
        };

    </script>
    <script src="football-game-rules.js"></script>
    <script src="football-arcade.js"></script>
    <script src="football-minigames.js"></script>
    <script src="football-game-center.js"></script>
    <script>
        FootballGameCenter.configure({
            canAccess: () => isAdmin,
            names: () => (players.length ? players : defaultPlayers).map(player => player.name),
            database: () => db,
            timestamp: () => firebase.firestore.FieldValue.serverTimestamp(),
            startMiniGame: (gameId, session) => FootballMiniGames.open(gameId, session),
            closeMiniGame: () => FootballMiniGames.close(false)
        });
    </script>
