                    btnHighlight(this._btnL, false);
                };
                this._btnRStart = (e) => {
                    e.preventDefault();
                    this._touchR = true;
                    this.touchSide = 1;
                    this._touchActive = true;
                    btnHighlight(this._btnR, true);
                    const now = Date.now();
                    if (now - this._lastTapTimeR < 300) { this._tryDash(); }
                    this._lastTapTimeR = now;
                };
                this._btnREnd = (e) => {
                    e.preventDefault();
                    this._touchR = false;
                    if (this._touchL) this.touchSide = -1;
                    else this.touchSide = 0;
                    this._touchActive = this._touchL;
                    this._lastTouchEnd = Date.now();
                    btnHighlight(this._btnR, false);
                };
                this._btnL.addEventListener('touchstart', this._btnLStart, { passive: false });
                this._btnL.addEventListener('touchend', this._btnLEnd, { passive: false });
                this._btnL.addEventListener('touchcancel', this._btnLEnd, { passive: false });
                this._btnR.addEventListener('touchstart', this._btnRStart, { passive: false });
                this._btnR.addEventListener('touchend', this._btnREnd, { passive: false });
                this._btnR.addEventListener('touchcancel', this._btnREnd, { passive: false });
                // Keyboard
                this._keysHeld = new Set();
                this._kd = (e) => {
                    if (this._stopped) return;
                    if (e.key === 'ArrowLeft') { this._keysHeld.add('left'); this.touchSide = -1; }
                    if (e.key === 'ArrowRight') { this._keysHeld.add('right'); this.touchSide = 1; }
                    if (e.key === ' ' || e.code === 'Space') { e.preventDefault(); this._tryDash(); }
                };
                this._ku = (e) => {
                    if (this._stopped) return;
                    if (e.key === 'ArrowLeft') this._keysHeld.delete('left');
                    if (e.key === 'ArrowRight') this._keysHeld.delete('right');
                    if (this._keysHeld.has('left')) this.touchSide = -1;
                    else if (this._keysHeld.has('right')) this.touchSide = 1;
                    else this.touchSide = 0;
                };
                document.addEventListener('keydown', this._kd);
                document.addEventListener('keyup', this._ku);
            },
            updateHud() {
                const diff = this.getDiff();
                const lvlText = diff.level >= 8 ? 'Lv.MAX' + (this._dashCooldown > 0 ? '' : ' [DASH]') : 'Lv.' + diff.level;
                document.getElementById('mgHud').innerHTML = `
                    ${GameSprites.healthBar(this.hearts, 3)}
                    ${GameSprites.scorePanel(this.score)}
                    ${GameSprites.comboIndicator(this.combo)}
                    <div style="color:rgba(255,255,255,0.8);font-size:0.8em;font-weight:700;background:rgba(255,255,255,0.1);padding:2px 8px;border-radius:8px;">${lvlText}</div>`;
            },
            getDiff() { return FootballGameRules.classic(this.elapsed,this.score); },
            _tryDash() {
                if(this._stopped||mgManager.paused||this._dashCooldown>0||this._dashActive>0)return;
                this._dashActive = 12; // ~0.2s at 60fps
                this._dashCooldownEnd = performance.now() + 7000; // 7 seconds real time
                this._dashCooldown = 300; // display fallback
                const dashDir = this.touchSide !== 0 ? this.touchSide : -1;
                this.player.x += dashDir * 60;
                this.player.x = Math.max(this.player.r, Math.min(this.w - this.player.r, this.player.x));
                // Dash particles
                for (let j = 0; j < 5; j++) {
                    this._particles.push({
                        x: this.player.x - dashDir * 20, y: this.player.y,
                        vx: -dashDir * (1 + Math.random() * 2), vy: (Math.random() - 0.5) * 2,
                        life: 12, maxLife: 12, size: 3, color: '#70a1ff'
                    });
                }
            },
            loop() {
                if (this._stopped) return;
                const now = performance.now();
                const dt = Math.min((now - this.lastTime) / (1000/60), 3);
                this.lastTime = now;
                this._physicsRemainder+=dt;
                while(this._physicsRemainder>=.5&&!this._stopped){this.update(.5);this._physicsRemainder-=.5;}
                if(!this._stopped)this.draw();
                if (!this._stopped) this.animFrame = requestAnimationFrame(() => this.loop());
            },
            update(dt) {
                this.elapsed+=dt/60;
                const diff = this.getDiff();
                if (this.invincibleTimer > 0) this.invincibleTimer -= dt;
                if (this.touchSide !== 0) {
                    this.player.x += this.touchSide * 5 * dt;
                }
                this.player.x = Math.max(this.player.r, Math.min(this.w - this.player.r, this.player.x));
                this.spawnTimer += dt;
                if (this.spawnTimer > 60 * diff.density) {
                    this.spawnTimer = 0;this._spawnWaves++;
                    let sx = Math.random() * (this.w - 40) + 20;
                    if (Math.abs(sx - this.player.x) < 40) sx = sx < this.player.x ? Math.max(20, sx - 50) : Math.min(this.w - 20, sx + 50);
                    if(diff.gate&&this._spawnWaves%3===0){
                        for(const side of [.23,.77])this.defenders.push({x:this.w*side,y:-20,r:14,vy:diff.speed,vx:0,tracking:0,screen:true});
                    }else {
                    this.defenders.push({
                        x: sx, y: -20, r: 14,
                        vy: diff.speed, vx: (Math.random() - 0.5) * diff.lateral * 3,
                        tracking: Math.random() < diff.tracking ? (0.03 + diff.tracking * 0.08) : 0
                    });
                    }
                }
                this.coinTimer += dt;
                const coinInterval = this.score >= 1200 ? 90 : this.score >= 500 ? 110 : 140;
                if (this.coinTimer > coinInterval) {
                    this.coinTimer = 0;
                    // Golden coin: 25% chance at 800+ score, spawns near a defender
                    const isGolden = this.score >= 800 && Math.random() < 0.25 && this.defenders.length > 0;
                    if (isGolden) {
                        const nearDef = this.defenders[Math.floor(Math.random() * this.defenders.length)];
                        const gx = Math.max(20, Math.min(this.w - 20, nearDef.x + (Math.random() - 0.5) * 40));
                        this.coins.push({ x: gx, y: -20, r: 12, vy: 2, golden: true, value: 150 });
                    } else {
                        this.coins.push({ x: Math.random() * (this.w - 40) + 20, y: -20, r: 10, vy: 2, golden: false, value: 50 });
                    }
                }
                this.defenders.forEach(d => {
                    if (d._isBoss && d._bossType) {
                        d._bossFrame = (d._bossFrame || 0) + dt;
                        // 플레이어 Y에 가까울수록 추적력 감소 (거리 220px 이내에서 선형 감소)
                        const distY = this.player.y - d.y;
                        const trackFade = distY > 0 ? Math.min(1, distY / 220) : 0;
                        const effectiveTracking = (d.tracking || 0) * trackFade;
                        if (d._bossType === 'charger') {
                            d.vy = Math.min(d.vy * (1 + 0.001 * dt), 12);
                            d.y += d.vy * dt;
                        } else if (d._bossType === 'zigzag') {
                            d.y += d.vy * dt;
                            d.x += Math.sin(d._bossFrame * 0.1) * 4 * dt;
                            d.x += (this.player.x - d.x) * effectiveTracking * dt;
                        } else if (d._bossType === 'wall') {
                            d.y += d.vy * dt;
                            d.x += (this.player.x - d.x) * effectiveTracking * dt;
                        } else if (d._bossType === 'tracker') {
                            d.y += d.vy * dt;
                            d.x += (this.player.x - d.x) * effectiveTracking * dt;
                        } else {
                            d.y += d.vy * dt; d.x += d.vx * dt;
                            if (d.tracking) d.x += (this.player.x - d.x) * effectiveTracking * dt;
                        }
                    } else {
                        d.y += d.vy * dt; d.x += d.vx * dt;
                        if (d.tracking) d.x += (this.player.x - d.x) * d.tracking * dt;
                    }
                    if (d.x < d.r) { d.x = d.r; d.vx *= -1; }
                    if (d.x > this.w - d.r) { d.x = this.w - d.r; d.vx *= -1; }
                });
                this.coins.forEach(c => { c.y += c.vy * dt; });
                // Dash cooldown & active timer
                if (this._dashCooldownEnd) {
                    this._dashCooldown = Math.max(0, this._dashCooldownEnd - performance.now()) / 1000 * 60;
                    if (this._dashCooldown <= 0) { this._dashCooldown = 0; this._dashCooldownEnd = null; }
                }
                if (this._dashActive > 0) this._dashActive -= dt;
                for (let i = this.defenders.length - 1; i >= 0; i--) {
                    const d = this.defenders[i];
                    if (Math.hypot(this.player.x - d.x, this.player.y - d.y) < this.player.r + d.r) {
                        if (this.invincibleTimer > 0 || this._dashActive > 0) { this.defenders.splice(i, 1); continue; }
                        this.hearts--; this.combo = 0; this._dodgeStreak = 0; this.defenders.splice(i, 1);
                        this.invincibleTimer = 90; this._hitFlash = 1;
                        GameAnim.shakeCanvas(10);
                        ParticleSystem.emit('impact', this.player.x, this.player.y, 8, 25);
                        SoundManager.play('miss');
                        this.updateHud();
                        if (this.hearts <= 0) { this.endGame(); return; }
                    }
                }
                for (let i = this.coins.length - 1; i >= 0; i--) {
                    const c = this.coins[i];
                    if (Math.hypot(this.player.x - c.x, this.player.y - c.y) < this.player.r + c.r) {
                        this.combo++;
                        if (this.combo > this.maxCombo) this.maxCombo = this.combo;
                        this.coinCount++;
                        if (c.golden) this._goldenCoinCount++;
                        SoundManager.play('coin');
                        const mult = this.combo >= 5 ? 2.5 : this.combo >= 4 ? 2 : this.combo >= 3 ? 1.5 : 1;
                        const baseVal = c.value || 50;
                        const pts = Math.floor(baseVal * mult);
                        this.score += pts; this.updateHud();
                        this._scoreTexts.push({ x: c.x, y: c.y, text: '+' + pts + (c.golden ? '★' : ''), life: 30, maxLife: 30 });
                        // Enhanced coin collection particles
                        ParticleSystem.emit('sparkle', c.x, c.y, c.golden ? 10 : 6, c.golden ? 25 : 18);
                        const particleColor = c.golden ? '#ff6b35' : '#ffd700';
                        const particleCount = c.golden ? 12 : 8;
                        for (let j = 0; j < particleCount; j++) {
                            this._particles.push({
                                x: c.x, y: c.y, vx: (Math.random()-0.5)*4, vy: (Math.random()-0.5)*4,
                                life: 15, maxLife: 15, size: c.golden ? 5 : 4, color: particleColor
                            });
                        }
                        this.coins.splice(i, 1);
                    }
                }
                for (let i = this.defenders.length - 1; i >= 0; i--) {
                    if (this.defenders[i].y > this.h + 30) {
                        this.combo++;
                        if (this.combo > this.maxCombo) this.maxCombo = this.combo;
                        this.dodgedCount++;
                        this._dodgeStreak++;
                        if (this._dodgeStreak > this._maxDodgeStreak) this._maxDodgeStreak = this._dodgeStreak;
                        const isBoss = this.defenders[i]._isBoss;
                        const mult = this.combo >= 5 ? 2.5 : this.combo >= 4 ? 2 : this.combo >= 3 ? 1.5 : 1;
                        // Dodge streak bonus: up to +30 per dodge
                        const streakBonus = Math.min(this._dodgeStreak * 2, 30);
                        const basePts = isBoss ? 200 : 10 + streakBonus;
                        const pts = Math.floor(basePts * mult);
                        this.score += pts; this.defenders.splice(i, 1); this.updateHud();
                    }
                }
                this.coins = this.coins.filter(c => c.y < this.h + 30);
                // Boss check: every 1000 points
                const bossThreshold = Math.floor(Math.max(this.score/1000,this.elapsed/diff.bossEvery));
                if (bossThreshold > this._lastBossThreshold) {
                    this._lastBossThreshold = bossThreshold;
                    this._bossActive = true;
                    const bossTypes = [
                        { name: '정기헌', type: 'tracker', color: '#cc0000', speed: 1.0, tracking: 0.10, r: 28, desc: '추적형' },
                        { name: '장건호', type: 'charger', color: '#ff6b35', speed: 1.6, tracking: 0, r: 28, desc: '돌진형' },
                        { name: '이신원', type: 'zigzag', color: '#9b59b6', speed: 1.2, tracking: 0.08, r: 28, desc: '지그재그' },
                        { name: '정우진', type: 'wall', color: '#2c3e50', speed: 0.6, tracking: 0.05, r: 36, desc: '벽' }
                    ];
                    const bossInfo = bossTypes[(bossThreshold - 1) % bossTypes.length];
                    const bossScaling = 1 + bossThreshold * 0.05;
                    SoundManager.play('boss');
                    GameAnim.shakeCanvas(12);
                    ParticleSystem.emit('impact', this.w / 2, 20, 10, 40);
                    this.defenders.push({
                        x: this.w / 2, y: -40, r: bossInfo.r,
                        vy: Math.max(2, this.getDiff().speed * 0.6 * bossInfo.speed * bossScaling),
                        vx: 0, tracking: Math.min(0.30, bossInfo.tracking * bossScaling),
                        _isBoss: true, _bossName: bossInfo.name, _bossType: bossInfo.type, _bossColor: bossInfo.color,
                        _bossFrame: 0
                    });
                    this._milestoneText = bossInfo.name === '정우진' ? `${bossInfo.name}: "양명!" (${bossInfo.desc})` : `${bossInfo.name}가 달려온다! (${bossInfo.desc})`;
                    this._milestoneTimer = 90;
                }
                // Milestone check (skip if boss banner is active)
                if (this._milestoneIdx < dribbleMilestones.length && this.score >= dribbleMilestones[this._milestoneIdx].score) {
                    if (this._milestoneTimer <= 0 || !this._bossActive) {
                        this._milestoneText = dribbleMilestones[this._milestoneIdx].text;
                        this._milestoneTimer = 120; // ~2 seconds at 60fps
                        this._milestoneIdx++;
                    }
                }
                if (this._milestoneTimer > 0) this._milestoneTimer -= dt;
                // Near miss detection (8px threshold) with scoring - not during invincibility/dash
                if (this._nearMissTimer > 0) this._nearMissTimer -= dt;
                for (const d of this.defenders) {
                    const dist = Math.hypot(this.player.x - d.x, this.player.y - d.y);
                    if (!d._nearAwarded && dist < this.player.r + d.r + 8 && dist >= this.player.r + d.r && this._nearMissTimer <= 0 && this.invincibleTimer <= 0 && this._dashActive <= 0) {
                        d._nearAwarded=true;
                        this._nearMissTimer = 30;
                        this._nearMissCount++;
                        const nmPts = d._isBoss ? 50 : 20;
                        this.score += nmPts;
                        SoundManager.play('nearMiss');
                        this._scoreTexts.push({ x: this.player.x, y: this.player.y - 20, text: 'NEAR! +' + nmPts, life: 25, maxLife: 25 });
                        // Near miss shockwave ring
                        if (!this._nearMissRings) this._nearMissRings = [];
                        this._nearMissRings.push({ x: this.player.x, y: this.player.y, startR: this.player.r + d.r, life: 15, maxLife: 15 });
                        // Near miss particles (use ParticleSystem)
                        ParticleSystem.emit('impact', this.player.x, this.player.y, 6, 20);
                        for (let j = 0; j < 4; j++) {
                            this._particles.push({
                                x: this.player.x, y: this.player.y,
                                vx: (Math.random()-0.5)*3, vy: (Math.random()-0.5)*3,
                                life: 10, maxLife: 10, size: 3, color: '#ff6b6b'
                            });
                        }
                        this.updateHud();
                    }
                }
                this._scoreTexts.forEach(st => { st.y -= 0.8 * dt; st.life -= dt; });
                this._scoreTexts = this._scoreTexts.filter(st => st.life > 0);
                // 파티클 업데이트 (dt 적용)
                this._particles.forEach(p => {
                    p.x += p.vx * dt; p.y += p.vy * dt; p.life -= dt;
                });
                this._particles = this._particles.filter(p => p.life > 0);
                // hitFlash 감소 (dt 적용)
                if (this._hitFlash > 0) this._hitFlash -= 0.05 * dt;
                this._motionTime += dt / 60;
                this._runnerMotion.advance(dt / 60, {x:this.player.x, speed:diff.speed*90, mode:this._hitFlash>.2?'hit':this._dashActive>0?'dash':'run'});
                // Update shared systems
                ParticleSystem.update(dt / 60);
                GameAnim.updateTweens(dt);
                // Near miss rings update (dt 적용)
                if (this._nearMissRings) {
                    this._nearMissRings.forEach(r => { r.life -= dt; });
                }
                // Boss afterimages decay (handled in draw for visual sync)
                // Level transition check
                const curLvl = Math.floor(this.score / 500) + 1;
                if (!this._lastLvl) this._lastLvl = 1;
                if (curLvl > this._lastLvl) {
                    this._lastLvl = curLvl;
                    this._levelTransition = 40;
                    this._levelTransText = 'LEVEL ' + curLvl;
                    SoundManager.play('level_up');
                    ParticleSystem.emit('confetti', this.w / 2, this.h / 2, 15, 60);
                }
                // Level transition timer (dt 적용)
                if (this._levelTransition > 0) this._levelTransition -= dt;
                // coinFrame 증가 (dt 적용)
                this._coinFrame += dt;
            },
            _coinFrame: 0, _hitFlash: 0, _particles: [],
            _bossAfterimages: [], _nearMissRings: [], _levelTransition: 0, _levelTransText: '',
            draw() {
                const ctx = this.ctx;
                ctx.clearRect(0, 0, this.w, this.h);
                const now = performance.now();

                // Apply screen shake
                ctx.save();
                GameAnim.applyShake(ctx);

                // Rich scrolling field background with parallax
                const scrollOff = now / 30;
                RichBackground.draw(ctx, this.w, this.h, scrollOff);

                // Level-based atmosphere overlays
                const lvl = Math.floor(this.score / 500) + 1;
                if (lvl >= 4) {
                    // Dark fog overlay
                    const fogAlpha = Math.min(0.25, (lvl - 3) * 0.05);
                    ctx.fillStyle = `rgba(0,0,20,${fogAlpha})`;
                    ctx.fillRect(0, 0, this.w, this.h);
                }
                if (lvl >= 6) {
                    // Red vignette for danger
                    const dangerGrad = ctx.createRadialGradient(this.w/2, this.h/2, this.h*0.3, this.w/2, this.h/2, this.h*0.7);
                    dangerGrad.addColorStop(0, 'rgba(0,0,0,0)');
                    dangerGrad.addColorStop(1, `rgba(180,30,30,${Math.min(0.2, (lvl-5)*0.04)})`);
                    ctx.fillStyle = dangerGrad;
                    ctx.fillRect(0, 0, this.w, this.h);
                }

                // Speed lines at high scores (enhanced)
                if (this.score >= 800) {
                    ctx.save();
                    const lineCount = Math.min(10, 5 + Math.floor(this.score / 500));
                    const lineAlpha = Math.min(0.15, 0.06 + this.score / 10000);
                    ctx.strokeStyle = `rgba(255,255,255,${lineAlpha})`;
                    ctx.lineWidth = 1;
                    for (let i = 0; i < lineCount; i++) {
                        const lx = 20 + (now / 8 + i * (this.w / lineCount)) % this.w;
                        ctx.beginPath();
                        ctx.moveTo(lx, 0);
                        ctx.lineTo(lx - 15, this.h);
                        ctx.stroke();
                    }
                    ctx.restore();
                }

                // Boss afterimages (zigzag type)
                this._bossAfterimages = this._bossAfterimages.filter(a => a.alpha > 0.02);
                this._bossAfterimages.forEach(a => {
                    ctx.save();
                    ctx.globalAlpha = a.alpha;
                    GameSprites.drawPlayer(ctx, a.x, a.y, a.r, a.color, 'front', 'angry');
                    ctx.restore();
                    a.alpha *= 0.88;
                });

                // Defenders with enhanced visuals
                this.defenders.forEach(d => {
                    if (d._isBoss) {
                        const bType = d._bossType;
                        const bFrame = d._bossFrame || 0;

                        // Boss-specific visual effects (behind boss)
                        if (bType === 'charger') {
                            // Fire trail particles behind charger
                            for (let fi = 0; fi < 3; fi++) {
                                const fx = d.x + (Math.random()-0.5) * d.r * 0.8;
                                const fy = d.y - d.r * 0.8 - Math.random() * 12;
                                const fSize = 3 + Math.random() * 4;
                                ctx.save();
                                ctx.globalAlpha = 0.5 + Math.random() * 0.3;
                                const fireGrad = ctx.createRadialGradient(fx, fy, 0, fx, fy, fSize);
                                fireGrad.addColorStop(0, '#ffdd44');
                                fireGrad.addColorStop(0.5, '#ff6b35');
                                fireGrad.addColorStop(1, 'rgba(255,60,20,0)');
                                ctx.fillStyle = fireGrad;
                                ctx.beginPath();
                                ctx.arc(fx, fy, fSize, 0, Math.PI * 2);
                                ctx.fill();
                                ctx.restore();
                            }
                        } else if (bType === 'zigzag') {
                            // Record afterimages
                            if (Math.floor(bFrame * 6) % 3 === 0) {
                                this._bossAfterimages.push({ x: d.x, y: d.y, r: d.r, color: d._bossColor, alpha: 0.35 });
                                if (this._bossAfterimages.length > 8) this._bossAfterimages.shift();
                            }
                        } else if (bType === 'wall') {
                            // Shield icon behind wall boss
                            ctx.save();
                            ctx.globalAlpha = 0.3 + Math.sin(bFrame * 0.05) * 0.1;
                            ctx.strokeStyle = '#7f8c8d';
                            ctx.lineWidth = 2;
                            const sx = d.x, sy = d.y;
                            ctx.beginPath();
                            ctx.moveTo(sx, sy - d.r * 1.2);
                            ctx.quadraticCurveTo(sx + d.r * 1.1, sy - d.r * 0.5, sx + d.r * 0.8, sy + d.r * 0.3);
                            ctx.quadraticCurveTo(sx, sy + d.r * 0.9, sx - d.r * 0.8, sy + d.r * 0.3);
                            ctx.quadraticCurveTo(sx - d.r * 1.1, sy - d.r * 0.5, sx, sy - d.r * 1.2);
                            ctx.stroke();
                            ctx.restore();
                        } else if (bType === 'tracker') {
                            // Crosshair targeting player
                            ctx.save();
                            ctx.strokeStyle = 'rgba(255,50,50,0.35)';
                            ctx.lineWidth = 1;
                            ctx.setLineDash([4, 4]);
                            ctx.beginPath();
                            ctx.moveTo(d.x, d.y);
                            ctx.lineTo(this.player.x, this.player.y);
                            ctx.stroke();
                            ctx.setLineDash([]);
                            // Crosshair circle at defender
                            const chR = d.r * 1.3;
                            ctx.beginPath();
                            ctx.arc(d.x, d.y, chR, 0, Math.PI * 2);
                            ctx.stroke();
                            ctx.beginPath();
                            ctx.moveTo(d.x - chR, d.y); ctx.lineTo(d.x - chR * 0.6, d.y);
                            ctx.moveTo(d.x + chR * 0.6, d.y); ctx.lineTo(d.x + chR, d.y);
                            ctx.moveTo(d.x, d.y - chR); ctx.lineTo(d.x, d.y - chR * 0.6);
                            ctx.moveTo(d.x, d.y + chR * 0.6); ctx.lineTo(d.x, d.y + chR);
                            ctx.stroke();
                            ctx.restore();
                        }

                        // Draw the boss character with expression and type-specific style
                        const bossExpr = bType === 'charger' ? 'angry' : bType === 'zigzag' ? 'determined' : bType === 'wall' ? 'angry' : 'panic';
                        const bossNum = bType === 'charger' ? '99' : bType === 'zigzag' ? '7' : bType === 'wall' ? '5' : '11';
                        ChibiSprite.drawChibi(ctx, d.x, d.y, d.r * 2.2, {
                            jersey: d._bossColor || '#cc0000',
                            expression: bossExpr,
                            number: bossNum,
                            role: 'defender', pose: 'running', animationTime: this._motionTime
                        });

                        // Boss name tag with glow
                        ctx.save();
                        ctx.shadowColor = d._bossColor || '#cc0000';
                        ctx.shadowBlur = 8;
                        GameText.drawOutlined(ctx, d._bossName || 'BOSS', d.x, d.y - d.r * 1.5 - 8, 12, '#ffd700', '#000');
                        ctx.restore();
                        if (d._bossName === '정우진') {
                            GameText.drawOutlined(ctx, '"양명!"', d.x, d.y - d.r - 24, 13, '#fff', '#000');
                        }
                    } else {
                        // Normal defenders with angry expression
                        GameSprites.drawDefender(ctx, d.x, d.y, d.r, {pose:'running', animationTime:this._motionTime, phaseOffset:(d.r%7)/7});
                    }
                });

                // Near miss shockwave rings
                this._nearMissRings = (this._nearMissRings || []).filter(r => r.life > 0 && r.maxLife > 0);
                this._nearMissRings.forEach(ring => {
                    ctx.save();
                    const rLife = Math.max(0, ring.life / ring.maxLife);
                    const t = 1 - rLife;
                    const radius = ring.startR + t * 35;
                    // Outer glow ring
                    ctx.globalAlpha = rLife * 0.25;
                    ctx.strokeStyle = '#ff9999';
                    ctx.lineWidth = Math.max(1, 6 * rLife);
                    ctx.beginPath();
                    ctx.arc(ring.x, ring.y, radius, 0, Math.PI * 2);
                    ctx.stroke();
                    // Inner sharp ring
                    ctx.globalAlpha = rLife * 0.7;
                    ctx.strokeStyle = '#ff6b6b';
                    ctx.lineWidth = Math.max(0.5, 2.5 * rLife);
                    ctx.beginPath();
                    ctx.arc(ring.x, ring.y, radius, 0, Math.PI * 2);
                    ctx.stroke();
                    // Second ring (slightly smaller, delayed)
                    if (t > 0.1) {
                        const r2 = ring.startR + (t - 0.1) * 28;
                        ctx.globalAlpha = rLife * 0.3;
                        ctx.lineWidth = Math.max(0.5, 1.5 * rLife);
                        ctx.beginPath();
                        ctx.arc(ring.x, ring.y, r2, 0, Math.PI * 2);
                        ctx.stroke();
                    }
                    ctx.restore();
                });

                // Coins with enhanced rendering
                this.coins.forEach(c => {
                    // Coin magnet effect (draw pull line when close)
                    const coinDist = Math.hypot(this.player.x - c.x, this.player.y - c.y);
                    if (coinDist < 50) {
                        ctx.save();
                        ctx.globalAlpha = (1 - coinDist / 50) * 0.3;
                        ctx.strokeStyle = c.golden ? '#ff6b35' : '#ffd700';
                        ctx.lineWidth = 1;
                        ctx.setLineDash([2, 4]);
                        ctx.beginPath();
                        ctx.moveTo(c.x, c.y);
                        ctx.lineTo(this.player.x, this.player.y);
                        ctx.stroke();
                        ctx.setLineDash([]);
                        ctx.restore();
                    }

                    if (c.golden) {
                        // Golden coin: orbiting sparkles
                        ctx.save();
                        ctx.shadowColor = '#ff6b35';
                        ctx.shadowBlur = 12;
                        GameSprites.drawCoin(ctx, c.x, c.y, c.r, this._coinFrame);
                        ctx.shadowBlur = 0;
                        // Star overlay
                        ctx.fillStyle = '#fff';
                        ctx.font = 'bold 10px sans-serif';
                        ctx.textAlign = 'center';
                        ctx.textBaseline = 'middle';
                        ctx.fillText('★', c.x, c.y);
                        // Orbiting sparkles
                        for (let si = 0; si < 3; si++) {
                            const angle = (now / 400) + si * (Math.PI * 2 / 3);
                            const sx = c.x + Math.cos(angle) * (c.r + 4);
                            const sy = c.y + Math.sin(angle) * (c.r + 4);
                            ctx.fillStyle = '#ffd700';
                            ctx.globalAlpha = 0.5 + Math.sin(now / 200 + si) * 0.3;
                            ctx.beginPath();
                            // tiny 4-point star
                            const ss = 2;
                            ctx.moveTo(sx, sy - ss);
                            ctx.lineTo(sx + ss * 0.3, sy - ss * 0.3);
                            ctx.lineTo(sx + ss, sy);
                            ctx.lineTo(sx + ss * 0.3, sy + ss * 0.3);
                            ctx.lineTo(sx, sy + ss);
                            ctx.lineTo(sx - ss * 0.3, sy + ss * 0.3);
                            ctx.lineTo(sx - ss, sy);
                            ctx.lineTo(sx - ss * 0.3, sy - ss * 0.3);
                            ctx.closePath();
                            ctx.fill();
                        }
                        ctx.restore();
                    } else {
                        GameSprites.drawCoin(ctx, c.x, c.y, c.r, this._coinFrame);

                });

                // ParticleSystem draw (shared system)

                this._particles.forEach(p => {

                // Player with ball at feet (blink during invincibility)

                if (showPlayer) {
                    const px = this.player.x, py = this.player.y - 6;

                            const slY = py - pr + sl * pr * 0.5;

                            ctx.beginPath();
                            ctx.moveTo(slX, slY);
                            ctx.lineTo(slX - dashDir * (15 + sl * 4), slY);
                            ctx.stroke();
                        }
                        ctx.restore();
                        // Afterimages with gradient opacity
                        for (let ai = 1; ai <= 4; ai++) {
                            ctx.save();

                            ctx.restore();
                        }
                        // Main player with glow
                        ctx.save();
                        ctx.shadowColor = '#70a1ff';
                        ctx.shadowBlur = 22;
                        GameSprites.drawPlayer(ctx, px, py, pr, '#70a1ff', 'front', 'determined', null, null, {motion:this._runnerMotion});

                        ctx.strokeStyle = 'rgba(112,161,255,0.4)';

                    } else {

                        if (this.invincibleTimer > 0) {
                            // Invincibility shield effect
                            ctx.save();
                            ctx.strokeStyle = `rgba(255,215,0,${0.3 + Math.sin(now / 150) * 0.15})`;
                            ctx.lineWidth = 2;
                            ctx.setLineDash([4, 4]);
                            ctx.lineDashOffset = now / 50;
                            ctx.beginPath();
                            ctx.arc(px, py, pr * 1.5, 0, Math.PI * 2);
                            ctx.stroke();
                            ctx.setLineDash([]);
                            ctx.restore();
                        }
                        GameSprites.drawPlayer(ctx, px, py, pr, GameSprites.colors.jersey1, 'front', expr, null, null, {motion:this._runnerMotion});
                    }

                    // Ball dribble wobble
                    const footstep = this._runnerMotion.sample(this._motionReduced);
                    GameSprites.drawSoccerBall(ctx, px + 4 + footstep.ballX*.5, py + pr * 0.6-footstep.ballLift*.5, 6);
                }

                // Score texts with outlined style (drawn after player for z-order)
                this._scoreTexts.forEach(st => {
                    const t = st.life / st.maxLife;
                    ctx.save();
                    ctx.globalAlpha = Math.min(1, t * 2);
                    const scale = t > 0.7 ? 1 + (1 - (t - 0.7) / 0.3) * 0.3 : 1;
                    const fontSize = Math.floor(14 * scale);
                    const isNear = st.text.includes('NEAR');
                    const isGolden = st.text.includes('★');
                    const fillColor = isNear ? '#ff6b6b' : isGolden ? '#ff6b35' : '#ffd700';
                    GameText.drawOutlined(ctx, st.text, st.x, st.y, fontSize, fillColor, '#000');
                    ctx.restore();
                });

                // Circular dash cooldown gauge
                if (this._dashCooldown > 0) {
                    ctx.save();
                    const dashCx = this.player.x;
                    const dashCy = this.player.y + this.player.r + 14;
                    const dashGaugeR = 8;
                    const totalCooldown = 7000 / 1000 * 60; // match actual 7s cooldown in frames
                    const ratio = Math.min(1, this._dashCooldown / totalCooldown);

                    // Background circle
                    ctx.beginPath();
                    ctx.arc(dashCx, dashCy, dashGaugeR, 0, Math.PI * 2);
                    ctx.fillStyle = 'rgba(0,0,0,0.4)';
                    ctx.fill();

                    // Cooldown arc (fills up as it recharges)
                    ctx.beginPath();
                    ctx.moveTo(dashCx, dashCy);
                    const startAngle = -Math.PI / 2;
                    const endAngle = startAngle + (1 - ratio) * Math.PI * 2;
                    ctx.arc(dashCx, dashCy, dashGaugeR, startAngle, endAngle);
                    ctx.closePath();
                    const gaugeColor = ratio > 0.5 ? '#e74c3c' : ratio > 0.25 ? '#f1c40f' : '#2ecc71';
                    ctx.fillStyle = gaugeColor;
                    ctx.globalAlpha = 0.7;
                    ctx.fill();

                    // "D" label
                    ctx.globalAlpha = 0.9;
                    ctx.fillStyle = '#fff';
                    ctx.font = 'bold 8px sans-serif';
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillText('D', dashCx, dashCy);
                    ctx.restore();
                } else if (!this._dashActive || this._dashActive <= 0) {
                    // Dash ready indicator
                    ctx.save();
                    ctx.globalAlpha = 0.3 + Math.sin(now / 300) * 0.15;
                    ctx.fillStyle = '#70a1ff';
                    ctx.beginPath();
                    ctx.arc(this.player.x, this.player.y + this.player.r + 14, 8, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.globalAlpha = 0.8;
                    ctx.fillStyle = '#fff';
                    ctx.font = 'bold 8px sans-serif';
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillText('D', this.player.x, this.player.y + this.player.r + 14);
                    ctx.restore();
                }

                // HUD: Score and combo with outlined text
                GameText.drawOutlined(ctx, 'SCORE: ' + this.score, this.w / 2, 14, 13, '#fff', '#000');
                if (this.combo >= 3) {
                    const comboColor = this.combo >= 5 ? '#ff6b35' : '#ffd700';
                    GameText.drawBouncy(ctx, this.combo + 'x COMBO!', this.w / 2, 32, 11, comboColor, now / 1000);
                }

                // Hit flash overlay with vignette style
                if (this._hitFlash > 0) {
                    ctx.save();
                    // Red vignette
                    const hitGrad = ctx.createRadialGradient(this.w/2, this.h/2, this.h*0.15, this.w/2, this.h/2, this.h*0.6);
                    hitGrad.addColorStop(0, 'rgba(231,76,60,0)');
                    hitGrad.addColorStop(0.5, `rgba(231,76,60,${this._hitFlash * 0.15})`);
                    hitGrad.addColorStop(1, `rgba(231,76,60,${this._hitFlash * 0.55})`);
                    ctx.fillStyle = hitGrad;
                    ctx.fillRect(0, 0, this.w, this.h);
                    // White flash (for initial impact)
                    if (this._hitFlash > 0.7) {
                        ctx.globalAlpha = (this._hitFlash - 0.7) / 0.3 * 0.2;
                        ctx.fillStyle = '#fff';
                        ctx.fillRect(0, 0, this.w, this.h);
                    }
                    // Screen edge glow
                    ctx.globalAlpha = this._hitFlash * 0.6;
                    ctx.strokeStyle = '#e74c3c';
                    ctx.lineWidth = 4;
                    ctx.strokeRect(1, 1, this.w - 2, this.h - 2);
                    ctx.restore();
                }

                // Milestone banner (enhanced)
                if (this._milestoneTimer > 0 && this._milestoneText) {
                    ctx.save();
                    const mAlpha = Math.min(1, this._milestoneTimer / 30);
                    const isBoss = this._milestoneText.includes('달려온다') || this._milestoneText.includes('양명');
                    ctx.globalAlpha = mAlpha;
                    // Banner background with gradient
                    const bannerY = this.h * 0.35;
                    const bannerGrad = ctx.createLinearGradient(0, bannerY, 0, bannerY + 50);
                    if (isBoss) {
                        bannerGrad.addColorStop(0, 'rgba(180,30,30,0.85)');
                        bannerGrad.addColorStop(1, 'rgba(100,15,15,0.85)');
                    } else {
                        bannerGrad.addColorStop(0, 'rgba(0,0,0,0.7)');
                        bannerGrad.addColorStop(1, 'rgba(0,0,0,0.5)');
                    }
                    ctx.fillStyle = bannerGrad;
                    ctx.fillRect(0, bannerY, this.w, 50);
                    // Top/bottom lines
                    ctx.strokeStyle = isBoss ? '#ff4444' : '#ffd700';
                    ctx.lineWidth = 1;
                    ctx.beginPath();
                    ctx.moveTo(0, bannerY); ctx.lineTo(this.w, bannerY);
                    ctx.moveTo(0, bannerY + 50); ctx.lineTo(this.w, bannerY + 50);
                    ctx.stroke();
                    // Text with entrance scale
                    const mScale = mAlpha > 0.8 ? 1 + (1 - (mAlpha - 0.8) / 0.2) * 0.3 : 1;
                    GameText.drawOutlined(ctx, this._milestoneText, this.w / 2, bannerY + 25, Math.floor(18 * mScale), isBoss ? '#ff4444' : '#ffd700', '#000');
                    ctx.restore();
                }

                // Level transition effect (enhanced with flash + text)
                if (this._levelTransition > 0) {
                    ctx.save();
                    const lt = this._levelTransition / 40;
                    // White flash at start
                    if (lt > 0.85) {
                        ctx.globalAlpha = (lt - 0.85) / 0.15 * 0.4;
                        ctx.fillStyle = '#fff';
                        ctx.fillRect(0, 0, this.w, this.h);
                    }
                    // Background dim
                    ctx.globalAlpha = lt * 0.3;
                    ctx.fillStyle = '#000';
                    ctx.fillRect(0, 0, this.w, this.h);
                    // Level text with scale animation
                    ctx.globalAlpha = Math.min(1, lt * 1.5);
                    const textScale = 1 + (1 - lt) * 0.6;
                    const fontSize = Math.floor(32 * textScale);
                    GameText.drawOutlined(ctx, this._levelTransText, this.w / 2, this.h / 2, fontSize, '#ffd700', '#000');
                    // Decorative lines
                    ctx.strokeStyle = 'rgba(255,215,0,' + (lt * 0.5) + ')';
                    ctx.lineWidth = 2;
                    const lineW = this.w * 0.3 * (1 - lt);
                    ctx.beginPath();
                    ctx.moveTo(this.w / 2 - lineW, this.h / 2 + 25);
                    ctx.lineTo(this.w / 2 + lineW, this.h / 2 + 25);
                    ctx.stroke();
                    ctx.restore();
                }

                ctx.restore(); // end shake transform
            },
            pause() {
                this._stopped = true;
                if (this.animFrame) { cancelAnimationFrame(this.animFrame); this.animFrame = null; }
                if (this._dashCooldownEnd) {
                    this._dashCooldownRemaining = Math.max(0, this._dashCooldownEnd - performance.now());
                }
                this._keysHeld.clear(); this.touchSide = 0;
            },
            resume() {
                this._stopped = false;
                // Apply a viewport change that happened while the loop was paused.
                if (this._doResize) this._doResize();
                if (this.animFrame) { cancelAnimationFrame(this.animFrame); this.animFrame = null; }
                if (this._dashCooldownRemaining > 0) {
                    this._dashCooldownEnd = performance.now() + this._dashCooldownRemaining;
                    this._dashCooldownRemaining = 0;
                }
                this.lastTime = performance.now();
                this.loop();
            },
            endGame() {
                if(this._stopped)return;

                mgManager.showResult('dribble', this.score, {
                    _summary: `수비수를 피해 ${this.score}점 달성!`,

                    level: diff.level, maxCombo: this.maxCombo,
                    heartsLeft: this.hearts,
                    nearMisses: this._nearMissCount, goldenCoins: this._goldenCoinCount,
                    maxDodgeStreak: this._maxDodgeStreak
                });
            }
        };

        // ====== 게임 4: 골키퍼도 해야지 ======
        const gkShooters = [
            { name: "정재오", lines: ["받아라!", "풀파워!"], multiLines: ["다 받아봐!", "연사 간다!"] },
            { name: "김태연", lines: ["어디 갈까~", "슛!"], multiLines: ["여러 개다!", "다 같이~"] },
            { name: "장건호", lines: ["막아봐!", "이건 못 막아"], multiLines: ["한꺼번에!", "동시에 간다!"] },
            { name: "강신재", lines: ["갈게~", "왼쪽? 오른쪽?"], multiLines: ["전부 간다!", "몰아친다!"] },
            { name: "김관영", lines: ["어이쿠!", "슛!"], multiLines: ["우르르!", "다 쏜다!"] },
            { name: "이도경", lines: ["여기다!", "하나 간다!"], multiLines: ["여러 개!", "동시 발사!"] },
            { name: "옥준혁", lines: ["잘 봐~", "날아간다!"], multiLines: ["한 번에!", "쏟아진다!"] },
            { name: "문용혁", lines: ["패스 아니고 슛!", "간다!"], multiLines: ["전부 슛!", "연사!"] },
            { name: "김동현", lines: ["이번엔 내가!", "골이다!"], multiLines: ["다 간다!", "한꺼번에!"] },
            { name: "전근우", lines: ["비켜!", "파워슛!"], multiLines: ["폭풍슛!", "연속이다!"] }
        ];
        const goalkeeperGame = {
            saves: 0, goals: 0, score: 0, combo: 0, maxCombo: 0,
            balls: [], hot: false, spawnTimer: null, _currentShooter: null,
            _reactionTimes: [], _isBossRound: false, _bossSpawned: false, _effectTimeouts: [],
            _deflectCount: 0, _lightningCount: 0, _fastCount: 0,
            _addTimeout(callback, delay) {
                const id = this._clock.after(() => {
                    callback();
                    const idx = this._effectTimeouts.indexOf(id);
                    if (idx !== -1) this._effectTimeouts.splice(idx, 1);
                }, delay);
                this._effectTimeouts.push(id);
                return id;
            },
            init() {
                this.saves = 0; this.goals = 0; this._totalGoals=0; this.score = 0;
                this.combo = 0; this.maxCombo = 0; this.balls = []; this.hot = false;
                this._currentShooter = null; this._reactionTimes = []; this._isBossRound = false; this._bossSpawned = false; this._effectTimeouts = []; this._cutsceneActive = false; this._nextShooter = null; this._nextMultiCount = 0;
                this._deflectCount = 0; this._lightningCount = 0; this._fastCount = 0;
                this._stopped = false; this._touchUsed = false;
                this._clock?.clear();this._clock=new FootballGameRules.PausableClock();
                this._pendingShots=0;this._waveActive=false;this._waveNo=0;this._nextBallId=0;this._handReadyAt=0;this._reported=false;
                this.render(); this.updateHud();
                this.startSpawning();
            },
            cleanup() {
                this._stopped=true;this._clock?.clear();
                if (this.spawnTimer) { this._clock.cancel(this.spawnTimer); this.spawnTimer = null; }
                this.balls.forEach(b => { if (b.timeout) this._clock.cancel(b.timeout); });

                this._effectTimeouts.forEach(t => this._clock.cancel(t));

            render() {

                    <rect x="0" y="2" width="200" height="8" rx="2" fill="url(#${gpId})"/>

                this._bindGkTouchEvents();
            },
            _boundGkZoneHandlers: [],
            _lastTapTime: 0,
            _bindGkTouchEvents() {
                this._cleanupGkTouchEvents();
                document.querySelectorAll('.gs-gk-zone').forEach(zone => {
                    const i = parseInt(zone.dataset.zone);
                    const handler = (e) => {
                        if (e.type === 'touchstart') { e.preventDefault(); this._touchUsed = true; }
                        if (e.type === 'click' && this._touchUsed) return;
                        this.tapZone(i);

                    this._boundGkZoneHandlers.push({ el: zone, handler });

            updateHud() {

                document.getElementById('mgHud').innerHTML = `
                    ${GameSprites.healthBar(Math.max(0, lives), 5)}

                    ${GameSprites.comboIndicator(this.combo)}
                    ${this.combo >= 3 ? `<div style="color:#ffd700;font-size:1.1em;font-weight:800;text-shadow:0 0 8px rgba(255,215,0,0.5);">${this.combo}연속!</div>` : ''}
                    ${this.hot ? '<div class="gs-combo" style="color:#ff6b35;font-size:0.85em;"><span class="gs-combo-flame"></span> HOT!</div>' : ''}`;
            },
            _cutsceneActive: false,
            _showShooterCutscene(shooter, isBoss, callback) {
                if (this._cutsceneActive) { callback(); return; }
