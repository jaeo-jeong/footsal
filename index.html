<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>젓자FC 팀 짜기</title>
    <!-- Pretendard Font -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <link rel="stylesheet" href="football-arcade.css">
    <link rel="stylesheet" href="attendance-import.css">
    <style>
        /* ====== Theme CSS Custom Properties ====== */
        :root {
            --mg-bg: #0F1B2D;
            --mg-bg-surface: #162336;
            --mg-bg-elevated: #1E3048;
            --mg-card-bg: rgba(255,255,255,0.1);
            --mg-card-border: rgba(255,255,255,0.08);
            --mg-accent: #FF6B35;
            --mg-accent-dark: #E85D3A;
            --mg-accent-light: #FF8F5E;
            --mg-field: #2D8A4E;
            --mg-field-light: #45B36B;
            --mg-field-dark: #1B6B3A;
            --mg-gold: #FFD700;
            --mg-text: rgba(255,255,255,0.95);
            --mg-text-dim: rgba(255,255,255,0.65);
            --mg-result-bg: #F5F7FA;
            --mg-result-text: #1A2332;
            --mg-tab-bg: rgba(255,255,255,0.08);
            --mg-tab-active-bg: #FF6B35;
            --mg-tab-active-text: white;
            --mg-shadow: rgba(0,0,0,0.35);
            --mg-ease-bounce: cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        .mg-overlay.theme-winter {
            --mg-bg: #D6E6F5;
            --mg-bg-surface: #E8F0FE;
            --mg-bg-elevated: #F0F5FF;
            --mg-card-bg: rgba(74,144,217,0.1);
            --mg-card-border: rgba(74,144,217,0.15);
            --mg-accent: #4A90D9;
            --mg-accent-dark: #3A78C0;
            --mg-accent-light: #6AADE6;
            --mg-field: #8aaa8a;
            --mg-field-light: #9aba9a;
            --mg-field-dark: #7a9a7a;
            --mg-gold: #FFD700;
            --mg-text: rgba(20,40,70,0.95);
            --mg-text-dim: rgba(20,40,70,0.6);
            --mg-result-bg: white;
            --mg-result-text: #1A2332;
            --mg-tab-bg: rgba(74,144,217,0.12);
            --mg-tab-active-bg: #4A90D9;
            --mg-tab-active-text: white;
            --mg-shadow: rgba(50,80,120,0.2);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Pretendard Variable', 'Pretendard', -apple-system, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 30px;
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 10px;
            font-size: 2.5em;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
            font-size: 1.1em;
        }

        .section {
            margin-bottom: 30px;
        }

        .section-title {
            font-size: 1.5em;
            color: #333;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 2px solid #667eea;
        }

        .controls {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
            flex-wrap: wrap;
            align-items: center;
        }

        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            font-size: 1em;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: 600;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .btn-secondary {
            background: #6c757d;
            color: white;
        }

        .btn-secondary:hover {
            background: #5a6268;
        }

        .btn-danger {
            background: #dc3545;
            color: white;
        }

        .btn-danger:hover {
            background: #c82333;
        }

        .btn-success {
            background: #28a745;
            color: white;
        }

        .btn-success:hover {
            background: #218838;
        }


        .players-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }

        .player-card {
            background: #f8f9fa;
            border: 2px solid #e9ecef;
            border-radius: 10px;
            padding: 15px;
            transition: all 0.3s;
        }

        .player-card:hover {
            border-color: #667eea;
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }

        .player-name {
            font-size: 1.2em;
            font-weight: 600;
            margin-bottom: 10px;
            color: #333;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .player-checkbox {
            width: 20px;
            height: 20px;
            cursor: pointer;
        }

        .player-fields {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .field-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .field-group label {
            font-size: 0.9em;
            color: #666;
            font-weight: 500;
        }

        .field-group select {
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 0.95em;
        }

        .delete-btn {
            margin-top: 10px;
            padding: 6px 12px;
            font-size: 0.85em;
        }

        .add-player-form {
            background: #f8f9fa;
            border: 2px dashed #667eea;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .form-row {
            display: grid;
            grid-template-columns: 2fr 1fr auto;
            gap: 10px;
            align-items: end;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .form-group label {
            font-size: 0.9em;
            color: #666;
            font-weight: 500;
        }

        .form-group input,
        .form-group select {
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 1em;
        }

        .teams-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .team {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 15px;
            padding: 20px;
            color: white;
            transition: all 0.2s;
        }

        .team-title {
            font-size: 1.5em;
            font-weight: 700;
            margin-bottom: 15px;
            text-align: center;
            padding-bottom: 10px;
            border-bottom: 2px solid rgba(255, 255, 255, 0.3);
        }

        .team-stats {
            display: flex;
            justify-content: space-around;
            margin-bottom: 15px;
            font-size: 0.9em;
            opacity: 0.9;
        }

        .team-players {
            list-style: none;
            min-height: 50px;
        }

        .team-player {
            background: rgba(255, 255, 255, 0.2);
            padding: 10px;
            margin-bottom: 8px;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 6px;
            transition: all 0.2s;
        }

        .team-player.draggable {
            cursor: move;
        }

        .team-player.draggable:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: translateX(5px);
        }

        .team-player.dragging {
            opacity: 0.5;
            background: rgba(255, 255, 255, 0.1);
        }

        .player-info {
            display: flex;
            flex-direction: column;
            flex: 1;
            min-width: 0;
        }

        .player-tier {
            font-size: 0.85em;
            opacity: 0.9;
        }

        .team.drag-over {
            background: linear-gradient(135deg, #7c8ff0 0%, #8a5fb8 100%);
            border: 3px dashed rgba(255, 255, 255, 0.8);
            transform: scale(1.02);
        }

        .tier-badge {
            display: inline-block;
            padding: 3px 8px;
            border-radius: 5px;
            font-size: 0.75em;
            font-weight: 600;
            margin-left: 5px;
        }

        .tier-황제 { background: linear-gradient(135deg, #8e2de2, #4a00e0); color: #ffe9a8; }
        .tier-S { background: #ff6b6b; }
        .tier-Aplus { background: #ffa500; }
        .tier-A { background: #ffd93d; }
        .tier-Aminus { background: #d4e157; }
        .tier-Bplus { background: #5dd68a; }
        .tier-B { background: #6bcf7f; }
        .tier-C { background: #4ecdc4; }
        .tier-D { background: #95a5a6; }

        .tier-table {
            background: #f8f9fa;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 30px;
            border: 2px solid #e9ecef;
        }

        .tier-table-title {
            font-size: 1.2em;
            font-weight: 600;
            color: #333;
            margin-bottom: 15px;
            text-align: center;
        }

        .tier-list {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
        }

        .tier-item {
            background: white;
            border-radius: 8px;
            border: 2px solid #e9ecef;
            padding: 15px;
        }

        .tier-item-header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 10px;
            padding-bottom: 10px;
            border-bottom: 2px solid #e9ecef;
        }

        .tier-item-label {
            font-size: 1.3em;
            font-weight: 700;
        }

        .tier-item-count {
            font-size: 0.9em;
            color: #666;
            margin-left: auto;
        }

        .tier-item-players {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .tier-player-name {
            padding: 5px 10px;
            background: #f8f9fa;
            border-radius: 5px;
            font-size: 0.9em;
            color: #333;
        }

        @media (max-width: 768px) {
            body {
                padding: 10px;
            }

            .container {
                padding: 15px;
                border-radius: 12px;
            }

            h1 {
                font-size: 1.6em;
                margin-bottom: 5px;
            }

            .subtitle {
                font-size: 0.95em;
                margin-bottom: 20px;
            }

            .section-title {
                font-size: 1.2em;
            }

            .top-buttons {
                display: flex;
                flex-wrap: wrap;
                justify-content: center;
                gap: 8px;
            }

            .top-buttons .btn {
                margin-left: 0 !important;
                flex: 1 1 auto;
                min-width: 120px;
                padding: 10px 12px;
                font-size: 0.85em;
            }

            .form-row {
                grid-template-columns: 1fr;
            }

            .players-grid {
                grid-template-columns: 1fr;
            }

            .controls {
                gap: 8px;
            }

            .controls .btn {
                padding: 10px 14px;
                font-size: 0.85em;
                flex: 1 1 calc(50% - 8px);
                text-align: center;
            }

            .controls label {
                width: 100%;
                justify-content: center;
                margin-left: 0 !important;
            }

            .teams-container {
                grid-template-columns: 1fr;
            }

            .team {
                padding: 15px;
            }

            .tier-list {
                grid-template-columns: 1fr 1fr;
            }

            .vote-grid {
                grid-template-columns: 1fr;
            }

            .modal-content {
                padding: 20px;
                max-height: 85vh;
                width: 95%;
            }

            #voteModal .modal-content {
                max-height: 85vh;
            }

            .modal-title {
                font-size: 1.2em;
                margin-bottom: 15px;
            }

            .btn {
                padding: 10px 16px;
                font-size: 0.9em;
                min-height: 44px;
            }

            .add-player-form {
                padding: 15px;
            }

            .tier-table {
                padding: 15px;
            }

            .player-checkbox {
                width: 24px;
                height: 24px;
                min-width: 24px;
            }

            .player-card {
                padding: 12px;
            }

            .player-name {
                padding: 4px 0;
            }

            .search-filter-bar {
                flex-direction: column;
            }
            .search-input {
                width: 100%;
            }
        }

        @media (max-width: 480px) {
            body {
                padding: 5px;
            }

            .container {
                padding: 12px;
                border-radius: 10px;
            }

            h1 {
                font-size: 1.4em;
            }

            .top-buttons .btn {
                min-width: 100%;
                font-size: 0.82em;
            }

            .controls .btn {
                flex: 1 1 100%;
            }

            .tier-list {
                grid-template-columns: 1fr;
            }

            .tier-item {
                padding: 10px;
            }

            .team-title {
                font-size: 1.2em;
            }

            .team-stats {
                flex-direction: column;
                gap: 5px;
                align-items: center;
            }
        }

        /* 모달 스타일 */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            justify-content: center;
            align-items: center;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background-color: white;
            padding: 30px;
            border-radius: 15px;
            max-width: 400px;
            width: 90%;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            display: flex;
            flex-direction: column;
            max-height: 90vh;
        }
        
        /* 투표 모달 전용 스타일 */
        #voteModal .modal-content {
            max-width: 600px;
            max-height: 90vh;
        }
        
        #voteContent {
            overflow-y: auto;
            overflow-x: hidden;
            flex: 1;
            min-height: 0;
            margin-bottom: 20px;
            padding-right: 10px;
            -webkit-overflow-scrolling: touch;
        }
        
        /* 모달 내부 스크롤 시 배경 스크롤 방지 */
        #voteModal .modal-content {
            touch-action: pan-y;
        }
        
        /* 스크롤바 스타일링 (선택사항) */
        #voteContent::-webkit-scrollbar {
            width: 8px;
        }
        
        #voteContent::-webkit-scrollbar-track {
            background: #f1f1f1;
            border-radius: 10px;
        }
        
        #voteContent::-webkit-scrollbar-thumb {
            background: #888;
            border-radius: 10px;
        }
        
        #voteContent::-webkit-scrollbar-thumb:hover {
            background: #555;
        }

        .modal-title {
            font-size: 1.5em;
            font-weight: 600;
            margin-bottom: 20px;
            text-align: center;
            color: #333;
        }

        .modal-input {
            width: 100%;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 1em;
            margin-bottom: 15px;
        }

        .modal-buttons {
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-shrink: 0;
            margin-top: auto;
        }

        .vote-section {
            background: #f8f9fa;
            border: 2px solid #667eea;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .vote-title {
            font-size: 1.2em;
            font-weight: 600;
            margin-bottom: 15px;
            color: #333;
        }

        .vote-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 10px;
        }

        .vote-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px;
            background: white;
            border-radius: 8px;
            border: 1px solid #ddd;
        }

        .vote-item select {
            flex: 1;
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 5px;
        }

        /* 황제(👑) 1명 제한: 잠긴 옵션 회색 처리 (지원 브라우저) */
        .vote-item select option:disabled { color: #bbb; background: #f5f5f5; }

        /* 황제 1명 제한 안내 + 선택된 행 강조 */
        .emperor-vote-notice {
            padding: 8px 12px;
            margin-bottom: 10px;
            border-radius: 8px;
            background: linear-gradient(135deg, #f3e9ff, #fff6e0);
            color: #4a00e0;
            font-size: 0.9em;
            text-align: center;
            font-weight: 600;
        }
        .vote-item.emperor-selected {
            background: linear-gradient(135deg, #f3e9ff, #efe2ff);
            border-color: #8e2de2;
            box-shadow: 0 0 0 2px rgba(142, 45, 226, 0.25) inset;
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        

        /* Toast 알림 */
        .toast-container {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 9999;
            display: flex;
            flex-direction: column-reverse;
            gap: 10px;
            pointer-events: none;
        }
        .toast {
            padding: 14px 28px;
            border-radius: 10px;
            color: white;
            font-weight: 600;
            font-size: 0.95em;
            box-shadow: 0 6px 20px rgba(0,0,0,0.25);
            animation: toastIn 0.35s ease forwards;
            pointer-events: auto;
            max-width: 400px;
            text-align: center;
        }
        .toast.toast-out {
            animation: toastOut 0.3s ease forwards;
        }
        .toast-success { background: #28a745; }
        .toast-error { background: #dc3545; }
        .toast-warning { background: #f0ad4e; color: #333; }
        @keyframes toastIn {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes toastOut {
            from { opacity: 1; transform: translateY(0); }
            to { opacity: 0; transform: translateY(30px); }
        }

        /* 커스텀 확인 모달 */
        #confirmModal {
            z-index: 2500;
        }
        .confirm-modal-content {
            text-align: center;
        }
        .confirm-message {
            font-size: 1.05em;
            color: #333;
            margin-bottom: 25px;
            line-height: 1.6;
            white-space: pre-line;
        }

        /* 오프라인 배너 */
        .offline-banner {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            background: #dc3545;
            color: white;
            text-align: center;
            padding: 10px;
            font-weight: 600;
            z-index: 10000;
            display: none;
            font-size: 0.95em;
        }
        .offline-banner.show { display: block; }

        /* 선수 검색/필터 */
        .search-filter-bar {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
            flex-wrap: wrap;
            align-items: center;
        }
        .search-input {
            flex: 1;
            min-width: 180px;
            padding: 10px 14px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 1em;
            font-family: inherit;
        }
        .search-input:focus {
            border-color: #667eea;
            outline: none;
        }
        .tier-filters {
            display: flex;
            gap: 5px;
            flex-wrap: wrap;
        }
        .tier-filter-btn {
            padding: 6px 12px;
            border: 2px solid #ddd;
            border-radius: 6px;
            background: white;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.85em;
            transition: all 0.2s;
            font-family: inherit;
        }
        .tier-filter-btn.active {
            border-color: #667eea;
            background: #667eea;
            color: white;
        }

        /* 선택 카운터 */
        .selection-counter {
            font-size: 1em;
            color: #666;
            font-weight: 600;
            padding: 6px 14px;
            background: #f0f0f0;
            border-radius: 8px;
            white-space: nowrap;
        }
        .selection-counter .count {
            color: #667eea;
            font-weight: 700;
        }

        /* 밸런스 시각화 */
        .balance-indicator {
            text-align: center;
            padding: 8px;
            border-radius: 6px;
            font-weight: 600;
            font-size: 0.9em;
            margin-bottom: 10px;
        }
        .balance-good { background: rgba(255,255,255,0.25); color: #c8ffc8; }
        .balance-ok { background: rgba(255,255,255,0.2); color: #fff3cd; }
        .balance-bad { background: rgba(255,255,255,0.2); color: #ffb3b3; }
        .player-lock {
            flex-shrink: 0; min-width: 44px; min-height: 44px; padding: 6px;
            border: 1px solid rgba(255,255,255,.5); border-radius: 8px;
            background: rgba(255,255,255,.14); cursor: pointer; font-size: 1.1em;
        }
        .player-lock[aria-pressed="true"] { background: #ffe08a; border-color: #ffe08a; }
        .player-lock:focus-visible { outline: 3px solid #fff; outline-offset: 2px; }
        .player-swap {
            width: 100%; min-height: 44px; padding: 6px; border: 1px solid transparent;
            border-radius: 6px; background: transparent; color: inherit; font: inherit;
            text-align: left; overflow-wrap: anywhere; cursor: pointer;
        }
        .player-swap:hover { background: rgba(255,255,255,.15); }
        .player-swap[aria-disabled="true"] { cursor: default; }
        .player-swap[aria-pressed="true"] { background: #ffe08a; color: #333; }
        .player-swap:focus-visible { outline: 3px solid #fff; outline-offset: 2px; }
        .team-player.swap-selected { outline: 2px solid #ffe08a; outline-offset: 2px; }
        .player-swap-controls { margin-bottom: 12px; color: #555; }
        .player-swap-controls:not([hidden]) { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
        .player-swap-cancel { min-height: 44px; }
        .tier-dist-bar {
            display: flex;
            height: 8px;
            border-radius: 4px;
            overflow: hidden;
            margin: 8px 0;
        }
        .tier-dist-bar > div {
            transition: width 0.3s;
        }

        /* 팀 결과 버튼 영역 */
        .team-actions {
            display: flex;
            gap: 10px;
            margin-top: 15px;
            flex-wrap: wrap;
            justify-content: center;
        }

        /* 모바일 이동 버튼 */
        .mobile-move-select {
            padding: 4px 8px;
            border: 1px solid rgba(255,255,255,0.5);
            border-radius: 5px;
            background: rgba(255,255,255,0.2);
            color: white;
            font-size: 0.8em;
            cursor: pointer;
            font-family: inherit;
        }
        .mobile-move-select option {
            color: #333;
            background: white;
        }

        /* 팀 히스토리 */
        .team-history-section {
            margin-top: 15px;
            padding: 15px;
            background: #f8f9fa;
            border-radius: 10px;
            border: 2px solid #e9ecef;
        }
        .history-item {
            padding: 10px;
            background: white;
            border-radius: 8px;
            margin-bottom: 8px;
            border: 1px solid #e9ecef;
            cursor: pointer;
            transition: all 0.2s;
        }
        .history-item:hover {
            border-color: #667eea;
            transform: translateY(-1px);
        }

        /* 버튼 일관된 스타일 */
        .btn {
            position: relative;
        }
        .btn:hover:not(:disabled) {
            transform: translateY(-2px);
        }
        .btn:active:not(:disabled) {
            transform: translateY(0);
        }
        .btn:focus-visible {
            outline: 3px solid #667eea;
            outline-offset: 2px;
        }
        .btn-secondary:hover:not(:disabled) {
            box-shadow: 0 4px 12px rgba(108,117,125,0.3);
        }
        .btn-danger:hover:not(:disabled) {
            box-shadow: 0 4px 12px rgba(220,53,69,0.3);
        }
        .btn-success:hover:not(:disabled) {
            box-shadow: 0 4px 12px rgba(40,167,69,0.3);
        }

        /* 로딩 스피너 */
        .btn-spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid rgba(255,255,255,0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
            margin-right: 8px;
            vertical-align: middle;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* 팀 카드 등장 애니메이션 */
        @keyframes teamFadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .team-animate {
            animation: teamFadeIn 0.4s ease forwards;
            opacity: 0;
        }

        /* 터치 타겟 개선 */
        .player-checkbox {
            width: 22px;
            height: 22px;
            min-width: 22px;
        }

        /* 빠른 출석체크 모드 (칩 뷰) */
        .quick-check-toggle {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 8px;
            margin-bottom: 12px;
        }
        .quick-check-toggle .toggle-btn {
            padding: 8px 16px;
            border: 2px solid #667eea;
            border-radius: 20px;
            background: white;
            color: #667eea;
            font-weight: 700;
            font-size: 0.9em;
            cursor: pointer;
            transition: all 0.2s;
            font-family: inherit;
            min-height: 44px;
        }
        .quick-check-toggle .toggle-btn.active {
            background: #667eea;
            color: white;
        }
        .players-chip-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 20px;
        }
        .player-chip {
            padding: 10px 16px;
            border: 2px solid #ddd;
            border-radius: 25px;
            background: #f8f9fa;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.95em;
            transition: all 0.15s;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
            min-height: 44px;
            display: flex;
            align-items: center;
        }
        .player-chip.selected {
            border-color: #667eea;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            box-shadow: 0 2px 8px rgba(102, 126, 234, 0.35);
        }
        .player-chip:active {
            transform: scale(0.95);
        }

        /* 투표 히스토리 카드 (모바일) */
        .vote-history-card {
            background: white;
            border-radius: 10px;
            border: 1px solid #e9ecef;
            padding: 12px;
            margin-bottom: 10px;
        }
        .vote-history-card-header {
            font-weight: 700;
            margin-bottom: 8px;
            padding-bottom: 8px;
            border-bottom: 1px solid #e9ecef;
        }
        .vote-history-card-votes {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }
        .vote-history-card-vote {
            font-size: 0.85em;
            padding: 3px 8px;
            background: #f8f9fa;
            border-radius: 4px;
        }

        /* ===== 풋살 FM 스타일 ===== */
        .fm-modal {
            display: none;
            position: fixed;
            z-index: 2000;
            left: 0; top: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.85);
            justify-content: center;
            align-items: center;
        }
        .fm-modal.active { display: flex; }
        .fm-modal-content {
            background: #1a1a2e;
            color: #eee;
            width: 95%;
            max-width: 700px;
            max-height: 95vh;
            border-radius: 16px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 20px 60px rgba(0,0,0,0.6);
        }
        .fm-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 20px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            font-size: 1.2em;
            font-weight: 700;
        }
        .fm-header-close {
            background: none; border: none; color: white;
            font-size: 1.4em; cursor: pointer; padding: 4px 8px;
            border-radius: 6px;
        }
        .fm-header-close:hover { background: rgba(255,255,255,0.2); }
        .fm-scoreboard {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            padding: 20px;
            background: linear-gradient(135deg, #2d1b69, #16213e);
        }
        .fm-team-info {
            text-align: center;
            flex: 1;
            min-width: 0;
        }
        .fm-team-name {
            font-size: 1.1em;
            font-weight: 700;
            margin-bottom: 4px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .fm-team-avg {
            font-size: 0.8em;
            color: #aaa;
        }
        .fm-score {
            font-size: 2.8em;
            font-weight: 800;
            letter-spacing: 8px;
            color: #fff;
            text-shadow: 0 0 20px rgba(102,126,234,0.6);
            min-width: 100px;
            text-align: center;
        }
        .fm-time {
            text-align: center;
            font-size: 0.9em;
            color: #bbb;
            padding: 6px 0 0;
        }
        .fm-rosters {
            display: flex;
            gap: 10px;
            padding: 10px 15px;
            max-height: 140px;
            overflow-y: auto;
        }
        .fm-roster-col {
            flex: 1;
            min-width: 0;
        }
        .fm-roster-col h4 {
            font-size: 0.8em;
            color: #888;
            margin-bottom: 6px;
            text-align: center;
        }
        .fm-roster-player {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 3px 6px;
            font-size: 0.82em;
            border-radius: 4px;
            margin-bottom: 2px;
        }
        .fm-roster-player.has-goal { background: rgba(102,126,234,0.2); }
        .fm-roster-player.has-card-yellow { border-left: 3px solid #ffd93d; }
        .fm-roster-player.has-card-red { border-left: 3px solid #ff4444; opacity: 0.5; }
        .fm-roster-icons { font-size: 0.85em; }
        .fm-commentary {
            flex: 1;
            min-height: 0;
            overflow-y: auto;
            padding: 0 15px 12px;
            border-top: 1px solid #333;
            border-bottom: 1px solid #333;
        }
        .fm-commentary-title {
            font-size: 0.85em;
            color: #888;
            margin-bottom: 8px;
            font-weight: 600;
            position: sticky;
            top: 0;
            background: #1a1a2e;
            padding: 12px 0 4px;
            z-index: 1;
        }
        .fm-event {
            padding: 6px 10px;
            margin-bottom: 4px;
            border-radius: 6px;
            font-size: 0.88em;
            animation: fmFadeIn 0.3s ease;
        }
        @keyframes fmFadeIn {
            from { opacity: 0; transform: translateY(-8px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .fm-event-goal { background: rgba(102,126,234,0.25); border-left: 3px solid #667eea; font-weight: 700; }
        .fm-event-save { background: rgba(77,182,172,0.2); border-left: 3px solid #4ecdc4; }
        .fm-event-card { background: rgba(255,217,61,0.15); border-left: 3px solid #ffd93d; }
        .fm-event-card-red { background: rgba(255,68,68,0.2); border-left: 3px solid #ff4444; }
        .fm-event-foul { background: rgba(150,150,150,0.15); }
        .fm-event-chance { background: rgba(255,165,0,0.15); border-left: 3px solid #ffa500; }
        .fm-event-possession { color: #777; font-size: 0.82em; }
        .fm-event-half { background: rgba(255,255,255,0.1); text-align: center; font-weight: 700; padding: 10px; }
        .fm-event-corner { background: rgba(100,200,100,0.1); }
        .fm-event-sub { background: rgba(100,200,255,0.15); border-left: 3px solid #64c8ff; }
        #fmMatchBody {
            display: flex;
            flex-direction: column;
            flex: 1;
            min-height: 0;
            overflow: hidden;
        }
        .fm-scoreboard { flex-shrink: 0; }
        .fm-rosters { flex-shrink: 0; }
        .fm-controls {
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 12px 15px;
            padding-bottom: max(12px, env(safe-area-inset-bottom));
            background: #111;
            flex-wrap: wrap;
        }
        .fm-controls .btn {
            padding: 8px 16px;
            font-size: 0.85em;
            border-radius: 6px;
            min-height: 36px;
        }
        .fm-btn-speed {
            background: #333; color: #ccc; border: 1px solid #555;
        }
        .fm-btn-speed.active {
            background: #667eea; color: white; border-color: #667eea;
        }
        .fm-btn-action {
            background: #444; color: #ddd; border: 1px solid #666;
        }
        .fm-btn-action:hover { background: #555; }
        /* FM 결과 화면 */
        .fm-result {
            padding: 20px;
            text-align: center;
            flex: 1;
            overflow-y: auto;
        }
        .fm-result h2 {
            font-size: 1.5em;
            margin-bottom: 10px;
            color: #667eea;
        }
        .fm-result-score {
            font-size: 2.2em;
            font-weight: 800;
            margin: 10px 0;
        }
        .fm-result-mvp {
            background: linear-gradient(135deg, #667eea22, #764ba222);
            border: 1px solid #667eea44;
            border-radius: 10px;
            padding: 12px;
            margin: 12px 0;
            font-size: 1em;
        }
        .fm-result-stats {
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            gap: 6px 12px;
            margin: 15px auto;
            max-width: 350px;
            font-size: 0.9em;
        }
        .fm-stat-label { color: #aaa; text-align: center; }
        .fm-stat-left { text-align: right; }
        .fm-stat-right { text-align: left; }
        .fm-result-goals {
            text-align: left;
            margin: 12px auto;
            max-width: 350px;
            font-size: 0.88em;
        }
        .fm-result-goals div { padding: 3px 0; }
        .fm-result-buttons {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-top: 15px;
        }
        .fm-pk-table {
            margin: 10px auto;
            font-size: 0.9em;
            border-collapse: collapse;
        }
        .fm-pk-table td, .fm-pk-table th {
            padding: 4px 10px;
            text-align: center;
            border-bottom: 1px solid #333;
        }
        /* FM 셋업 모달 */
        .fm-setup-content {
            background: #1a1a2e;
            color: #eee;
            max-width: 400px;
            width: 90%;
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.6);
        }
        .fm-setup-content h3 {
            text-align: center;
            margin-bottom: 16px;
            color: #667eea;
        }
        .fm-setup-team-btn {
            display: block;
            width: 100%;
            padding: 12px;
            margin-bottom: 8px;
            background: #2a2a4a;
            color: #eee;
            border: 2px solid transparent;
            border-radius: 10px;
            cursor: pointer;
            font-size: 0.95em;
            text-align: left;
            transition: all 0.2s;
        }
        .fm-setup-team-btn:hover { border-color: #667eea; }
        .fm-setup-team-btn.selected { border-color: #667eea; background: #333366; }
        .fm-setup-content.fm-setup-wide { max-width: 600px; }
        .fm-pos-teams {
            display: flex;
            gap: 16px;
        }
        .fm-pos-team-col {
            flex: 1;
            min-width: 0;
        }
        .fm-pos-team-col h4 {
            text-align: center;
            color: #667eea;
            margin-bottom: 10px;
            font-size: 0.95em;
        }
        .fm-pos-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 6px 8px;
            margin-bottom: 4px;
            background: #2a2a4a;
            border-radius: 8px;
            gap: 6px;
        }
        .fm-pos-name {
            font-size: 0.88em;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            min-width: 0;
            flex: 1;
        }
        .fm-pos-select {
            padding: 4px 6px;
            border-radius: 6px;
            border: 1px solid #555;
            background: #1a1a2e;
            color: #eee;
            font-size: 0.82em;
            cursor: pointer;
            flex-shrink: 0;
        }
        .fm-pos-select:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            background: #252540;
        }
        .fm-formation-row {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 10px;
            padding: 6px 8px;
            background: #1e1e3a;
            border-radius: 8px;
        }
        .fm-formation-row label {
            font-size: 0.82em;
            color: #aaa;
            white-space: nowrap;
        }
        .fm-formation-select {
            flex: 1;
            padding: 5px 8px;
            border-radius: 6px;
            border: 1px solid #555;
            background: #2a2a4a;
            color: #eee;
            font-size: 0.9em;
            font-weight: 600;
            cursor: pointer;
        }
        .fm-mode-label {
            text-align: center;
            font-size: 0.82em;
            color: #888;
            margin-bottom: 12px;
        }
        .fm-pos-section-label {
            font-size: 0.78em;
            color: #999;
            padding: 6px 0 4px;
            border-bottom: 1px solid #333;
            margin-bottom: 4px;
            font-weight: 600;
        }
        .fm-pos-sub-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 4px 8px;
            margin-bottom: 3px;
            background: #222240;
            border-radius: 8px;
            opacity: 0.7;
        }
        .fm-pos-swap-btn {
            padding: 2px 8px;
            font-size: 0.72em;
            border: 1px solid #555;
            border-radius: 4px;
            background: #333;
            color: #ccc;
            cursor: pointer;
            flex-shrink: 0;
        }
        .fm-pos-swap-btn:hover { background: #444; border-color: #667eea; }
        .fm-roster-player.is-sub { opacity: 0.5; font-style: italic; }
        .fm-sub-badge {
            display: inline-block;
            padding: 1px 4px;
            border-radius: 3px;
            font-size: 0.65em;
            font-weight: 700;
            background: #666;
            color: #ccc;
            margin-right: 3px;
        }
        .fm-pos-badge {
            display: inline-block;
            padding: 1px 5px;
            border-radius: 3px;
            font-size: 0.68em;
            font-weight: 700;
            margin-right: 3px;
            color: #fff;
        }
        .fm-pos-GK { background: #e67e22; }
        .fm-pos-DF { background: #3498db; }
        .fm-pos-MF { background: #2ecc71; }
        .fm-pos-FW { background: #e74c3c; }
        @media (max-width: 768px) {
            .fm-modal {
                align-items: stretch;
            }
            .fm-modal-content {
                width: 100%;
                height: 100vh;
                height: 100dvh;
                max-height: 100vh;
                max-height: 100dvh;
                border-radius: 0;
                max-width: 100%;
            }
            .fm-header { padding: 10px 16px; font-size: 1.05em; }
            .fm-score { font-size: 1.8em; letter-spacing: 4px; min-width: 70px; }
            .fm-scoreboard { padding: 10px 12px; gap: 8px; }
            .fm-team-name { font-size: 0.95em; }
            .fm-team-avg { font-size: 0.72em; }
            .fm-rosters { max-height: 90px; padding: 6px 10px; gap: 6px; }
            .fm-roster-player { padding: 2px 4px; font-size: 0.75em; }
            .fm-commentary { padding: 0 10px 8px; }
            .fm-commentary-title { padding: 8px 0 4px; }
            .fm-event { padding: 4px 8px; font-size: 0.82em; }
            .fm-pos-swap-btn { padding: 1px 6px; font-size: 0.68em; }
            .fm-pos-sub-row { padding: 3px 6px; }
            .fm-pos-section-label { font-size: 0.72em; }
            .fm-controls {
                padding: 8px 10px;
                padding-bottom: max(8px, env(safe-area-inset-bottom));
                gap: 6px;
            }
            .fm-controls .btn { padding: 7px 12px; font-size: 0.8em; min-height: 32px; }
            .fm-pos-teams { flex-direction: column; gap: 12px; }
            .fm-setup-content {
                max-height: 90vh;
                max-height: 90dvh;
                overflow-y: auto;
                width: 95%;
            }
            .fm-setup-content.fm-setup-wide { max-width: 95%; }
            .fm-result { padding: 14px 12px; }
            .fm-result h2 { font-size: 1.2em; }
            .fm-result-score { font-size: 1.8em; }
            .fm-result-mvp { padding: 10px; font-size: 0.9em; }
            .fm-result-stats { font-size: 0.82em; gap: 4px 10px; }
        }

        /* ====== 미니게임 센터 스타일 ====== */
        .mg-btn {
            background: linear-gradient(135deg, #ff6b6b 0%, #ee5a24 100%);
            color: white;
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            font-size: 1em;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: 600;
        }
        .mg-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(238, 90, 36, 0.4);
        }
        .mg-overlay {
            display: none;
            position: fixed;
            z-index: 2100;
            left: 0; top: 0;
            width: 100%; height: 100%;
            background:
                radial-gradient(ellipse at 30% -5%, rgba(45,138,78,0.12) 0%, transparent 50%),
                radial-gradient(ellipse at 75% 105%, rgba(255,107,53,0.06) 0%, transparent 40%),
                radial-gradient(circle at 50% 50%, transparent 0%, rgba(0,0,0,0.15) 100%),
                linear-gradient(180deg, var(--mg-bg-surface, #162336) 0%, var(--mg-bg, #0F1B2D) 100%);
            flex-direction: column;
            align-items: center;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
        }
        .mg-overlay.theme-winter {
            background:
                radial-gradient(ellipse at 30% -5%, rgba(74,144,217,0.1) 0%, transparent 50%),
                radial-gradient(ellipse at 75% 105%, rgba(255,107,53,0.05) 0%, transparent 40%),
                radial-gradient(circle at 50% 50%, transparent 0%, rgba(50,80,120,0.06) 100%),
                linear-gradient(180deg, var(--mg-bg-surface, #E8F0FE) 0%, var(--mg-bg, #D6E6F5) 100%);
        }
        .mg-overlay.active { display: flex; }
        .mg-name-modal {
            background: linear-gradient(180deg, #FFFFFF 0%, #F5F7FA 100%);
            border-radius: 24px;
            padding: 32px;
            max-width: 360px;
            width: 90%;
            text-align: center;
            border: 1.5px solid rgba(255,255,255,0.5);
            border-top-color: rgba(255,255,255,0.8);
            border-bottom-color: rgba(0,0,0,0.05);
            box-shadow:
                0 24px 64px rgba(0,0,0,0.5),
                0 4px 0 rgba(0,0,0,0.03),
                inset 0 1px 0 rgba(255,255,255,0.8);
        }

        /* ====== Feature CSS: Shooting Trajectory ====== */
        .gs-trajectory-ball {
            position: absolute; z-index: 8; pointer-events: none;
            width: 24px; height: 24px;
        }
        @keyframes gsShotArc {
            0% { transform: translate(-50%, -50%) scale(0.6); opacity: 1; }
            50% { transform: translate(-50%, calc(-50% - 30px)) scale(1); opacity: 1; }
            100% { transform: translate(-50%, -50%) scale(0.8); opacity: 0.8; }
        }
        @keyframes gsShotMiss {
            0% { transform: translate(-50%, -50%) scale(0.6); opacity: 1; }
            50% { transform: translate(-50%, calc(-50% - 40px)) scale(1.1); opacity: 1; }
            100% { transform: translate(calc(-50% + 60px), calc(-50% - 80px)) scale(0.3); opacity: 0; }
        }
        .gs-trajectory-ball.goal { animation: gsShotArc 0.5s ease-out forwards; }
        .gs-trajectory-ball.miss { animation: gsShotMiss 0.5s ease-out forwards; }

        /* ====== Feature CSS: Combo Effects ====== */
        .gs-combo-glow {
            animation: gsComboGlow 0.8s ease-in-out infinite alternate;
        }
        @keyframes gsComboGlow {
            from { box-shadow: inset 0 0 20px rgba(255,215,0,0.2), 0 0 15px rgba(255,215,0,0.3); }
            to { box-shadow: inset 0 0 40px rgba(255,215,0,0.4), 0 0 25px rgba(255,215,0,0.5); }
        }
        .gs-combo-banner {
            position: absolute; top: 40%; left: 50%; transform: translate(-50%, -50%);
            color: #ffd700; font-size: 1.6em; font-weight: 800; z-index: 12;
            text-shadow: 0 0 10px rgba(255,215,0,0.8), 0 2px 4px rgba(0,0,0,0.5);
            animation: gsComboText 1.2s ease-out forwards; pointer-events: none;
            white-space: nowrap;
        }
        @keyframes gsComboText {
            0% { transform: translate(-50%, -50%) scale(0.5); opacity: 0; }
            20% { transform: translate(-50%, -50%) scale(1.3); opacity: 1; }
            80% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
            100% { transform: translate(-50%, -50%) scale(1); opacity: 0; }
        }
        @keyframes gsCameraShake {
            0%, 100% { transform: translate(0,0); }
            10% { transform: translate(-3px, -2px); }
            20% { transform: translate(3px, 2px); }
            30% { transform: translate(-2px, 3px); }
            40% { transform: translate(2px, -3px); }
            50% { transform: translate(-3px, 1px); }
            60% { transform: translate(3px, -1px); }
            70% { transform: translate(-1px, 3px); }
            80% { transform: translate(1px, -2px); }
            90% { transform: translate(-2px, 2px); }
        }
        .gs-camera-shake { animation: gsCameraShake 0.4s ease-in-out; }

        /* ====== Feature CSS: GK Cutscene ====== */
        .gs-shooter-cutscene {
            position: absolute; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.7); z-index: 15;
            display: flex; align-items: center; justify-content: center;
            animation: gsCutsceneIn 0.3s ease-out;
        }
        .gs-shooter-cutscene.boss { background: rgba(80,0,0,0.8); }
        .gs-shooter-cutscene-inner {
            display: flex; align-items: center; gap: 16px;
            animation: gsCutsceneSlide 0.8s ease-out;
        }
        @keyframes gsCutsceneSlide {
            0% { transform: translateX(100px); opacity: 0; }
            30% { transform: translateX(0); opacity: 1; }
            80% { transform: translateX(0); opacity: 1; }
            100% { transform: translateX(0); opacity: 0; }
        }
        @keyframes gsCutsceneIn {
            from { opacity: 0; } to { opacity: 1; }
        }
        .gs-shooter-cutscene .name {
            color: #ffd700; font-size: 1.5em; font-weight: 800;
            text-shadow: 0 2px 8px rgba(0,0,0,0.5);
        }
        .gs-shooter-cutscene.boss .name {
            color: #ff4757; font-size: 1.8em;
            animation: gsCameraShake 0.4s ease-in-out 0.2s;
        }
        .gs-shooter-cutscene .line {
            color: rgba(255,255,255,0.8); font-size: 0.9em; font-style: italic;
        }

        /* ====== Feature CSS: DH Zone Labels ====== */
        .gs-dh-zone-label {
            position: absolute; left: 12px; top: 8px;
            padding: 3px 10px; border-radius: 6px; font-size: 0.75em; font-weight: 700;
            z-index: 3; transition: all 0.5s ease;

        }
        .gs-dh-zone-label.danger { background: rgba(255,71,87,0.8); color: white; }
        .gs-dh-zone-label.warn { background: rgba(255,165,0,0.7); color: white; }
        .gs-dh-zone-label.neutral { background: rgba(255,255,255,0.2); color: rgba(255,255,255,0.7); }
        .gs-dh-zone-label.safe { background: rgba(46,204,113,0.6); color: white; }
        .gs-dh-zone-label.almost { background: rgba(46,204,113,0.9); color: white; }
        @keyframes gsDhPulse {
            0%, 100% { opacity: 0.7; }
            50% { opacity: 1; }
        }
        .gs-dh-pulse { animation: gsDhPulse 1s ease-in-out infinite; }
