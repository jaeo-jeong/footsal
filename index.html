        // 풋살팀 구성 규칙
        function getFutsalTeamSizes(totalPlayers) {
            const rules = {
                12: [6, 6],
                13: [7, 6],
                14: [7, 7],
                15: [5, 5, 5],
                16: [8, 8],
                17: [6, 6, 5],
                18: [6, 6, 6],
                19: [7, 6, 6],
                20: [7, 7, 6],
                21: [7, 7, 7],
                22: [6, 6, 5, 5],
                23: [6, 6, 6, 5],
                24: [6, 6, 6, 6],
                25: [7, 6, 6, 6],
                26: [7, 7, 6, 6],
                27: [7, 7, 7, 6],
                28: [7, 7, 7, 7]
            };
            
            if (rules[totalPlayers]) {
                return rules[totalPlayers];
            }
            
            // 10-11명인 경우 기본 처리 (2팀)
            if (totalPlayers < 12) {
                const teamSize = Math.floor(totalPlayers / 2);
                const remainder = totalPlayers % 2;
                if (remainder === 0) {
                    return [teamSize, teamSize];
                } else {
                    return [teamSize + 1, teamSize];
                }
            }
            
            return null;
        }

        // 축구팀 구성 규칙 (2팀으로 나누기)
        function getSoccerTeamSizes(totalPlayers) {
            const teamSize = Math.floor(totalPlayers / 2);
            const remainder = totalPlayers % 2;
            if (remainder === 0) {
                return [teamSize, teamSize];
            } else {
                return [teamSize + 1, teamSize];
            }
        }

        // 풋살팀 구성 생성
        // 승률 가중치 반영 함수
        function getEffectiveWeight(player) {
            let weight = tierWeights[player.tier] || 4;
            if (document.getElementById('winRateCheckbox') && document.getElementById('winRateCheckbox').checked) {
                const wr = parseFloat(calculateWinRate(player));
                const total = (player.win || 0) + (player.draw || 0) + (player.loss || 0);
                if (total >= 3) {
                    if (wr >= 70) weight += 0.5;
                    else if (wr <= 30) weight -= 0.5;
                }
            }
            return weight;
        }

        // 공통 팀 생성 로직 (로딩 스피너 포함)
        function runTeamGeneration(selectedPlayersList, teamSizes, btnId) {
            const btn = document.getElementById(btnId);
            const originalText = btn.textContent;
            btn.disabled = true;
            btn.innerHTML = '<span class="btn-spinner"></span>생성 중...';

            setTimeout(() => {
                const shuffledList = [...selectedPlayersList].sort(() => Math.random() - 0.5);
                let bestTeams = null;
                let bestDiff = Infinity;
                let noImproveCount = 0;

                for (let attempt = 0; attempt < 100; attempt++) {
                    const reShuffledList = [...shuffledList].sort(() => Math.random() - 0.5);
                    const teams = createBalancedTeams(teamSizes, reShuffledList);
                    if (teams) {
                        const diff = calculateTeamDifference(teams);
                        if (diff < bestDiff) {
                            bestDiff = diff;
                            bestTeams = teams;
                            noImproveCount = 0;
                            if (diff < 0.01) break;
                        } else {
                            noImproveCount++;
                            if (noImproveCount >= 20) break;
                        }
                    }
                }

                btn.disabled = false;
                btn.textContent = originalText;

                if (!bestTeams) {
                    showToast('팀 구성을 실패했습니다. 선수 수를 확인해주세요.', 'error');
                    return;
                }

                // 팀 간 평균 차이 계산
                const avgs = bestTeams.map(t => {
                    const s = t.reduce((sum, p) => sum + tierWeights[p.tier], 0);
                    return t.length > 0 ? s / t.length : 0;
                });
                const maxAvg = Math.max(...avgs);
                const minAvg = Math.min(...avgs);
                const avgDiff = (maxAvg - minAvg).toFixed(2);

                renderTeams(bestTeams, teamSizes);
                saveTeamHistory(bestTeams, teamSizes);
                document.getElementById('teamActions').style.display = 'flex';
                showToast(`팀 생성 완료! 평균 차이: ${avgDiff}`, 'success');
            }, 0);
        }

        function generateFutsalTeams() {
            const selectedPlayersList = players.filter(p => selectedPlayers.has(p.name));
            const totalPlayers = selectedPlayersList.length;

            if (totalPlayers < 10) {
                showToast('최소 10명의 선수를 선택해주세요.', 'warning');
                return;
            }
            if (totalPlayers >= 29) {
                showToast('그냥 축구를 하세요', 'warning');
                return;
            }
            const teamSizes = getFutsalTeamSizes(totalPlayers);
            if (!teamSizes) {
                showToast('풋살팀 구성이 불가능한 인원 수입니다.', 'warning');
                return;
            }
            runTeamGeneration(selectedPlayersList, teamSizes, 'futsalBtn');
        }

        function generateSoccerTeams() {
            const selectedPlayersList = players.filter(p => selectedPlayers.has(p.name));
            const totalPlayers = selectedPlayersList.length;

            if (totalPlayers < 2) {
                showToast('최소 2명의 선수를 선택해주세요.', 'warning');
                return;
            }
            const teamSizes = getSoccerTeamSizes(totalPlayers);
            runTeamGeneration(selectedPlayersList, teamSizes, 'soccerBtn');
        }

        // 밸런스 있는 팀 생성 (Snake Draft)
        function createBalancedTeams(teamSizes, playerList) {
            const numTeams = teamSizes.length;
            const teams = Array(numTeams).fill(null).map(() => []);

            // 선수를 티어순 정렬, 같은 티어 내 랜덤
            const tierOrder = ['S', 'A+', 'A', 'B+', 'B', 'C', 'D'];
            const sorted = [...playerList].sort((a, b) => {
                const tierDiff = tierOrder.indexOf(a.tier) - tierOrder.indexOf(b.tier);
                if (tierDiff !== 0) return tierDiff;
                return Math.random() - 0.5;
            });

            // Snake draft 순서 생성 (0→1→2→2→1→0→...)
            const draftOrder = [];
            const fillCount = Array(numTeams).fill(0);
            let forward = true;
            let assigned = 0;
            const totalNeeded = teamSizes.reduce((a, b) => a + b, 0);
            while (assigned < totalNeeded) {
                const seq = forward
                    ? Array.from({length: numTeams}, (_, i) => i)
                    : Array.from({length: numTeams}, (_, i) => numTeams - 1 - i);
                for (const idx of seq) {
                    if (assigned >= totalNeeded) break;
                    if (fillCount[idx] < teamSizes[idx]) {
                        draftOrder.push(idx);
                        fillCount[idx]++;
                        assigned++;
                    }
                }
                forward = !forward;
            }

            // Snake draft로 선수 배정
            let playerIdx = 0;
            for (const teamIdx of draftOrder) {
                if (playerIdx >= sorted.length) break;
                teams[teamIdx].push(sorted[playerIdx]);
                playerIdx++;
            }

            // 팀 크기 확인
            for (let i = 0; i < numTeams; i++) {
                if (teams[i].length !== teamSizes[i]) {
                    return null;
                }
            }

            // 티어 밸런스 최적화
            optimizeTierBalance(teams);

            return teams;
        }

        // 티어별 분배 개선 (인원당 평균도 고려)
        function improveTierDistribution(teams) {
            const criticalTiers = ['S', 'A+', 'C', 'D'];
            const tierOrder = ['S', 'A+', 'A', 'B+', 'B', 'C', 'D'];
            
            function getTeamTierAverage(team) {
                if (team.length === 0) return 0;
                const sum = team.reduce((sum, p) => sum + getEffectiveWeight(p), 0);
                return sum / team.length;
            }
            
            function getAverageVariance(teams) {
                const averages = teams.map(team => getTeamTierAverage(team));
                const avg = averages.reduce((a, b) => a + b, 0) / averages.length;
                return averages.reduce((sum, s) => sum + Math.pow(s - avg, 2), 0) / averages.length;
            }
            
            for (let iteration = 0; iteration < 200; iteration++) {
                let improved = false;
                const currentAvgVariance = getAverageVariance(teams);
                
                // 각 티어별로 확인
                tierOrder.forEach(tier => {
                    const tierCounts = teams.map(team => 
                        team.filter(p => p.tier === tier).length
                    );
                    const maxCount = Math.max(...tierCounts);
                    const minCount = Math.min(...tierCounts);
                    
                    // 분배가 불균형하면 개선 시도
                    if (maxCount - minCount > 1 || (criticalTiers.includes(tier) && maxCount >= 2)) {
                        // 가장 많은 팀과 가장 적은 팀 찾기
                        const maxTeamIdx = tierCounts.indexOf(maxCount);
                        const minTeamIdx = tierCounts.indexOf(minCount);
                        
                        // 해당 티어 선수를 찾아서 교체 시도
                        const maxTeam = teams[maxTeamIdx];
                        const minTeam = teams[minTeamIdx];
                        
                        // 같은 티어가 아닌 선수와 교체
                        for (let i = 0; i < maxTeam.length; i++) {
                            if (maxTeam[i].tier === tier) {
                                for (let j = 0; j < minTeam.length; j++) {
                                    if (minTeam[j].tier !== tier) {
                                        // 교체 시도
                                        const temp = maxTeam[i];
                                        maxTeam[i] = minTeam[j];
                                        minTeam[j] = temp;
                                        
                                        // 인원당 평균 밸런스 개선 확인
                                        const newAvgVariance = getAverageVariance(teams);
                                        
                                        // 티어 분배 개선 확인
                                        const newTierCounts = teams.map(team => 
                                            team.filter(p => p.tier === tier).length
                                        );
                                        const newMaxCount = Math.max(...newTierCounts);
                                        const newMinCount = Math.min(...newTierCounts);
                                        
                                        // 인원당 평균 밸런스가 개선되거나, 티어 분배가 개선되고 인원당 평균이 나빠지지 않으면 수용
                                        const tierDistributionImproved = (newMaxCount - newMinCount < maxCount - minCount);
                                        const avgBalanceImproved = (newAvgVariance < currentAvgVariance);
                                        
                                        // 인원당 평균 밸런스 개선을 더 우선시 (인원당 평균이 개선되면 무조건 수용)
                                        // 또는 티어 분배가 개선되고 인원당 평균이 거의 나빠지지 않으면 수용 (5% 이내)
                                        if (avgBalanceImproved || (tierDistributionImproved && newAvgVariance <= currentAvgVariance * 1.05)) {
                                            improved = true;
                                            break;
                                        } else {
                                            // 되돌리기
                                            minTeam[j] = maxTeam[i];
                                            maxTeam[i] = temp;
                                        }
                                    }
                                }
                                if (improved) break;
                            }
                        }
                    }
                });
                
                if (!improved) break;
            }
        }

        // 티어 밸런스 최적화 (Best-Improvement + 3-Way 로테이션)
        function optimizeTierBalance(teams) {
            // 먼저 티어별 분배 개선 (S, A+, D가 한 팀에 몰리지 않도록)
            improveTierDistribution(teams);

            // Best-improvement 스왑 + 3-way 로테이션
            for (let iteration = 0; iteration < 200; iteration++) {
                const currentScore = calculateTeamDifference(teams);
                let bestScore = currentScore;
                let bestMove = null;

                // 2-way 스왑: 모든 팀 쌍의 모든 선수 조합 탐색
                for (let i = 0; i < teams.length; i++) {
                    for (let j = i + 1; j < teams.length; j++) {
                        for (let pi = 0; pi < teams[i].length; pi++) {
                            for (let pj = 0; pj < teams[j].length; pj++) {
                                if (teams[i][pi].tier === teams[j][pj].tier) continue;
                                // 스왑 적용
                                const tmp = teams[i][pi];
                                teams[i][pi] = teams[j][pj];
                                teams[j][pj] = tmp;
                                const score = calculateTeamDifference(teams);
                                if (score < bestScore) {
                                    bestScore = score;
                                    bestMove = { type: '2way', i, j, pi, pj };
                                }
                                // 되돌리기
                                teams[j][pj] = teams[i][pi];
                                teams[i][pi] = tmp;
                            }
                        }
                    }
                }

                // 3-way 로테이션: 3팀 이상일 때 A→B, B→C, C→A 및 역방향
                if (teams.length >= 3) {
                    for (let a = 0; a < teams.length; a++) {
                        for (let b = a + 1; b < teams.length; b++) {
                            for (let c = b + 1; c < teams.length; c++) {
                                for (let pa = 0; pa < teams[a].length; pa++) {
                                    for (let pb = 0; pb < teams[b].length; pb++) {
                                        for (let pc = 0; pc < teams[c].length; pc++) {
                                            // 정방향: A→B, B→C, C→A
                                            const sa = teams[a][pa], sb = teams[b][pb], sc = teams[c][pc];
                                            if (sa.tier === sb.tier && sb.tier === sc.tier) continue;
                                            teams[a][pa] = sc;
                                            teams[b][pb] = sa;
                                            teams[c][pc] = sb;
                                            let score = calculateTeamDifference(teams);
                                            if (score < bestScore) {
                                                bestScore = score;
                                                bestMove = { type: '3way', a, b, c, pa, pb, pc, dir: 'fwd' };
                                            }
                                            // 역방향: A→C, C→B, B→A
                                            teams[a][pa] = sb;
                                            teams[b][pb] = sc;
                                            teams[c][pc] = sa;
                                            score = calculateTeamDifference(teams);
                                            if (score < bestScore) {
                                                bestScore = score;
                                                bestMove = { type: '3way', a, b, c, pa, pb, pc, dir: 'rev' };
                                            }
                                            // 되돌리기
                                            teams[a][pa] = sa;
                                            teams[b][pb] = sb;
                                            teams[c][pc] = sc;
                                        }
                                    }
                                }
                            }
                        }
                    }
                }

                // 최선의 이동 적용
                if (!bestMove) break;
                if (bestMove.type === '2way') {
                    const { i, j, pi, pj } = bestMove;
                    const tmp = teams[i][pi];
                    teams[i][pi] = teams[j][pj];
                    teams[j][pj] = tmp;
                } else {
                    const { a, b, c, pa, pb, pc, dir } = bestMove;
                    const sa = teams[a][pa], sb = teams[b][pb], sc = teams[c][pc];
                    if (dir === 'fwd') {
                        teams[a][pa] = sc;
                        teams[b][pb] = sa;
                        teams[c][pc] = sb;
                    } else {
                        teams[a][pa] = sb;
                        teams[b][pb] = sc;
                        teams[c][pc] = sa;
                    }
                }
            }
        }

        // 티어별 분배 점수 계산 (낮을수록 좋음, 인원당 평균 밸런스 최우선)
        function calculateTierDistributionScore(teams) {
            const tierOrder = ['S', 'A+', 'A', 'B+', 'B', 'C', 'D'];
            const criticalTiers = ['S', 'A+', 'C', 'D']; // 한 팀에 몰리면 안 되는 티어
            let score = 0;
            
            // 각 티어별로 팀 간 분배 확인
            tierOrder.forEach(tier => {
                const tierCounts = teams.map(team => 
                    team.filter(p => p.tier === tier).length
                );
                
                // 팀 간 분배의 분산 계산
                const avg = tierCounts.reduce((a, b) => a + b, 0) / tierCounts.length;
                const variance = tierCounts.reduce((sum, c) => sum + Math.pow(c - avg, 2), 0) / tierCounts.length;
                score += variance * 3; // 티어 분배 불균형 페널티 (5에서 3으로 더 감소)
                
                // S, A+, D 티어는 한 팀에 몰리면 큰 페널티 (하지만 인원당 평균 밸런스가 최우선)
                if (criticalTiers.includes(tier)) {
                    const maxCount = Math.max(...tierCounts);
                    const minCount = Math.min(...tierCounts);
                    if (maxCount - minCount > 1) {
                        score += (maxCount - minCount - 1) * 30; // 큰 페널티 (50에서 30으로 더 감소)
                    }
                    // 한 팀에 2명 이상 몰리면 추가 페널티
                    if (maxCount >= 2) {
                        score += (maxCount - 1) * 15; // 추가 페널티 (25에서 15로 더 감소)
                    }
                }
            });
            
            return score;
        }

        // 팀 간 티어 차이 계산 (인원당 평균 기준)
        function calculateTeamDifference(teams) {
            // 인원당 평균 티어를 계산 (승률 가중치 반영 옵션 적용)
            const averages = teams.map(team => {
                const sum = team.reduce((sum, p) => sum + getEffectiveWeight(p), 0);
                return team.length > 0 ? sum / team.length : 0;
            });
            
            // 평균의 분산 계산 (인원당 평균 밸런스가 최우선)
            const avg = averages.reduce((a, b) => a + b, 0) / averages.length;
            const variance = averages.reduce((sum, s) => sum + Math.pow(s - avg, 2), 0) / averages.length;
            
            // 티어 분배 점수 추가 (가중치를 낮춰서 인원당 평균을 더 우선시)
            const tierDistributionScore = calculateTierDistributionScore(teams);
            
            // 인원당 평균 분산에 높은 가중치, 티어 분배 점수에 낮은 가중치 적용
            return variance * 10 + tierDistributionScore * 0.1;
        }

        // 티어 표시/숨기기 토글
        function toggleTierVisibility() {
            showTier = !document.getElementById('hideTierCheckbox').checked;
            // 현재 표시된 팀이 있으면 다시 렌더링
            if (currentTeamsData && currentTeamSizes) {
                renderTeams(currentTeamsData, currentTeamSizes);
            }
        }
        
        // 선수 이동 함수
        function movePlayerToTeam(playerName, fromTeamIndex, toTeamIndex) {
            if (!isAdmin) {
                showToast('관리자만 선수를 이동할 수 있습니다.', 'error');
                return;
            }

            if (!currentTeamsData || !currentTeamSizes) {
                showToast('팀 구성이 없습니다.', 'error');
                return;
            }

            if (fromTeamIndex === toTeamIndex) return;

            const fromTeam = currentTeamsData[fromTeamIndex];
            const playerIndex = fromTeam.findIndex(p => p.name === playerName);

            if (playerIndex === -1) {
                showToast('선수를 찾을 수 없습니다.', 'error');
                return;
            }
            
            const player = fromTeam[playerIndex];
            
            // 선수 이동
            fromTeam.splice(playerIndex, 1);
            currentTeamsData[toTeamIndex].push(player);
            
            // 팀 크기 업데이트
            currentTeamSizes[fromTeamIndex]--;
            currentTeamSizes[toTeamIndex]++;
            
            // 팀 정보 다시 렌더링
            renderTeams(currentTeamsData, currentTeamSizes);
        }

        // 드래그 앤 드롭 관련 전역 변수
        let draggedPlayer = null;
        let draggedFromTeamIndex = null;

        // 팀 렌더링
        function renderTeams(teams, teamSizes) {
            currentTeamsData = teams;
            currentTeamSizes = teamSizes;

            const container = document.getElementById('teamsContainer');
            container.innerHTML = '';

            // 팀 간 평균 차이 계산 (밸런스 시각화용)
            const teamAverages = teams.map(team => {
                const s = team.reduce((sum, p) => sum + tierWeights[p.tier], 0);
                return team.length > 0 ? s / team.length : 0;
            });
            const maxAvg = Math.max(...teamAverages);
            const minAvg = Math.min(...teamAverages);
            const avgDiff = maxAvg - minAvg;

            const tierOrder = ['S', 'A+', 'A', 'B+', 'B', 'C', 'D'];
            const tierColors = { 'S': '#ff6b6b', 'A+': '#ffa500', 'A': '#ffd93d', 'B+': '#5dd68a', 'B': '#6bcf7f', 'C': '#4ecdc4', 'D': '#95a5a6' };
            const isMobile = 'ontouchstart' in window || navigator.maxTouchPoints > 0;
            const numTeams = teams.length;

            teams.forEach((team, index) => {
                const teamDiv = document.createElement('div');
                teamDiv.className = 'team team-animate';
                teamDiv.style.animationDelay = (index * 0.1) + 's';
                teamDiv.setAttribute('data-team-index', index);

                const sortedTeam = [...team].sort((a, b) => {
                    return tierOrder.indexOf(a.tier) - tierOrder.indexOf(b.tier);
                });

                const tierSum = sortedTeam.reduce((sum, p) => sum + tierWeights[p.tier], 0);
                const tierAverage = team.length > 0 ? (tierSum / team.length).toFixed(2) : 0;

                // 밸런스 표시
                let balanceClass = 'balance-good';
                let balanceText = '균형';
                if (avgDiff >= 1.0) { balanceClass = 'balance-bad'; balanceText = '불균형'; }
                else if (avgDiff >= 0.5) { balanceClass = 'balance-ok'; balanceText = '보통'; }

                // 티어 분포 바
                const tierCounts = {};
                tierOrder.forEach(t => tierCounts[t] = 0);
                team.forEach(p => { tierCounts[p.tier] = (tierCounts[p.tier] || 0) + 1; });
                const totalP = team.length || 1;
                const distBar = tierOrder.map(t => {
                    const pct = (tierCounts[t] / totalP * 100).toFixed(1);
                    return tierCounts[t] > 0 ? `<div style="width:${pct}%;background:${tierColors[t]}" title="${t}: ${tierCounts[t]}명"></div>` : '';
                }).join('');

                // 모바일 이동 옵션
                const moveOptions = Array.from({length: numTeams}, (_, i) => i)
                    .filter(i => i !== index)
                    .map(i => `<option value="${i}">팀 ${i+1}</option>`)
                    .join('');

                teamDiv.innerHTML = `
                    <div class="team-title">팀 ${index + 1} (${teamSizes[index]}명)</div>
                    <div class="balance-indicator ${balanceClass}">차이: ${avgDiff.toFixed(2)} (${balanceText})</div>
                    <div class="team-stats">
                        <div>티어 합: ${tierSum}</div>
                        <div>인원당 평균: ${tierAverage}</div>
                    </div>
                    <div class="tier-dist-bar">${distBar}</div>
                    <ul class="team-players" data-team-index="${index}">
                        ${sortedTeam.map(player => `
                            <li class="team-player ${isAdmin ? 'draggable' : ''}"
                                draggable="${isAdmin && !isMobile ? 'true' : 'false'}"
                                data-player-name="${player.name}"
                                data-team-index="${index}">
                                <div class="player-info">
                                    <div>${player.name}${showTier ? ` <span class="tier-badge tier-${player.tier.replace('+', 'plus')}">${player.tier}</span>` : ''}</div>
                                </div>
                                ${isAdmin && isMobile && numTeams > 1 ? `<select class="mobile-move-select" onchange="if(this.value !== '') { movePlayerToTeam('${player.name}', ${index}, parseInt(this.value)); this.selectedIndex=0; }" onclick="event.stopPropagation()">
                                    <option value="">이동</option>
                                    ${moveOptions}
                                </select>` : ''}
                            </li>
                        `).join('')}
                    </ul>
                `;
                container.appendChild(teamDiv);

                if (isAdmin && !isMobile) {
                    setupDragAndDrop(teamDiv, index);
                }
            });
        }

        // 드래그 앤 드롭 이벤트 설정
        function setupDragAndDrop(teamDiv, teamIndex) {
            const playersList = teamDiv.querySelector('.team-players');
            
            // 선수 항목에 드래그 이벤트
            playersList.querySelectorAll('.team-player.draggable').forEach(playerEl => {
                playerEl.addEventListener('dragstart', function(e) {
                    draggedPlayer = this.getAttribute('data-player-name');
                    draggedFromTeamIndex = parseInt(this.getAttribute('data-team-index'));
                    this.classList.add('dragging');
                    e.dataTransfer.effectAllowed = 'move';
                    e.dataTransfer.setData('text/html', this.innerHTML);
                });
                
                playerEl.addEventListener('dragend', function(e) {
                    this.classList.remove('dragging');
                    // 모든 팀의 drag-over 클래스 제거
                    document.querySelectorAll('.team').forEach(team => {
                        team.classList.remove('drag-over');
                    });
                });
            });
            
            // 팀 영역에 드롭 이벤트
            teamDiv.addEventListener('dragover', function(e) {
                if (draggedPlayer && draggedFromTeamIndex !== teamIndex) {
                    e.preventDefault();
                    e.dataTransfer.dropEffect = 'move';
                    this.classList.add('drag-over');
                }
            });
            
            teamDiv.addEventListener('dragleave', function(e) {
                this.classList.remove('drag-over');
            });
            
            teamDiv.addEventListener('drop', function(e) {
                e.preventDefault();
                this.classList.remove('drag-over');
                
                if (draggedPlayer && draggedFromTeamIndex !== null && draggedFromTeamIndex !== teamIndex) {
                    movePlayerToTeam(draggedPlayer, draggedFromTeamIndex, teamIndex);
                }
                
                draggedPlayer = null;
                draggedFromTeamIndex = null;
            });
        }

        // 초기 렌더링은 waitForFirebaseAndInit()에서 처리

        // ===== 풋살 FM 시뮬레이션 엔진 =====
        let fmState = null;
        let fmInterval = null;
        let fmTimeout = null;
        let fmSpeed = 1000;
        let fmPaused = false;
        let fmSetupSelected = [];
        let fmSelectedTeams = null;
        let fmPositionState = null;

        const FM_SPEEDS = { slow: 2000, normal: 1000, fast: 400 };
        const FM_HALF_TICKS = 20;
        const FM_MAX_COMMENTARY = 50;
        const FM_POSITIONS = ['NONE', 'GK', 'DF', 'MF', 'FW'];
        const FM_POS_LABELS = { NONE: '미정', GK: '골키퍼', DF: '수비', MF: '미드', FW: '공격' };
        const FM_POS_WEIGHTS = {
            attack:  { GK: 0.3, DF: 1, MF: 3, FW: 5 },
            assist:  { GK: 0.2, DF: 1.5, MF: 5, FW: 3 },
            defense: { GK: 10, DF: 3, MF: 1, FW: 0.3 },
            foul:    { GK: 0.5, DF: 3, MF: 2, FW: 1 }
        };

        const FM_COMMENTARY = {
            goal: [
                "골! {scorer}의 강력한 슛이 골망을 흔듭니다!",
                "골! {scorer}의 정확한 마무리! 멋진 득점입니다!",
                "골! {scorer}! 골대 구석으로 꽂히는 슛!",
                "골! {scorer}의 환상적인 골!",
                "골! {scorer}가 침착하게 골을 넣었습니다!"
            ],
            goalAssist: [
                "{assist}의 절묘한 어시스트! {scorer}가 마무리합니다!",
                "{assist}의 패스를 받은 {scorer}! 골!",
                "{assist}가 찔러준 공, {scorer}의 득점!",
                "{scorer} 골! {assist}의 도움이 빛납니다!"
            ],
            save: [
                "{keeper}의 선방! 위험한 순간을 막아냅니다!",
                "{keeper}가 몸을 날려 막아냅니다!",
                "{keeper}의 반사적인 세이브!",
                "{keeper}! 대단한 선방입니다!"
            ],
            miss: [
                "{player}의 슛! 아쉽게 빗나갑니다.",
                "{player}가 슛을 날렸지만 골대를 벗어납니다.",
                "{player}의 강슛! 골대 위로 넘어갑니다.",
                "{player}의 슈팅, 아깝게 빗나갔습니다."
            ],
            corner: [
                "{team}의 코너킥! 기회를 만들어봅니다.",
                "코너킥! {team}이 공격 기회를 잡습니다."
            ],
            foul: [
                "{player}의 거친 태클! 프리킥이 선언됩니다.",
                "{player}의 반칙! 상대에게 프리킥.",
                "{player}가 상대를 걸어 넘어뜨립니다. 파울!"
            ],
            yellowCard: [
                "{player}에게 경고! 옐로카드가 제시됩니다.",
                "{player} 옐로카드! 거친 플레이에 대한 경고."
            ],
            redCard: [
                "{player}에게 퇴장! 레드카드! {team}이 한 명 줄어듭니다.",
                "레드카드! {player} 퇴장! 수적 열세에 놓입니다."
            ],
            chance: [
                "{team}의 위험한 공격! 찬스입니다!",
                "{team}이 빠르게 역습합니다! 위기 상황!",
                "{team}이 상대 진영 깊숙이 침투합니다!"
            ],
            possession: [
                "{team}이 중원에서 공을 돌립니다.",
                "{team}이 점유율을 유지하며 패스를 이어갑니다.",
                "볼 소유 {team}. 천천히 기회를 엿봅니다.",
                "{team}이 수비 라인에서 빌드업을 시작합니다."
            ],
            halfTime: ["전반전 종료! 하프타임입니다."],
            fullTime: ["경기 종료! 풀타임 휘슬이 울립니다."],
            kickOff: ["경기 시작! 킥오프!"],
            secondHalf: ["후반전 시작!"]
        };

        // === 포지션 유틸 ===

        const FM_FORMATION_PRESETS = {
            3:  [{ name:'1-1-1', d:1, m:1, f:1 }],
            4:  [{ name:'1-2-1', d:1, m:2, f:1 }, { name:'2-1-1', d:2, m:1, f:1 }, { name:'1-1-2', d:1, m:1, f:2 }],
            5:  [{ name:'2-2-1', d:2, m:2, f:1 }, { name:'1-2-2', d:1, m:2, f:2 }, { name:'2-1-2', d:2, m:1, f:2 }],
            6:  [{ name:'2-2-2', d:2, m:2, f:2 }, { name:'2-3-1', d:2, m:3, f:1 }, { name:'3-2-1', d:3, m:2, f:1 }],
            7:  [{ name:'3-2-2', d:3, m:2, f:2 }, { name:'2-3-2', d:2, m:3, f:2 }, { name:'3-3-1', d:3, m:3, f:1 }],
            8:  [{ name:'3-3-2', d:3, m:3, f:2 }, { name:'4-2-2', d:4, m:2, f:2 }, { name:'3-2-3', d:3, m:2, f:3 }],
            9:  [{ name:'4-3-2', d:4, m:3, f:2 }, { name:'3-4-2', d:3, m:4, f:2 }, { name:'4-2-3', d:4, m:2, f:3 }],
            10: [{ name:'4-3-3', d:4, m:3, f:3 }, { name:'4-4-2', d:4, m:4, f:2 }, { name:'3-5-2', d:3, m:5, f:2 }, { name:'3-4-3', d:3, m:4, f:3 }, { name:'5-3-2', d:5, m:3, f:2 }]
        };

        let fmFormationData = { a: [], b: [] };

        function getFormationsForCount(fieldCount) {
            if (FM_FORMATION_PRESETS[fieldCount]) return FM_FORMATION_PRESETS[fieldCount];
            // 프리셋 없는 인원: 밸런스 포메이션 생성
            const d = Math.max(1, Math.round(fieldCount * 0.4));
            const f = Math.max(1, Math.round(fieldCount * 0.25));
            const m = Math.max(1, fieldCount - d - f);
            return [{ name: `${d}-${m}-${f}`, d, m, f }];
        }

        function getDefaultPositions(count) {
            if (count <= 0) return [];
            return Array(count).fill('NONE');
        }

        function applyFmFormation(prefix) {
            if (!fmPositionState) return;
            const state = fmPositionState[prefix];
            const starterCount = state.starters.length;
            for (let i = 0; i < starterCount; i++) {
                const el = document.getElementById(`${prefix}_pos_${i}`);
                if (el) el.value = 'NONE';
            }
        }

        function enforceFmFormation(prefix, changedIdx) {
            if (!fmPositionState) return;
            const state = fmPositionState[prefix];
            const starterCount = state.starters.length;
            const formEl = document.getElementById(`${prefix}_formation`);
            if (!formEl) return;
            const formIdx = parseInt(formEl.value);
            if (formIdx === -1) return;

            const formations = fmFormationData[prefix];
            if (!formations || !formations[formIdx]) return;
            const fm = formations[formIdx];
            const limits = { GK: 1, DF: fm.d, MF: fm.m, FW: fm.f };

            const positions = [];
            for (let i = 0; i < starterCount; i++) {
                positions.push(document.getElementById(`${prefix}_pos_${i}`).value);
            }

            const counts = { GK: 0, DF: 0, MF: 0, FW: 0 };
            positions.forEach(p => counts[p]++);

            const changedPos = positions[changedIdx];
            if (counts[changedPos] <= limits[changedPos]) return;

            let displaceIdx = -1;
            for (let i = 0; i < starterCount; i++) {
                if (i !== changedIdx && positions[i] === changedPos) {
                    displaceIdx = i;
                    break;
                }
            }
            if (displaceIdx === -1) return;

            const vacantPos = FM_POSITIONS.find(pos => counts[pos] < limits[pos]);
            if (!vacantPos) return;

            document.getElementById(`${prefix}_pos_${displaceIdx}`).value = vacantPos;
        }

        // === 셋업 플로우 ===

        function openFutsalFMSetup() {
            if (!currentTeamsData || currentTeamsData.length < 2) {
                showToast('먼저 팀을 구성해주세요 (최소 2팀)', 'error');
                return;
            }
            if (currentTeamsData.length === 2) {
                showFmPositionSetup(currentTeamsData[0], currentTeamsData[1], '팀 1', '팀 2');
                return;
            }
            // 3팀 이상: 팀 선택
            fmSetupSelected = [];
            const content = document.getElementById('fmSetupContent');
            content.classList.remove('fm-setup-wide');
            content.innerHTML = `
                <h3>시뮬레이션 - 팀 선택</h3>
                <p style="text-align:center;color:#aaa;margin-bottom:14px;font-size:0.9em;">경기할 두 팀을 선택하세요</p>
                <div id="fmSetupTeamList"></div>
                <div style="display:flex;gap:10px;margin-top:16px;justify-content:center;">
                    <button class="btn btn-primary" onclick="goToPositionSetup()">다음</button>
                    <button class="btn btn-secondary" onclick="closeFmSetup()">취소</button>
                </div>
            `;
            const list = document.getElementById('fmSetupTeamList');
            currentTeamsData.forEach((team, i) => {
                const avg = (team.reduce((s, p) => s + tierWeights[p.tier], 0) / team.length).toFixed(1);
                const btn = document.createElement('button');
                btn.className = 'fm-setup-team-btn';
                btn.innerHTML = `<strong>팀 ${i + 1}</strong> (${team.map(p => p.name).join(', ')}) <span style="color:#aaa;font-size:0.85em;">평균 ${avg}</span>`;
                btn.onclick = () => {
                    const idx = fmSetupSelected.indexOf(i);
                    if (idx > -1) {
                        fmSetupSelected.splice(idx, 1);
                        btn.classList.remove('selected');
                    } else {
                        if (fmSetupSelected.length >= 2) {
                            const oldIdx = fmSetupSelected.shift();
                            list.children[oldIdx].classList.remove('selected');
                        }
                        fmSetupSelected.push(i);
                        btn.classList.add('selected');
                    }
                };
                list.appendChild(btn);
            });
            document.getElementById('fmSetupModal').classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        function goToPositionSetup() {
            if (fmSetupSelected.length !== 2) {
                showToast('두 팀을 선택해주세요', 'error');
                return;
            }
            const [a, b] = fmSetupSelected;
            showFmPositionSetup(
                currentTeamsData[a], currentTeamsData[b],
                `팀 ${a + 1}`, `팀 ${b + 1}`
            );
        }

        function renderFmPositionColumn(prefix) {
            const team = prefix === 'a' ? fmSelectedTeams.teamA : fmSelectedTeams.teamB;
            const name = prefix === 'a' ? fmSelectedTeams.nameA : fmSelectedTeams.nameB;
            const state = fmPositionState[prefix];
            const formations = fmFormationData[prefix];
            const starterCount = state.starters.length;
            const positions = getDefaultPositions(starterCount);

            let html = `<h4>${name}</h4>`;
            html += `<div class="fm-formation-row">
                <label>포메이션</label>
                <select class="fm-formation-select" id="${prefix}_formation" onchange="applyFmFormation('${prefix}')">
                    <option value="-1" selected>자유 배치</option>
                    ${formations.map((f, i) => `<option value="${i}">${f.name}</option>`).join('')}
                </select>
            </div>`;

            html += `<div class="fm-pos-section-label">선발 (${starterCount}명)</div>`;
            state.starters.forEach((pIdx, i) => {
                const p = team[pIdx];
                const tierCls = 'tier-' + p.tier.replace('+', 'plus');
                html += `<div class="fm-pos-row">
                    <span class="fm-pos-name">${p.name} <span class="tier-badge ${tierCls}" style="font-size:0.7em;">${p.tier}</span></span>
                    <select class="fm-pos-select" id="${prefix}_pos_${i}" onchange="enforceFmFormation('${prefix}',${i})">
                        ${FM_POSITIONS.map(pos =>
                            `<option value="${pos}" ${positions[i] === pos ? 'selected' : ''}>${FM_POS_LABELS[pos]}</option>`
                        ).join('')}
                    </select>
                    ${starterCount > 2 && starterCount < fmPositionState.maxStarters ? `<button class="fm-pos-swap-btn" onclick="fmSwapPlayer('${prefix}',${pIdx},false)">↓</button>` : ''}
                </div>`;
            });

            if (state.subs.length > 0) {
                html += `<div class="fm-pos-section-label" style="margin-top:8px;">교체 (${state.subs.length}명)</div>`;
                state.subs.forEach(pIdx => {
                    const p = team[pIdx];
                    const tierCls = 'tier-' + p.tier.replace('+', 'plus');
                    html += `<div class="fm-pos-sub-row">
                        <span class="fm-pos-name">${p.name} <span class="tier-badge ${tierCls}" style="font-size:0.7em;">${p.tier}</span></span>
                        <button class="fm-pos-swap-btn" onclick="fmSwapPlayer('${prefix}',${pIdx},true)">↑</button>
                    </div>`;
                });
            }
            return html;
        }

        function fmSwapPlayer(prefix, playerIdx, toStarter) {
            const state = fmPositionState[prefix];
            const maxStarters = fmPositionState.maxStarters;

            if (toStarter) {
                if (state.starters.length >= maxStarters) {
                    const lastStarter = state.starters.pop();
                    state.subs.unshift(lastStarter);
                }
                state.subs = state.subs.filter(idx => idx !== playerIdx);
                state.starters.push(playerIdx);
            } else {
                if (state.starters.length <= 2) {
                    showToast('최소 2명의 선발이 필요합니다', 'error');
                    return;
                }
                state.starters = state.starters.filter(idx => idx !== playerIdx);
                state.subs.unshift(playerIdx);
            }

            const fieldCount = Math.max(1, state.starters.length - 1);
            fmFormationData[prefix] = getFormationsForCount(fieldCount);

            const col = document.getElementById(`fmPosCol_${prefix}`);
            col.innerHTML = renderFmPositionColumn(prefix);
            applyFmFormation(prefix);
        }

        function showFmPositionSetup(teamA, teamB, nameA, nameB) {
            fmSelectedTeams = { teamA, teamB, nameA, nameB };

            const maxSize = Math.max(teamA.length, teamB.length);
            const isFutsal = maxSize <= 7;
            const maxStarters = isFutsal ? 6 : 11;
            const modeLabel = isFutsal ? '풋살' : '축구';

            function sortIndicesByTier(team) {
                const indices = team.map((_, i) => i);
                indices.sort((a, b) => (tierWeights[team[b].tier] || 0) - (tierWeights[team[a].tier] || 0));
                return indices;
            }

            const sortedA = sortIndicesByTier(teamA);
            const sortedB = sortIndicesByTier(teamB);

            fmPositionState = {
                a: {
                    starters: sortedA.slice(0, Math.min(teamA.length, maxStarters)),
                    subs: sortedA.slice(Math.min(teamA.length, maxStarters))
                },
                b: {
                    starters: sortedB.slice(0, Math.min(teamB.length, maxStarters)),
                    subs: sortedB.slice(Math.min(teamB.length, maxStarters))
                },
                maxStarters: maxStarters
            };

            const fieldA = Math.max(1, fmPositionState.a.starters.length - 1);
            const fieldB = Math.max(1, fmPositionState.b.starters.length - 1);
            fmFormationData.a = getFormationsForCount(fieldA);
            fmFormationData.b = getFormationsForCount(fieldB);

            const startersA = Math.min(teamA.length, maxStarters);
            const startersB = Math.min(teamB.length, maxStarters);

            const content = document.getElementById('fmSetupContent');
            content.classList.add('fm-setup-wide');
            content.innerHTML = `
                <h3>시뮬레이션 - 포지션 설정</h3>
                <div class="fm-mode-label">${modeLabel} 모드 (${startersA}vs${startersB})</div>
                <div class="fm-pos-teams">
                    <div class="fm-pos-team-col" id="fmPosCol_a">
                        ${renderFmPositionColumn('a')}
                    </div>
                    <div class="fm-pos-team-col" id="fmPosCol_b">
                        ${renderFmPositionColumn('b')}
                    </div>
                </div>
                <div style="display:flex;gap:10px;margin-top:16px;justify-content:center;">
                    <button class="btn btn-primary" onclick="startFmWithPositions()">경기 시작</button>
                    <button class="btn btn-secondary" onclick="closeFmSetup()">취소</button>
                </div>
            `;

            document.getElementById('fmSetupModal').classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        function autoAssignPositions(starters, prefix) {
            const positions = starters.map((_, i) => document.getElementById(`${prefix}_pos_${i}`).value);
            const noneIndices = positions.map((p, i) => p === 'NONE' ? i : -1).filter(i => i !== -1);
            if (noneIndices.length === 0) return positions;

            const fieldCount = Math.max(1, starters.length - 1);
            const formEl = document.getElementById(`${prefix}_formation`);
            const formIdx = formEl ? parseInt(formEl.value) : -1;
            const formations = fmFormationData[prefix];
            const fm = (formIdx >= 0 && formations && formations[formIdx])
                ? formations[formIdx]
                : getFormationsForCount(fieldCount)[0];
            const slots = [];
            for (let i = 0; i < fm.d; i++) slots.push('DF');
            for (let i = 0; i < fm.m; i++) slots.push('MF');
            for (let i = 0; i < fm.f; i++) slots.push('FW');

            // 이미 지정된 포지션 차감
            const assigned = { GK: 0, DF: 0, MF: 0, FW: 0 };
            positions.forEach(p => { if (p !== 'NONE') assigned[p]++; });

            const needed = [];
            if (assigned['GK'] === 0 && noneIndices.length > 0) needed.push('GK');
            ['DF', 'MF', 'FW'].forEach(pos => {
                const limit = pos === 'DF' ? fm.d : pos === 'MF' ? fm.m : fm.f;
                for (let i = assigned[pos]; i < limit; i++) needed.push(pos);
            });

            // 남는 미정 슬롯은 MF로 채움
            while (needed.length < noneIndices.length) needed.push('MF');
            // 미정 선수가 더 적으면 필요한 만큼만
            while (needed.length > noneIndices.length) needed.pop();

            // 랜덤 셔플
            for (let i = needed.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [needed[i], needed[j]] = [needed[j], needed[i]];
            }

            noneIndices.forEach((idx, i) => { positions[idx] = needed[i]; });
            return positions;
        }

        function startFmWithPositions() {
            if (!fmSelectedTeams || !fmPositionState) return;
            const { teamA, teamB, nameA, nameB } = fmSelectedTeams;

            const positionsA = autoAssignPositions(fmPositionState.a.starters, 'a');
            const enrichedA = fmPositionState.a.starters.map((pIdx, i) => ({
                ...teamA[pIdx], position: positionsA[i], isSub: false
            }));
            const subsA = fmPositionState.a.subs.map(pIdx => ({
                ...teamA[pIdx],
                position: 'SUB',
                isSub: true
            }));

            const positionsB = autoAssignPositions(fmPositionState.b.starters, 'b');
            const enrichedB = fmPositionState.b.starters.map((pIdx, i) => ({
                ...teamB[pIdx], position: positionsB[i], isSub: false
            }));
            const subsB = fmPositionState.b.subs.map(pIdx => ({
                ...teamB[pIdx],
                position: 'SUB',
                isSub: true
            }));

            closeFmSetup();
            openFutsalFM([...enrichedA, ...subsA], [...enrichedB, ...subsB], nameA, nameB);
        }

        function closeFmSetup() {
            document.getElementById('fmSetupModal').classList.remove('active');
            document.body.style.overflow = '';
            fmSelectedTeams = null;
            fmPositionState = null;
        }

        // === 매치 시작 ===

        function openFutsalFM(teamA, teamB, nameA, nameB) {
            fmState = initFmState(teamA, teamB, nameA, nameB);
            fmPaused = false;
            fmSpeed = FM_SPEEDS.normal;
            restoreFmMatchControls();
            document.getElementById('fmMatchModal').classList.add('active');
            document.body.style.overflow = 'hidden';
            renderFmInitial();
            addFmEvent({ type: 'kickOff', minute: 0, text: FM_COMMENTARY.kickOff[0] });
            renderFmTick();
            fmInterval = setInterval(simulateTick, fmSpeed);
        }

        function initFmState(teamA, teamB, nameA, nameB) {
            const strA = calculateTeamStrength(teamA);
            const strB = calculateTeamStrength(teamB);
            return {
                teamA: teamA.map(p => ({ ...p, goals: 0, assists: 0, saves: 0, yellowCards: 0, redCard: false })),
                teamB: teamB.map(p => ({ ...p, goals: 0, assists: 0, saves: 0, yellowCards: 0, redCard: false })),
                nameA, nameB,
                strA, strB,
                scoreA: 0, scoreB: 0,
                half: 1,
                tick: 0,
                events: [],
                stats: {
                    possA: 0, possB: 0,
                    shotsA: 0, shotsB: 0,
                    foulsA: 0, foulsB: 0,
                    cornersA: 0, cornersB: 0,
                    yellowsA: 0, yellowsB: 0,
                    redsA: 0, redsB: 0
                },
                finished: false
            };
        }

        function calculateTeamStrength(team) {
            const starters = team.filter(p => !p.isSub);
            if (!starters.length) return 1;
            const total = starters.reduce((s, p) => s + tierWeights[p.tier], 0);
            return total / starters.length;
        }

        // === 시뮬레이션 틱 ===

        function simulateTick() {
            if (fmPaused || !fmState || fmState.finished) return;
            fmState.tick++;

            if (fmState.tick > FM_HALF_TICKS) {
                if (fmState.half === 1) {
                    handleHalfTime();
                    return;
                } else {
                    handleFullTime();
                    return;
                }
            }

            const minute = fmState.half === 1 ? fmState.tick : FM_HALF_TICKS + fmState.tick;
            const evt = generateMatchEvent(minute);
            addFmEvent(evt);
            applyEvent(evt);
            renderFmTick();
        }

        function generateMatchEvent(minute) {
            const st = fmState;
            const totalStr = st.strA + st.strB;
            const ratioA = st.strA / totalStr;
            const ratioB = st.strB / totalStr;

            const attackA = Math.random() < ratioA;
            const atkTeam = attackA ? 'A' : 'B';
            const defTeam = attackA ? 'B' : 'A';
            const atkPlayers = attackA ? st.teamA : st.teamB;
            const defPlayers = attackA ? st.teamB : st.teamA;
            const atkName = attackA ? st.nameA : st.nameB;

            const activePlayers = atkPlayers.filter(p => !p.redCard && !p.isSub);
            const activeDefenders = defPlayers.filter(p => !p.redCard && !p.isSub);

            if (attackA) st.stats.possA++; else st.stats.possB++;

            const roll = Math.random();
            let cumulative = 0;

            const baseGoalRate = 0.06;
            const atkRatio = attackA ? ratioA : ratioB;
            const goalRate = Math.min(baseGoalRate * (atkRatio * 2), 0.12);
            cumulative += goalRate;
            if (roll < cumulative) {
                const atkFieldPlayers = activePlayers.filter(p => p.position !== 'GK');
                const scorer = selectWeightedPlayer(atkFieldPlayers.length > 0 ? atkFieldPlayers : activePlayers, 'attack');
                if (attackA) { st.stats.shotsA++; } else { st.stats.shotsB++; }
                let assist = null;
                let text;
                if (Math.random() < 0.75 && activePlayers.length > 1) {
                    const assistCandidates = activePlayers.filter(p => p.name !== scorer.name);
                    assist = selectWeightedPlayer(assistCandidates, 'assist');
                    text = randomFrom(FM_COMMENTARY.goalAssist).replace('{scorer}', scorer.name).replace('{assist}', assist.name);
                } else {
                    text = randomFrom(FM_COMMENTARY.goal).replace('{scorer}', scorer.name);
                }
                return { type: 'goal', minute, team: atkTeam, scorer: scorer.name, assist: assist ? assist.name : null, text };
            }

            cumulative += 0.08;
            if (roll < cumulative) {
                const gks = activeDefenders.filter(p => p.position === 'GK');
                const keeper = gks.length > 0 ? gks[0] : selectWeightedPlayer(activeDefenders, 'defense');
                if (attackA) { st.stats.shotsA++; } else { st.stats.shotsB++; }
                const text = randomFrom(FM_COMMENTARY.save).replace('{keeper}', keeper.name);
                return { type: 'save', minute, team: defTeam, player: keeper.name, text };
            }

            cumulative += 0.10;
            if (roll < cumulative) {
                const missFieldPlayers = activePlayers.filter(p => p.position !== 'GK');
                const shooter = selectWeightedPlayer(missFieldPlayers.length > 0 ? missFieldPlayers : activePlayers, 'attack');
                if (attackA) { st.stats.shotsA++; } else { st.stats.shotsB++; }
                const text = randomFrom(FM_COMMENTARY.miss).replace('{player}', shooter.name);
                return { type: 'miss', minute, team: atkTeam, player: shooter.name, text };
            }

            cumulative += 0.05;
            if (roll < cumulative) {
                if (attackA) st.stats.cornersA++; else st.stats.cornersB++;
                const text = randomFrom(FM_COMMENTARY.corner).replace('{team}', atkName);
                return { type: 'corner', minute, team: atkTeam, text };
            }

            cumulative += 0.08;
            if (roll < cumulative) {
                const fouler = selectWeightedPlayer(activeDefenders, 'foul');
                if (attackA) st.stats.foulsB++; else st.stats.foulsA++;
                const text = randomFrom(FM_COMMENTARY.foul).replace('{player}', fouler.name);
                return { type: 'foul', minute, team: defTeam, player: fouler.name, text };
            }

            cumulative += 0.02;
            if (roll < cumulative) {
                const carder = selectWeightedPlayer(activeDefenders, 'foul');
                if (attackA) st.stats.yellowsB++; else st.stats.yellowsA++;
                const text = randomFrom(FM_COMMENTARY.yellowCard).replace('{player}', carder.name);
                return { type: 'yellowCard', minute, team: defTeam, player: carder.name, text };
            }

            cumulative += 0.003;
            if (roll < cumulative) {
                const carder = selectWeightedPlayer(activeDefenders, 'foul');
                if (attackA) st.stats.redsB++; else st.stats.redsA++;
                const teamName = attackA ? st.nameB : st.nameA;
                const text = randomFrom(FM_COMMENTARY.redCard).replace('{player}', carder.name).replace('{team}', teamName);
                return { type: 'redCard', minute, team: defTeam, player: carder.name, text };
            }

            cumulative += 0.08;
            if (roll < cumulative) {
                const text = randomFrom(FM_COMMENTARY.chance).replace('{team}', atkName);
                return { type: 'chance', minute, team: atkTeam, text };
            }

            const text = randomFrom(FM_COMMENTARY.possession).replace('{team}', atkName);
            return { type: 'possession', minute, team: atkTeam, text };
        }

        function selectWeightedPlayer(players, context) {
            if (!players.length) return { name: '알 수 없음', tier: 'C', position: 'MF' };
            const weights = players.map(p => {
                let w = tierWeights[p.tier] || 3;
                if (context === 'foul') w = 12 - w;
                const posW = FM_POS_WEIGHTS[context] ? (FM_POS_WEIGHTS[context][p.position] || 1) : 1;
                w *= posW;
                return Math.max(w, 0.1);
            });
            const total = weights.reduce((s, w) => s + w, 0);
            let r = Math.random() * total;
            for (let i = 0; i < players.length; i++) {
                r -= weights[i];
                if (r <= 0) return players[i];
            }
            return players[players.length - 1];
        }

        function randomFrom(arr) { return arr[Math.floor(Math.random() * arr.length)]; }

        function addFmEvent(evt) {
            fmState.events.unshift(evt);
            if (fmState.events.length > FM_MAX_COMMENTARY) fmState.events.pop();
        }

        function applyEvent(evt) {
            const st = fmState;
            const players = evt.team === 'A' ? st.teamA : st.teamB;
            switch (evt.type) {
                case 'goal':
                    if (evt.team === 'A') st.scoreA++; else st.scoreB++;
                    const scorer = players.find(p => p.name === evt.scorer);
                    if (scorer) scorer.goals++;
                    if (evt.assist) {
                        const assister = players.find(p => p.name === evt.assist);
                        if (assister) assister.assists++;
                    }
                    break;
                case 'save':
                    const keeper = players.find(p => p.name === evt.player);
                    if (keeper) keeper.saves++;
                    break;
                case 'yellowCard':
                    const yp = players.find(p => p.name === evt.player);
                    if (yp) {
                        yp.yellowCards++;
                        if (yp.yellowCards >= 2) yp.redCard = true;
                    }
                    break;
                case 'redCard':
                    const rp = players.find(p => p.name === evt.player);
                    if (rp) rp.redCard = true;
                    break;
            }
        }

        // === 하프/풀타임 ===

        function performAutoSubstitution(teamKey, minute) {
            const st = fmState;
            const players = teamKey === 'A' ? st.teamA : st.teamB;
            const teamName = teamKey === 'A' ? st.nameA : st.nameB;
            const subs = players.filter(p => p.isSub && !p.redCard);
            const starters = players.filter(p => !p.isSub && !p.redCard && p.position !== 'GK');
            if (subs.length === 0 || starters.length === 0) return;
            const sub = subs[0];
            const outPlayer = starters[Math.floor(Math.random() * starters.length)];
            sub.isSub = false;
            sub.position = outPlayer.position;
            outPlayer.isSub = true;
            outPlayer.position = 'SUB';
            addFmEvent({
                type: 'substitution', minute, team: teamKey,
                text: `교체! ${teamName} - ${sub.name} IN ↔ ${outPlayer.name} OUT`
            });
        }

        function handleHalfTime() {
            clearInterval(fmInterval);
            fmInterval = null;
            addFmEvent({ type: 'halfTime', minute: FM_HALF_TICKS, text: FM_COMMENTARY.halfTime[0] });
            performAutoSubstitution('A', FM_HALF_TICKS);
            performAutoSubstitution('B', FM_HALF_TICKS);
            renderFmTick();
            fmTimeout = setTimeout(() => {
                if (!fmState) return;
                fmState.half = 2;
                fmState.tick = 0;
                addFmEvent({ type: 'secondHalf', minute: FM_HALF_TICKS, text: FM_COMMENTARY.secondHalf[0] });
                renderFmTick();
                fmInterval = setInterval(simulateTick, fmSpeed);
            }, fmSpeed * 2);
        }

        function handleFullTime() {
            clearInterval(fmInterval);
            fmInterval = null;
            addFmEvent({ type: 'fullTime', minute: FM_HALF_TICKS * 2, text: FM_COMMENTARY.fullTime[0] });
            renderFmTick();
            fmState.finished = true;

            if (fmState.scoreA === fmState.scoreB) {
                fmTimeout = setTimeout(() => {
                    if (!fmState) return;
                    simulatePKs();
                }, fmSpeed * 2);
            } else {
                showFmEndControls();
            }
        }

        function simulatePKs() {
            const st = fmState;
            const pkA = []; const pkB = [];
            let playersA = st.teamA.filter(p => !p.redCard && !p.isSub);
            let playersB = st.teamB.filter(p => !p.redCard && !p.isSub);
            if (!playersA.length) playersA = st.teamA.filter(p => !p.isSub);
            if (!playersA.length) playersA = st.teamA;
            if (!playersB.length) playersB = st.teamB.filter(p => !p.isSub);
            if (!playersB.length) playersB = st.teamB;

            function pkSuccess(player) {
                const w = tierWeights[player.tier] || 3;
                const rate = 0.6 + (w / 10) * 0.3;
                return Math.random() < rate;
            }

            for (let i = 0; i < 5; i++) {
                const kA = playersA[i % playersA.length];
                const kB = playersB[i % playersB.length];
                pkA.push({ player: kA.name, success: pkSuccess(kA) });
                pkB.push({ player: kB.name, success: pkSuccess(kB) });
            }

            let scorePA = pkA.filter(p => p.success).length;
            let scorePB = pkB.filter(p => p.success).length;

            let round = 5;
            while (scorePA === scorePB) {
                const kA = playersA[round % playersA.length];
                const kB = playersB[round % playersB.length];
                const rA = { player: kA.name, success: pkSuccess(kA) };
                const rB = { player: kB.name, success: pkSuccess(kB) };
                pkA.push(rA); pkB.push(rB);
                if (rA.success) scorePA++;
                if (rB.success) scorePB++;
                round++;
                if (round > 20) {
                    if (scorePA === scorePB) scorePA++;
                    break;
                }
            }

            st.pk = { pkA, pkB, scorePA, scorePB };

            addFmEvent({
                type: 'halfTime', minute: 'PK',
                text: `승부차기! ${st.nameA} ${scorePA} - ${scorePB} ${st.nameB}`
            });
            renderFmTick();
            showFmEndControls();
        }

        // === 경기 종료 → 결과 보기 버튼 ===

        function showFmEndControls() {
            const controls = document.getElementById('fmControls');
            controls.innerHTML = `
                <button class="btn btn-primary" onclick="showFmResult()" style="padding:10px 30px;font-size:1em;">경기 결과 보기</button>
            `;
        }

        // === 결과 화면 ===

        function calculateMVP() {
            const st = fmState;
            const allPlayers = [
                ...st.teamA.map(p => ({ ...p, team: st.nameA })),
                ...st.teamB.map(p => ({ ...p, team: st.nameB }))
            ];
            let best = null;
            let bestScore = -1;
            allPlayers.forEach(p => {
                const score = (p.goals || 0) * 3 + (p.assists || 0) * 2 + (p.saves || 0) * 1;
                if (score > bestScore) { bestScore = score; best = p; }
            });
            return best;
        }

        function showFmResult() {
            const st = fmState;
            const mvp = calculateMVP();
            const totalPoss = st.stats.possA + st.stats.possB || 1;
            const possAP = Math.round(st.stats.possA / totalPoss * 100);
            const possBP = 100 - possAP;

            const goalEvents = st.events.filter(e => e.type === 'goal').reverse();
            let goalsHtml = '';
            goalEvents.forEach(e => {
                const teamName = e.team === 'A' ? st.nameA : st.nameB;
                const assistText = e.assist ? ` (${e.assist} 도움)` : '';
                goalsHtml += `<div>${e.minute}' ⚽ ${e.scorer}${assistText} - ${teamName}</div>`;
            });

            let pkHtml = '';
            if (st.pk) {
                pkHtml = `<div style="margin:12px 0"><strong>승부차기 ${st.pk.scorePA} - ${st.pk.scorePB}</strong></div>`;
                pkHtml += '<table class="fm-pk-table"><tr><th>' + st.nameA + '</th><th>R</th><th>' + st.nameB + '</th></tr>';
                const maxR = Math.max(st.pk.pkA.length, st.pk.pkB.length);
                for (let i = 0; i < maxR; i++) {
                    const a = st.pk.pkA[i];
                    const b = st.pk.pkB[i];
                    pkHtml += `<tr>
                        <td>${a ? (a.success ? '⚽' : '❌') + ' ' + a.player : ''}</td>
                        <td style="color:#888">${i + 1}</td>
                        <td>${b ? (b.success ? '⚽' : '❌') + ' ' + b.player : ''}</td>
                    </tr>`;
                }
                pkHtml += '</table>';
            }

            let winner = '';
            if (st.pk) {
                winner = st.pk.scorePA > st.pk.scorePB ? st.nameA : st.nameB;
            } else {
                winner = st.scoreA > st.scoreB ? st.nameA : st.nameB;
            }

            document.getElementById('fmMatchBody').innerHTML = `
                <div class="fm-result">
                    <h2>경기 종료</h2>
                    <div style="color:#aaa;margin-bottom:6px;">${st.nameA} vs ${st.nameB}</div>
                    <div class="fm-result-score">${st.scoreA} - ${st.scoreB}</div>
                    ${pkHtml}
                    <div style="font-size:1.1em;margin:8px 0;color:#ffd93d;">🏆 ${winner} 승리!</div>
                    ${mvp ? `<div class="fm-result-mvp">⭐ MVP: <strong>${mvp.name}</strong> (${mvp.team})<br><span style="font-size:0.85em;color:#aaa;">골 ${mvp.goals || 0} / 도움 ${mvp.assists || 0} / 선방 ${mvp.saves || 0}</span></div>` : ''}
                    <div class="fm-result-stats">
                        <div class="fm-stat-left">${possAP}%</div><div class="fm-stat-label">점유율</div><div class="fm-stat-right">${possBP}%</div>
                        <div class="fm-stat-left">${st.stats.shotsA}</div><div class="fm-stat-label">슈팅</div><div class="fm-stat-right">${st.stats.shotsB}</div>
                        <div class="fm-stat-left">${st.stats.cornersA}</div><div class="fm-stat-label">코너킥</div><div class="fm-stat-right">${st.stats.cornersB}</div>
                        <div class="fm-stat-left">${st.stats.foulsA}</div><div class="fm-stat-label">파울</div><div class="fm-stat-right">${st.stats.foulsB}</div>
                        <div class="fm-stat-left">${st.stats.yellowsA}</div><div class="fm-stat-label">경고</div><div class="fm-stat-right">${st.stats.yellowsB}</div>
                        <div class="fm-stat-left">${st.stats.redsA}</div><div class="fm-stat-label">퇴장</div><div class="fm-stat-right">${st.stats.redsB}</div>
                    </div>
                    ${goalsHtml ? `<div class="fm-result-goals"><strong>골 기록</strong>${goalsHtml}</div>` : '<div style="color:#888;margin:10px 0;">득점 없음</div>'}
                </div>
            `;

            document.getElementById('fmControls').innerHTML = `
                <button class="btn btn-primary" onclick="replayFm()">다시하기</button>
                <button class="btn btn-secondary" onclick="closeFmMatchModal()">닫기</button>
            `;

            saveFmResult(st, winner);
        }

        function saveFmResult(st, winner) {
            try {
                const history = JSON.parse(localStorage.getItem('fmHistory') || '[]');
                history.unshift({
                    date: new Date().toISOString(),
                    teamA: st.nameA, teamB: st.nameB,
                    scoreA: st.scoreA, scoreB: st.scoreB,
                    pk: st.pk ? { scorePA: st.pk.scorePA, scorePB: st.pk.scorePB } : null,
                    winner
                });
                if (history.length > 50) history.length = 50;
                localStorage.setItem('fmHistory', JSON.stringify(history));
            } catch (e) { /* ignore storage errors */ }
        }

        function replayFm() {
            closeFmMatchModal();
            openFutsalFMSetup();
        }

        // === 렌더링 ===

        function renderFmInitial() {
            const st = fmState;
            document.getElementById('fmTeamAName').textContent = st.nameA;
            document.getElementById('fmTeamBName').textContent = st.nameB;
            document.getElementById('fmTeamAAvg').textContent = `평균 ${st.strA.toFixed(1)}`;
            document.getElementById('fmTeamBAvg').textContent = `평균 ${st.strB.toFixed(1)}`;
            document.getElementById('fmScoreDisplay').textContent = '0 - 0';
            document.getElementById('fmTimeDisplay').textContent = '전반전 0:00';
            document.getElementById('fmCommentary').innerHTML = '<div class="fm-commentary-title">경기 중계</div>';
            renderFmRosters();
        }

        function renderFmRosters() {
            const st = fmState;
            const container = document.getElementById('fmRosters');
            function renderCol(team, name) {
                const starters = team.filter(p => !p.isSub);
                const subs = team.filter(p => p.isSub);
                let html = `<div class="fm-roster-col"><h4>${name}</h4>`;
                starters.forEach(p => {
                    let cls = 'fm-roster-player';
                    if (p.goals > 0) cls += ' has-goal';
                    if (p.redCard) cls += ' has-card-red';
                    else if (p.yellowCards > 0) cls += ' has-card-yellow';
                    const tierCls = 'tier-' + p.tier.replace('+', 'plus');
                    const posCls = 'fm-pos-' + (p.position || 'MF');
                    let icons = '';
                    for (let i = 0; i < p.goals; i++) icons += '⚽';
                    for (let i = 0; i < p.assists; i++) icons += '🅰️';
                    for (let i = 0; i < p.yellowCards; i++) icons += '🟨';
                    if (p.redCard) icons += '🟥';
                    for (let i = 0; i < p.saves; i++) icons += '🧤';
                    html += `<div class="${cls}">
                        <span><span class="fm-pos-badge ${posCls}">${p.position || 'MF'}</span>${p.name} <span class="tier-badge ${tierCls}" style="font-size:0.7em;">${p.tier}</span></span>
                        <span class="fm-roster-icons">${icons}</span>
                    </div>`;
                });
                if (subs.length > 0) {
                    html += '<div style="font-size:0.68em;color:#666;margin-top:3px;padding-left:4px;">교체</div>';
                    subs.forEach(p => {
                        const tierCls = 'tier-' + p.tier.replace('+', 'plus');
                        let icons = '';
                        if (p.redCard) icons += '🟥';
                        html += `<div class="fm-roster-player is-sub">
                            <span><span class="fm-sub-badge">SUB</span>${p.name} <span class="tier-badge ${tierCls}" style="font-size:0.7em;">${p.tier}</span></span>
                            <span class="fm-roster-icons">${icons}</span>
                        </div>`;
                    });
                }
                html += '</div>';
                return html;
            }
            container.innerHTML = renderCol(st.teamA, st.nameA) + renderCol(st.teamB, st.nameB);
        }

        function renderFmTick() {
            const st = fmState;
            document.getElementById('fmScoreDisplay').textContent = `${st.scoreA} - ${st.scoreB}`;
            const minute = st.half === 1 ? st.tick : FM_HALF_TICKS + st.tick;
            const halfLabel = st.half === 1 ? '전반전' : '후반전';
            document.getElementById('fmTimeDisplay').textContent = `${halfLabel} ${minute}:00`;
            renderFmRosters();
            const commEl = document.getElementById('fmCommentary');
            let html = '<div class="fm-commentary-title">경기 중계</div>';
            st.events.forEach(evt => {
                let cls = 'fm-event';
                switch (evt.type) {
                    case 'goal': cls += ' fm-event-goal'; break;
                    case 'save': cls += ' fm-event-save'; break;
                    case 'yellowCard': cls += ' fm-event-card'; break;
                    case 'redCard': cls += ' fm-event-card-red'; break;
                    case 'foul': cls += ' fm-event-foul'; break;
                    case 'chance': cls += ' fm-event-chance'; break;
                    case 'possession': cls += ' fm-event-possession'; break;
                    case 'halfTime': case 'fullTime': case 'kickOff': case 'secondHalf': cls += ' fm-event-half'; break;
                    case 'corner': cls += ' fm-event-corner'; break;
                    case 'substitution': cls += ' fm-event-sub'; break;
                }
                const minuteStr = typeof evt.minute === 'number' ? `${evt.minute}'` : evt.minute;
                html += `<div class="${cls}">${minuteStr} ${evt.text}</div>`;
            });
            commEl.innerHTML = html;
        }

        // === 제어 ===

        const FM_SPEED_LABELS = { slow: '느림', normal: '보통', fast: '빠름' };

        function setFmSpeed(speed) {
            fmSpeed = FM_SPEEDS[speed] || FM_SPEEDS.normal;
            const targetLabel = FM_SPEED_LABELS[speed];
            const controls = document.getElementById('fmControls');
            if (controls) {
                controls.querySelectorAll('.fm-btn-speed').forEach(btn => {
                    btn.classList.toggle('active', btn.textContent === targetLabel);
                });
            }
            if (fmInterval && !fmPaused) {
                clearInterval(fmInterval);
                fmInterval = setInterval(simulateTick, fmSpeed);
            }
        }

        function toggleFmPause() {
            fmPaused = !fmPaused;
            document.getElementById('fmPauseBtn').textContent = fmPaused ? '계속' : '일시정지';
        }

        function skipToEnd() {
            if (!fmState || fmState.finished) return;
            clearInterval(fmInterval);
            fmInterval = null;
            while (!fmState.finished) {
                fmState.tick++;

                if (fmState.tick > FM_HALF_TICKS) {
                    if (fmState.half === 1) {
                        addFmEvent({ type: 'halfTime', minute: FM_HALF_TICKS, text: FM_COMMENTARY.halfTime[0] });
                        performAutoSubstitution('A', FM_HALF_TICKS);
                        performAutoSubstitution('B', FM_HALF_TICKS);
                        fmState.half = 2;
                        fmState.tick = 0;
                        addFmEvent({ type: 'secondHalf', minute: FM_HALF_TICKS, text: FM_COMMENTARY.secondHalf[0] });
                        continue;
                    } else {
                        addFmEvent({ type: 'fullTime', minute: FM_HALF_TICKS * 2, text: FM_COMMENTARY.fullTime[0] });
                        fmState.finished = true;
                        break;
                    }
                }
                const minute = fmState.half === 1 ? fmState.tick : FM_HALF_TICKS + fmState.tick;
                const evt = generateMatchEvent(minute);
                addFmEvent(evt);
                applyEvent(evt);
            }
            renderFmTick();
            if (fmState.scoreA === fmState.scoreB) {
                simulatePKs();
            } else {
                showFmEndControls();
            }
        }

        function restoreFmMatchControls() {
            document.getElementById('fmControls').innerHTML = `
                <button class="btn fm-btn-speed" onclick="setFmSpeed('slow')">느림</button>
                <button class="btn fm-btn-speed active" onclick="setFmSpeed('normal')">보통</button>
                <button class="btn fm-btn-speed" onclick="setFmSpeed('fast')">빠름</button>
                <button class="btn fm-btn-action" onclick="toggleFmPause()" id="fmPauseBtn">일시정지</button>
                <button class="btn fm-btn-action" onclick="skipToEnd()">스킵</button>
            `;
        }

        function restoreFmMatchBody() {
            document.getElementById('fmMatchBody').innerHTML = `
                <div class="fm-scoreboard" id="fmScoreboard">
                    <div class="fm-team-info">
                        <div class="fm-team-name" id="fmTeamAName">팀1</div>
                        <div class="fm-team-avg" id="fmTeamAAvg"></div>
                    </div>
                    <div>
                        <div class="fm-score" id="fmScoreDisplay">0 - 0</div>
                        <div class="fm-time" id="fmTimeDisplay">경기 준비 중</div>
                    </div>
                    <div class="fm-team-info">
                        <div class="fm-team-name" id="fmTeamBName">팀2</div>
                        <div class="fm-team-avg" id="fmTeamBAvg"></div>
                    </div>
                </div>
                <div class="fm-rosters" id="fmRosters"></div>
                <div class="fm-commentary" id="fmCommentary">
                    <div class="fm-commentary-title">경기 중계</div>
                </div>
            `;
        }

        function closeFmMatchModal() {
            if (fmInterval) {
                clearInterval(fmInterval);
                fmInterval = null;
            }
            if (fmTimeout) {
                clearTimeout(fmTimeout);
                fmTimeout = null;
            }
            fmState = null;
            fmPaused = false;
            document.getElementById('fmMatchModal').classList.remove('active');
            document.body.style.overflow = '';
            restoreFmMatchBody();
            restoreFmMatchControls();
        }

        // ESC 키로 FM 모달 닫기
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') {
                if (document.getElementById('fmMatchModal').classList.contains('active')) {
                    closeFmMatchModal();
                } else if (document.getElementById('fmSetupModal').classList.contains('active')) {
                    closeFmSetup();
                }
            }
        });

    </script>
