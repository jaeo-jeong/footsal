        // === 포지션 유틸 ===

        const FM_FORMATION_PRESETS = {
            3:  [{ name:'1-1-1', d:1, m:1, f:1 }],
            4:  [{ name:'1-2-1', d:1, m:2, f:1 }, { name:'2-1-1', d:2, m:1, f:1 }, { name:'1-1-2', d:1, m:1, f:2 }],
            5:  [{ name:'2-2-1', d:2, m:2, f:1 }, { name:'1-2-2', d:1, m:2, f:2 }, { name:'2-1-2', d:2, m:1, f:2 }],
            6:  [{ name:'2-2-2', d:2, m:2, f:2 }, { name:'2-3-1', d:2, m:3, f:1 }, { name:'3-2-1', d:3, m:2, f:1 }],
            7:  [{ name:'3-2-2', d:3, m:2, f:2 }, { name:'2-3-2', d:2, m:3, f:2 }, { name:'3-3-1', d:3, m:3, f:1 }],
            8:  [{ name:'3-3-2', d:3, m:3, f:2 }, { name:'4-2-2', d:4, m:2, f:2 }, { name:'3-2-3', d:3, m:2, f:3 }],
            9:  [{ name:'4-3-2', d:4, m:3, f:2 }, { name:'3-4-2', d:3, m:4, f:2 }, { name:'4-2-3', d:4, m:2, f:3 }],
            10: [{ name:'4-3-3', d:4, m:3, f:3 }, { name:'4-4-2', d:4, m:4, f:2 }, { name:'3-5-2', d:3, m:5, f:2 }, { name:'3-4-3', d:3, m:4, f:3 }, { name:'5-3-2', d:5, m:3, f:2 }]
        };

        let fmFormationData = { a: [], b: [] };

        function getFormationsForCount(fieldCount) {
            if (FM_FORMATION_PRESETS[fieldCount]) return FM_FORMATION_PRESETS[fieldCount];
            // 프리셋 없는 인원: 밸런스 포메이션 생성
            const d = Math.max(1, Math.round(fieldCount * 0.4));
            const f = Math.max(1, Math.round(fieldCount * 0.25));
            const m = Math.max(1, fieldCount - d - f);
            return [{ name: `${d}-${m}-${f}`, d, m, f }];
        }

        function getDefaultPositions(count) {
            if (count <= 0) return [];
            return Array(count).fill('NONE');
        }

        function applyFmFormation(prefix) {
            if (!fmPositionState) return;
            const state = fmPositionState[prefix];
            const starterCount = state.starters.length;
            for (let i = 0; i < starterCount; i++) {
                const el = document.getElementById(`${prefix}_pos_${i}`);
                if (el) el.value = 'NONE';
            }
        }

        function enforceFmFormation(prefix, changedIdx) {
            if (!fmPositionState) return;
            const state = fmPositionState[prefix];
            const starterCount = state.starters.length;
            const formEl = document.getElementById(`${prefix}_formation`);
            if (!formEl) return;
            const formIdx = parseInt(formEl.value);
            if (formIdx === -1) return;

            const formations = fmFormationData[prefix];
            if (!formations || !formations[formIdx]) return;
            const fm = formations[formIdx];
            const limits = { GK: 1, DF: fm.d, MF: fm.m, FW: fm.f };

            const positions = [];
            for (let i = 0; i < starterCount; i++) {
                positions.push(document.getElementById(`${prefix}_pos_${i}`).value);
            }

            const changedPos = positions[changedIdx];
            if (!changedPos || changedPos === 'NONE') return;

            const counts = { GK: 0, DF: 0, MF: 0, FW: 0 };
            positions.forEach(p => { if (counts.hasOwnProperty(p)) counts[p]++; });

            if (counts[changedPos] <= limits[changedPos]) return;

            let displaceIdx = -1;
            for (let i = 0; i < starterCount; i++) {
                if (i !== changedIdx && positions[i] === changedPos) {
                    displaceIdx = i;
                    break;
                }
            }
            if (displaceIdx === -1) return;

            const vacantPos = FM_POSITIONS.find(pos => counts[pos] < limits[pos]);
            if (!vacantPos) return;

            document.getElementById(`${prefix}_pos_${displaceIdx}`).value = vacantPos;
        }

        // === 셋업 플로우 ===

        function openFutsalFMSetup() {
            if (!currentTeamsData || currentTeamsData.length < 2) {
                showToast('먼저 팀을 구성해주세요 (최소 2팀)', 'error');
                return;
            }
            if (currentTeamsData.length === 2) {
                showFmPositionSetup(currentTeamsData[0], currentTeamsData[1], '팀 1', '팀 2');
                return;
            }
            // 3팀 이상: 팀 선택
            fmSetupSelected = [];
            const content = document.getElementById('fmSetupContent');
            content.classList.remove('fm-setup-wide');
            content.innerHTML = `
                <h3>시뮬레이션 - 팀 선택</h3>
                <p style="text-align:center;color:#aaa;margin-bottom:14px;font-size:0.9em;">경기할 두 팀을 선택하세요</p>
                <div id="fmSetupTeamList"></div>
                <div style="display:flex;gap:10px;margin-top:16px;justify-content:center;">
                    <button class="btn btn-primary" onclick="goToPositionSetup()">다음</button>
                    <button class="btn btn-secondary" onclick="closeFmSetup()">취소</button>
                </div>
            `;
            const list = document.getElementById('fmSetupTeamList');
            currentTeamsData.forEach((team, i) => {
                const avg = (team.reduce((s, p) => s + getEffectiveWeight(p), 0) / team.length).toFixed(1);
                const btn = document.createElement('button');
                btn.className = 'fm-setup-team-btn';
                btn.innerHTML = `<strong>팀 ${i + 1}</strong> (${team.map(p => escapeHtml(p.name)).join(', ')}) <span style="color:#aaa;font-size:0.85em;">평균 ${avg}</span>`;
                btn.onclick = () => {
                    const idx = fmSetupSelected.indexOf(i);
                    if (idx > -1) {
                        fmSetupSelected.splice(idx, 1);
                        btn.classList.remove('selected');
                    } else {
                        if (fmSetupSelected.length >= 2) {
                            const oldIdx = fmSetupSelected.shift();
                            list.children[oldIdx].classList.remove('selected');
                        }
                        fmSetupSelected.push(i);
                        btn.classList.add('selected');
                    }
                };
                list.appendChild(btn);
            });
            document.getElementById('fmSetupModal').classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        function goToPositionSetup() {
            if (fmSetupSelected.length !== 2) {
                showToast('두 팀을 선택해주세요', 'error');
                return;
            }
            const [a, b] = fmSetupSelected;
            showFmPositionSetup(
                currentTeamsData[a], currentTeamsData[b],
                `팀 ${a + 1}`, `팀 ${b + 1}`
            );
        }

        function renderFmPositionColumn(prefix) {
            const team = prefix === 'a' ? fmSelectedTeams.teamA : fmSelectedTeams.teamB;
            const name = prefix === 'a' ? fmSelectedTeams.nameA : fmSelectedTeams.nameB;
            const state = fmPositionState[prefix];
            const formations = fmFormationData[prefix];
            const starterCount = state.starters.length;
            const positions = getDefaultPositions(starterCount);

            let html = `<h4>${name}</h4>`;
            html += `<div class="fm-formation-row">
                <label>포메이션</label>
                <select class="fm-formation-select" id="${prefix}_formation" onchange="applyFmFormation('${prefix}')">
                    <option value="-1" selected>자유 배치</option>
                    ${formations.map((f, i) => `<option value="${i}">${f.name}</option>`).join('')}
                </select>
            </div>`;

            html += `<div class="fm-pos-section-label">선발 (${starterCount}명)</div>`;
            state.starters.forEach((pIdx, i) => {
                const p = team[pIdx];
                const tierCls = 'tier-' + p.tier.replace('+', 'plus').replace('-', 'minus');
                html += `<div class="fm-pos-row">
                    <span class="fm-pos-name">${escapeHtml(p.name)} <span class="tier-badge ${tierCls}" style="font-size:0.7em;">${tierLabel(p.tier)}</span></span>
                    <select class="fm-pos-select" id="${prefix}_pos_${i}" onchange="enforceFmFormation('${prefix}',${i})">
                        ${FM_POSITIONS.map(pos =>
                            `<option value="${pos}" ${positions[i] === pos ? 'selected' : ''}>${FM_POS_LABELS[pos]}</option>`
                        ).join('')}
                    </select>
                    ${starterCount > 2 && starterCount < fmPositionState.maxStarters ? `<button class="fm-pos-swap-btn" onclick="fmSwapPlayer('${prefix}',${pIdx},false)">↓</button>` : ''}
                </div>`;
            });

            if (state.subs.length > 0) {
                html += `<div class="fm-pos-section-label" style="margin-top:8px;">교체 (${state.subs.length}명)</div>`;
                state.subs.forEach(pIdx => {
                    const p = team[pIdx];
                    const tierCls = 'tier-' + p.tier.replace('+', 'plus').replace('-', 'minus');
                    html += `<div class="fm-pos-sub-row">
                        <span class="fm-pos-name">${escapeHtml(p.name)} <span class="tier-badge ${tierCls}" style="font-size:0.7em;">${tierLabel(p.tier)}</span></span>
                        <button class="fm-pos-swap-btn" onclick="fmSwapPlayer('${prefix}',${pIdx},true)">↑</button>
                    </div>`;
                });
            }
            return html;
        }

        function fmSwapPlayer(prefix, playerIdx, toStarter) {
            const state = fmPositionState[prefix];
            const maxStarters = fmPositionState.maxStarters;

            if (toStarter) {
                if (state.starters.length >= maxStarters) {
                    const lastStarter = state.starters.pop();
                    state.subs.unshift(lastStarter);
                }
                state.subs = state.subs.filter(idx => idx !== playerIdx);
                state.starters.push(playerIdx);
            } else {
                if (state.starters.length <= 2) {
                    showToast('최소 2명의 선발이 필요합니다', 'error');
                    return;
                }
                state.starters = state.starters.filter(idx => idx !== playerIdx);
                state.subs.unshift(playerIdx);
            }

            const fieldCount = Math.max(1, state.starters.length - 1);
            fmFormationData[prefix] = getFormationsForCount(fieldCount);

            const col = document.getElementById(`fmPosCol_${prefix}`);
            col.innerHTML = renderFmPositionColumn(prefix);
            applyFmFormation(prefix);
        }

        function showFmPositionSetup(teamA, teamB, nameA, nameB) {
            fmSelectedTeams = { teamA, teamB, nameA, nameB };

            const maxSize = Math.max(teamA.length, teamB.length);
            const isFutsal = currentTeamMeta ? currentTeamMeta.mode === 'futsal' : maxSize <= 7;
            const maxStarters = currentTeamMeta ? currentTeamMeta.onFieldCount : (isFutsal ? 6 : 11);
            const modeLabel = isFutsal ? '풋살' : '축구';

            function sortIndicesByStrength(team) {
                const indices = team.map((_, i) => i);
                indices.sort((a, b) => getEffectiveWeight(team[b]) - getEffectiveWeight(team[a]));
                return indices;
            }

            const sortedA = sortIndicesByStrength(teamA);
            const sortedB = sortIndicesByStrength(teamB);

            fmPositionState = {
                a: {
                    starters: sortedA.slice(0, Math.min(teamA.length, maxStarters)),
                    subs: sortedA.slice(Math.min(teamA.length, maxStarters))
                },
                b: {
                    starters: sortedB.slice(0, Math.min(teamB.length, maxStarters)),
                    subs: sortedB.slice(Math.min(teamB.length, maxStarters))
                },
                maxStarters: maxStarters
            };

            const fieldA = Math.max(1, fmPositionState.a.starters.length - 1);
            const fieldB = Math.max(1, fmPositionState.b.starters.length - 1);
            fmFormationData.a = getFormationsForCount(fieldA);
            fmFormationData.b = getFormationsForCount(fieldB);

            const startersA = Math.min(teamA.length, maxStarters);
            const startersB = Math.min(teamB.length, maxStarters);

            const content = document.getElementById('fmSetupContent');
            content.classList.add('fm-setup-wide');
            content.innerHTML = `
                <h3>시뮬레이션 - 포지션 설정</h3>
                <div class="fm-mode-label">${modeLabel} 모드 (${startersA}vs${startersB})</div>
                <div class="fm-pos-teams">
                    <div class="fm-pos-team-col" id="fmPosCol_a">
                        ${renderFmPositionColumn('a')}
                    </div>
                    <div class="fm-pos-team-col" id="fmPosCol_b">
                        ${renderFmPositionColumn('b')}
                    </div>
                </div>
                <div style="display:flex;gap:10px;margin-top:16px;justify-content:center;">
                    <button class="btn btn-primary" onclick="startFmWithPositions()">경기 시작</button>
                    <button class="btn btn-secondary" onclick="closeFmSetup()">취소</button>
                </div>
            `;

            document.getElementById('fmSetupModal').classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        function autoAssignPositions(starters, prefix) {
            const positions = starters.map((_, i) => document.getElementById(`${prefix}_pos_${i}`).value);
            const noneIndices = positions.map((p, i) => p === 'NONE' ? i : -1).filter(i => i !== -1);
            if (noneIndices.length === 0) return positions;

            const fieldCount = Math.max(1, starters.length - 1);
            const formEl = document.getElementById(`${prefix}_formation`);
            const formIdx = formEl ? parseInt(formEl.value) : -1;
            const formations = fmFormationData[prefix];
            const fm = (formIdx >= 0 && formations && formations[formIdx])
                ? formations[formIdx]
                : getFormationsForCount(fieldCount)[0];
            const slots = [];
            for (let i = 0; i < fm.d; i++) slots.push('DF');
            for (let i = 0; i < fm.m; i++) slots.push('MF');
            for (let i = 0; i < fm.f; i++) slots.push('FW');

            // 이미 지정된 포지션 차감
            const assigned = { GK: 0, DF: 0, MF: 0, FW: 0 };
            positions.forEach(p => { if (p !== 'NONE') assigned[p]++; });

            const needed = [];
            if (assigned['GK'] === 0 && noneIndices.length > 0) needed.push('GK');
            ['DF', 'MF', 'FW'].forEach(pos => {
                const limit = pos === 'DF' ? fm.d : pos === 'MF' ? fm.m : fm.f;
                for (let i = assigned[pos]; i < limit; i++) needed.push(pos);
            });

            // 남는 미정 슬롯은 MF로 채움
            while (needed.length < noneIndices.length) needed.push('MF');
            // 미정 선수가 더 적으면 필요한 만큼만
            while (needed.length > noneIndices.length) needed.pop();

            // 랜덤 셔플
            for (let i = needed.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [needed[i], needed[j]] = [needed[j], needed[i]];
            }

            noneIndices.forEach((idx, i) => { positions[idx] = needed[i]; });
            return positions;
        }

        function startFmWithPositions() {
            if (!fmSelectedTeams || !fmPositionState) return;
            const { teamA, teamB, nameA, nameB } = fmSelectedTeams;

            const positionsA = autoAssignPositions(fmPositionState.a.starters, 'a');
            const enrichedA = fmPositionState.a.starters.map((pIdx, i) => ({
                ...teamA[pIdx], position: positionsA[i], isSub: false
            }));
            const subsA = fmPositionState.a.subs.map(pIdx => ({
                ...teamA[pIdx],
                position: 'SUB',
                isSub: true
            }));

            const positionsB = autoAssignPositions(fmPositionState.b.starters, 'b');
            const enrichedB = fmPositionState.b.starters.map((pIdx, i) => ({
                ...teamB[pIdx], position: positionsB[i], isSub: false
            }));
            const subsB = fmPositionState.b.subs.map(pIdx => ({
                ...teamB[pIdx],
                position: 'SUB',
                isSub: true
            }));

            closeFmSetup();
            openFutsalFM([...enrichedA, ...subsA], [...enrichedB, ...subsB], nameA, nameB);
        }

        function closeFmSetup() {
            document.getElementById('fmSetupModal').classList.remove('active');
            if (!isAnyModalActive()) {
                document.body.style.overflow = '';
            }
            fmSelectedTeams = null;
            fmPositionState = null;
        }

        // === 매치 시작 ===

        function openFutsalFM(teamA, teamB, nameA, nameB) {
            fmState = initFmState(teamA, teamB, nameA, nameB);
            fmPaused = false;
            fmSpeed = FM_SPEEDS.normal;
            restoreFmMatchControls();
            document.getElementById('fmMatchModal').classList.add('active');
            document.body.style.overflow = 'hidden';
            renderFmInitial();
            addFmEvent({ type: 'kickOff', minute: 0, text: FM_COMMENTARY.kickOff[0] });
            renderFmTick();
            fmInterval = setInterval(simulateTick, fmSpeed);
        }

        function initFmState(teamA, teamB, nameA, nameB) {
            const strA = calculateTeamStrength(teamA);
            const strB = calculateTeamStrength(teamB);
            return {
                teamA: teamA.map(p => ({ ...p, goals: 0, assists: 0, saves: 0, yellowCards: 0, redCard: false })),
                teamB: teamB.map(p => ({ ...p, goals: 0, assists: 0, saves: 0, yellowCards: 0, redCard: false })),
                nameA, nameB,
                strA, strB,
                scoreA: 0, scoreB: 0,
                half: 1,
                tick: 0,
                events: [],
                stats: {
                    possA: 0, possB: 0,
                    shotsA: 0, shotsB: 0,
                    foulsA: 0, foulsB: 0,
                    cornersA: 0, cornersB: 0,
                    yellowsA: 0, yellowsB: 0,
                    redsA: 0, redsB: 0
                },
                finished: false
            };
        }

        function calculateTeamStrength(team) {
            const starters = team.filter(p => !p.isSub);
            if (!starters.length) return 1;
            const total = starters.reduce((s, p) => s + getEffectiveWeight(p), 0);
            return total / starters.length;
        }

        // === 시뮬레이션 틱 ===

        function simulateTick() {
            if (fmPaused || !fmState || fmState.finished) return;
            fmState.tick++;

            if (fmState.tick > FM_HALF_TICKS) {
                if (fmState.half === 1) {
                    handleHalfTime();
                    return;
                } else {
                    handleFullTime();
                    return;
                }
            }

            const minute = fmState.half === 1 ? fmState.tick : FM_HALF_TICKS + fmState.tick;
            const evt = generateMatchEvent(minute);
            addFmEvent(evt);
            applyEvent(evt);
            renderFmTick();
        }

        function generateMatchEvent(minute) {
            const st = fmState;
            const totalStr = st.strA + st.strB;
            const ratioA = st.strA / totalStr;
            const ratioB = st.strB / totalStr;

            const attackA = Math.random() < ratioA;
            const atkTeam = attackA ? 'A' : 'B';
            const defTeam = attackA ? 'B' : 'A';
            const atkPlayers = attackA ? st.teamA : st.teamB;
            const defPlayers = attackA ? st.teamB : st.teamA;
            const atkName = attackA ? st.nameA : st.nameB;

            const activePlayers = atkPlayers.filter(p => !p.redCard && !p.isSub);
            const activeDefenders = defPlayers.filter(p => !p.redCard && !p.isSub);

            if (attackA) st.stats.possA++; else st.stats.possB++;

            const roll = Math.random();
            let cumulative = 0;

            const baseGoalRate = 0.06;
            const atkRatio = attackA ? ratioA : ratioB;
            const goalRate = Math.min(baseGoalRate * (atkRatio * 2), 0.12);
            cumulative += goalRate;
            if (roll < cumulative) {
                const atkFieldPlayers = activePlayers.filter(p => p.position !== 'GK');
                const scorer = selectWeightedPlayer(atkFieldPlayers.length > 0 ? atkFieldPlayers : activePlayers, 'attack');
                if (attackA) { st.stats.shotsA++; } else { st.stats.shotsB++; }
                let assist = null;
                let text;
                if (Math.random() < 0.75 && activePlayers.length > 1) {
                    const assistCandidates = activePlayers.filter(p => p.name !== scorer.name);
                    assist = selectWeightedPlayer(assistCandidates, 'assist');
                    text = randomFrom(FM_COMMENTARY.goalAssist).replace('{scorer}', escapeHtml(scorer.name)).replace('{assist}', escapeHtml(assist.name));
                } else {
                    text = randomFrom(FM_COMMENTARY.goal).replace('{scorer}', escapeHtml(scorer.name));
                }
                return { type: 'goal', minute, team: atkTeam, scorer: scorer.name, assist: assist ? assist.name : null, text };
            }

            cumulative += 0.08;
            if (roll < cumulative) {
                const gks = activeDefenders.filter(p => p.position === 'GK');
                const keeper = gks.length > 0 ? gks[0] : selectWeightedPlayer(activeDefenders, 'defense');
                if (attackA) { st.stats.shotsA++; } else { st.stats.shotsB++; }
                const text = randomFrom(FM_COMMENTARY.save).replace('{keeper}', escapeHtml(keeper.name));
                return { type: 'save', minute, team: defTeam, player: keeper.name, text };
            }

            cumulative += 0.10;
            if (roll < cumulative) {
                const missFieldPlayers = activePlayers.filter(p => p.position !== 'GK');
                const shooter = selectWeightedPlayer(missFieldPlayers.length > 0 ? missFieldPlayers : activePlayers, 'attack');
                if (attackA) { st.stats.shotsA++; } else { st.stats.shotsB++; }
                const text = randomFrom(FM_COMMENTARY.miss).replace('{player}', escapeHtml(shooter.name));
                return { type: 'miss', minute, team: atkTeam, player: shooter.name, text };
            }

            cumulative += 0.05;
            if (roll < cumulative) {
                if (attackA) st.stats.cornersA++; else st.stats.cornersB++;
                const text = randomFrom(FM_COMMENTARY.corner).replace('{team}', atkName);
                return { type: 'corner', minute, team: atkTeam, text };
            }

            cumulative += 0.08;
            if (roll < cumulative) {
                const fouler = selectWeightedPlayer(activeDefenders, 'foul');
                if (attackA) st.stats.foulsB++; else st.stats.foulsA++;
                const text = randomFrom(FM_COMMENTARY.foul).replace('{player}', escapeHtml(fouler.name));
                return { type: 'foul', minute, team: defTeam, player: fouler.name, text };
            }

            cumulative += 0.02;
            if (roll < cumulative) {
                const carder = selectWeightedPlayer(activeDefenders, 'foul');
                if (attackA) st.stats.yellowsB++; else st.stats.yellowsA++;
                const text = randomFrom(FM_COMMENTARY.yellowCard).replace('{player}', escapeHtml(carder.name));
                return { type: 'yellowCard', minute, team: defTeam, player: carder.name, text };
            }

            cumulative += 0.003;
            if (roll < cumulative) {
                const carder = selectWeightedPlayer(activeDefenders, 'foul');
                if (attackA) st.stats.redsB++; else st.stats.redsA++;
                const teamName = attackA ? st.nameB : st.nameA;
                const text = randomFrom(FM_COMMENTARY.redCard).replace('{player}', escapeHtml(carder.name)).replace('{team}', escapeHtml(teamName));
                return { type: 'redCard', minute, team: defTeam, player: carder.name, text };
            }

            cumulative += 0.08;
            if (roll < cumulative) {
                const text = randomFrom(FM_COMMENTARY.chance).replace('{team}', atkName);
                return { type: 'chance', minute, team: atkTeam, text };
            }

            const text = randomFrom(FM_COMMENTARY.possession).replace('{team}', atkName);
            return { type: 'possession', minute, team: atkTeam, text };
        }

        function selectWeightedPlayer(players, context) {
            if (!players.length) return { name: '알 수 없음', tier: 'C', position: 'MF' };
            const weights = players.map(p => {
                let w = getEffectiveWeight(p);
                if (context === 'foul') w = 12 - w;
                const posW = FM_POS_WEIGHTS[context] ? (FM_POS_WEIGHTS[context][p.position] || 1) : 1;
                w *= posW;
                return Math.max(w, 0.1);
            });
            const total = weights.reduce((s, w) => s + w, 0);
            let r = Math.random() * total;
            for (let i = 0; i < players.length; i++) {
                r -= weights[i];
                if (r <= 0) return players[i];
            }
            return players[players.length - 1];
        }

        function randomFrom(arr) { return arr[Math.floor(Math.random() * arr.length)]; }

        function addFmEvent(evt) {
            fmState.events.unshift(evt);
            if (fmState.events.length > FM_MAX_COMMENTARY) fmState.events.pop();
        }

        function applyEvent(evt) {
            const st = fmState;
            const teamPlayers = evt.team === 'A' ? st.teamA : st.teamB;
            switch (evt.type) {
                case 'goal': {
                    if (evt.team === 'A') st.scoreA++; else st.scoreB++;
                    const scorer = teamPlayers.find(p => p.name === evt.scorer);
                    if (scorer) scorer.goals++;
                    if (evt.assist) {
                        const assister = teamPlayers.find(p => p.name === evt.assist);
                        if (assister) assister.assists++;
                    }
                    break;
                }
                case 'save': {
                    const keeper = teamPlayers.find(p => p.name === evt.player);
                    if (keeper) keeper.saves++;
                    break;
                }
                case 'yellowCard': {
                    const yp = teamPlayers.find(p => p.name === evt.player);
                    if (yp) {
                        yp.yellowCards++;
                        if (yp.yellowCards >= 2) yp.redCard = true;
                    }
                    break;
                }
                case 'redCard': {
                    const rp = teamPlayers.find(p => p.name === evt.player);
                    if (rp) rp.redCard = true;
                    break;
                }
            }
        }

        // === 하프/풀타임 ===

        function performAutoSubstitution(teamKey, minute) {
            const st = fmState;
            const players = teamKey === 'A' ? st.teamA : st.teamB;
            const teamName = teamKey === 'A' ? st.nameA : st.nameB;
            const subs = players.filter(p => p.isSub && !p.redCard);
            const starters = players.filter(p => !p.isSub && !p.redCard && p.position !== 'GK');
            if (subs.length === 0 || starters.length === 0) return;
            const sub = subs[0];
            const outPlayer = starters[Math.floor(Math.random() * starters.length)];
            sub.isSub = false;
            sub.position = outPlayer.position;
            outPlayer.isSub = true;
            outPlayer.position = 'SUB';
            addFmEvent({
                type: 'substitution', minute, team: teamKey,
                text: `교체! ${teamName} - ${escapeHtml(sub.name)} IN ↔ ${escapeHtml(outPlayer.name)} OUT`
            });
        }

        function handleHalfTime() {
            clearInterval(fmInterval);
            fmInterval = null;
            addFmEvent({ type: 'halfTime', minute: FM_HALF_TICKS, text: FM_COMMENTARY.halfTime[0] });
            performAutoSubstitution('A', FM_HALF_TICKS);
            performAutoSubstitution('B', FM_HALF_TICKS);
            renderFmTick();
            fmTimeout = setTimeout(() => {
                if (!fmState) return;
                fmState.half = 2;
                fmState.tick = 0;
                addFmEvent({ type: 'secondHalf', minute: FM_HALF_TICKS, text: FM_COMMENTARY.secondHalf[0] });
                renderFmTick();
                fmInterval = setInterval(simulateTick, fmSpeed);
            }, fmSpeed * 2);
        }

        function handleFullTime() {
            clearInterval(fmInterval);
            fmInterval = null;
            addFmEvent({ type: 'fullTime', minute: FM_HALF_TICKS * 2, text: FM_COMMENTARY.fullTime[0] });
            renderFmTick();
            fmState.finished = true;

            if (fmState.scoreA === fmState.scoreB) {
                fmTimeout = setTimeout(() => {
                    if (!fmState) return;
                    simulatePKs();
                }, fmSpeed * 2);
            } else {
                showFmEndControls();
            }
        }

        function simulatePKs() {
            const st = fmState;
            const pkA = []; const pkB = [];
            let playersA = st.teamA.filter(p => !p.redCard && !p.isSub);
            let playersB = st.teamB.filter(p => !p.redCard && !p.isSub);
            if (!playersA.length) playersA = st.teamA.filter(p => !p.isSub);
            if (!playersA.length) playersA = st.teamA;
            if (!playersB.length) playersB = st.teamB.filter(p => !p.isSub);
            if (!playersB.length) playersB = st.teamB;

            function pkSuccess(player) {
                const w = getEffectiveWeight(player);
                const rate = 0.6 + (w / 10) * 0.3;
                return Math.random() < rate;
            }

            for (let i = 0; i < 5; i++) {
                const kA = playersA[i % playersA.length];
                const kB = playersB[i % playersB.length];
                pkA.push({ player: kA.name, success: pkSuccess(kA) });
                pkB.push({ player: kB.name, success: pkSuccess(kB) });
            }

            let scorePA = pkA.filter(p => p.success).length;
            let scorePB = pkB.filter(p => p.success).length;

            let round = 5;
            while (scorePA === scorePB) {
                const kA = playersA[round % playersA.length];
                const kB = playersB[round % playersB.length];
                const rA = { player: kA.name, success: pkSuccess(kA) };
                const rB = { player: kB.name, success: pkSuccess(kB) };
                pkA.push(rA); pkB.push(rB);
                if (rA.success) scorePA++;
                if (rB.success) scorePB++;
                round++;
                if (round > 20) {
                    if (scorePA === scorePB) {
                        // 공정하게 동전 던지기로 결정
                        if (Math.random() < 0.5) scorePA++;
                        else scorePB++;
                    }
                    break;
                }
            }

            st.pk = { pkA, pkB, scorePA, scorePB };

            addFmEvent({
                type: 'halfTime', minute: 'PK',
                text: `승부차기! ${escapeHtml(st.nameA)} ${scorePA} - ${scorePB} ${escapeHtml(st.nameB)}`
            });
            renderFmTick();
            showFmEndControls();
        }

        // === 경기 종료 → 결과 보기 버튼 ===

        function showFmEndControls() {
            const controls = document.getElementById('fmControls');
            controls.innerHTML = `
                <button class="btn btn-primary" onclick="showFmResult()" style="padding:10px 30px;font-size:1em;">경기 결과 보기</button>
            `;
        }

        // === 결과 화면 ===

        function calculateMVP() {
            const st = fmState;
            const allPlayers = [
                ...st.teamA.map(p => ({ ...p, team: st.nameA })),
                ...st.teamB.map(p => ({ ...p, team: st.nameB }))
            ];
            let best = null;
            let bestScore = -1;
            allPlayers.forEach(p => {
                const score = (p.goals || 0) * 3 + (p.assists || 0) * 2 + (p.saves || 0) * 1;
                if (score > bestScore) { bestScore = score; best = p; }
            });
            return best;
        }

        function showFmResult() {
            const st = fmState;
            const mvp = calculateMVP();
            const totalPoss = (st.stats.possA + st.stats.possB) || 1;
            const possAP = Math.round(st.stats.possA / totalPoss * 100);
            const possBP = 100 - possAP;

            const goalEvents = st.events.filter(e => e.type === 'goal').reverse();
            let goalsHtml = '';
            goalEvents.forEach(e => {
                const teamName = e.team === 'A' ? st.nameA : st.nameB;
                const assistText = e.assist ? ` (${e.assist} 도움)` : '';
                goalsHtml += `<div>${e.minute}' ⚽ ${e.scorer}${assistText} - ${teamName}</div>`;
            });

            let pkHtml = '';
            if (st.pk) {
                pkHtml = `<div style="margin:12px 0"><strong>승부차기 ${st.pk.scorePA} - ${st.pk.scorePB}</strong></div>`;
                pkHtml += '<table class="fm-pk-table"><tr><th>' + st.nameA + '</th><th>R</th><th>' + st.nameB + '</th></tr>';
                const maxR = Math.max(st.pk.pkA.length, st.pk.pkB.length);
                for (let i = 0; i < maxR; i++) {
                    const a = st.pk.pkA[i];
                    const b = st.pk.pkB[i];
                    pkHtml += `<tr>
                        <td>${a ? (a.success ? '⚽' : '❌') + ' ' + a.player : ''}</td>
                        <td style="color:#888">${i + 1}</td>
                        <td>${b ? (b.success ? '⚽' : '❌') + ' ' + b.player : ''}</td>
                    </tr>`;
                }
                pkHtml += '</table>';
            }

            let winner = '';
            if (st.pk) {
                winner = st.pk.scorePA > st.pk.scorePB ? st.nameA : st.nameB;
            } else {
                winner = st.scoreA > st.scoreB ? st.nameA : st.nameB;
            }

            document.getElementById('fmMatchBody').innerHTML = `
                <div class="fm-result">
                    <h2>경기 종료</h2>
                    <div style="color:#aaa;margin-bottom:6px;">${st.nameA} vs ${st.nameB}</div>
                    <div class="fm-result-score">${st.scoreA} - ${st.scoreB}</div>
                    ${pkHtml}
                    <div style="font-size:1.1em;margin:8px 0;color:#ffd93d;">🏆 ${winner} 승리!</div>
                    ${mvp ? `<div class="fm-result-mvp">⭐ MVP: <strong>${escapeHtml(mvp.name)}</strong> (${escapeHtml(mvp.team)})<br><span style="font-size:0.85em;color:#aaa;">골 ${mvp.goals || 0} / 도움 ${mvp.assists || 0} / 선방 ${mvp.saves || 0}</span></div>` : ''}
                    <div class="fm-result-stats">
                        <div class="fm-stat-left">${possAP}%</div><div class="fm-stat-label">점유율</div><div class="fm-stat-right">${possBP}%</div>
                        <div class="fm-stat-left">${st.stats.shotsA}</div><div class="fm-stat-label">슈팅</div><div class="fm-stat-right">${st.stats.shotsB}</div>
                        <div class="fm-stat-left">${st.stats.cornersA}</div><div class="fm-stat-label">코너킥</div><div class="fm-stat-right">${st.stats.cornersB}</div>
                        <div class="fm-stat-left">${st.stats.foulsA}</div><div class="fm-stat-label">파울</div><div class="fm-stat-right">${st.stats.foulsB}</div>
                        <div class="fm-stat-left">${st.stats.yellowsA}</div><div class="fm-stat-label">경고</div><div class="fm-stat-right">${st.stats.yellowsB}</div>
                        <div class="fm-stat-left">${st.stats.redsA}</div><div class="fm-stat-label">퇴장</div><div class="fm-stat-right">${st.stats.redsB}</div>
                    </div>
                    ${goalsHtml ? `<div class="fm-result-goals"><strong>골 기록</strong>${goalsHtml}</div>` : '<div style="color:#888;margin:10px 0;">득점 없음</div>'}
                </div>
            `;

            document.getElementById('fmControls').innerHTML = `
                <button class="btn btn-primary" onclick="replayFm()">다시하기</button>
                <button class="btn btn-secondary" onclick="closeFmMatchModal()">닫기</button>
            `;

            saveFmResult(st, winner);
        }

        function saveFmResult(st, winner) {
            try {
                const history = JSON.parse(localStorage.getItem('fmHistory') || '[]');
                history.unshift({
                    date: new Date().toISOString(),
                    teamA: st.nameA, teamB: st.nameB,
                    scoreA: st.scoreA, scoreB: st.scoreB,
                    pk: st.pk ? { scorePA: st.pk.scorePA, scorePB: st.pk.scorePB } : null,
                    winner
                });
                if (history.length > 50) history.length = 50;
                localStorage.setItem('fmHistory', JSON.stringify(history));
            } catch (e) { /* ignore storage errors */ }
        }

        function replayFm() {
            closeFmMatchModal();
            openFutsalFMSetup();
        }

        // === 렌더링 ===

        function renderFmInitial() {
            const st = fmState;
            document.getElementById('fmTeamAName').textContent = st.nameA;
            document.getElementById('fmTeamBName').textContent = st.nameB;
            document.getElementById('fmTeamAAvg').textContent = `평균 ${st.strA.toFixed(1)}`;
            document.getElementById('fmTeamBAvg').textContent = `평균 ${st.strB.toFixed(1)}`;
            document.getElementById('fmScoreDisplay').textContent = '0 - 0';
            document.getElementById('fmTimeDisplay').textContent = '전반전 0:00';
            document.getElementById('fmCommentary').innerHTML = '<div class="fm-commentary-title">경기 중계</div>';
            renderFmRosters();
        }

        function renderFmRosters() {
            const st = fmState;
            const container = document.getElementById('fmRosters');
            function renderCol(team, name) {
                const starters = team.filter(p => !p.isSub);
                const subs = team.filter(p => p.isSub);
                let html = `<div class="fm-roster-col"><h4>${name}</h4>`;
                starters.forEach(p => {
                    let cls = 'fm-roster-player';
                    if (p.goals > 0) cls += ' has-goal';
                    if (p.redCard) cls += ' has-card-red';
                    else if (p.yellowCards > 0) cls += ' has-card-yellow';
                    const tierCls = 'tier-' + p.tier.replace('+', 'plus').replace('-', 'minus');
                    const posCls = 'fm-pos-' + (p.position || 'MF');
                    let icons = '';
                    for (let i = 0; i < p.goals; i++) icons += '⚽';
                    for (let i = 0; i < p.assists; i++) icons += '🅰️';
                    for (let i = 0; i < p.yellowCards; i++) icons += '🟨';
                    if (p.redCard) icons += '🟥';
                    for (let i = 0; i < p.saves; i++) icons += '🧤';
                    html += `<div class="${cls}">
                        <span><span class="fm-pos-badge ${posCls}">${p.position || 'MF'}</span>${escapeHtml(p.name)} <span class="tier-badge ${tierCls}" style="font-size:0.7em;">${tierLabel(p.tier)}</span></span>
                        <span class="fm-roster-icons">${icons}</span>
                    </div>`;
                });
                if (subs.length > 0) {
                    html += '<div style="font-size:0.68em;color:#666;margin-top:3px;padding-left:4px;">교체</div>';
                    subs.forEach(p => {
                        const tierCls = 'tier-' + p.tier.replace('+', 'plus').replace('-', 'minus');
                        let icons = '';
                        if (p.redCard) icons += '🟥';
                        html += `<div class="fm-roster-player is-sub">
                            <span><span class="fm-sub-badge">SUB</span>${escapeHtml(p.name)} <span class="tier-badge ${tierCls}" style="font-size:0.7em;">${tierLabel(p.tier)}</span></span>
                            <span class="fm-roster-icons">${icons}</span>
                        </div>`;
                    });
                }
                html += '</div>';
                return html;
            }
            container.innerHTML = renderCol(st.teamA, st.nameA) + renderCol(st.teamB, st.nameB);
        }

        function renderFmTick() {
            const st = fmState;
            document.getElementById('fmScoreDisplay').textContent = `${st.scoreA} - ${st.scoreB}`;
            const minute = st.half === 1 ? st.tick : FM_HALF_TICKS + st.tick;
            const halfLabel = st.half === 1 ? '전반전' : '후반전';
            document.getElementById('fmTimeDisplay').textContent = `${halfLabel} ${minute}:00`;
            renderFmRosters();
            const commEl = document.getElementById('fmCommentary');
            let html = '<div class="fm-commentary-title">경기 중계</div>';
            st.events.forEach(evt => {
                let cls = 'fm-event';
                switch (evt.type) {
                    case 'goal': cls += ' fm-event-goal'; break;
                    case 'save': cls += ' fm-event-save'; break;
                    case 'yellowCard': cls += ' fm-event-card'; break;
                    case 'redCard': cls += ' fm-event-card-red'; break;
                    case 'foul': cls += ' fm-event-foul'; break;
                    case 'chance': cls += ' fm-event-chance'; break;
                    case 'possession': cls += ' fm-event-possession'; break;
                    case 'halfTime': case 'fullTime': case 'kickOff': case 'secondHalf': cls += ' fm-event-half'; break;
                    case 'corner': cls += ' fm-event-corner'; break;
                    case 'substitution': cls += ' fm-event-sub'; break;
                }
                const minuteStr = typeof evt.minute === 'number' ? `${evt.minute}'` : evt.minute;

            });

        // === 제어 ===

        const FM_SPEED_LABELS = { slow: '느림', normal: '보통', fast: '빠름' };

        function setFmSpeed(speed) {
            fmSpeed = FM_SPEEDS[speed] || FM_SPEEDS.normal;
            const targetLabel = FM_SPEED_LABELS[speed];
            const controls = document.getElementById('fmControls');
            if (controls) {
                controls.querySelectorAll('.fm-btn-speed').forEach(btn => {
                    btn.classList.toggle('active', btn.textContent === targetLabel);
                });
            }
            if (fmInterval && !fmPaused) {
                clearInterval(fmInterval);
                fmInterval = setInterval(simulateTick, fmSpeed);
            }
        }

        function toggleFmPause() {
            fmPaused = !fmPaused;
            const fmPauseBtn = document.getElementById('fmPauseBtn');
            if (fmPauseBtn) fmPauseBtn.textContent = fmPaused ? '계속' : '일시정지';
            if (fmPaused && fmTimeout) {
                clearTimeout(fmTimeout);
                fmTimeout = null;
                if (!fmState) return;
                fmState._pausedDuringHalf = true;
                fmState._pauseContext = fmState.finished ? 'fulltime' : 'halftime';
            } else if (!fmPaused && fmState && fmState._pausedDuringHalf) {
                fmState._pausedDuringHalf = false;
                const ctx = fmState._pauseContext;
                delete fmState._pauseContext;
                if (ctx === 'fulltime' && fmState.scoreA === fmState.scoreB) {
                    // 풀타임→PK 전환 재개
                    fmTimeout = setTimeout(() => {
                        if (!fmState) return;
                        simulatePKs();
                    }, fmSpeed * 2);
                } else if (ctx === 'fulltime' && fmState.scoreA !== fmState.scoreB) {
                    // 풀타임 비-동점: 경기 종료 컨트롤 표시
                    showFmEndControls();
                } else if (ctx === 'halftime' && fmState.half === 1 && fmState.tick > FM_HALF_TICKS) {
                    fmState.half = 2;
                    fmState.tick = 0;
                    addFmEvent({ type: 'secondHalf', minute: FM_HALF_TICKS, text: FM_COMMENTARY.secondHalf[0] });
                    renderFmTick();
                    fmInterval = setInterval(simulateTick, fmSpeed);
                }
            }
        }

        function skipToEnd() {
            if (!fmState || fmState.finished) return;
            clearInterval(fmInterval);
            fmInterval = null;
            if (fmTimeout) { clearTimeout(fmTimeout); fmTimeout = null; }
            while (!fmState.finished) {
                fmState.tick++;

                if (fmState.tick > FM_HALF_TICKS) {
                    if (fmState.half === 1) {
                        addFmEvent({ type: 'halfTime', minute: FM_HALF_TICKS, text: FM_COMMENTARY.halfTime[0] });
                        performAutoSubstitution('A', FM_HALF_TICKS);
                        performAutoSubstitution('B', FM_HALF_TICKS);
                        fmState.half = 2;
                        fmState.tick = 0;
                        addFmEvent({ type: 'secondHalf', minute: FM_HALF_TICKS, text: FM_COMMENTARY.secondHalf[0] });
                        continue;
                    } else {
                        addFmEvent({ type: 'fullTime', minute: FM_HALF_TICKS * 2, text: FM_COMMENTARY.fullTime[0] });
                        fmState.finished = true;
                        break;
                    }
                }
                const minute = fmState.half === 1 ? fmState.tick : FM_HALF_TICKS + fmState.tick;
                const evt = generateMatchEvent(minute);
                addFmEvent(evt);
                applyEvent(evt);
            }
            renderFmTick();
            if (fmState.scoreA === fmState.scoreB) {
                simulatePKs();
            } else {
                showFmEndControls();
            }
        }

        const SoundManager = {

                if (this._initialized) return;
