                return 'data:image/svg+xml,' + encodeURIComponent(svg);
            },

            svgHeart(size, filled) {
                const s = size || 18;
                const opacity = filled ? '1' : '0.35';
                const hgId = 'hrt' + Math.random().toString(36).substr(2, 6);
                let fillAttr;
                if (filled) {
                    fillAttr = `url(#${hgId})`;
                } else {
                    fillAttr = '#555';
                }
                const gradDef = filled ? `<defs><radialGradient id="${hgId}" cx="0.35" cy="0.3" r="0.65">
                    <stop offset="0%" stop-color="#ff7675"/><stop offset="50%" stop-color="#e74c3c"/><stop offset="100%" stop-color="#b71c1c"/>
                    </radialGradient></defs>` : '';
                const highlight = filled ? `<ellipse cx="35" cy="25" rx="10" ry="7" fill="rgba(255,255,255,0.3)"/>` : '';
                const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="${s}" height="${s}" opacity="${opacity}">
                    ${gradDef}
                    <path d="M50 88 C25 65 5 50 5 30 C5 12 18 2 32 2 C40 2 47 6 50 12 C53 6 60 2 68 2 C82 2 95 12 95 30 C95 50 75 65 50 88Z" fill="${fillAttr}" stroke="${filled?'#c0392b':'#444'}" stroke-width="2"/>
                    ${highlight}
                </svg>`;
                return 'data:image/svg+xml,' + encodeURIComponent(svg);
            },

            svgClock(size) {
                const s = size || 16;
                const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="${s}" height="${s}">
                    <circle cx="50" cy="50" r="45" fill="none" stroke="rgba(255,255,255,0.7)" stroke-width="6"/>
                    <line x1="50" y1="50" x2="50" y2="22" stroke="white" stroke-width="5" stroke-linecap="round"/>
                    <line x1="50" y1="50" x2="68" y2="50" stroke="white" stroke-width="4" stroke-linecap="round"/>
                    <circle cx="50" cy="50" r="4" fill="white"/>
                </svg>`;
                return 'data:image/svg+xml,' + encodeURIComponent(svg);
            },

            // ====== Canvas tile sprites for puzzle game ======
            _rrect(ctx, x, y, w, h, rad) {
                ctx.beginPath();
                ctx.moveTo(x + rad, y);
                ctx.arcTo(x + w, y, x + w, y + h, rad);
                ctx.arcTo(x + w, y + h, x, y + h, rad);
                ctx.arcTo(x, y + h, x, y, rad);
                ctx.arcTo(x, y, x + w, y, rad);
                ctx.closePath();
            },
            drawTileBase(ctx, x, y, sz, c1, c2) {
                const p = 2, s = sz - p * 2;
                // Enhanced shadow (multi-layer)
                ctx.fillStyle = 'rgba(0,0,0,0.15)';
                this._rrect(ctx, x + p + 3, y + p + 3, s, s, 7); ctx.fill();
                ctx.fillStyle = 'rgba(0,0,0,0.25)';
                this._rrect(ctx, x + p + 1.5, y + p + 1.5, s, s, 7); ctx.fill();
                // Main tile body with richer gradient
                const g = ctx.createLinearGradient(x + p, y + p, x + p + s * 0.3, y + p + s);
                g.addColorStop(0, c1); g.addColorStop(0.5, c2); g.addColorStop(1, c2);
                ctx.fillStyle = g;
                this._rrect(ctx, x + p, y + p, s, s, 7); ctx.fill();
                // Inner bevel (top highlight)
                const bevel = ctx.createLinearGradient(x + p, y + p, x + p, y + p + s * 0.5);
                bevel.addColorStop(0, 'rgba(255,255,255,0.25)');
                bevel.addColorStop(1, 'rgba(255,255,255,0)');
                ctx.fillStyle = bevel;
                this._rrect(ctx, x + p + 1, y + p + 1, s - 2, s * 0.45, 6); ctx.fill();
                // Border
                ctx.strokeStyle = 'rgba(255,255,255,0.18)'; ctx.lineWidth = 1;
                this._rrect(ctx, x + p, y + p, s, s, 7); ctx.stroke();
                // Bottom edge shadow
                ctx.strokeStyle = 'rgba(0,0,0,0.15)'; ctx.lineWidth = 1;
                ctx.beginPath();
                ctx.moveTo(x + p + 7, y + p + s);
                ctx.lineTo(x + p + s - 7, y + p + s);
                ctx.stroke();
                // Main specular highlight
                ctx.beginPath();
                ctx.arc(x + p + s * 0.25, y + p + s * 0.2, s * 0.08, 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(255,255,255,0.4)'; ctx.fill();
                // Secondary highlight
                ctx.beginPath();
                ctx.arc(x + p + s * 0.32, y + p + s * 0.28, s * 0.04, 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(255,255,255,0.25)'; ctx.fill();
            },
            drawTileBall(ctx, x, y, sz) {
                this.drawTileBase(ctx, x, y, sz, '#f5f5f5', '#ccc');
                const cx = x + sz / 2, cy = y + sz / 2, r = sz * 0.27;
                const g = ctx.createRadialGradient(cx - r * 0.3, cy - r * 0.3, r * 0.1, cx, cy, r);
                g.addColorStop(0, '#fff'); g.addColorStop(1, '#b0b0b0');
                ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2);
                ctx.fillStyle = g; ctx.fill();
                ctx.strokeStyle = '#666'; ctx.lineWidth = 0.7; ctx.stroke();
                ctx.fillStyle = '#333'; ctx.beginPath();
                for (let i = 0; i < 5; i++) {
                    const a = -Math.PI / 2 + i * Math.PI * 2 / 5;
                    const px = cx + Math.cos(a) * r * 0.35, py = cy + Math.sin(a) * r * 0.35;
                    i === 0 ? ctx.moveTo(px, py) : ctx.lineTo(px, py);
                }
                ctx.closePath(); ctx.fill();
            },
            drawTileJersey(ctx, x, y, sz) {
                this.drawTileBase(ctx, x, y, sz, '#2196F3', '#0d47a1');
                const cx = x + sz / 2, cy = y + sz / 2, s = sz * 0.28;
                ctx.fillStyle = '#1565C0';
                ctx.beginPath();
                ctx.moveTo(cx - s, cy - s * 0.9); ctx.lineTo(cx - s * 1.4, cy - s * 0.3);
                ctx.lineTo(cx - s * 0.85, cy); ctx.lineTo(cx - s * 0.85, cy + s);
                ctx.lineTo(cx + s * 0.85, cy + s); ctx.lineTo(cx + s * 0.85, cy);
                ctx.lineTo(cx + s * 1.4, cy - s * 0.3); ctx.lineTo(cx + s, cy - s * 0.9);
                ctx.closePath(); ctx.fill();
                ctx.strokeStyle = 'rgba(255,255,255,0.25)'; ctx.lineWidth = 0.8;
                ctx.beginPath();
                ctx.moveTo(cx - s * 0.25, cy - s * 0.9); ctx.lineTo(cx - s * 0.25, cy + s);
                ctx.moveTo(cx + s * 0.25, cy - s * 0.9); ctx.lineTo(cx + s * 0.25, cy + s);
                ctx.stroke();
                ctx.fillStyle = '#fff'; ctx.font = `bold ${Math.floor(sz * 0.2)}px sans-serif`;
                ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                ctx.fillText('10', cx, cy + s * 0.2);
            },
            drawTileBoot(ctx, x, y, sz) {
                this.drawTileBase(ctx, x, y, sz, '#555', '#222');
                const cx = x + sz / 2, cy = y + sz / 2, s = sz * 0.26;
                ctx.fillStyle = '#333';
                ctx.beginPath();
                ctx.moveTo(cx - s * 0.6, cy - s * 0.8); ctx.lineTo(cx - s * 0.3, cy - s);
                ctx.lineTo(cx + s * 0.3, cy - s * 0.6); ctx.lineTo(cx + s, cy - s * 0.3);
                ctx.lineTo(cx + s * 1.2, cy + s * 0.2); ctx.lineTo(cx + s * 0.8, cy + s * 0.5);
                ctx.lineTo(cx - s * 0.8, cy + s * 0.5); ctx.lineTo(cx - s, cy + s * 0.2);
                ctx.lineTo(cx - s * 0.8, cy - s * 0.4);
                ctx.closePath(); ctx.fill();
                ctx.fillStyle = '#f5d0a9';
                ctx.beginPath(); ctx.ellipse(cx - s * 0.45, cy - s * 0.6, s * 0.25, s * 0.35, -0.3, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = '#666';
                for (let i = 0; i < 3; i++) {
                    ctx.beginPath();
                    ctx.arc(cx - s * 0.3 + i * s * 0.5, cy + s * 0.65, s * 0.12, 0, Math.PI * 2);
                    ctx.fill();
                }
            },
            drawTileTrophy(ctx, x, y, sz) {
                this.drawTileBase(ctx, x, y, sz, '#FDD835', '#F57F17');
                const cx = x + sz / 2, cy = y + sz / 2, s = sz * 0.24;
                const g = ctx.createRadialGradient(cx - s * 0.2, cy - s * 0.3, s * 0.1, cx, cy, s * 1.5);
                g.addColorStop(0, '#FFE082'); g.addColorStop(1, '#F9A825');
                ctx.fillStyle = g;
                ctx.beginPath();
                ctx.moveTo(cx - s * 0.9, cy - s * 0.8); ctx.lineTo(cx + s * 0.9, cy - s * 0.8);
                ctx.lineTo(cx + s * 0.6, cy + s * 0.2); ctx.lineTo(cx + s * 0.3, cy + s * 0.3);
                ctx.lineTo(cx + s * 0.3, cy + s * 0.5); ctx.lineTo(cx + s * 0.5, cy + s * 0.7);
                ctx.lineTo(cx - s * 0.5, cy + s * 0.7); ctx.lineTo(cx - s * 0.3, cy + s * 0.5);
                ctx.lineTo(cx - s * 0.3, cy + s * 0.3); ctx.lineTo(cx - s * 0.6, cy + s * 0.2);
                ctx.closePath(); ctx.fill();
                ctx.strokeStyle = '#E65100'; ctx.lineWidth = 0.6; ctx.stroke();
                ctx.save();
                ctx.globalAlpha = ctx.globalAlpha * 0.5;
                ctx.fillStyle = '#fff';
                ctx.beginPath(); ctx.arc(cx - s * 0.15, cy - s * 0.3, s * 0.15, 0, Math.PI * 2); ctx.fill();
                ctx.restore();
                ctx.fillStyle = '#FFD600'; ctx.font = `bold ${Math.floor(sz * 0.16)}px sans-serif`;
                ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                ctx.fillText('★', cx, cy - s * 0.1);
            },
            drawTileGoal(ctx, x, y, sz) {
                this.drawTileBase(ctx, x, y, sz, '#e0e0e0', '#999');
                const cx = x + sz / 2, cy = y + sz / 2, s = sz * 0.28;
                ctx.strokeStyle = '#fff'; ctx.lineWidth = 2;
                ctx.strokeRect(cx - s, cy - s * 0.7, s * 2, s * 1.4);
                ctx.strokeStyle = 'rgba(150,150,150,0.5)'; ctx.lineWidth = 0.5;
                const step = s * 0.45;
                for (let gx = cx - s + step; gx < cx + s; gx += step) {
                    ctx.beginPath(); ctx.moveTo(gx, cy - s * 0.7); ctx.lineTo(gx, cy + s * 0.7); ctx.stroke();
                }
                for (let gy = cy - s * 0.7 + step; gy < cy + s * 0.7; gy += step) {
                    ctx.beginPath(); ctx.moveTo(cx - s, gy); ctx.lineTo(cx + s, gy); ctx.stroke();
                }
            },
            drawTileCard(ctx, x, y, sz) {
                this.drawTileBase(ctx, x, y, sz, '#ef5350', '#b71c1c');
                const cx = x + sz / 2, cy = y + sz / 2, w = sz * 0.3, h = sz * 0.38;
                ctx.fillStyle = 'rgba(0,0,0,0.2)';
                this._rrect(ctx, cx - w + 2, cy - h + 2, w * 2, h * 2, 3); ctx.fill();
                const g = ctx.createLinearGradient(cx - w, cy - h, cx + w, cy + h);
                g.addColorStop(0, '#ff1744'); g.addColorStop(1, '#d50000');
                ctx.fillStyle = g;
                this._rrect(ctx, cx - w, cy - h, w * 2, h * 2, 3); ctx.fill();
                ctx.strokeStyle = 'rgba(255,255,255,0.3)'; ctx.lineWidth = 0.5; ctx.stroke();
                ctx.fillStyle = 'rgba(255,255,255,0.2)';
                this._rrect(ctx, cx - w + 3, cy - h + 3, w * 2 - 6, h - 3, 2); ctx.fill();
            },
            drawTileGrass(ctx, x, y, sz) {
                const p = 2, s = sz - p * 2;
                ctx.fillStyle = 'rgba(0,0,0,0.2)';
                this._rrect(ctx, x + p + 2, y + p + 2, s, s, 6); ctx.fill();
                const g = ctx.createLinearGradient(x + p, y + p, x + p, y + p + s);
                g.addColorStop(0, '#66BB6A'); g.addColorStop(1, '#2E7D32');
                ctx.fillStyle = g;
                this._rrect(ctx, x + p, y + p, s, s, 6); ctx.fill();
                ctx.strokeStyle = 'rgba(0,0,0,0.15)'; ctx.lineWidth = 1; ctx.stroke();
                ctx.strokeStyle = '#1B5E20'; ctx.lineWidth = 1.2; ctx.lineCap = 'round';
                const bx = x + sz / 2, by = y + sz * 0.75;
                for (let i = -2; i <= 2; i++) {
                    ctx.beginPath();
                    ctx.moveTo(bx + i * sz * 0.09, by);
                    ctx.quadraticCurveTo(bx + i * sz * 0.12, by - sz * 0.28, bx + i * sz * 0.06 + (i * 1.5), by - sz * 0.38);
                    ctx.stroke();
                }
            },
            drawTileMud(ctx, x, y, sz, stage) {
                const p = 2, s = sz - p * 2;
                ctx.fillStyle = 'rgba(0,0,0,0.2)';
                this._rrect(ctx, x + p + 2, y + p + 2, s, s, 6); ctx.fill();
                const g = ctx.createLinearGradient(x + p, y + p, x + p, y + p + s);
                g.addColorStop(0, stage >= 2 ? '#8D6E63' : '#6D4C41');
                g.addColorStop(1, stage >= 2 ? '#5D4037' : '#3E2723');
                ctx.fillStyle = g;
                this._rrect(ctx, x + p, y + p, s, s, 6); ctx.fill();
                ctx.strokeStyle = 'rgba(0,0,0,0.2)'; ctx.lineWidth = 1; ctx.stroke();
                ctx.strokeStyle = 'rgba(0,0,0,0.3)'; ctx.lineWidth = 0.8;
                const cx = x + sz / 2, cy = y + sz / 2;
                ctx.beginPath();
                ctx.moveTo(cx - s * 0.25, cy - s * 0.15); ctx.lineTo(cx + s * 0.1, cy + s * 0.1);
                ctx.moveTo(cx + s * 0.05, cy - s * 0.2); ctx.lineTo(cx + s * 0.25, cy + s * 0.15);
                if (stage >= 2) {
                    ctx.moveTo(cx - s * 0.1, cy + s * 0.1); ctx.lineTo(cx + s * 0.2, cy + s * 0.25);
                }
                ctx.stroke();
                ctx.fillStyle = '#fff'; ctx.font = `bold ${Math.floor(sz * 0.22)}px sans-serif`;
                ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                ctx.fillText(stage >= 2 ? '2' : '1', cx, cy);
            },
            drawSpecialOverlay(ctx, x, y, sz, type, frame) {
                const cx = x + sz / 2, cy = y + sz / 2;
                const pulse = 0.5 + 0.5 * Math.sin(frame * 0.1);
                const fastPulse = 0.5 + 0.5 * Math.sin(frame * 0.18);
                ctx.save();
                // Outer glow ring
                ctx.globalAlpha = 0.15 + pulse * 0.15;
                const glowColor = type === 'lineH' ? '#00E5FF' : type === 'lineV' ? '#FF9100' : type === 'bomb' ? '#FF1744' : '#AA00FF';
                const glow = ctx.createRadialGradient(cx, cy, sz * 0.15, cx, cy, sz * 0.5);
                glow.addColorStop(0, glowColor);
                glow.addColorStop(1, 'transparent');
                ctx.fillStyle = glow;
                ctx.fillRect(x, y, sz, sz);
                ctx.globalAlpha = 0.5 + pulse * 0.35;
                if (type === 'lineH') {
                    ctx.strokeStyle = '#00E5FF'; ctx.lineWidth = 2.5;
                    ctx.shadowColor = '#00E5FF'; ctx.shadowBlur = 6;
                    ctx.beginPath(); ctx.moveTo(x + 4, cy); ctx.lineTo(x + sz - 4, cy); ctx.stroke();
                    ctx.fillStyle = '#00E5FF'; ctx.font = `bold ${Math.floor(sz * 0.24)}px sans-serif`;
                    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                    ctx.fillText('↔', cx, cy);
                    // Arrow tips
                    ctx.beginPath(); ctx.moveTo(x + 3, cy); ctx.lineTo(x + 8, cy - 4); ctx.lineTo(x + 8, cy + 4); ctx.fill();
                    ctx.beginPath(); ctx.moveTo(x + sz - 3, cy); ctx.lineTo(x + sz - 8, cy - 4); ctx.lineTo(x + sz - 8, cy + 4); ctx.fill();
                } else if (type === 'lineV') {
                    ctx.strokeStyle = '#FF9100'; ctx.lineWidth = 2.5;
                    ctx.shadowColor = '#FF9100'; ctx.shadowBlur = 6;
                    ctx.beginPath(); ctx.moveTo(cx, y + 4); ctx.lineTo(cx, y + sz - 4); ctx.stroke();
                    ctx.fillStyle = '#FF9100'; ctx.font = `bold ${Math.floor(sz * 0.24)}px sans-serif`;
                    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                    ctx.fillText('↕', cx, cy);
                    ctx.beginPath(); ctx.moveTo(cx, y + 3); ctx.lineTo(cx - 4, y + 8); ctx.lineTo(cx + 4, y + 8); ctx.fill();
                    ctx.beginPath(); ctx.moveTo(cx, y + sz - 3); ctx.lineTo(cx - 4, y + sz - 8); ctx.lineTo(cx + 4, y + sz - 8); ctx.fill();
                } else if (type === 'bomb') {
                    ctx.shadowColor = '#FF1744'; ctx.shadowBlur = 8;
                    ctx.strokeStyle = '#FF1744'; ctx.lineWidth = 2;
                    const r = sz * 0.3 + fastPulse * sz * 0.08;
                    ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.stroke();
                    // Inner pulsing ring
                    ctx.globalAlpha *= 0.5;
                    ctx.beginPath(); ctx.arc(cx, cy, r * 0.6, 0, Math.PI * 2); ctx.stroke();
                    ctx.globalAlpha *= 2;
                    ctx.fillStyle = '#FF1744'; ctx.font = `bold ${Math.floor(sz * 0.28)}px sans-serif`;
                    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                    ctx.fillText('✦', cx, cy);
                } else if (type === 'cross') {
                    ctx.shadowColor = '#AA00FF'; ctx.shadowBlur = 6;
                    ctx.strokeStyle = '#AA00FF'; ctx.lineWidth = 2;
                    ctx.beginPath();
                    ctx.moveTo(x + 4, cy); ctx.lineTo(x + sz - 4, cy);
                    ctx.moveTo(cx, y + 4); ctx.lineTo(cx, y + sz - 4);
                    ctx.stroke();
                    // Rotating indicator
                    ctx.save();
                    ctx.translate(cx, cy);
                    ctx.rotate(frame * 0.03);
                    ctx.fillStyle = '#AA00FF'; ctx.font = `bold ${Math.floor(sz * 0.26)}px sans-serif`;
                    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                    ctx.fillText('✚', 0, 0);
                    ctx.restore();
                }
                ctx.restore();
            },

            // Canvas sprite functions for games 2 & 3
            drawSoccerBall(ctx, x, y, r) {
                ctx.save();
                // Shadow (soft ellipse)
                ctx.beginPath();
                ctx.ellipse(x + 1.5, y + r + 3, r * 0.75, r * 0.2, 0, 0, Math.PI * 2);
                const shGrad = ctx.createRadialGradient(x + 1.5, y + r + 3, 0, x + 1.5, y + r + 3, r * 0.75);
                shGrad.addColorStop(0, 'rgba(0,0,0,0.25)');
                shGrad.addColorStop(1, 'rgba(0,0,0,0)');
                ctx.fillStyle = shGrad;
                ctx.fill();
                // Ball body with 3D gradient
                const grad = ctx.createRadialGradient(x - r * 0.35, y - r * 0.35, r * 0.05, x + r * 0.1, y + r * 0.1, r * 1.1);
                grad.addColorStop(0, '#ffffff');
                grad.addColorStop(0.6, '#e8e8e8');
                grad.addColorStop(0.85, '#c0c0c0');
                grad.addColorStop(1, '#999');
                ctx.beginPath();
                ctx.arc(x, y, r, 0, Math.PI * 2);
                ctx.fillStyle = grad;
                ctx.fill();
                ctx.strokeStyle = 'rgba(80,80,80,0.6)';
                ctx.lineWidth = 0.8;
                ctx.stroke();
                // Pentagon pattern
                const angles = [-Math.PI / 2, -Math.PI / 2 + Math.PI * 2 / 5, -Math.PI / 2 + Math.PI * 4 / 5,
                                -Math.PI / 2 + Math.PI * 6 / 5, -Math.PI / 2 + Math.PI * 8 / 5];
                ctx.fillStyle = '#2a2a2a';
                // Center pentagon
                ctx.beginPath();
                for (let i = 0; i < 5; i++) {
                    const px = x + Math.cos(angles[i]) * r * 0.33;
                    const py = y + Math.sin(angles[i]) * r * 0.33;
                    i === 0 ? ctx.moveTo(px, py) : ctx.lineTo(px, py);
                }
                ctx.closePath();
                ctx.fill();
                // Outer pentagons
                for (let i = 0; i < 5; i++) {
                    const cx2 = x + Math.cos(angles[i]) * r * 0.7;
                    const cy2 = y + Math.sin(angles[i]) * r * 0.7;
                    ctx.beginPath();
                    for (let j = 0; j < 5; j++) {
                        const a = angles[i] + (Math.PI * 2 * j / 5);
                        const px = cx2 + Math.cos(a) * r * 0.18;
                        const py = cy2 + Math.sin(a) * r * 0.18;
                        j === 0 ? ctx.moveTo(px, py) : ctx.lineTo(px, py);
                    }
                    ctx.closePath();
                    ctx.fill();
                }
                // Specular highlight (glossy)
                const hlGrad = ctx.createRadialGradient(x - r * 0.3, y - r * 0.3, 0, x - r * 0.3, y - r * 0.3, r * 0.5);
                hlGrad.addColorStop(0, 'rgba(255,255,255,0.6)');
                hlGrad.addColorStop(0.5, 'rgba(255,255,255,0.15)');
                hlGrad.addColorStop(1, 'rgba(255,255,255,0)');
                ctx.beginPath();
                ctx.arc(x, y, r, 0, Math.PI * 2);
                ctx.fillStyle = hlGrad;
                ctx.fill();
                ctx.restore();
            },

            drawPlayer(ctx, x, y, r, jerseyColor, dir, expression, number) {
                ctx.save();
                const c = jerseyColor || this.colors.jersey1;
                // Shadow
                ctx.beginPath();
                ctx.ellipse(x, y + r * 0.8, r * 0.6, r * 0.2, 0, 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(0,0,0,0.25)';
                ctx.fill();
                // Legs with running animation
                const legPhase = performance.now() / 200;
                const legSwing = Math.sin(legPhase) * r * 0.15;
                // Shorts
                ctx.fillStyle = ChibiSprite._darken(c, 30);
                ctx.beginPath();
                ctx.moveTo(x - r * 0.2, y + r * 0.4);
                ctx.lineTo(x - r * 0.18, y + r * 0.55);
                ctx.lineTo(x - r * 0.02, y + r * 0.55);
                ctx.lineTo(x, y + r * 0.42);
                ctx.lineTo(x + r * 0.02, y + r * 0.55);
                ctx.lineTo(x + r * 0.18, y + r * 0.55);
                ctx.lineTo(x + r * 0.2, y + r * 0.4);
                ctx.closePath();
                ctx.fill();
                // Legs (skin)
                ctx.strokeStyle = '#deb887';
                ctx.lineWidth = r * 0.16;
                ctx.lineCap = 'round';
                ctx.beginPath();
                ctx.moveTo(x - r * 0.15, y + r * 0.5);
                ctx.lineTo(x - r * 0.15 - legSwing, y + r * 0.72);
                ctx.stroke();
                ctx.beginPath();
                ctx.moveTo(x + r * 0.15, y + r * 0.5);
                ctx.lineTo(x + r * 0.15 + legSwing, y + r * 0.72);
                ctx.stroke();
                // White socks
                ctx.strokeStyle = 'white';
                ctx.lineWidth = r * 0.14;
                ctx.beginPath();
                ctx.moveTo(x - r * 0.15 - legSwing, y + r * 0.68);
                ctx.lineTo(x - r * 0.15 - legSwing, y + r * 0.8);
                ctx.stroke();
                ctx.beginPath();
                ctx.moveTo(x + r * 0.15 + legSwing, y + r * 0.68);
                ctx.lineTo(x + r * 0.15 + legSwing, y + r * 0.8);
                ctx.stroke();
                // Boots
                ctx.fillStyle = '#1a1a2e';
                ctx.beginPath();
                ctx.ellipse(x - r * 0.15 - legSwing, y + r * 0.85, r * 0.09, r * 0.04, 0, 0, Math.PI * 2);
                ctx.fill();
                ctx.beginPath();
                ctx.ellipse(x + r * 0.15 + legSwing, y + r * 0.85, r * 0.09, r * 0.04, 0, 0, Math.PI * 2);
                ctx.fill();
                // Body (jersey with 3D radialGradient)
                const jGrad = ctx.createRadialGradient(x - r * 0.15, y - r * 0.1, r * 0.1, x, y + r * 0.1, r * 0.6);
                jGrad.addColorStop(0, ChibiSprite._lighten(c, 20));
                jGrad.addColorStop(0.5, c);
                jGrad.addColorStop(1, ChibiSprite._darken(c, 15));
                ctx.beginPath();
                ctx.ellipse(x, y + r * 0.1, r * 0.55, r * 0.55, 0, 0, Math.PI * 2);
                ctx.fillStyle = jGrad;
                ctx.fill();
                // Jersey stripe
                ctx.beginPath();
                ctx.moveTo(x - r * 0.15, y - r * 0.3);
                ctx.lineTo(x - r * 0.15, y + r * 0.55);
                ctx.moveTo(x + r * 0.15, y - r * 0.3);
                ctx.lineTo(x + r * 0.15, y + r * 0.55);
                ctx.strokeStyle = 'rgba(255,255,255,0.12)';
                ctx.lineWidth = 1;
                ctx.stroke();
                ctx.strokeStyle = 'rgba(0,0,0,0.12)';
                ctx.lineWidth = 1;
                ctx.beginPath();
                ctx.ellipse(x, y + r * 0.1, r * 0.55, r * 0.55, 0, 0, Math.PI * 2);
                ctx.stroke();
                // Arms
                const armSwing = Math.sin(legPhase + Math.PI) * r * 0.08;
                ctx.beginPath();
                ctx.arc(x - r * 0.55, y - r * 0.05 + armSwing, r * 0.16, 0, Math.PI * 2);
                ctx.arc(x + r * 0.55, y - r * 0.05 - armSwing, r * 0.16, 0, Math.PI * 2);
                ctx.fillStyle = c;
                ctx.fill();
                // Hands
                ctx.beginPath();
                ctx.arc(x - r * 0.55, y + r * 0.08 + armSwing, r * 0.08, 0, Math.PI * 2);
                ctx.arc(x + r * 0.55, y + r * 0.08 - armSwing, r * 0.08, 0, Math.PI * 2);
                ctx.fillStyle = '#f5d0a9';
                ctx.fill();
                // Head
                ctx.beginPath();
                ctx.arc(x, y - r * 0.6, r * 0.35, 0, Math.PI * 2);
                ctx.fillStyle = '#f5d0a9';
                ctx.fill();
                ctx.strokeStyle = 'rgba(0,0,0,0.1)';
                ctx.stroke();
                // Hair
                ctx.beginPath();
                ctx.arc(x, y - r * 0.7, r * 0.3, Math.PI, 0);
                ctx.fillStyle = '#1a1a2a';
                ctx.fill();
                // Face expression
                if (typeof CharacterFace !== 'undefined') {
                    CharacterFace.draw(ctx, x, y, r, expression || 'neutral');
                }
                // Number
                ctx.fillStyle = 'white';
                ctx.font = `bold ${r * 0.4}px sans-serif`;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.strokeStyle = 'rgba(0,0,0,0.2)';
                ctx.lineWidth = 1.5;
                ctx.strokeText(number || '10', x, y + r * 0.15);
                ctx.fillText(number || '10', x, y + r * 0.15);
                ctx.restore();
            },

            drawDefender(ctx, x, y, r) {
                this.drawPlayer(ctx, x, y, r, this.colors.jersey2, 0, 'angry');
                // Override number with different
                ctx.save();
                ctx.fillStyle = 'white';
                ctx.font = `bold ${r * 0.45}px sans-serif`;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                // Redraw number area
                ctx.beginPath();
                ctx.ellipse(x, y + r * 0.1, r * 0.35, r * 0.3, 0, 0, Math.PI * 2);
                ctx.fillStyle = this.colors.jersey2;
                ctx.fill();
                ctx.fillStyle = 'white';
                ctx.fillText('4', x, y + r * 0.15);
                // Shield overlay
                ctx.beginPath();
                ctx.moveTo(x, y - r * 0.85);
                ctx.lineTo(x + r * 0.15, y - r * 0.7);
                ctx.lineTo(x + r * 0.15, y - r * 0.5);
                ctx.quadraticCurveTo(x, y - r * 0.4, x - r * 0.15, y - r * 0.5);
                ctx.lineTo(x - r * 0.15, y - r * 0.7);
                ctx.closePath();
                ctx.fillStyle = 'rgba(255,255,255,0.5)';
                ctx.fill();
                ctx.restore();
            },

            drawCoin(ctx, x, y, r, frame) {
                ctx.save();
                const f = frame || 0;
                const rot = (f * 0.04) % (Math.PI * 2);
                // 3D coin rotation (squish x based on angle)
                const squish = 0.7 + 0.3 * Math.abs(Math.cos(rot));
                // Glow
                const glow = ctx.createRadialGradient(x, y, r * 0.3, x, y, r * 2);
                glow.addColorStop(0, 'rgba(249,168,37,0.35)');
                glow.addColorStop(1, 'rgba(249,168,37,0)');
                ctx.beginPath();
                ctx.arc(x, y, r * 2, 0, Math.PI * 2);
                ctx.fillStyle = glow;
                ctx.fill();
                // Coin body (circle with 3D squish)
                ctx.translate(x, y);
                ctx.scale(squish, 1);
                // Edge (darker coin side visible during rotation)
                ctx.beginPath();
                ctx.arc(0, 2, r, 0, Math.PI * 2);
                ctx.fillStyle = '#c17900';
                ctx.fill();
                // Main coin face
                const coinGrad = ctx.createRadialGradient(-r * 0.25, -r * 0.25, r * 0.1, 0, 0, r);
                coinGrad.addColorStop(0, '#ffe082');
                coinGrad.addColorStop(0.6, '#f9a825');
                coinGrad.addColorStop(1, '#e08600');
                ctx.beginPath();
                ctx.arc(0, 0, r, 0, Math.PI * 2);
                ctx.fillStyle = coinGrad;
                ctx.fill();
                ctx.strokeStyle = '#c17900';
                ctx.lineWidth = 1.5;
                ctx.stroke();
                // Inner ring
                ctx.beginPath();
                ctx.arc(0, 0, r * 0.75, 0, Math.PI * 2);
                ctx.strokeStyle = 'rgba(193,121,0,0.4)';
                ctx.lineWidth = 1;
                ctx.stroke();
                // Soccer ball icon on coin
                if (squish > 0.85) {
                    ctx.fillStyle = 'rgba(193,121,0,0.6)';
                    ctx.beginPath();
                    for (let i = 0; i < 5; i++) {
                        const a = -Math.PI / 2 + (i * Math.PI * 2 / 5);
                        const px = Math.cos(a) * r * 0.3;
                        const py = Math.sin(a) * r * 0.3;
                        i === 0 ? ctx.moveTo(px, py) : ctx.lineTo(px, py);
                    }
                    ctx.closePath();
                    ctx.fill();
                }
                // Glossy highlight (larger, softer)
                const hlCoinGrad = ctx.createRadialGradient(-r * 0.25, -r * 0.3, 0, -r * 0.25, -r * 0.3, r * 0.45);
                hlCoinGrad.addColorStop(0, 'rgba(255,255,255,0.55)');
                hlCoinGrad.addColorStop(0.5, 'rgba(255,255,255,0.15)');
                hlCoinGrad.addColorStop(1, 'rgba(255,255,255,0)');
                ctx.beginPath();
                ctx.arc(0, 0, r, 0, Math.PI * 2);
                ctx.fillStyle = hlCoinGrad;
                ctx.fill();
                ctx.restore();
            },

            drawFieldBg(ctx, w, h, scrollOffset) {
                ctx.save();
                const off = scrollOffset || 0;
                const tc = this.getThemeFieldColors();
                // Base green with subtle gradient
                const baseGrad = ctx.createLinearGradient(0, 0, 0, h);
                baseGrad.addColorStop(0, tc.field);
                baseGrad.addColorStop(0.5, tc.fieldLight || tc.field);
                baseGrad.addColorStop(1, tc.field);
                ctx.fillStyle = baseGrad;
                ctx.fillRect(0, 0, w, h);
                // Alternating stripes with smoother edges
                const stripeH = 38;
                const startY = -(off % (stripeH * 2));
                for (let y = startY; y < h; y += stripeH * 2) {
                    const sGrad = ctx.createLinearGradient(0, y, 0, y + stripeH);
                    const stripeBase = tc.fieldLight || '#35a05e';
                    sGrad.addColorStop(0, stripeBase + '44');
                    sGrad.addColorStop(0.5, stripeBase + '66');
                    sGrad.addColorStop(1, stripeBase + '44');
                    ctx.fillStyle = sGrad;
                    ctx.fillRect(0, y, w, stripeH);
                }
                // Side lines with glow
                ctx.strokeStyle = 'rgba(255,255,255,0.18)';
                ctx.lineWidth = 2;
                ctx.shadowColor = 'rgba(255,255,255,0.1)';
                ctx.shadowBlur = 4;
                ctx.beginPath();
                ctx.moveTo(8, 0); ctx.lineTo(8, h);
                ctx.moveTo(w - 8, 0); ctx.lineTo(w - 8, h);
                ctx.stroke();
                ctx.shadowBlur = 0;
                // Center line
                ctx.strokeStyle = 'rgba(255,255,255,0.22)';
                ctx.lineWidth = 1.5;
                ctx.setLineDash([]);
                ctx.beginPath();
                ctx.moveTo(0, h / 2);
                ctx.lineTo(w, h / 2);
                ctx.stroke();
                // Center circle + dot
                ctx.beginPath();
                ctx.arc(w / 2, h / 2, 32, 0, Math.PI * 2);
                ctx.strokeStyle = 'rgba(255,255,255,0.18)';
                ctx.lineWidth = 1.5;
                ctx.stroke();
                ctx.beginPath();
                ctx.arc(w / 2, h / 2, 3, 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(255,255,255,0.2)';
                ctx.fill();
                // Penalty areas (top and bottom)
                ctx.strokeStyle = 'rgba(255,255,255,0.1)';
                ctx.lineWidth = 1;
                ctx.strokeRect(w * 0.2, 0, w * 0.6, h * 0.12);
                ctx.strokeRect(w * 0.2, h * 0.88, w * 0.6, h * 0.12);
                // Corner arcs
                ctx.beginPath();
                ctx.arc(0, 0, 12, 0, Math.PI / 2);
                ctx.stroke();
                ctx.beginPath();
                ctx.arc(w, 0, 12, Math.PI / 2, Math.PI);
                ctx.stroke();
                ctx.beginPath();
                ctx.arc(w, h, 12, Math.PI, Math.PI * 1.5);
                ctx.stroke();
                ctx.beginPath();
                ctx.arc(0, h, 12, Math.PI * 1.5, Math.PI * 2);
                ctx.stroke();
                // Stadium light spots (top)
                const lightGrad1 = ctx.createRadialGradient(w * 0.25, -20, 0, w * 0.25, -20, h * 0.35);
                lightGrad1.addColorStop(0, 'rgba(255,255,220,0.06)');
                lightGrad1.addColorStop(1, 'rgba(255,255,220,0)');
                ctx.fillStyle = lightGrad1;
                ctx.fillRect(0, 0, w, h);
                const lightGrad2 = ctx.createRadialGradient(w * 0.75, -20, 0, w * 0.75, -20, h * 0.35);
                lightGrad2.addColorStop(0, 'rgba(255,255,220,0.06)');
                lightGrad2.addColorStop(1, 'rgba(255,255,220,0)');
                ctx.fillStyle = lightGrad2;
                ctx.fillRect(0, 0, w, h);
                // Vignette (deeper)
                const vGrad = ctx.createRadialGradient(w / 2, h / 2, Math.min(w, h) * 0.25, w / 2, h / 2, Math.max(w, h) * 0.7);
                vGrad.addColorStop(0, 'rgba(0,0,0,0)');
                vGrad.addColorStop(0.7, 'rgba(0,0,0,0.08)');
                vGrad.addColorStop(1, 'rgba(0,0,0,0.22)');
                ctx.fillStyle = vGrad;
                ctx.fillRect(0, 0, w, h);
                ctx.restore();
            },

            drawParticle(ctx, x, y, size, color, alpha) {
                ctx.save();
                ctx.globalAlpha = alpha;
                const grd = ctx.createRadialGradient(x, y, 0, x, y, size * 1.2);
                grd.addColorStop(0, '#fff');
                grd.addColorStop(0.25, color);
                grd.addColorStop(0.7, color);
                grd.addColorStop(1, 'transparent');
                ctx.beginPath();
                ctx.arc(x, y, size * 1.2, 0, Math.PI * 2);
                ctx.fillStyle = grd;
                ctx.fill();
                ctx.restore();
            },

            drawArrowTrail(ctx, x1, y1, x2, y2) {
                ctx.save();
                ctx.strokeStyle = 'rgba(255,255,255,0.7)';
                ctx.lineWidth = 2.5;
                ctx.setLineDash([6, 4]);
                ctx.beginPath();
                ctx.moveTo(x1, y1);
                ctx.lineTo(x2, y2);
                ctx.stroke();
                ctx.setLineDash([]);
                // Arrowhead
                const angle = Math.atan2(y2 - y1, x2 - x1);
                const headLen = 10;
                ctx.beginPath();
                ctx.moveTo(x2, y2);
                ctx.lineTo(x2 - headLen * Math.cos(angle - Math.PI / 6), y2 - headLen * Math.sin(angle - Math.PI / 6));
                ctx.moveTo(x2, y2);
                ctx.lineTo(x2 - headLen * Math.cos(angle + Math.PI / 6), y2 - headLen * Math.sin(angle + Math.PI / 6));
                ctx.strokeStyle = 'rgba(255,255,255,0.9)';
                ctx.lineWidth = 2.5;
                ctx.stroke();
                ctx.restore();
            },

            // UI Component generators
            healthBar(current, max) {
                let html = '<div class="gs-health-bar">';
                for (let i = 0; i < max; i++) {
                    const filled = i < current;
                    html += `<img class="gs-heart${filled ? '' : ' gs-heart-empty'}" src="${this.svgHeart(20, filled)}" alt="">`;
                }
                html += '</div>';
                return html;
            },

            scorePanel(score) {
                return `<div class="gs-score-panel">
                    <img src="${this.svgStar(16)}" alt="" style="width:16px;height:16px;">
                    <span style="letter-spacing:0.5px;">${typeof score === 'number' ? score.toLocaleString() : score}</span>
                </div>`;
            },

            comboIndicator(combo) {
                if (combo < 2) return '<div class="mg-combo"></div>';
                const isHigh = combo >= 5;
                return `<div class="gs-combo" ${isHigh ? 'style="filter:drop-shadow(0 0 6px rgba(255,215,0,0.5));"' : ''}>
                    <span class="gs-combo-flame"></span>
                    <span style="${isHigh ? 'background:linear-gradient(180deg,#ffd700,#ff8f00);-webkit-background-clip:text;-webkit-text-fill-color:transparent;font-size:1.1em;' : ''}">x${combo}</span>
                </div>`;
            },

            timerBar(current, max) {
                const pct = Math.max(0, Math.min(100, (current / max) * 100));
                let color;
                if (pct > 60) color = '#2ecc71';
                else if (pct > 30) color = '#f39c12';
                else color = '#e74c3c';
                return `<div class="gs-timer">
                    <img class="gs-timer-icon" src="${this.svgClock(16)}" alt="">
                    <div class="gs-timer-bar"><div class="gs-timer-fill" style="width:${pct}%;background:${color};"></div></div>
                    <span class="gs-timer-text">${current.toFixed(1)}s</span>
                </div>`;
            },

            roundBadge(round) {
                return `<div class="gs-round-badge">R${round}</div>`;
            },

            // Confetti helper
            _confettiTimeouts: [],
            _flashTimeouts: [],
            spawnConfetti(container, count) {
                const colors = ['#2ecc71', '#f9a825', '#1a73e8', '#ff6b35', '#e74c3c'];
                for (let i = 0; i < (count || 12); i++) {
                    const piece = document.createElement('div');
                    piece.className = 'gs-confetti-piece';
                    piece.style.left = (30 + Math.random() * 40) + '%';
                    piece.style.top = (40 + Math.random() * 20) + '%';
                    piece.style.background = colors[Math.floor(Math.random() * colors.length)];
                    piece.style.animationDuration = (0.5 + Math.random() * 0.5) + 's';
                    piece.style.animationDelay = (Math.random() * 0.2) + 's';
                    piece.style.transform = `rotate(${Math.random() * 360}deg)`;
                    container.appendChild(piece);
                    this._confettiTimeouts.push(setTimeout(() => piece.remove(), 1200));
                }
            },
            clearConfetti() {
                this._confettiTimeouts.forEach(t => clearTimeout(t));
                this._confettiTimeouts = [];
                document.querySelectorAll('.gs-confetti-piece').forEach(el => el.remove());
            },

            // Goal flash helper
            flashScreen(color) {
                const flash = document.createElement('div');
                flash.className = 'gs-goal-flash';
                if (color) flash.style.background = color;
                document.body.appendChild(flash);
                const tid = setTimeout(() => flash.remove(), 500);
                this._flashTimeouts.push(tid);
            },
            clearFlash() {
                this._flashTimeouts.forEach(t => clearTimeout(t));
                this._flashTimeouts = [];
                document.querySelectorAll('.gs-goal-flash').forEach(el => el.remove());
            },

        const ChibiSprite = {

            // ── Helper: draw capsule (pill) shape between two points ──
            _drawCapsule(ctx, x1, y1, x2, y2, w) {
                const r = w * 0.5;
                const ang = Math.atan2(y2 - y1, x2 - x1);
                ctx.beginPath();
                ctx.arc(x1, y1, r, ang + Math.PI * 0.5, ang + Math.PI * 1.5);
                ctx.arc(x2, y2, r, ang - Math.PI * 0.5, ang + Math.PI * 0.5);
                ctx.closePath();
            },

            // ── Helper: capsule with perpendicular gradient fill ──
            _drawCapsuleGrad(ctx, x1, y1, x2, y2, w, cL, cD) {
                const dx = x2 - x1, dy = y2 - y1;
                const len = Math.sqrt(dx * dx + dy * dy) || 1;
                const r = w * 0.5;
                const nx = -dy / len * r, ny = dx / len * r;
                const mx = (x1 + x2) * 0.5, my = (y1 + y2) * 0.5;
                this._drawCapsule(ctx, x1, y1, x2, y2, w);
                const g = ctx.createLinearGradient(mx + nx, my + ny, mx - nx, my - ny);

                g.addColorStop(1, cD);

            // ── Helper: SVG capsule path string ──
            _svgCapsule(x1, y1, x2, y2, w) {
                const dx = x2 - x1, dy = y2 - y1;
                const len = Math.sqrt(dx * dx + dy * dy) || 1;
                const r = w * 0.5;
                const nx = (-dy / len) * r, ny = (dx / len) * r;
                return `M${(x1+nx).toFixed(1)} ${(y1+ny).toFixed(1)} L${(x2+nx).toFixed(1)} ${(y2+ny).toFixed(1)} A${r.toFixed(1)} ${r.toFixed(1)} 0 0 1 ${(x2-nx).toFixed(1)} ${(y2-ny).toFixed(1)} L${(x1-nx).toFixed(1)} ${(y1-ny).toFixed(1)} A${r.toFixed(1)} ${r.toFixed(1)} 0 0 1 ${(x1+nx).toFixed(1)} ${(y1+ny).toFixed(1)} Z`;

                ctx.arc(x + headR * 0.15, hY - headR * 0.72 + hairFollow, headR * 0.2, Math.PI * 1.2, Math.PI * 1.6);

                const head = `<circle cx="50" cy="18" r="22" fill="url(#${hgId})" stroke="rgba(140,100,60,0.2)" stroke-width="0.8"/>
                    <ellipse cx="44" cy="10" rx="5.5" ry="3.2" fill="rgba(255,255,255,0.35)" opacity="0.7"/>
                    <ellipse cx="40" cy="16" rx="2" ry="1.2" fill="rgba(255,255,255,0.18)" opacity="0.5"/>`;

                // ═══ 머리카락 (풍성한 앞머리) ═══
                const hair = `<path d="M30 10 Q50 -4 70 10 Q72 4 60 -1 Q50 -4 40 -1 Q28 4 30 10Z" fill="#2a2035"/>
                    <path d="M30 16 Q33 4 50 1 Q67 4 70 16" fill="#2a2035" stroke="none"/>

                    <path d="M33 13 Q38 2 50 1 Q62 2 67 13" fill="#352840" stroke="none" opacity="0.6"/>
                    <path d="M36 5 Q44 -1 52 3 Q58 -1 66 5" fill="#2a2035"/>
                    <path d="M34 8 Q40 1 50 0 Q60 1 66 8" fill="none" stroke="rgba(255,255,255,0.18)" stroke-width="1.8" stroke-linecap="round"/>
                    <path d="M38 4 Q46 1 52 5" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="1.2" stroke-linecap="round"/>

            },

            _getCached(key, w, h, drawFn) {
                if (this._cache[key]) return this._cache[key];
                const canvas = document.createElement('canvas');
                canvas.width = w;
                canvas.height = h;
                drawFn(canvas.getContext('2d'));
                if (this._cacheKeys.length >= this._maxCache) {
                    const oldest = this._cacheKeys.shift();
                    delete this._cache[oldest];

                this._cacheKeys.push(key);

            _roundRect(ctx, x, y, w, h, r) {
                ctx.beginPath();
                ctx.moveTo(x + r, y);
                ctx.lineTo(x + w - r, y);
                ctx.quadraticCurveTo(x + w, y, x + w, y + r);
                ctx.lineTo(x + w, y + h - r);
                ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
                ctx.lineTo(x + r, y + h);
                ctx.quadraticCurveTo(x, y + h, x, y + h - r);
                ctx.lineTo(x, y + r);
                ctx.quadraticCurveTo(x, y, x + r, y);
                ctx.closePath();
            },

            _lighten(color, pct) {
                const c = this._parseColor(color);
                return `rgb(${Math.min(255, c.r + pct)},${Math.min(255, c.g + pct)},${Math.min(255, c.b + pct)})`;
            },
            _darken(color, pct) {
                const c = this._parseColor(color);
                return `rgb(${Math.max(0, c.r - pct)},${Math.max(0, c.g - pct)},${Math.max(0, c.b - pct)})`;
            },
            _parseColor(color) {
                if (color.startsWith('rgb')) {
                    const m = color.match(/(\d+)/g);
                    return { r: +m[0], g: +m[1], b: +m[2] };
                }
                let hex = color.replace('#', '');
                if (hex.length === 3) hex = hex[0]+hex[0]+hex[1]+hex[1]+hex[2]+hex[2];
                return { r: parseInt(hex.substr(0,2),16), g: parseInt(hex.substr(2,2),16), b: parseInt(hex.substr(4,2),16) };

        // ====== ChibiFace 모바일게임 스타일 표정 시스템 ======
        const ChibiFace = {
            draw(ctx, x, y, headR, expression) {
                const ex = expression || 'neutral';
                // 눈을 훨씬 크게! (헤드 대비 25%)
                const eyeR = headR * 0.25;
                const eyeSpacing = headR * 0.34;
                const eyeY = y + headR * 0.06;
                ctx.save();

                if (ex === 'happy') {
                    // ^_^ 감긴 행복한 눈
                    ctx.strokeStyle = '#2a2030'; ctx.lineWidth = Math.max(2, headR * 0.06);
                    ctx.beginPath(); ctx.arc(x - eyeSpacing, eyeY, eyeR * 0.8, Math.PI + 0.15, -0.15); ctx.stroke();
                    ctx.beginPath(); ctx.arc(x + eyeSpacing, eyeY, eyeR * 0.8, Math.PI + 0.15, -0.15); ctx.stroke();
                    // 큰 볼터치
                    ctx.fillStyle = 'rgba(255,130,130,0.4)';
                    ctx.beginPath(); ctx.ellipse(x - eyeSpacing * 1.35, eyeY + headR * 0.16, headR * 0.11, headR * 0.065, 0, 0, Math.PI * 2); ctx.fill();
                    ctx.beginPath(); ctx.ellipse(x + eyeSpacing * 1.35, eyeY + headR * 0.16, headR * 0.11, headR * 0.065, 0, 0, Math.PI * 2); ctx.fill();
                    // 귀여운 고양이 입
                    ctx.beginPath();
                    ctx.moveTo(x - headR * 0.12, eyeY + headR * 0.25);
                    ctx.quadraticCurveTo(x - headR * 0.04, eyeY + headR * 0.32, x, eyeY + headR * 0.27);
                    ctx.quadraticCurveTo(x + headR * 0.04, eyeY + headR * 0.32, x + headR * 0.12, eyeY + headR * 0.25);
                    ctx.strokeStyle = '#2a2030'; ctx.lineWidth = Math.max(1.5, headR * 0.04); ctx.stroke();
                } else if (ex === 'sad') {
                    this._drawAnimeEye(ctx, x - eyeSpacing, eyeY, eyeR, '#6a5030', 0.25);
                    this._drawAnimeEye(ctx, x + eyeSpacing, eyeY, eyeR, '#6a5030', -0.25);
                    // 걱정 눈썹
                    ctx.strokeStyle = '#3a3040'; ctx.lineWidth = Math.max(1.8, headR * 0.05);
                    ctx.beginPath(); ctx.moveTo(x - eyeSpacing - eyeR * 0.8, eyeY - eyeR * 1.4); ctx.quadraticCurveTo(x - eyeSpacing, eyeY - eyeR * 1.7, x - eyeSpacing + eyeR * 0.6, eyeY - eyeR * 1.15); ctx.stroke();
                    ctx.beginPath(); ctx.moveTo(x + eyeSpacing + eyeR * 0.8, eyeY - eyeR * 1.4); ctx.quadraticCurveTo(x + eyeSpacing, eyeY - eyeR * 1.7, x + eyeSpacing - eyeR * 0.6, eyeY - eyeR * 1.15); ctx.stroke();
                    // 울상 입
                    ctx.beginPath();
                    ctx.arc(x, eyeY + headR * 0.4, headR * 0.1, Math.PI + 0.4, -0.4);
                    ctx.strokeStyle = '#2a2030'; ctx.lineWidth = Math.max(1.5, headR * 0.04); ctx.stroke();
                    // 눈물 한 방울
                    ctx.fillStyle = 'rgba(100,180,255,0.55)';
                    ctx.beginPath();
                    ctx.moveTo(x - eyeSpacing + eyeR * 0.5, eyeY + eyeR * 0.9);
                    ctx.quadraticCurveTo(x - eyeSpacing + eyeR * 0.65, eyeY + eyeR * 1.4, x - eyeSpacing + eyeR * 0.5, eyeY + eyeR * 1.5);
                    ctx.quadraticCurveTo(x - eyeSpacing + eyeR * 0.35, eyeY + eyeR * 1.4, x - eyeSpacing + eyeR * 0.5, eyeY + eyeR * 0.9);
                    ctx.fill();
                } else if (ex === 'angry') {
                    this._drawAnimeEye(ctx, x - eyeSpacing, eyeY, eyeR * 0.9, '#9B1010');
                    this._drawAnimeEye(ctx, x + eyeSpacing, eyeY, eyeR * 0.9, '#9B1010');
                    // V자 화난 눈썹
                    ctx.strokeStyle = '#2a2030'; ctx.lineWidth = Math.max(2.2, headR * 0.06);
                    ctx.beginPath(); ctx.moveTo(x - eyeSpacing - eyeR, eyeY - eyeR * 1.6); ctx.lineTo(x - eyeSpacing + eyeR * 0.4, eyeY - eyeR * 1.05); ctx.stroke();
                    ctx.beginPath(); ctx.moveTo(x + eyeSpacing + eyeR, eyeY - eyeR * 1.6); ctx.lineTo(x + eyeSpacing - eyeR * 0.4, eyeY - eyeR * 1.05); ctx.stroke();
                    // 화남 마크 (십자)
                    ctx.strokeStyle = '#e74c3c'; ctx.lineWidth = Math.max(1.8, headR * 0.045);
                    const ax = x + headR * 0.48, ay = eyeY - headR * 0.38;
                    const am = headR * 0.07;
                    ctx.beginPath(); ctx.moveTo(ax - am, ay - am); ctx.lineTo(ax + am, ay + am); ctx.moveTo(ax + am, ay - am); ctx.lineTo(ax - am, ay + am); ctx.stroke();
                    // 으으 입
                    ctx.strokeStyle = '#2a2030'; ctx.lineWidth = Math.max(1.5, headR * 0.04);
                    ctx.beginPath();
                    const mw = headR * 0.12;
                    for (let i = 0; i < 4; i++) {
                        const mx = x - mw * 1.5 + i * mw;
                        const my = eyeY + headR * 0.28 + (i % 2 === 0 ? 0 : headR * 0.035);
                        i === 0 ? ctx.moveTo(mx, my) : ctx.lineTo(mx, my);
                    }
                    ctx.stroke();
                } else if (ex === 'surprised') {
                    this._drawAnimeEye(ctx, x - eyeSpacing, eyeY, eyeR * 1.25, '#4a3520');
                    this._drawAnimeEye(ctx, x + eyeSpacing, eyeY, eyeR * 1.25, '#4a3520');
                    // 올라간 눈썹
                    ctx.strokeStyle = '#2a2030'; ctx.lineWidth = Math.max(1.8, headR * 0.045);
                    ctx.beginPath(); ctx.arc(x - eyeSpacing, eyeY - eyeR * 2.0, eyeR, 0.3, Math.PI - 0.3, true); ctx.stroke();
                    ctx.beginPath(); ctx.arc(x + eyeSpacing, eyeY - eyeR * 2.0, eyeR, 0.3, Math.PI - 0.3, true); ctx.stroke();
                    // O 입
                    ctx.beginPath();
                    ctx.ellipse(x, eyeY + headR * 0.3, headR * 0.08, headR * 0.06, 0, 0, Math.PI * 2);
                    ctx.fillStyle = '#3a2030'; ctx.fill();
                } else if (ex === 'determined') {
                    this._drawAnimeEye(ctx, x - eyeSpacing, eyeY, eyeR, '#1a4a8a');
                    this._drawAnimeEye(ctx, x + eyeSpacing, eyeY, eyeR, '#1a4a8a');
                    // 일자 결의 눈썹
                    ctx.strokeStyle = '#2a2030'; ctx.lineWidth = Math.max(2.2, headR * 0.055);
                    ctx.beginPath(); ctx.moveTo(x - eyeSpacing - eyeR * 0.8, eyeY - eyeR * 1.35); ctx.lineTo(x - eyeSpacing + eyeR * 0.8, eyeY - eyeR * 1.35); ctx.stroke();
                    ctx.beginPath(); ctx.moveTo(x + eyeSpacing - eyeR * 0.8, eyeY - eyeR * 1.35); ctx.lineTo(x + eyeSpacing + eyeR * 0.8, eyeY - eyeR * 1.35); ctx.stroke();
                    // 꾹 다문 입
                    ctx.beginPath();
                    ctx.moveTo(x - headR * 0.08, eyeY + headR * 0.27);
                    ctx.lineTo(x + headR * 0.08, eyeY + headR * 0.27);
                    ctx.strokeStyle = '#2a2030'; ctx.lineWidth = Math.max(1.8, headR * 0.045); ctx.stroke();
                } else if (ex === 'panic') {
                    this._drawAnimeEye(ctx, x - eyeSpacing, eyeY, eyeR * 1.3, '#333', 0, 0.35);
                    this._drawAnimeEye(ctx, x + eyeSpacing, eyeY, eyeR * 1.3, '#333', 0, 0.35);
                    // 땀방울
                    ctx.fillStyle = 'rgba(100,180,255,0.6)';
                    ctx.beginPath();
                    ctx.moveTo(x + headR * 0.58, eyeY - headR * 0.22);
                    ctx.quadraticCurveTo(x + headR * 0.64, eyeY - headR * 0.05, x + headR * 0.58, eyeY + headR * 0.02);
                    ctx.quadraticCurveTo(x + headR * 0.52, eyeY - headR * 0.05, x + headR * 0.58, eyeY - headR * 0.22);
                    ctx.fill();
                    // 벌린 입
                    ctx.beginPath();
                    ctx.ellipse(x, eyeY + headR * 0.32, headR * 0.09, headR * 0.065, 0, 0, Math.PI * 2);
                    ctx.fillStyle = '#3a2030'; ctx.fill();
                } else if (ex === 'celebrate') {
                    // ^_^ 감긴 축하 눈 + 별
                    ctx.strokeStyle = '#2a2030'; ctx.lineWidth = Math.max(2, headR * 0.06);
                    ctx.beginPath(); ctx.arc(x - eyeSpacing, eyeY, eyeR * 0.8, Math.PI + 0.15, -0.15); ctx.stroke();
                    ctx.beginPath(); ctx.arc(x + eyeSpacing, eyeY, eyeR * 0.8, Math.PI + 0.15, -0.15); ctx.stroke();
                    // 큰 볼터치
                    ctx.fillStyle = 'rgba(255,120,120,0.42)';
                    ctx.beginPath(); ctx.ellipse(x - eyeSpacing * 1.35, eyeY + headR * 0.16, headR * 0.12, headR * 0.07, 0, 0, Math.PI * 2); ctx.fill();
                    ctx.beginPath(); ctx.ellipse(x + eyeSpacing * 1.35, eyeY + headR * 0.16, headR * 0.12, headR * 0.07, 0, 0, Math.PI * 2); ctx.fill();
                    // W 입
                    ctx.beginPath();
                    ctx.moveTo(x - headR * 0.15, eyeY + headR * 0.22);
                    ctx.quadraticCurveTo(x - headR * 0.06, eyeY + headR * 0.35, x, eyeY + headR * 0.27);
                    ctx.quadraticCurveTo(x + headR * 0.06, eyeY + headR * 0.35, x + headR * 0.15, eyeY + headR * 0.22);
                    ctx.strokeStyle = '#2a2030'; ctx.lineWidth = Math.max(1.5, headR * 0.04); ctx.stroke();
                    // 반짝 별
                    this._drawSparkle(ctx, x + headR * 0.52, eyeY - headR * 0.32, headR * 0.1);
                    this._drawSparkle(ctx, x - headR * 0.55, eyeY - headR * 0.25, headR * 0.06);
                } else {
                    // Neutral - 큰 애니메 눈
                    this._drawAnimeEye(ctx, x - eyeSpacing, eyeY, eyeR, '#4a3520');
                    this._drawAnimeEye(ctx, x + eyeSpacing, eyeY, eyeR, '#4a3520');
                    // 작은 고양이 입
                    ctx.beginPath();
                    ctx.moveTo(x - headR * 0.06, eyeY + headR * 0.27);
                    ctx.quadraticCurveTo(x, eyeY + headR * 0.30, x + headR * 0.06, eyeY + headR * 0.27);
                    ctx.strokeStyle = '#2a2030'; ctx.lineWidth = Math.max(1.3, headR * 0.035); ctx.stroke();
                }
                // 코 (모든 표정 공통 - 은은하게)
                ctx.save();
                ctx.fillStyle = 'rgba(200,150,120,0.18)';
                ctx.beginPath();
                ctx.arc(x, eyeY + headR * 0.16, headR * 0.025, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
                // 볼터치 (아직 없는 표정에 추가)
                if (ex === 'sad' || ex === 'surprised' || ex === 'determined' || ex === 'panic' || ex === 'neutral') {
                    ctx.fillStyle = 'rgba(255,140,140,0.22)';
                    ctx.beginPath(); ctx.ellipse(x - eyeSpacing * 1.35, eyeY + headR * 0.16, headR * 0.09, headR * 0.055, 0, 0, Math.PI * 2); ctx.fill();
                    ctx.beginPath(); ctx.ellipse(x + eyeSpacing * 1.35, eyeY + headR * 0.16, headR * 0.09, headR * 0.055, 0, 0, Math.PI * 2); ctx.fill();
                }
                ctx.restore();
            },

            // 큰 애니메 스타일 눈 - 그라데이션 홍채 + 3중 하이라이트 + 속눈썹
            _drawAnimeEye(ctx, ex, ey, r, irisColor, lookDir, pupilScale) {
                const dir = lookDir || 0;
                const ps = pupilScale || 0.5;
                // 흰자위 (살짝 세로로 길게)
                ctx.fillStyle = '#fff';
                ctx.beginPath();
                ctx.ellipse(ex, ey, r, r * 1.18, 0, 0, Math.PI * 2);
                ctx.fill();
                ctx.strokeStyle = 'rgba(60,40,30,0.35)';
                ctx.lineWidth = Math.max(0.8, r * 0.06);
                ctx.stroke();
                // 홍채 (그라데이션!)
                const ix = ex + dir * r * 0.12;
                const iR = r * 0.68;
                const irisG = ctx.createRadialGradient(ix, ey - iR * 0.15, iR * 0.1, ix, ey + iR * 0.1, iR);
                const ic = irisColor || '#4a3520';
                irisG.addColorStop(0, this._lightenColor(ic, 40));
                irisG.addColorStop(0.35, ic);
                irisG.addColorStop(0.7, this._darkenColor(ic, 20));
                irisG.addColorStop(1, this._darkenColor(ic, 35));
                ctx.fillStyle = irisG;
                ctx.beginPath();
                ctx.arc(ix, ey + r * 0.04, iR, 0, Math.PI * 2);
                ctx.fill();
                // 동공
                ctx.fillStyle = '#0a0a12';
                ctx.beginPath();
                ctx.arc(ix, ey + r * 0.07, iR * ps, 0, Math.PI * 2);
                ctx.fill();
                // 위쪽 속눈썹 라인 (눈 윗부분 두껍게)
                ctx.strokeStyle = '#2a2030';
                ctx.lineWidth = Math.max(1.5, r * 0.12);
                ctx.beginPath();
                ctx.arc(ex, ey, r, Math.PI + 0.3, -0.3);
                ctx.stroke();
                // 하이라이트 1 (큰 - 왼쪽 위)
                ctx.fillStyle = '#fff';
                ctx.beginPath();
                ctx.ellipse(ex - r * 0.24, ey - r * 0.28, r * 0.24, r * 0.2, -0.2, 0, Math.PI * 2);
                ctx.fill();
                // 하이라이트 2 (중간 - 오른쪽 아래)
                ctx.beginPath();
                ctx.arc(ex + r * 0.18, ey + r * 0.22, r * 0.13, 0, Math.PI * 2);
                ctx.fill();
                // 하이라이트 3 (작은 반짝 - 왼쪽)
                ctx.beginPath();
                ctx.arc(ex - r * 0.38, ey + r * 0.05, r * 0.06, 0, Math.PI * 2);
                ctx.fill();
            },

            // 색상 밝게/어둡게 헬퍼 (ChibiFace 내부용)
            _lightenColor(hex, amount) {
                const num = parseInt(hex.replace('#', ''), 16);
                const r = Math.min(255, (num >> 16) + amount);
                const g = Math.min(255, ((num >> 8) & 0xff) + amount);
                const b = Math.min(255, (num & 0xff) + amount);
                return '#' + (r << 16 | g << 8 | b).toString(16).padStart(6, '0');
            },
            _darkenColor(hex, amount) {
                const num = parseInt(hex.replace('#', ''), 16);
                const r = Math.max(0, (num >> 16) - amount);
                const g = Math.max(0, ((num >> 8) & 0xff) - amount);
                const b = Math.max(0, (num & 0xff) - amount);
                return '#' + (r << 16 | g << 8 | b).toString(16).padStart(6, '0');
            },

            _drawSparkle(ctx, x, y, size) {
                ctx.save();
                ctx.fillStyle = '#ffd700';
                ctx.globalAlpha = 0.85;
                ctx.beginPath();
                ctx.moveTo(x, y - size);
                ctx.lineTo(x + size * 0.22, y - size * 0.22);
                ctx.lineTo(x + size, y);
                ctx.lineTo(x + size * 0.22, y + size * 0.22);
                ctx.lineTo(x, y + size);
                ctx.lineTo(x - size * 0.22, y + size * 0.22);
                ctx.lineTo(x - size, y);
                ctx.lineTo(x - size * 0.22, y - size * 0.22);
                ctx.closePath();
                ctx.fill();
                // 중앙에 작은 흰색 점
                ctx.fillStyle = '#fff';
                ctx.beginPath();
                ctx.arc(x, y, size * 0.2, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            },

            // SVG face for DOM-based games (큰 애니메 눈 스타일)
            svgFace(expression) {
                const ex = expression || 'neutral';
                // 공통 큰 눈 SVG 헬퍼
                const bigEye = (cx, cy, rx, ry, ic, lash) => {
                    return `<ellipse cx="${cx}" cy="${cy}" rx="${rx}" ry="${ry}" fill="#fff" stroke="rgba(50,40,30,0.4)" stroke-width="0.7"/>` +
                        `<circle cx="${cx}" cy="${cy + ry * 0.03}" r="${rx * 0.68}" fill="${ic}"/>` +
                        `<circle cx="${cx}" cy="${cy + ry * 0.06}" r="${rx * 0.38}" fill="#0a0a12"/>` +
                        (lash !== false ? `<path d="M${cx - rx * 0.85} ${cy - ry * 0.2} Q${cx} ${cy - ry * 1.1} ${cx + rx * 0.85} ${cy - ry * 0.2}" fill="none" stroke="#2a2030" stroke-width="1.8" stroke-linecap="round"/>` : '') +

                    const e = tw.easeFn(t);
                    for (const k in tw.props) {
                        tw.target[k] = tw.start[k] + (tw.props[k] - tw.start[k]) * e;
                    }
                    if (t >= 1) {
                        if (tw.onComplete) tw.onComplete();

                    }

        // Extend GameSprites colors
        Object.assign(GameSprites.colors, {
            primaryLight: '#4a90d9', primaryDark: '#0d47a1',

        // ====== Enhanced Particle System ======
        const ParticleSystem = {
            _pool: new Array(200).fill(null).map(() => ({ active: false, x: 0, y: 0, vx: 0, vy: 0, life: 0, maxLife: 0, size: 0, color: '', type: 'circle', rotation: 0, rotSpeed: 0, gravity: 0 })),
            _activeCount: 0,

            emit(preset, x, y, count, spread) {
                const presets = {
                    sparkle: { size: [3, 5], speed: [1, 3], life: [20, 35], colors: ['#ffd700', '#fff', '#ffe082'], type: 'star4', gravity: -0.03 },
                    confetti: { size: [3, 6], speed: [1, 4], life: [25, 40], colors: ['#2ecc71', '#f9a825', '#1a73e8', '#ff6b35', '#e74c3c'], type: 'rect', gravity: 0.08 },
                    impact: { size: [2, 4], speed: [3, 6], life: [10, 18], colors: ['#fff', '#ffd700'], type: 'circle', gravity: 0 },
                    dust: { size: [2, 4], speed: [0.3, 1], life: [30, 50], colors: ['rgba(255,255,255,0.5)', 'rgba(200,200,200,0.4)'], type: 'circle', gravity: -0.02 },
                    fire: { size: [3, 6], speed: [0.5, 2], life: [15, 25], colors: ['#ff6b35', '#e74c3c', '#f9a825'], type: 'circle', gravity: -0.1 },
                    trail: { size: [2, 3], speed: [0.2, 0.5], life: [8, 15], colors: ['rgba(255,255,255,0.6)'], type: 'circle', gravity: 0 },
                    celebration: { size: [3, 7], speed: [1.5, 4], life: [30, 50], colors: ['#ffd700', '#ff6b6b', '#2ecc71', '#1a73e8', '#ff6b35', '#e91e63', '#9b59b6'], type: 'mixed', gravity: 0.05 },
                    shockwave: { size: [8, 15], speed: [4, 8], life: [8, 12], colors: ['rgba(255,255,255,0.6)', 'rgba(255,215,0,0.4)'], type: 'ring', gravity: 0 },
                    grass: { size: [2, 4], speed: [0.5, 2], life: [15, 25], colors: ['#4CAF50', '#66BB6A', '#2E7D32', '#81C784'], type: 'rect', gravity: 0.12 }
                };
                const cfg = presets[preset] || presets.sparkle;
                const sp = spread || 1;
                const n = count || 8;
                for (let i = 0; i < n; i++) {
                    const p = this._getParticle();
                    if (!p) break;
                    const angle = Math.random() * Math.PI * 2;
                    const spd = cfg.speed[0] + Math.random() * (cfg.speed[1] - cfg.speed[0]);
                    p.x = x + (Math.random() - 0.5) * 10 * sp;
                    p.y = y + (Math.random() - 0.5) * 10 * sp;
                    p.vx = Math.cos(angle) * spd * sp;
                    p.vy = Math.sin(angle) * spd * sp;
                    p.life = cfg.life[0] + Math.random() * (cfg.life[1] - cfg.life[0]);
                    p.maxLife = p.life;
                    p.size = cfg.size[0] + Math.random() * (cfg.size[1] - cfg.size[0]);
                    p.color = cfg.colors[Math.floor(Math.random() * cfg.colors.length)];
                    p.type = cfg.type;
                    p.rotation = Math.random() * Math.PI * 2;
                    p.rotSpeed = (Math.random() - 0.5) * 0.2;
                    p.gravity = cfg.gravity;
                    p.active = true;

            _getParticle() {
                for (let i = 0; i < this._pool.length; i++) {
                    if (!this._pool[i].active) return this._pool[i];
                }
                return null;
            },

            update(dt) {
                this._activeCount = 0;
                for (const p of this._pool) {
                    if (!p.active) continue;
                    p.x += p.vx * dt;
                    p.y += p.vy * dt;
                    p.vy += p.gravity * dt;
                    p.rotation += p.rotSpeed * dt;
                    p.life -= dt;
                    if (p.life <= 0) { p.active = false; continue; }
                    this._activeCount++;
                }
            },

            draw(ctx) {
                for (const p of this._pool) {
                    if (!p.active) continue;
                    const alpha = Math.min(1, p.life / p.maxLife * 2);
                    ctx.save();
                    ctx.globalAlpha = alpha;
                    ctx.translate(p.x, p.y);

                        ctx.fillStyle = p.color;

                        for (let j = 0; j < 4; j++) {
                            const a = (j / 4) * Math.PI * 2 - Math.PI / 2;

                            ctx.lineTo(Math.cos(ia) * p.size * 0.4, Math.sin(ia) * p.size * 0.4);
                        }
                        ctx.closePath();

                            // Star

                            for (let j = 0; j < 5; j++) {
                                const a = (j / 5) * Math.PI * 2 - Math.PI / 2;

                                ctx.lineTo(Math.cos(a) * p.size, Math.sin(a) * p.size);
                                ctx.lineTo(Math.cos(ia) * p.size * 0.4, Math.sin(ia) * p.size * 0.4);
                            }

        // ====== Enhanced Background Renderer ======
        const RichBackground = {

                    const len = 10 + Math.random() * 14;

            draw(ctx, w, h, scrollOffset, theme) {
                const off = scrollOffset || 0;
                const tc = GameSprites.getThemeFieldColors();

                ctx.beginPath();
                ctx.arc(w / 2, h / 2, 3, 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(255,255,255,0.25)';
                ctx.fill();
                ctx.restore();

                // Lane dividers (faint dotted lines)
                ctx.save();
                ctx.strokeStyle = 'rgba(255,255,255,0.06)';
                ctx.setLineDash([4, 8]);
                ctx.lineWidth = 1;
                for (let lane = 1; lane < 3; lane++) {
                    const lx = (w / 3) * lane;
                    ctx.beginPath();
                    ctx.moveTo(lx, 0);
                    ctx.lineTo(lx, h);
                    ctx.stroke();
                }
                ctx.setLineDash([]);
                ctx.restore();

                // Corner flags
                ctx.save();
                // Bottom-left
                ctx.fillStyle = 'rgba(255,255,255,0.5)';
                ctx.strokeStyle = 'rgba(255,255,255,0.5)';
                ctx.lineWidth = 1.5;
                ctx.beginPath(); ctx.moveTo(10, h - 2); ctx.lineTo(10, h - 16); ctx.stroke();
                ctx.fillStyle = '#ff6b6b';
                ctx.beginPath(); ctx.moveTo(10, h - 16); ctx.lineTo(18, h - 13); ctx.lineTo(10, h - 10); ctx.fill();
                // Bottom-right
                ctx.strokeStyle = 'rgba(255,255,255,0.5)';
                ctx.beginPath(); ctx.moveTo(w - 10, h - 2); ctx.lineTo(w - 10, h - 16); ctx.stroke();
                ctx.fillStyle = '#1a73e8';
                ctx.beginPath(); ctx.moveTo(w - 10, h - 16); ctx.lineTo(w - 18, h - 13); ctx.lineTo(w - 10, h - 10); ctx.fill();
                ctx.restore();

                // Layer 3: Floating dust particles
                if (this._dustParticles.length === 0) this._initDust(w, h);
                ctx.save();
                for (const d of this._dustParticles) {
                    const dx = d.x + Math.sin(time * d.speed + d.phase) * 15;
                    const dy = (d.y + time * d.speed * 10) % h;
                    ctx.globalAlpha = 0.15 + Math.sin(time + d.phase) * 0.1;
                    ctx.fillStyle = '#fff';
                    ctx.beginPath();
                    ctx.arc(dx, dy, d.size, 0, Math.PI * 2);
                    ctx.fill();
                }
                ctx.restore();

                // Vignette (enhanced)
                const vGrad = ctx.createRadialGradient(w / 2, h / 2, Math.min(w, h) * 0.25, w / 2, h / 2, Math.max(w, h) * 0.75);
                vGrad.addColorStop(0, 'rgba(0,0,0,0)');
                vGrad.addColorStop(1, 'rgba(0,0,0,0.25)');
                ctx.fillStyle = vGrad;
                ctx.fillRect(0, 0, w, h);
            }
        };

        // Extend SoundManager with new sounds
        (function() {
            const origPlay = SoundManager.play.bind(SoundManager);
            const newSounds = {
                whoosh: (ctx, now, osc, gain) => { osc.type='sawtooth'; osc.frequency.setValueAtTime(400,now); osc.frequency.linearRampToValueAtTime(100,now+0.15); gain.gain.setValueAtTime(0.06,now); gain.gain.exponentialRampToValueAtTime(0.01,now+0.2); osc.start(now); osc.stop(now+0.2); },
                thud: (ctx, now, osc, gain) => { osc.type='sine'; osc.frequency.setValueAtTime(80,now); osc.frequency.linearRampToValueAtTime(40,now+0.15); gain.gain.setValueAtTime(0.12,now); gain.gain.exponentialRampToValueAtTime(0.01,now+0.2); osc.start(now); osc.stop(now+0.2); },
                whistle: (ctx, now, osc, gain) => { osc.type='sine'; osc.frequency.setValueAtTime(2000,now); osc.frequency.linearRampToValueAtTime(1500,now+0.1); osc.frequency.linearRampToValueAtTime(2000,now+0.3); gain.gain.setValueAtTime(0.06,now); gain.gain.exponentialRampToValueAtTime(0.01,now+0.4); osc.start(now); osc.stop(now+0.4); },
                countdown: (ctx, now, osc, gain) => { osc.type='square'; osc.frequency.setValueAtTime(440,now); gain.gain.setValueAtTime(0.08,now); gain.gain.exponentialRampToValueAtTime(0.01,now+0.12); osc.start(now); osc.stop(now+0.12); },
                level_up: (ctx, now, osc, gain) => { osc.type='sine'; osc.frequency.setValueAtTime(523,now); osc.frequency.setValueAtTime(659,now+0.1); osc.frequency.setValueAtTime(784,now+0.2); osc.frequency.setValueAtTime(1047,now+0.3); gain.gain.setValueAtTime(0.12,now); gain.gain.exponentialRampToValueAtTime(0.01,now+0.5); osc.start(now); osc.stop(now+0.5); },
                button_pop: (ctx, now, osc, gain) => { osc.type='sine'; osc.frequency.setValueAtTime(600,now); osc.frequency.setValueAtTime(900,now+0.04); gain.gain.setValueAtTime(0.1,now); gain.gain.exponentialRampToValueAtTime(0.01,now+0.08); osc.start(now); osc.stop(now+0.08); },
                celebration: (ctx, now, osc, gain) => { osc.type='square'; const notes=[523,659,784,1047,784,1047]; notes.forEach((f,i)=>{osc.frequency.setValueAtTime(f,now+i*0.08);}); gain.gain.setValueAtTime(0.1,now); gain.gain.exponentialRampToValueAtTime(0.01,now+0.6); osc.start(now); osc.stop(now+0.6); }
            };
            SoundManager.play = function(type) {
                if (this.muted || !this.ctx) return;
                if (this.ctx.state === 'suspended') this.ctx.resume().catch(()=>{});
                if (newSounds[type]) {
                    try {
                        const now = this.ctx.currentTime;
                        const osc = this.ctx.createOscillator();
                        const gain = this.ctx.createGain();
                        osc.connect(gain); gain.connect(this.ctx.destination);
                        newSounds[type](this.ctx, now, osc, gain);
                    } catch(e) {}
                    return;
                }
                origPlay(type);
            };
        })();

        async function resetMiniGameScores() {
            if (!isAdmin || !db) return;
            const c1 = await showConfirm('미니게임 점수를 전체 초기화하시겠습니까?\n모든 게임의 모든 플레이어 점수가 삭제됩니다.');
            if (!c1) return;
            const c2 = await showConfirm('정말로 전체 초기화하시겠습니까?\n이 작업은 되돌릴 수 없습니다!');
            if (!c2) return;
            try {
                const snap = await db.collection('miniGameScores').get();
                const batchSize = 499;
                let batch = db.batch();
                let count = 0;
                for (const doc of snap.docs) {
                    batch.delete(doc.ref);
                    count++;
                    if (count % batchSize === 0) {
                        await batch.commit();
                        batch = db.batch();
                    }
                }
                if (count % batchSize !== 0) await batch.commit();
                ['penalty','pass','dribble','goalkeeper','donghyun'].forEach(id => localStorage.removeItem('mgBest_' + id));
                // 잔여 세션 문서도 정리 (500개 제한 대응)
                try {
                    const sesSnap = await db.collection('miniGameSessions').get();
                    if (!sesSnap.empty) {
                        let sesBatch = db.batch();
                        let sesCount = 0;
                        for (const d of sesSnap.docs) {
                            sesBatch.delete(d.ref);
                            sesCount++;
                            if (sesCount % batchSize === 0) {
                                await sesBatch.commit();
                                sesBatch = db.batch();
                            }
                        }
                        if (sesCount % batchSize !== 0) await sesBatch.commit();
                    }
                } catch(se) { console.warn('세션 정리 실패:', se); }
                showToast('미니게임 점수가 초기화되었습니다. (' + count + '건 삭제)', 'success');
            } catch(e) { console.error('미니게임 점수 초기화 실패:', e); showToast('초기화 실패: ' + e.message, 'error'); }
        }

            try {
                const snap = await db.collection('miniGameScores').where('gameId', '==', gameId).get();
                const batchSize = 499;
                let batch = db.batch();
                let count = 0;
                for (const doc of snap.docs) {

                showToast(`"${gName}" 점수 초기화 완료 (${count}건 삭제)`, 'success');
