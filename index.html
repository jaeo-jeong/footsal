                { pos: 'ST', x: 38, y: 18 }, { pos: 'ST', x: 62, y: 18 }
            ],
            '3-4-3': [
                { pos: 'GK', x: 50, y: 91 },
                { pos: 'CB', x: 26, y: 75 }, { pos: 'CB', x: 50, y: 77 }, { pos: 'CB', x: 74, y: 75 },
                { pos: 'LM', x: 14, y: 50 }, { pos: 'CM', x: 38, y: 52 }, { pos: 'CM', x: 62, y: 52 }, { pos: 'RM', x: 86, y: 50 },
                { pos: 'LW', x: 18, y: 22 }, { pos: 'ST', x: 50, y: 15 }, { pos: 'RW', x: 82, y: 22 }
            ],
            '5-3-2': [
                { pos: 'GK', x: 50, y: 91 },
                { pos: 'LWB', x: 11, y: 64 }, { pos: 'CB', x: 30, y: 76 }, { pos: 'CB', x: 50, y: 78 }, { pos: 'CB', x: 70, y: 76 }, { pos: 'RWB', x: 89, y: 64 },
                { pos: 'CM', x: 30, y: 47 }, { pos: 'CDM', x: 50, y: 52 }, { pos: 'CM', x: 70, y: 47 },
                { pos: 'ST', x: 38, y: 18 }, { pos: 'ST', x: 62, y: 18 }
            ],
            '5-4-1': [
                { pos: 'GK', x: 50, y: 91 },
                { pos: 'LWB', x: 11, y: 64 }, { pos: 'CB', x: 30, y: 76 }, { pos: 'CB', x: 50, y: 78 }, { pos: 'CB', x: 70, y: 76 }, { pos: 'RWB', x: 89, y: 64 },
                { pos: 'LM', x: 15, y: 45 }, { pos: 'CM', x: 38, y: 49 }, { pos: 'CM', x: 62, y: 49 }, { pos: 'RM', x: 85, y: 45 },
                { pos: 'ST', x: 50, y: 16 }
            ]
        };

        let soccerBoard = null;   // { formation, onPitch: [{name,x,y,pos}], bench: [name] }
        let sbPicked = null;      // 눌러서 고른 대상 { kind:'pitch', index } | { kind:'tray', name, zone }
        let sbDragEndedAt = 0;

        // 칩이 경기장 밖으로 삐져나가지 않게 좌표를 가둔다
        function sbClampX(v) { return Math.min(91, Math.max(9, Number(v) || 0)); }
        function sbClampY(v) { return Math.min(94, Math.max(6, Number(v) || 0)); }

        // 놓은 위치로 포지션을 짐작한다 (마음에 안 들면 포지션 바에서 바꾸면 된다)
        function sbGuessPosition(x, y) {
            if (y >= 85) return 'GK';
            if (y >= 62) return x < 25 ? 'LB' : x > 75 ? 'RB' : 'CB';
            if (y >= 40) return x < 22 ? 'LM' : x > 78 ? 'RM' : 'CM';
            if (y >= 28) return x < 22 ? 'LW' : x > 78 ? 'RW' : 'CAM';
            return x < 22 ? 'LW' : x > 78 ? 'RW' : 'ST';
        }

        function sbDefaultBoard() {
            return { formation: '4-4-2', onPitch: [], bench: [] };
        }

        function loadSoccerBoard() {
            try {
                const raw = JSON.parse(localStorage.getItem(SOCCER_BOARD_KEY) || 'null');
                if (raw && SOCCER_FORMATIONS[raw.formation] && Array.isArray(raw.onPitch)) {
                    const known = new Set(players.map(p => p.name));
                    const seen = new Set();
                    const onPitch = [];
                    raw.onPitch.forEach(entry => {
                        // 명단에서 빠진 이름은 버리고, 한 선수가 두 자리를 차지하지 않게 한다
                        if (!entry || !known.has(entry.name) || seen.has(entry.name)) return;
                        if (onPitch.length >= SOCCER_MAX_ON_PITCH) return;
                        seen.add(entry.name);
                        onPitch.push({
                            name: entry.name,
                            x: sbClampX(entry.x),
                            y: sbClampY(entry.y),
                            pos: SOCCER_POSITIONS.includes(entry.pos) ? entry.pos : sbGuessPosition(sbClampX(entry.x), sbClampY(entry.y)),
                            posManual: !!entry.posManual
                        });
                    });
                    const bench = [];
                    (Array.isArray(raw.bench) ? raw.bench : []).forEach(n => {
                        if (!known.has(n) || seen.has(n)) return;
                        seen.add(n);
                        bench.push(n);
                    });
                    return { formation: raw.formation, onPitch: onPitch, bench: bench };
                }
            } catch (e) {
                console.warn('전술판 불러오기 실패:', e);
            }
            return sbDefaultBoard();
        }

        function saveSoccerBoard() {
            if (!soccerBoard) return;
            try {
                localStorage.setItem(SOCCER_BOARD_KEY, JSON.stringify({
                    formation: soccerBoard.formation,
                    onPitch: soccerBoard.onPitch.map(p => ({
                        name: p.name,
                        x: Math.round(p.x * 100) / 100,
                        y: Math.round(p.y * 100) / 100,
                        pos: p.pos,
                        posManual: !!p.posManual
                    })),
                    bench: soccerBoard.bench
                }));
            } catch (e) {
                console.warn('전술판 저장 실패:', e);
            }
        }

        function openSoccerBoard() {
            if (!players.length) {
                showToast('선수 명단을 불러오는 중입니다.', 'warning');
                return;
            }
            soccerBoard = loadSoccerBoard();
            sbPicked = null;

            const select = document.getElementById('sbFormation');
            select.innerHTML = Object.keys(SOCCER_FORMATIONS)
                .map(name => `<option value="${name}"${name === soccerBoard.formation ? ' selected' : ''}>${name}</option>`)
                .join('');

            // 팀을 구성한 뒤라면 그 결과를 바로 불러올 수 있게 목록을 채운다
            const teamPick = document.getElementById('sbTeamPick');
            if (currentTeamsData && currentTeamsData.length) {
                teamPick.innerHTML = '<option value="">팀 불러오기</option>' + currentTeamsData
                    .map((t, i) => `<option value="${i}">팀 ${i + 1} (${t.length}명)</option>`).join('');
                teamPick.style.display = '';
            } else {
                teamPick.style.display = 'none';
            }

            const modal = document.getElementById('soccerBoardModal');
            if (!modal.dataset.sbReady) {
                // 드래그로 끝난 동작이 배경 클릭으로 오인돼 창이 닫히는 것 방지
                modal.addEventListener('click', e => {
                    if (e.target === modal && Date.now() - sbDragEndedAt < 400) e.stopPropagation();
                }, true);
                modal.dataset.sbReady = '1';
            }
            modal.classList.add('active');
            document.body.style.overflow = 'hidden';
            renderSoccerBoard();
        }

        function closeSoccerBoard() {
            document.getElementById('soccerBoardModal').classList.remove('active');
            if (!isAnyModalActive()) document.body.style.overflow = '';
        }

        function sbPlayerByName(name) {
            return players.find(p => p.name === name);
        }

        // 아직 경기장에도 후보에도 없는 선수 (실력 순)
        function sbUnassigned() {
            const used = new Set(soccerBoard.onPitch.map(p => p.name));
            soccerBoard.bench.forEach(n => used.add(n));
            return players
                .filter(p => !used.has(p.name))
                .sort((a, b) => getEffectiveWeight(b) - getEffectiveWeight(a));
        }

        function sbChipHtml(name, sub, picked) {
            const player = sbPlayerByName(name);
            const tier = player ? tierLabel(player.tier) : '';
            const label = sub ? (showTier && tier ? `${sub} · ${tier}` : sub) : (showTier ? tier : '');
            const aria = [name, sub, tier].filter(Boolean).join(' ');
            return `<span class="sb-chip${picked ? ' sb-picked' : ''}" role="button" tabindex="0"
                          aria-pressed="${picked ? 'true' : 'false'}" aria-label="${escapeHtml(aria)}">
                        <span class="sb-chip-name">${escapeHtml(name)}</span>
                        ${label ? `<span class="sb-chip-sub">${escapeHtml(label)}</span>` : ''}
                    </span>`;
        }

        function sbIsPicked(kind, key) {
            if (!sbPicked) return false;
            if (kind === 'pitch') return sbPicked.kind === 'pitch' && sbPicked.index === key;
            return sbPicked.kind === 'tray' && sbPicked.name === key;
        }

        function renderSoccerBoard() {
            if (!soccerBoard) return;

            // 경기장 — 선수를 놓은 자리에만 칩이 있다 (빈 자리 표시 없음)
            const pitch = document.getElementById('sbPitch');
            pitch.innerHTML = '<div class="sb-box sb-box-bottom"></div><div class="sb-box sb-box-top"></div>' +
                soccerBoard.onPitch.map((p, i) =>
                    `<div class="sb-slot" data-sb-target="player" data-sb-index="${i}"
                          style="left:${p.x}%;top:${p.y}%">${sbChipHtml(p.name, p.pos, sbIsPicked('pitch', i))}</div>`
                ).join('');

            // 포지션 바 — 경기장 위 선수를 고르면 나타난다
            const posBar = document.getElementById('sbPosBar');
            const wasHidden = posBar.hidden;
            if (sbPicked && sbPicked.kind === 'pitch' && soccerBoard.onPitch[sbPicked.index]) {
                const target = soccerBoard.onPitch[sbPicked.index];
                document.getElementById('sbPosName').textContent = target.name;
                document.getElementById('sbPosRow').innerHTML =
                    `<button type="button" class="sb-posbtn sb-posbtn-auto${target.posManual ? '' : ' sb-posbtn-on'}"
                             onclick="sbSetPosition('AUTO')">자동</button>` +
                    SOCCER_POSITIONS
                        .map(pos => `<button type="button" class="sb-posbtn${(target.posManual && pos === target.pos) ? ' sb-posbtn-on' : ''}"
                                        onclick="sbSetPosition('${pos}')">${pos}</button>`).join('');
                posBar.hidden = false;
                // 방금 열렸다면 버튼이 화면 밖에 있지 않게 끌어온다
                if (wasHidden) posBar.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
            } else {
                posBar.hidden = true;
            }

            // 후보
            const bench = document.getElementById('sbBench');
            bench.innerHTML = soccerBoard.bench.length
                ? soccerBoard.bench.map(n => sbChipHtml(n, null, sbIsPicked('tray', n))).join('')
                : '<span class="sb-tray-empty">여기로 옮기면 교체 선수가 됩니다</span>';

            // 미배치
            const pool = document.getElementById('sbPool');
            const rest = sbUnassigned();
            pool.innerHTML = rest.length
                ? rest.map(p => sbChipHtml(p.name, null, sbIsPicked('tray', p.name))).join('')
                : '<span class="sb-tray-empty">모든 선수가 배치되었습니다</span>';

            document.getElementById('sbCount').textContent = `선발 ${soccerBoard.onPitch.length}/${SOCCER_MAX_ON_PITCH}`;
            document.getElementById('sbBenchCount').textContent = `${soccerBoard.bench.length}명`;
            document.getElementById('sbPoolCount').textContent = `${rest.length}명`;

            sbBindChips();
        }

        function sbBindChips() {
            const modal = document.getElementById('soccerBoardModal');

            modal.querySelectorAll('#sbPitch .sb-slot').forEach(el => {
                const source = { kind: 'pitch', index: parseInt(el.dataset.sbIndex, 10) };
                const chip = el.querySelector('.sb-chip');
                sbBindPointer(chip, source);
                sbBindKeys(chip, source);
            });

            ['sbBench', 'sbPool'].forEach(id => {
                modal.querySelectorAll(`#${id} .sb-chip`).forEach(chip => {
                    const source = { kind: 'tray', name: chip.querySelector('.sb-chip-name').textContent, zone: id };
                    sbBindPointer(chip, source);
                    sbBindKeys(chip, source);
                });
            });
        }

        // 키보드로도 같은 동작 (Enter / Space)
        function sbBindKeys(el, source) {
            el.addEventListener('keydown', e => {
                if (e.key !== 'Enter' && e.key !== ' ' && e.key !== 'Spacebar') return;
                e.preventDefault();
                sbTap(source);
            });
        }

        let sbActivePointer = null;

        function sbBindPointer(el, source) {
            el.addEventListener('pointerdown', e => {
                if (e.button > 0) return;
                if (sbActivePointer !== null) return;   // 두 손가락 동시 드래그 방지
                sbActivePointer = e.pointerId;
                e.preventDefault();
                const startX = e.clientX, startY = e.clientY;
                let moved = false;
                let ghost = null;

                // 손가락으로 끌 때는 분신을 위로 띄운다. 안 그러면 손가락이 놓을 자리를 가린다.
                const touchLift = e.pointerType === 'touch' ? 52 : 0;
                const threshold = e.pointerType === 'touch' ? 6 : 8;

                const onMove = ev => {
                    if (ev.pointerId !== e.pointerId) return;
                    if (!moved) {
                        if (Math.abs(ev.clientX - startX) < threshold && Math.abs(ev.clientY - startY) < threshold) return;
                        moved = true;
                        ghost = el.cloneNode(true);
                        ghost.classList.add('sb-ghost');
                        ghost.classList.remove('sb-picked');
                        document.body.appendChild(ghost);
                        el.classList.add('sb-dragging');
                        if (touchLift) document.body.classList.add('sb-dragging-touch');
                    }
                    ghost.style.left = ev.clientX + 'px';
                    ghost.style.top = (ev.clientY - touchLift) + 'px';
                    // 판정은 실제 손가락 위치가 아니라 분신이 있는 자리로 (보이는 대로 놓인다)
                    sbHighlight(sbTargetAt(ev.clientX, ev.clientY - touchLift));
                };

                const onUp = ev => {
                    if (ev.pointerId !== e.pointerId) return;
                    sbActivePointer = null;
                    try {
                        if (el.hasPointerCapture && el.hasPointerCapture(e.pointerId)) el.releasePointerCapture(e.pointerId);
                    } catch (err) { /* 이미 풀렸으면 무시 */ }
                    document.removeEventListener('pointermove', onMove);
                    document.removeEventListener('pointerup', onUp);
                    document.removeEventListener('pointercancel', onUp);
                    el.classList.remove('sb-dragging');
                    if (ghost) ghost.remove();
                    document.body.classList.remove('sb-dragging-touch');
                    sbHighlight(null);
                    if (!moved) { sbTap(source); return; }
                    sbDragEndedAt = Date.now();
                    const target = sbTargetAt(ev.clientX, ev.clientY - touchLift);
                    if (target) sbMove(source, target);
                    else renderSoccerBoard();
                };

                // 리스너를 document 에 건다. 포인터 캡처가 안 되는 상황에서도 끝까지 따라간다.
                document.addEventListener('pointermove', onMove);
                document.addEventListener('pointerup', onUp);
                document.addEventListener('pointercancel', onUp);
                try {
                    el.setPointerCapture(e.pointerId);
                } catch (err) { /* 캡처가 안 되어도 위 리스너로 동작한다 */ }
            });
        }

        function sbTargetAt(clientX, clientY) {
            const el = document.elementFromPoint(clientX, clientY);
            if (!el) return null;
            const hit = el.closest('[data-sb-target]');
            if (!hit) return null;
            const kind = hit.dataset.sbTarget;
            if (kind === 'player') return { kind: 'player', index: parseInt(hit.dataset.sbIndex, 10), el: hit };
            if (kind === 'pitch') {
                const point = sbPitchPoint(clientX, clientY);
                return { kind: 'grass', el: hit, x: point.x, y: point.y };
            }
            return { kind: kind, el: hit };   // 'bench' | 'pool'
        }

        // 화면 좌표 → 경기장 안 백분율 좌표
        function sbPitchPoint(clientX, clientY) {
            const rect = document.getElementById('sbPitch').getBoundingClientRect();
            return {
                x: sbClampX((clientX - rect.left) / rect.width * 100),
                y: sbClampY((clientY - rect.top) / rect.height * 100)
            };
        }

        let sbHighlighted = null;
        function sbHighlight(target) {
            if (sbHighlighted) sbHighlighted.classList.remove('sb-drop-on');
            sbHighlighted = target ? target.el : null;
            if (sbHighlighted) sbHighlighted.classList.add('sb-drop-on');
        }

        function sbNameOf(ref) {
            if (!ref) return null;
            if (ref.kind === 'pitch') {
                const entry = soccerBoard.onPitch[ref.index];
                return entry ? entry.name : null;
            }
            return ref.name;
        }

        // 선수를 경기장/후보에서 떼어낸다 (아무 데도 없으면 미배치 상태)
        function sbDetach(name) {
            soccerBoard.onPitch = soccerBoard.onPitch.filter(p => p.name !== name);
            soccerBoard.bench = soccerBoard.bench.filter(n => n !== name);
        }

        // 선수를 고른 상태에서 경기장 빈 곳을 누르면 그 자리로
        function sbPitchClick(event) {
            if (!sbPicked) return;
            if (event.target.closest('.sb-slot')) return;   // 선수 칩은 칩이 처리
            if (Date.now() - sbDragEndedAt < 400) return;   // 드래그 직후 클릭은 무시
            const point = sbPitchPoint(event.clientX, event.clientY);
            sbMove(sbPicked, { kind: 'grass', x: point.x, y: point.y });
        }

        function sbTap(ref) {
            const same = sbPicked && ((ref.kind === 'pitch' && sbPicked.kind === 'pitch' && sbPicked.index === ref.index)
                                   || (ref.kind === 'tray' && sbPicked.kind === 'tray' && sbPicked.name === ref.name));
            if (same) {
                sbPicked = null;
                renderSoccerBoard();
                return;
            }

            if (sbPicked) {
                // 같은 목록 안에서 다른 선수를 누르면 선택만 옮긴다
                if (sbPicked.kind === 'tray' && ref.kind === 'tray' && sbPicked.zone === ref.zone) {
                    sbPicked = ref;
                    renderSoccerBoard();
                    return;
                }
                const target = ref.kind === 'pitch'
                    ? { kind: 'player', index: ref.index }
                    : { kind: ref.zone === 'sbBench' ? 'bench' : 'pool' };
                sbMove(sbPicked, target);
                return;
            }

            sbPicked = ref;
            renderSoccerBoard();
        }

        function sbMove(source, target) {
            const name = sbNameOf(source);
            if (!name) { sbPicked = null; renderSoccerBoard(); return; }

            if (target.kind === 'grass') {
                const entry = source.kind === 'pitch' ? soccerBoard.onPitch[source.index] : null;
                if (entry) {
                    entry.x = sbClampX(target.x);
                    entry.y = sbClampY(target.y);
                    // 옮긴 자리에 맞춰 포지션도 따라간다.
                    // 단, 직접 골라둔 선수는 건드리지 않는다 (안 그러면 지정한 게 무의미해진다)
                    if (!entry.posManual) entry.pos = sbGuessPosition(entry.x, entry.y);
                } else {
                    if (soccerBoard.onPitch.length >= SOCCER_MAX_ON_PITCH) {
                        showToast('이미 11명입니다. 한 명을 빼고 넣어주세요.', 'warning');
                        sbPicked = null;
                        renderSoccerBoard();
                        return;
                    }
                    const x = sbClampX(target.x), y = sbClampY(target.y);
                    sbDetach(name);
                    soccerBoard.onPitch.push({ name: name, x: x, y: y, pos: sbGuessPosition(x, y) });
                }
            } else if (target.kind === 'player') {
                const spot = soccerBoard.onPitch[target.index];
                if (!spot || spot.name === name) { sbPicked = null; renderSoccerBoard(); return; }
                if (source.kind === 'pitch') {
                    // 둘 다 경기장 위 → 서로 자리를 맞바꾼다 (포지션도 함께)
                    const mine = soccerBoard.onPitch[source.index];
                    const swapped = spot.name;
                    spot.name = mine.name;
                    mine.name = swapped;
                } else {
                    // 밖에서 들어온 선수가 그 자리를 차지하고, 있던 선수는 원래 자리로 나간다
                    const replaced = spot.name;
                    const toBench = source.zone === 'sbBench';
                    sbDetach(name);
                    spot.name = name;
                    if (toBench) soccerBoard.bench.push(replaced);
                }
            } else if (target.kind === 'bench') {
                sbDetach(name);
                soccerBoard.bench.push(name);
            } else {
                sbDetach(name);
            }

            sbPicked = null;
            saveSoccerBoard();
            renderSoccerBoard();
        }

        function sbSetPosition(pos) {
            if (!sbPicked || sbPicked.kind !== 'pitch') return;
            const entry = soccerBoard.onPitch[sbPicked.index];
            if (!entry) return;
            if (pos === 'AUTO') {
                // 다시 위치를 따라가게
                entry.posManual = false;
                entry.pos = sbGuessPosition(entry.x, entry.y);
            } else {
                if (!SOCCER_POSITIONS.includes(pos)) return;
                entry.pos = pos;
                entry.posManual = true;
            }
            saveSoccerBoard();
            renderSoccerBoard();
        }

        // 포지션이 속한 큰 역할 (수비/미드/공격)
        const SB_ROLE_GROUP = {
            GK: 'GK',
            LB: 'DF', CB: 'DF', RB: 'DF', LWB: 'DF', RWB: 'DF',
            CDM: 'MF', LM: 'MF', CM: 'MF', RM: 'MF', CAM: 'MF',
            LW: 'FW', RW: 'FW', ST: 'FW', CF: 'FW'
        };
        const SB_GROUP_ORDER = { GK: 0, DF: 1, MF: 2, FW: 3 };
        // 왼쪽 -1 / 가운데 0 / 오른쪽 1
        const SB_SIDE = {
            GK: 0, LB: -1, LWB: -1, LM: -1, LW: -1,
            CB: 0, CDM: 0, CM: 0, CAM: 0, ST: 0, CF: 0,
            RB: 1, RWB: 1, RM: 1, RW: 1
        };

        // 이 포지션의 선수를 이 자리에 세우는 게 얼마나 어색한지 (작을수록 잘 맞음).
        // 현재 좌표가 아니라 포지션으로만 따진다 — 좌표로 따지면 포메이션을 오갈 때마다 배치가 표류한다.
        function sbRoleCost(playerPos, spotPos) {
            if (playerPos === spotPos) return 0;
            const pg = SB_ROLE_GROUP[playerPos], sg = SB_ROLE_GROUP[spotPos];
            if ((pg === 'GK') !== (sg === 'GK')) return 1000;   // 골키퍼는 골문 밖으로 안 나간다
            const sideGap = Math.abs(SB_SIDE[playerPos] - SB_SIDE[spotPos]) * 8;
            if (pg === sg) return 10 + sideGap;                 // 같은 역할군이면 좌우만 맞춰준다
            // 자리가 모자라 다른 역할군으로 밀려날 때도 좌우는 지킨다 (RM 이면 오른쪽 윙으로)
            return 100 + Math.abs(SB_GROUP_ORDER[pg] - SB_GROUP_ORDER[sg]) * 20 + sideGap;
        }

        // 선수 n명을 자리 m개에 "전체 비용이 최소가 되게" 배정 (헝가리안 알고리즘, n <= m).
        // 눈앞에서 싼 것부터 고르면 마지막에 남은 선수가 반대편으로 밀려나는 일이 생긴다.
        function sbAssign(cost) {
            const n = cost.length, m = cost[0].length;
            const u = new Array(n + 1).fill(0), v = new Array(m + 1).fill(0);
            const p = new Array(m + 1).fill(0), way = new Array(m + 1).fill(0);
            for (let i = 1; i <= n; i++) {
                p[0] = i;
                let j0 = 0;
                const minv = new Array(m + 1).fill(Infinity);
                const used = new Array(m + 1).fill(false);
                do {
                    used[j0] = true;
                    const i0 = p[j0];
                    let delta = Infinity, j1 = 0;
                    for (let j = 1; j <= m; j++) {
                        if (used[j]) continue;
                        const cur = cost[i0 - 1][j - 1] - u[i0] - v[j];
                        if (cur < minv[j]) { minv[j] = cur; way[j] = j0; }
                        if (minv[j] < delta) { delta = minv[j]; j1 = j; }
                    }
                    for (let j = 0; j <= m; j++) {
                        if (used[j]) { u[p[j]] += delta; v[j] -= delta; }
                        else minv[j] -= delta;
                    }
                    j0 = j1;
                } while (p[j0] !== 0);
                do {
                    const j1 = way[j0];
                    p[j0] = p[j1];
                    j0 = j1;
                } while (j0);
            }
            const result = new Array(n).fill(-1);
            for (let j = 1; j <= m; j++) if (p[j]) result[p[j] - 1] = j - 1;
            return result;
        }

        // 현재 뛰고 있는 선수들을 고른 포메이션 모양으로 세운다.
        // 누가 어느 자리로 갈지는 지금 포지션과 서 있는 자리를 보고 전체가 가장 자연스럽게 되도록 배정한다.
        function sbApplyShape(formation) {
            const shape = SOCCER_FORMATIONS[formation];
            if (!shape || !soccerBoard.onPitch.length) return;

            const cost = soccerBoard.onPitch.map((entry, ei) =>
                shape.map((spot, si) => {
                    const dx = entry.x - spot.x, dy = entry.y - spot.y;
                    // 포지션 궁합이 먼저(x1000), 궁합이 같으면 지금 서 있는 자리에서 가까운 쪽으로
                    return sbRoleCost(entry.pos, spot.pos) * 1000
                         + Math.sqrt(dx * dx + dy * dy)
                         + ei * 0.001 + si * 0.0001;
                })
            );

            const assigned = sbAssign(cost);
            soccerBoard.onPitch.forEach((entry, i) => {
                const spot = shape[assigned[i]];
                if (!spot) return;
                entry.x = spot.x;
                entry.y = spot.y;
                // '자동'인 선수는 새로 선 자리의 포지션을 따라간다 (직접 고정한 선수는 그대로)
                if (!entry.posManual) entry.pos = spot.pos;
            });
        }

        function sbChangeFormation(name) {
            if (!SOCCER_FORMATIONS[name]) return;
            soccerBoard.formation = name;
            sbApplyShape(name);
            const select = document.getElementById('sbFormation');
            if (select && select.value !== name) select.value = name;
            sbPicked = null;
            saveSoccerBoard();
            renderSoccerBoard();
        }

        function sbAlignToFormation() {
            sbApplyShape(soccerBoard.formation);
            sbPicked = null;
            saveSoccerBoard();
            renderSoccerBoard();
            showToast(`${soccerBoard.formation} 모양으로 정렬했습니다.`, 'success');
        }

        // 팀 구성 결과에서 한 팀을 그대로 불러오기
        function sbApplyTeam(value) {
            const index = parseInt(value, 10);
            const select = document.getElementById('sbTeamPick');
            select.value = '';
            if (isNaN(index) || !currentTeamsData || !currentTeamsData[index]) return;

            const roster = currentTeamsData[index].slice()
                .sort((a, b) => getEffectiveWeight(b) - getEffectiveWeight(a))
                .map(p => p.name);
            const shape = SOCCER_FORMATIONS[soccerBoard.formation];

            // 골문은 가장 낮은 실력의 선수, 필드는 앞선부터 실력 순
            const ordered = [];
            if (roster.length) ordered.push(roster.pop());
            while (ordered.length < SOCCER_MAX_ON_PITCH && roster.length) ordered.push(roster.shift());

            soccerBoard.onPitch = ordered.map((name, i) => ({
                name: name,
                x: shape[i].x,
                y: shape[i].y,
                pos: shape[i].pos,
                posManual: false
            }));
            soccerBoard.bench = roster;

            sbPicked = null;
            saveSoccerBoard();
            renderSoccerBoard();
            showToast(`팀 ${index + 1}을(를) 불러왔습니다.`, 'success');
        }

        async function sbReset() {
            const ok = await showConfirm('전술판을 비울까요? 이 기기에 저장된 배치가 사라집니다.');
            if (!ok) return;
            soccerBoard.onPitch = [];
            soccerBoard.bench = [];
            sbPicked = null;
            saveSoccerBoard();
            renderSoccerBoard();
            showToast('전술판을 초기화했습니다.', 'success');
        }

        // ====== 전술판 공유 ======

        // 라인(GK/DF/MF/FW) 별로 묶어 왼쪽부터 정렬
        function sbLineup() {
            const lines = { GK: [], DF: [], MF: [], FW: [] };
            soccerBoard.onPitch.forEach(entry => {
                lines[SB_ROLE_GROUP[entry.pos] || 'MF'].push(entry);
            });
            Object.values(lines).forEach(arr => arr.sort((a, b) => a.x - b.x));
            return lines;
        }

        function sbCopyText() {
            if (!soccerBoard.onPitch.length) {
                showToast('경기장에 선수가 없습니다.', 'warning');
                return;
            }
            const lines = sbLineup();
            let text = `⚽ 젓자FC 전술판 · ${soccerBoard.formation}\n\n`;
            ['FW', 'MF', 'DF', 'GK'].forEach(group => {
                if (!lines[group].length) return;
                text += `${group}  ` + lines[group]
                    .map(e => `${e.name}(${e.pos})`).join(' ') + '\n';
            });
            if (soccerBoard.bench.length) {
                text += `\n교체  ${soccerBoard.bench.join(' ')}`;
            }
            sbCopyToClipboard(text.trim());
        }

        function sbCopyToClipboard(text) {
            if (navigator.clipboard && window.isSecureContext) {
                navigator.clipboard.writeText(text)
                    .then(() => showToast('전술판을 클립보드에 복사했습니다.', 'success'))
                    .catch(() => showToast('복사에 실패했습니다.', 'error'));
                return;
            }
            const textarea = document.createElement('textarea');
            textarea.value = text;
            textarea.style.position = 'fixed';
            textarea.style.opacity = '0';
            document.body.appendChild(textarea);
            textarea.select();
            try {
                document.execCommand('copy');
                showToast('전술판을 클립보드에 복사했습니다.', 'success');
            } catch (e) {
                showToast('복사에 실패했습니다.', 'error');
            }
            document.body.removeChild(textarea);
        }

        function sbRoundRect(ctx, x, y, w, h, r) {
            const radius = Math.min(r, w / 2, h / 2);
            ctx.beginPath();
            ctx.moveTo(x + radius, y);
            ctx.arcTo(x + w, y, x + w, y + h, radius);
            ctx.arcTo(x + w, y + h, x, y + h, radius);
            ctx.arcTo(x, y + h, x, y, radius);
            ctx.arcTo(x, y, x + w, y, radius);
            ctx.closePath();
        }

        // 전술판을 그대로 그림으로 그린다 (외부 라이브러리 없이 canvas 로)
        function sbRenderImage() {
            const scale = 2;
            const W = 720;
            const PAD = 18;
            const HEAD = 62;
            const pitchW = W - PAD * 2;
            const pitchH = Math.round(pitchW * 78 / 68);   // 공유용은 조금 납작하게
            const benchH = soccerBoard.bench.length ? 76 : 0;
            const H = HEAD + pitchH + benchH + PAD;

            const canvas = document.createElement('canvas');
            canvas.width = W * scale;
            canvas.height = H * scale;
            const ctx = canvas.getContext('2d');
            ctx.scale(scale, scale);
            const font = "'Pretendard Variable', Pretendard, -apple-system, 'Segoe UI', sans-serif";

            // 배경
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(0, 0, W, H);

            // 제목
            ctx.fillStyle = '#222222';
            ctx.font = `800 24px ${font}`;
            ctx.textBaseline = 'middle';
            ctx.textAlign = 'left';
            ctx.fillText('⚽ 젓자FC 전술판', PAD, HEAD / 2 + 2);
            ctx.fillStyle = '#667eea';
            ctx.font = `700 20px ${font}`;
            ctx.textAlign = 'right';
            ctx.fillText(soccerBoard.formation, W - PAD, HEAD / 2 + 2);

            // 경기장
            const px = PAD, py = HEAD;
            ctx.save();
            sbRoundRect(ctx, px, py, pitchW, pitchH, 14);
            ctx.clip();
            for (let i = 0; i < 12; i++) {
                ctx.fillStyle = i % 2 === 0 ? '#3a9e5c' : '#359454';
                ctx.fillRect(px, py + (pitchH / 12) * i, pitchW, pitchH / 12 + 1);
            }
            ctx.strokeStyle = 'rgba(255,255,255,0.35)';
            ctx.lineWidth = 2;
            // 하프라인
            ctx.beginPath();
            ctx.moveTo(px, py + pitchH / 2);
            ctx.lineTo(px + pitchW, py + pitchH / 2);
            ctx.stroke();
            // 센터서클
            ctx.beginPath();
            ctx.arc(px + pitchW / 2, py + pitchH / 2, pitchW * 0.13, 0, Math.PI * 2);
            ctx.stroke();
            // 페널티박스
            const boxW = pitchW * 0.56, boxH = pitchH * 0.15;
            ctx.strokeRect(px + (pitchW - boxW) / 2, py + pitchH - boxH, boxW, boxH);
            ctx.strokeRect(px + (pitchW - boxW) / 2, py, boxW, boxH);
            ctx.restore();
            sbRoundRect(ctx, px, py, pitchW, pitchH, 14);
            ctx.strokeStyle = 'rgba(255,255,255,0.45)';
            ctx.lineWidth = 2;
            ctx.stroke();

            // 선수 칩
            const chipW = 92, chipH = 46;
            soccerBoard.onPitch.forEach(entry => {
                const cx = px + pitchW * entry.x / 100;
                const cy = py + pitchH * entry.y / 100;
                const x = cx - chipW / 2, y = cy - chipH / 2;

                ctx.save();
                ctx.shadowColor = 'rgba(0,0,0,0.32)';
                ctx.shadowBlur = 6;
                ctx.shadowOffsetY = 2;
                ctx.fillStyle = 'rgba(255,255,255,0.97)';
                sbRoundRect(ctx, x, y, chipW, chipH, 10);
                ctx.fill();
                ctx.restore();

                const player = sbPlayerByName(entry.name);
                const tier = player ? tierLabel(player.tier) : '';
                const sub = showTier && tier ? `${entry.pos} · ${tier}` : entry.pos;

                ctx.textAlign = 'center';
                ctx.fillStyle = '#222222';
                ctx.font = `700 17px ${font}`;
                ctx.fillText(entry.name, cx, y + 17);
                ctx.fillStyle = '#667eea';
                ctx.font = `700 13px ${font}`;
                ctx.fillText(sub, cx, y + 34);
            });

            // 교체 선수
            if (soccerBoard.bench.length) {
                const by = py + pitchH + 16;
                ctx.textAlign = 'left';
                ctx.fillStyle = '#444444';
                ctx.font = `700 17px ${font}`;
                ctx.fillText('교체', PAD, by + 16);
                ctx.fillStyle = '#555555';
                ctx.font = `600 16px ${font}`;
                const names = soccerBoard.bench.join('  ');
                ctx.fillText(names, PAD + 46, by + 16);
            }

            return canvas;
        }

        // 데이터 URL → Blob (동기). toBlob 을 쓰면 기다리는 사이에 클릭 자격이 풀린다.
        function sbDataUrlToBlob(dataUrl) {
            const parts = dataUrl.split(',');
            const mime = (parts[0].match(/:(.*?);/) || [])[1] || 'image/png';
            const binary = atob(parts[1]);
            const bytes = new Uint8Array(binary.length);
            for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
            return new Blob([bytes], { type: mime });
        }

        // 공유도 저장도 안 되는 환경(카톡 내장 브라우저 등)을 위한 마지막 수단.
        // 이미지를 띄워주고 길게 눌러 앨범에 저장하게 한다.
        function sbShowImagePreview(dataUrl) {
            const layer = document.createElement('div');
            layer.className = 'sb-preview';
            layer.innerHTML = `
                <div class="sb-preview-inner">
                    <p class="sb-preview-hint">이미지를 <b>길게 눌러</b> 저장하세요</p>
                    <img src="${dataUrl}" alt="전술판">
                    <button type="button" class="sb-btn sb-btn-primary">닫기</button>
                </div>`;
            const close = () => layer.remove();
            layer.addEventListener('click', e => { if (e.target === layer) close(); });
            layer.querySelector('button').addEventListener('click', close);
            document.body.appendChild(layer);
        }

        function sbDownloadImage(blob, fileName) {
            const url = URL.createObjectURL(blob);
            const link = document.createElement('a');
            link.href = url;
            link.download = fileName;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            setTimeout(() => URL.revokeObjectURL(url), 1000);
            showToast('전술판 이미지를 저장했습니다.', 'success');
        }

        // 처음부터 끝까지 동기로 처리한다.
        // await 를 한 번이라도 걸면 "방금 사용자가 눌렀다"는 자격이 풀려서
        // 공유 시트도 클립보드 복사도 브라우저가 거부한다.
        function sbShareImage() {
            if (!soccerBoard.onPitch.length) {
                showToast('경기장에 선수가 없습니다.', 'warning');
                return;
            }

            let dataUrl, blob;
            try {
                dataUrl = sbRenderImage().toDataURL('image/png');
                blob = sbDataUrlToBlob(dataUrl);
            } catch (e) {
                console.warn('전술판 이미지 생성 실패:', e);
                showToast('이미지를 만들지 못했습니다.', 'error');
                return;
            }

            const fileName = `젓자FC-전술판-${soccerBoard.formation}.png`;
            const isTouch = window.matchMedia && window.matchMedia('(pointer: coarse)').matches;

            // 휴대폰: 공유 시트 → 거기서 "이미지 저장"을 누르면 앨범에 들어간다
            if (isTouch) {
                try {
                    const file = new File([blob], fileName, { type: 'image/png' });
                    if (navigator.canShare && navigator.canShare({ files: [file] })) {
                        navigator.share({ files: [file], title: '젓자FC 전술판' })
                            .catch(err => {
                                if (err && err.name === 'AbortError') return;   // 사용자가 취소함
                                console.warn('공유 실패:', err);
                                sbShowImagePreview(dataUrl);
                            });
                        return;
                    }
                } catch (e) {
                    console.warn('공유 준비 실패:', e);
                }
                // 공유를 못 쓰는 브라우저면 이미지를 띄워 길게 눌러 저장하게 한다
                sbShowImagePreview(dataUrl);
                return;
            }

            // PC: 클립보드로 바로 복사
            if (navigator.clipboard && window.ClipboardItem && window.isSecureContext) {
                navigator.clipboard.write([new ClipboardItem({ 'image/png': blob })])
                    .then(() => showToast('전술판 이미지를 클립보드에 복사했습니다. 붙여넣기 하세요.', 'success'))
                    .catch(err => {
                        console.warn('이미지 클립보드 복사 실패:', err);
                        sbDownloadImage(blob, fileName);
                    });
                return;
            }
            sbDownloadImage(blob, fileName);
        }

        // 팀 렌더링
        function renderTeams(teams, teamSizes) {
            currentTeamsData = teams;
            currentTeamSizes = teamSizes;
            const lockCount = Object.keys(playerTeamLocks).length;
            document.getElementById('lockSummary').textContent = lockCount
                ? '🔒 ' + lockCount + '명 고정 · 다시 편성해도 현재 팀에 남습니다. 자물쇠를 다시 누르면 해제됩니다.'
                : '선수 옆 자물쇠를 누르면 현재 팀에 고정할 수 있습니다.';

            const container = document.getElementById('teamsContainer');
            container.innerHTML = '';

            // 팀 간 평균 차이 계산 (밸런스 시각화용)
            const teamAverages = teams.map(team => {
                const s = team.reduce((sum, p) => sum + getEffectiveWeight(p), 0);
                return team.length > 0 ? s / team.length : 0;
            });
            const maxAvg = Math.max(...teamAverages);
            const minAvg = Math.min(...teamAverages);
            const avgDiff = maxAvg - minAvg;

            const tierOrder = ['황제', 'S', 'A+', 'A', 'A-', 'B+', 'B', 'C', 'D'];
            const tierColors = { '황제': '#8e2de2', 'S': '#ff6b6b', 'A+': '#ffa500', 'A': '#ffd93d', 'A-': '#d4e157', 'B+': '#5dd68a', 'B': '#6bcf7f', 'C': '#4ecdc4', 'D': '#95a5a6' };
            const isMobile = 'ontouchstart' in window || navigator.maxTouchPoints > 0;
            const numTeams = teams.length;

            teams.forEach((team, index) => {
                const teamDiv = document.createElement('div');
                teamDiv.className = 'team team-animate';
                teamDiv.style.animationDelay = (index * 0.1) + 's';
                teamDiv.setAttribute('data-team-index', index);

                const sortedTeam = [...team].sort((a, b) => {
                    return tierOrder.indexOf(a.tier) - tierOrder.indexOf(b.tier);
                });

                const tierSum = sortedTeam.reduce((sum, p) => sum + getEffectiveWeight(p), 0);
                const tierAverage = team.length > 0 ? (tierSum / team.length).toFixed(2) : 0;

                // 밸런스 표시
                let balanceClass = 'balance-good';
                let balanceText = '티어 균등';
                if (TeamBuilder.tierViolations(teams) > 0) { balanceClass = 'balance-ok'; balanceText = '티어 쏠림 있음'; }

                // 티어 분포 바
                const tierCounts = {};
                tierOrder.forEach(t => tierCounts[t] = 0);
                team.forEach(p => { tierCounts[p.tier] = (tierCounts[p.tier] || 0) + 1; });
                const totalP = team.length || 1;
                const distBar = tierOrder.map(t => {
                    const pct = (tierCounts[t] / totalP * 100).toFixed(1);
                    return tierCounts[t] > 0 ? `<div style="width:${pct}%;background:${tierColors[t]}" title="${t}: ${tierCounts[t]}명"></div>` : '';
                }).join('');

                // 모바일 이동 옵션
                const moveOptions = Array.from({length: numTeams}, (_, i) => i)
                    .filter(i => i !== index)
                    .map(i => `<option value="${i}">팀 ${i+1}</option>`)
                    .join('');

                teamDiv.innerHTML = `
                    <div class="team-title">팀 ${index + 1} (${teamSizes[index]}명)</div>
                    ${currentTeamMeta ? `<div>출전 ${currentTeamMeta.onFieldCount}명 · 교체 ${Math.max(0, team.length - currentTeamMeta.onFieldCount)}명</div>` : ''}
                    <div class="balance-indicator ${balanceClass}">차이: ${avgDiff.toFixed(2)} (${balanceText})</div>
                    <div class="team-stats">
                        <div>티어 합: ${tierSum.toFixed(1)}</div>
                        <div>인원당 평균: ${tierAverage}</div>
                    </div>
                    <div class="tier-dist-bar">${distBar}</div>
                    <ul class="team-players" data-team-index="${index}">
                        ${sortedTeam.map(player => `
                            <li class="team-player ${isAdmin && !Object.hasOwn(playerTeamLocks, TeamBuilder.identity(player)) ? 'draggable' : ''}"
                                draggable="${isAdmin && !isMobile && !Object.hasOwn(playerTeamLocks, TeamBuilder.identity(player)) ? 'true' : 'false'}"
                                data-player-id="${escapeHtml(TeamBuilder.identity(player))}"
                                data-player-name="${escapeHtml(player.name)}"
                                data-team-index="${index}">
                                <div class="player-info">
                                    ${isAdmin && numTeams > 1 ? `<button type="button" class="player-swap" aria-pressed="false"
                                        aria-label="${escapeHtml(player.name)} 맞교환 선수 선택"
                                        onclick="event.stopPropagation(); selectPlayerForSwap('${escapeForJsString(TeamBuilder.identity(player))}', ${index})">` : '<div>'}
                                        ${isAdmin && numTeams > 1 ? '<span aria-hidden="true">↔ </span>' : ''}${escapeHtml(player.name)}${showTier ? ` <span class="tier-badge tier-${player.tier.replace('+', 'plus').replace('-', 'minus')}">${tierLabel(player.tier)}</span>` : ''}
                                    ${isAdmin && numTeams > 1 ? '</button>' : '</div>'}
                                </div>
                                <button type="button" class="player-lock" aria-pressed="${Object.hasOwn(playerTeamLocks, TeamBuilder.identity(player))}"
                                    aria-label="${escapeHtml(player.name)} ${Object.hasOwn(playerTeamLocks, TeamBuilder.identity(player)) ? '잠금 해제' : '이 팀에 고정'}"
                                    onclick="event.stopPropagation(); togglePlayerLock('${escapeForJsString(TeamBuilder.identity(player))}', ${index})">${Object.hasOwn(playerTeamLocks, TeamBuilder.identity(player)) ? '🔒' : '🔓'}</button>
                                ${isAdmin && isMobile && numTeams > 1 ? `<select class="mobile-move-select" ${Object.hasOwn(playerTeamLocks, TeamBuilder.identity(player)) ? 'disabled' : ''} onchange="if(this.value !== '') { movePlayerToTeam('${escapeForJsString(player.name)}', ${index}, parseInt(this.value)); this.selectedIndex=0; }" onclick="event.stopPropagation()">
                                    <option value="">이동</option>
                                    ${moveOptions}
                                </select>` : ''}
                            </li>
                        `).join('')}
                    </ul>
                `;
                container.appendChild(teamDiv);

                if (isAdmin && !isMobile) {
                    setupDragAndDrop(teamDiv, index);
                }
            });
            updatePlayerSwapSelection();
        }

        // 드래그 앤 드롭 이벤트 설정
        function setupDragAndDrop(teamDiv, teamIndex) {
            const playersList = teamDiv.querySelector('.team-players');
            
            // 선수 항목에 드래그 이벤트
            playersList.querySelectorAll('.team-player.draggable').forEach(playerEl => {
                playerEl.addEventListener('dragstart', function(e) {
                    clearPlayerSwapSelection();
                    draggedPlayer = this.getAttribute('data-player-name');
                    draggedFromTeamIndex = parseInt(this.getAttribute('data-team-index'));
                    this.classList.add('dragging');
                    e.dataTransfer.effectAllowed = 'move';
                    e.dataTransfer.setData('text/html', this.innerHTML);
                });
                
                playerEl.addEventListener('dragend', function(e) {
                    this.classList.remove('dragging');
                    draggedPlayer = null;
                    draggedFromTeamIndex = null;
                    // 모든 팀의 drag-over 클래스 제거
                    document.querySelectorAll('.team').forEach(team => {
                        team.classList.remove('drag-over');
                    });
                });
            });
            
            // 팀 영역에 드롭 이벤트
            teamDiv.addEventListener('dragover', function(e) {
                if (draggedPlayer && draggedFromTeamIndex !== teamIndex) {
                    e.preventDefault();
                    e.dataTransfer.dropEffect = 'move';
                    this.classList.add('drag-over');
                }
            });
            
            teamDiv.addEventListener('dragleave', function(e) {
                this.classList.remove('drag-over');
            });
            
            teamDiv.addEventListener('drop', function(e) {
                e.preventDefault();
                this.classList.remove('drag-over');
                
                if (draggedPlayer && draggedFromTeamIndex !== null && draggedFromTeamIndex !== teamIndex) {
                    movePlayerToTeam(draggedPlayer, draggedFromTeamIndex, teamIndex);
                }
                
                draggedPlayer = null;
                draggedFromTeamIndex = null;
            });
        }

        // 초기 렌더링은 waitForFirebaseAndInit()에서 처리
