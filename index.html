<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>젓자FC 팀 짜기</title>
    <!-- Pretendard Font -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Pretendard Variable', 'Pretendard', -apple-system, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 30px;
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 10px;
            font-size: 2.5em;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
            font-size: 1.1em;
        }

        .section {
            margin-bottom: 30px;
        }

        .section-title {
            font-size: 1.5em;
            color: #333;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 2px solid #667eea;
        }

        .controls {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
            flex-wrap: wrap;
            align-items: center;
        }

        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            font-size: 1em;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: 600;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .btn-secondary {
            background: #6c757d;
            color: white;
        }

        .btn-secondary:hover {
            background: #5a6268;
        }

        .btn-danger {
            background: #dc3545;
            color: white;
        }

        .btn-danger:hover {
            background: #c82333;
        }

        .btn-success {
            background: #28a745;
            color: white;
        }

        .btn-success:hover {
            background: #218838;
        }


        .players-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }

        .player-card {
            background: #f8f9fa;
            border: 2px solid #e9ecef;
            border-radius: 10px;
            padding: 15px;
            transition: all 0.3s;
        }

        .player-card:hover {
            border-color: #667eea;
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }

        .player-name {
            font-size: 1.2em;
            font-weight: 600;
            margin-bottom: 10px;
            color: #333;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .player-checkbox {
            width: 20px;
            height: 20px;
            cursor: pointer;
        }

        .player-fields {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .field-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .field-group label {
            font-size: 0.9em;
            color: #666;
            font-weight: 500;
        }

        .field-group select {
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 0.95em;
        }

        .delete-btn {
            margin-top: 10px;
            padding: 6px 12px;
            font-size: 0.85em;
        }

        .add-player-form {
            background: #f8f9fa;
            border: 2px dashed #667eea;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .form-row {
            display: grid;
            grid-template-columns: 2fr 1fr auto;
            gap: 10px;
            align-items: end;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .form-group label {
            font-size: 0.9em;
            color: #666;
            font-weight: 500;
        }

        .form-group input,
        .form-group select {
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 1em;
        }

        .teams-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .team {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 15px;
            padding: 20px;
            color: white;
        }

        .team-title {
            font-size: 1.5em;
            font-weight: 700;
            margin-bottom: 15px;
            text-align: center;
            padding-bottom: 10px;
            border-bottom: 2px solid rgba(255, 255, 255, 0.3);
        }

        .team-stats {
            display: flex;
            justify-content: space-around;
            margin-bottom: 15px;
            font-size: 0.9em;
            opacity: 0.9;
        }

        .team-players {
            list-style: none;
        }

        .team-player {
            background: rgba(255, 255, 255, 0.2);
            padding: 10px;
            margin-bottom: 8px;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: all 0.2s;
        }

        .team-player.draggable {
            cursor: move;
        }

        .team-player.draggable:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: translateX(5px);
        }

        .team-player.dragging {
            opacity: 0.5;
            background: rgba(255, 255, 255, 0.1);
        }

        .player-info {
            display: flex;
            flex-direction: column;
            flex: 1;
        }

        .player-tier {
            font-size: 0.85em;
            opacity: 0.9;
        }

        .team {
            transition: all 0.2s;
        }

        .team.drag-over {
            background: linear-gradient(135deg, #7c8ff0 0%, #8a5fb8 100%);
            border: 3px dashed rgba(255, 255, 255, 0.8);
            transform: scale(1.02);
        }

        .team-players {
            min-height: 50px;
        }


        .tier-badge {
            display: inline-block;
            padding: 3px 8px;
            border-radius: 5px;
            font-size: 0.75em;
            font-weight: 600;
            margin-left: 5px;
        }

        .tier-S { background: #ff6b6b; }
        .tier-Aplus { background: #ffa500; }
        .tier-A { background: #ffd93d; }
        .tier-Bplus { background: #5dd68a; }
        .tier-B { background: #6bcf7f; }
        .tier-C { background: #4ecdc4; }
        .tier-D { background: #95a5a6; }

        .tier-table {
            background: #f8f9fa;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 30px;
            border: 2px solid #e9ecef;
        }

        .tier-table-title {
            font-size: 1.2em;
            font-weight: 600;
            color: #333;
            margin-bottom: 15px;
            text-align: center;
        }

        .tier-list {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
        }

        .tier-item {
            background: white;
            border-radius: 8px;
            border: 2px solid #e9ecef;
            padding: 15px;
        }

        .tier-item-header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 10px;
            padding-bottom: 10px;
            border-bottom: 2px solid #e9ecef;
        }

        .tier-item-label {
            font-size: 1.3em;
            font-weight: 700;
        }

        .tier-item-count {
            font-size: 0.9em;
            color: #666;
            margin-left: auto;
        }

        .tier-item-players {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .tier-player-name {
            padding: 5px 10px;
            background: #f8f9fa;
            border-radius: 5px;
            font-size: 0.9em;
            color: #333;
        }

        @media (max-width: 768px) {
            body {
                padding: 10px;
            }

            .container {
                padding: 15px;
                border-radius: 12px;
            }

            h1 {
                font-size: 1.6em;
                margin-bottom: 5px;
            }

            .subtitle {
                font-size: 0.95em;
                margin-bottom: 20px;
            }

            .section-title {
                font-size: 1.2em;
            }

            .top-buttons {
                display: flex;
                flex-wrap: wrap;
                justify-content: center;
                gap: 8px;
            }

            .top-buttons .btn {
                margin-left: 0 !important;
                flex: 1 1 auto;
                min-width: 120px;
                padding: 10px 12px;
                font-size: 0.85em;
            }

            .form-row {
                grid-template-columns: 1fr;
            }

            .players-grid {
                grid-template-columns: 1fr;
            }

            .controls {
                gap: 8px;
            }

            .controls .btn {
                padding: 10px 14px;
                font-size: 0.85em;
                flex: 1 1 calc(50% - 8px);
                text-align: center;
            }

            .controls label {
                width: 100%;
                justify-content: center;
                margin-left: 0 !important;
            }

            .teams-container {
                grid-template-columns: 1fr;
            }

            .team {
                padding: 15px;
            }

            .tier-list {
                grid-template-columns: 1fr 1fr;
            }

            .vote-grid {
                grid-template-columns: 1fr;
            }

            .modal-content {
                padding: 20px;
                max-height: 85vh;
                width: 95%;
            }

            #voteModal .modal-content {
                max-height: 85vh;
            }

            .modal-title {
                font-size: 1.2em;
                margin-bottom: 15px;
            }

            .btn {
                padding: 10px 16px;
                font-size: 0.9em;
                min-height: 44px;
            }

            .add-player-form {
                padding: 15px;
            }

            .tier-table {
                padding: 15px;
            }

            .player-checkbox {
                width: 24px;
                height: 24px;
                min-width: 24px;
            }

            .player-card {
                padding: 12px;
            }

            .player-name {
                padding: 4px 0;
            }

            .search-filter-bar {
                flex-direction: column;
            }
            .search-input {
                width: 100%;
            }
        }

        @media (max-width: 480px) {
            body {
                padding: 5px;
            }

            .container {
                padding: 12px;
                border-radius: 10px;
            }

            h1 {
                font-size: 1.4em;
            }

            .top-buttons .btn {
                min-width: 100%;
                font-size: 0.82em;
            }

            .controls .btn {
                flex: 1 1 100%;
            }

            .tier-list {
                grid-template-columns: 1fr;
            }

            .tier-item {
                padding: 10px;
            }

            .team-title {
                font-size: 1.2em;
            }

            .team-stats {
                flex-direction: column;
                gap: 5px;
                align-items: center;
            }
        }

        /* 모달 스타일 */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            justify-content: center;
            align-items: center;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background-color: white;
            padding: 30px;
            border-radius: 15px;
            max-width: 400px;
            width: 90%;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            display: flex;
            flex-direction: column;
            max-height: 90vh;
        }
        
        /* 투표 모달 전용 스타일 */
        #voteModal .modal-content {
            max-width: 600px;
            max-height: 90vh;
        }
        
        #voteContent {
            overflow-y: auto;
            overflow-x: hidden;
            flex: 1;
            min-height: 0;
            margin-bottom: 20px;
            padding-right: 10px;
            -webkit-overflow-scrolling: touch;
        }
        
        /* 모달 내부 스크롤 시 배경 스크롤 방지 */
        #voteModal .modal-content {
            touch-action: pan-y;
        }
        
        /* 스크롤바 스타일링 (선택사항) */
        #voteContent::-webkit-scrollbar {
            width: 8px;
        }
        
        #voteContent::-webkit-scrollbar-track {
            background: #f1f1f1;
            border-radius: 10px;
        }
        
        #voteContent::-webkit-scrollbar-thumb {
            background: #888;
            border-radius: 10px;
        }
        
        #voteContent::-webkit-scrollbar-thumb:hover {
            background: #555;
        }

        .modal-title {
            font-size: 1.5em;
            font-weight: 600;
            margin-bottom: 20px;
            text-align: center;
            color: #333;
        }

        .modal-input {
            width: 100%;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 1em;
            margin-bottom: 15px;
        }

        .modal-buttons {
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-shrink: 0;
            margin-top: auto;
        }

        .vote-section {
            background: #f8f9fa;
            border: 2px solid #667eea;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .vote-title {
            font-size: 1.2em;
            font-weight: 600;
            margin-bottom: 15px;
            color: #333;
        }

        .vote-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 10px;
        }

        .vote-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px;
            background: white;
            border-radius: 8px;
            border: 1px solid #ddd;
        }

        .vote-item select {
            flex: 1;
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 5px;
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        
        /* 승/무/패 입력 박스 스타일 */
        .record-input {
            width: 50px;
            padding: 8px 5px;
            border: 1px solid #ddd;
            border-radius: 5px;
            text-align: center;
            font-size: 0.95em;
        }
        
        /* number input 스피너 제거 */
        .record-input::-webkit-inner-spin-button,
        .record-input::-webkit-outer-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
        
        .record-input {
            -moz-appearance: textfield;
            appearance: textfield;
        }

        /* Toast 알림 */
        .toast-container {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 9999;
            display: flex;
            flex-direction: column-reverse;
            gap: 10px;
            pointer-events: none;
        }
        .toast {
            padding: 14px 28px;
            border-radius: 10px;
            color: white;
            font-weight: 600;
            font-size: 0.95em;
            box-shadow: 0 6px 20px rgba(0,0,0,0.25);
            animation: toastIn 0.35s ease forwards;
            pointer-events: auto;
            max-width: 400px;
            text-align: center;
        }
        .toast.toast-out {
            animation: toastOut 0.3s ease forwards;
        }
        .toast-success { background: #28a745; }
        .toast-error { background: #dc3545; }
        .toast-warning { background: #f0ad4e; color: #333; }
        @keyframes toastIn {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes toastOut {
            from { opacity: 1; transform: translateY(0); }
            to { opacity: 0; transform: translateY(30px); }
        }

        /* 커스텀 확인 모달 */
        .confirm-modal-content {
            text-align: center;
        }
        .confirm-message {
            font-size: 1.05em;
            color: #333;
            margin-bottom: 25px;
            line-height: 1.6;
            white-space: pre-line;
        }

        /* 오프라인 배너 */
        .offline-banner {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            background: #dc3545;
            color: white;
            text-align: center;
            padding: 10px;
            font-weight: 600;
            z-index: 10000;
            display: none;
            font-size: 0.95em;
        }
        .offline-banner.show { display: block; }

        /* 선수 검색/필터 */
        .search-filter-bar {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
            flex-wrap: wrap;
            align-items: center;
        }
        .search-input {
            flex: 1;
            min-width: 180px;
            padding: 10px 14px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 1em;
            font-family: inherit;
        }
        .search-input:focus {
            border-color: #667eea;
            outline: none;
        }
        .tier-filters {
            display: flex;
            gap: 5px;
            flex-wrap: wrap;
        }
        .tier-filter-btn {
            padding: 6px 12px;
            border: 2px solid #ddd;
            border-radius: 6px;
            background: white;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.85em;
            transition: all 0.2s;
            font-family: inherit;
        }
        .tier-filter-btn.active {
            border-color: #667eea;
            background: #667eea;
            color: white;
        }

        /* 선택 카운터 */
        .selection-counter {
            font-size: 1em;
            color: #666;
            font-weight: 600;
            padding: 6px 14px;
            background: #f0f0f0;
            border-radius: 8px;
            white-space: nowrap;
        }
        .selection-counter .count {
            color: #667eea;
            font-weight: 700;
        }

        /* 밸런스 시각화 */
        .balance-indicator {
            text-align: center;
            padding: 8px;
            border-radius: 6px;
            font-weight: 600;
            font-size: 0.9em;
            margin-bottom: 10px;
        }
        .balance-good { background: rgba(255,255,255,0.25); color: #c8ffc8; }
        .balance-ok { background: rgba(255,255,255,0.2); color: #fff3cd; }
        .balance-bad { background: rgba(255,255,255,0.2); color: #ffb3b3; }
        .tier-dist-bar {
            display: flex;
            height: 8px;
            border-radius: 4px;
            overflow: hidden;
            margin: 8px 0;
        }
        .tier-dist-bar > div {
            transition: width 0.3s;
        }

        /* 팀 결과 버튼 영역 */
        .team-actions {
            display: flex;
            gap: 10px;
            margin-top: 15px;
            flex-wrap: wrap;
            justify-content: center;
        }

        /* 모바일 이동 버튼 */
        .mobile-move-select {
            padding: 4px 8px;
            border: 1px solid rgba(255,255,255,0.5);
            border-radius: 5px;
            background: rgba(255,255,255,0.2);
            color: white;
            font-size: 0.8em;
            cursor: pointer;
            font-family: inherit;
        }
        .mobile-move-select option {
            color: #333;
            background: white;
        }

        /* 팀 히스토리 */
        .team-history-section {
            margin-top: 15px;
            padding: 15px;
            background: #f8f9fa;
            border-radius: 10px;
            border: 2px solid #e9ecef;
        }
        .history-item {
            padding: 10px;
            background: white;
            border-radius: 8px;
            margin-bottom: 8px;
            border: 1px solid #e9ecef;
            cursor: pointer;
            transition: all 0.2s;
        }
        .history-item:hover {
            border-color: #667eea;
            transform: translateY(-1px);
        }

        /* 버튼 일관된 스타일 */
        .btn {
            position: relative;
        }
        .btn:hover:not(:disabled) {
            transform: translateY(-2px);
        }
        .btn:active:not(:disabled) {
            transform: translateY(0);
        }
        .btn:focus-visible {
            outline: 3px solid #667eea;
            outline-offset: 2px;
        }
        .btn-secondary:hover:not(:disabled) {
            box-shadow: 0 4px 12px rgba(108,117,125,0.3);
        }
        .btn-danger:hover:not(:disabled) {
            box-shadow: 0 4px 12px rgba(220,53,69,0.3);
        }
        .btn-success:hover:not(:disabled) {
            box-shadow: 0 4px 12px rgba(40,167,69,0.3);
        }

        /* 로딩 스피너 */
        .btn-spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid rgba(255,255,255,0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
            margin-right: 8px;
            vertical-align: middle;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* 팀 카드 등장 애니메이션 */
        @keyframes teamFadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .team-animate {
            animation: teamFadeIn 0.4s ease forwards;
            opacity: 0;
        }

        /* 터치 타겟 개선 */
        .player-checkbox {
            width: 22px;
            height: 22px;
            min-width: 22px;
        }

        /* 투표 히스토리 카드 (모바일) */
        .vote-history-card {
            background: white;
            border-radius: 10px;
            border: 1px solid #e9ecef;
            padding: 12px;
            margin-bottom: 10px;
        }
        .vote-history-card-header {
            font-weight: 700;
            margin-bottom: 8px;
            padding-bottom: 8px;
            border-bottom: 1px solid #e9ecef;
        }
        .vote-history-card-votes {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }
        .vote-history-card-vote {
            font-size: 0.85em;
            padding: 3px 8px;
            background: #f8f9fa;
            border-radius: 4px;
        }

        /* ===== 풋살 FM 스타일 ===== */
        .fm-modal {
            display: none;
            position: fixed;
            z-index: 2000;
            left: 0; top: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.85);
            justify-content: center;
            align-items: center;
        }
        .fm-modal.active { display: flex; }
        .fm-modal-content {
            background: #1a1a2e;
            color: #eee;
            width: 95%;
            max-width: 700px;
            max-height: 95vh;
            border-radius: 16px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 20px 60px rgba(0,0,0,0.6);
        }
        .fm-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 20px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            font-size: 1.2em;
            font-weight: 700;
        }
        .fm-header-close {
            background: none; border: none; color: white;
            font-size: 1.4em; cursor: pointer; padding: 4px 8px;
            border-radius: 6px;
        }
        .fm-header-close:hover { background: rgba(255,255,255,0.2); }
        .fm-scoreboard {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            padding: 20px;
            background: linear-gradient(135deg, #2d1b69, #16213e);
        }
        .fm-team-info {
            text-align: center;
            flex: 1;
            min-width: 0;
        }
        .fm-team-name {
            font-size: 1.1em;
            font-weight: 700;
            margin-bottom: 4px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .fm-team-avg {
            font-size: 0.8em;
            color: #aaa;
        }
        .fm-score {
            font-size: 2.8em;
            font-weight: 800;
            letter-spacing: 8px;
            color: #fff;
            text-shadow: 0 0 20px rgba(102,126,234,0.6);
            min-width: 100px;
            text-align: center;
        }
        .fm-time {
            text-align: center;
            font-size: 0.9em;
            color: #bbb;
            padding: 6px 0 0;
        }
        .fm-rosters {
            display: flex;
            gap: 10px;
            padding: 10px 15px;
            max-height: 140px;
            overflow-y: auto;
        }
        .fm-roster-col {
            flex: 1;
            min-width: 0;
        }
        .fm-roster-col h4 {
            font-size: 0.8em;
            color: #888;
            margin-bottom: 6px;
            text-align: center;
        }
        .fm-roster-player {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 3px 6px;
            font-size: 0.82em;
            border-radius: 4px;
            margin-bottom: 2px;
        }
        .fm-roster-player.has-goal { background: rgba(102,126,234,0.2); }
        .fm-roster-player.has-card-yellow { border-left: 3px solid #ffd93d; }
        .fm-roster-player.has-card-red { border-left: 3px solid #ff4444; opacity: 0.5; }
        .fm-roster-icons { font-size: 0.85em; }
        .fm-commentary {
            flex: 1;
            min-height: 0;
            overflow-y: auto;
            padding: 0 15px 12px;
            border-top: 1px solid #333;
            border-bottom: 1px solid #333;
        }
        .fm-commentary-title {
            font-size: 0.85em;
            color: #888;
            margin-bottom: 8px;
            font-weight: 600;
            position: sticky;
            top: 0;
            background: #1a1a2e;
            padding: 12px 0 4px;
            z-index: 1;
        }
        .fm-event {
            padding: 6px 10px;
            margin-bottom: 4px;
            border-radius: 6px;
            font-size: 0.88em;
            animation: fmFadeIn 0.3s ease;
        }
        @keyframes fmFadeIn {
            from { opacity: 0; transform: translateY(-8px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .fm-event-goal { background: rgba(102,126,234,0.25); border-left: 3px solid #667eea; font-weight: 700; }
        .fm-event-save { background: rgba(77,182,172,0.2); border-left: 3px solid #4ecdc4; }
        .fm-event-card { background: rgba(255,217,61,0.15); border-left: 3px solid #ffd93d; }
        .fm-event-card-red { background: rgba(255,68,68,0.2); border-left: 3px solid #ff4444; }
        .fm-event-foul { background: rgba(150,150,150,0.15); }
        .fm-event-chance { background: rgba(255,165,0,0.15); border-left: 3px solid #ffa500; }
        .fm-event-possession { color: #777; font-size: 0.82em; }
        .fm-event-half { background: rgba(255,255,255,0.1); text-align: center; font-weight: 700; padding: 10px; }
        .fm-event-corner { background: rgba(100,200,100,0.1); }
        .fm-event-sub { background: rgba(100,200,255,0.15); border-left: 3px solid #64c8ff; }
        #fmMatchBody {
            display: flex;
            flex-direction: column;
            flex: 1;
            min-height: 0;
            overflow: hidden;
        }
        .fm-scoreboard { flex-shrink: 0; }
        .fm-rosters { flex-shrink: 0; }
        .fm-controls {
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 12px 15px;
            padding-bottom: max(12px, env(safe-area-inset-bottom));
            background: #111;
            flex-wrap: wrap;
        }
        .fm-controls .btn {
            padding: 8px 16px;
            font-size: 0.85em;
            border-radius: 6px;
            min-height: 36px;
        }
        .fm-btn-speed {
            background: #333; color: #ccc; border: 1px solid #555;
        }
        .fm-btn-speed.active {
            background: #667eea; color: white; border-color: #667eea;
        }
        .fm-btn-action {
            background: #444; color: #ddd; border: 1px solid #666;
        }
        .fm-btn-action:hover { background: #555; }
        /* FM 결과 화면 */
        .fm-result {
            padding: 20px;
            text-align: center;
            flex: 1;
            overflow-y: auto;
        }
        .fm-result h2 {
            font-size: 1.5em;
            margin-bottom: 10px;
            color: #667eea;
        }
        .fm-result-score {
            font-size: 2.2em;
            font-weight: 800;
            margin: 10px 0;
        }
        .fm-result-mvp {
            background: linear-gradient(135deg, #667eea22, #764ba222);
            border: 1px solid #667eea44;
            border-radius: 10px;
            padding: 12px;
            margin: 12px 0;
            font-size: 1em;
        }
        .fm-result-stats {
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            gap: 6px 12px;
            margin: 15px auto;
            max-width: 350px;
            font-size: 0.9em;
        }
        .fm-stat-label { color: #aaa; text-align: center; }
        .fm-stat-left { text-align: right; }
        .fm-stat-right { text-align: left; }
        .fm-result-goals {
            text-align: left;
            margin: 12px auto;
            max-width: 350px;
            font-size: 0.88em;
        }
        .fm-result-goals div { padding: 3px 0; }
        .fm-result-buttons {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-top: 15px;
        }
        .fm-pk-table {
            margin: 10px auto;
            font-size: 0.9em;
            border-collapse: collapse;
        }
        .fm-pk-table td, .fm-pk-table th {
            padding: 4px 10px;
            text-align: center;
            border-bottom: 1px solid #333;
        }
        /* FM 셋업 모달 */
        .fm-setup-content {
            background: #1a1a2e;
            color: #eee;
            max-width: 400px;
            width: 90%;
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.6);
        }
        .fm-setup-content h3 {
            text-align: center;
            margin-bottom: 16px;
            color: #667eea;
        }
        .fm-setup-team-btn {
            display: block;
            width: 100%;
            padding: 12px;
            margin-bottom: 8px;
            background: #2a2a4a;
            color: #eee;
            border: 2px solid transparent;
            border-radius: 10px;
            cursor: pointer;
            font-size: 0.95em;
            text-align: left;
            transition: all 0.2s;
        }
        .fm-setup-team-btn:hover { border-color: #667eea; }
        .fm-setup-team-btn.selected { border-color: #667eea; background: #333366; }
        .fm-setup-content.fm-setup-wide { max-width: 600px; }
        .fm-pos-teams {
            display: flex;
            gap: 16px;
        }
        .fm-pos-team-col {
            flex: 1;
            min-width: 0;
        }
        .fm-pos-team-col h4 {
            text-align: center;
            color: #667eea;
            margin-bottom: 10px;
            font-size: 0.95em;
        }
        .fm-pos-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 6px 8px;
            margin-bottom: 4px;
            background: #2a2a4a;
            border-radius: 8px;
            gap: 6px;
        }
        .fm-pos-name {
            font-size: 0.88em;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            min-width: 0;
            flex: 1;
        }
        .fm-pos-select {
            padding: 4px 6px;
            border-radius: 6px;
            border: 1px solid #555;
            background: #1a1a2e;
            color: #eee;
            font-size: 0.82em;
            cursor: pointer;
            flex-shrink: 0;
        }
        .fm-pos-select:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            background: #252540;
        }
        .fm-formation-row {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 10px;
            padding: 6px 8px;
            background: #1e1e3a;
            border-radius: 8px;
        }
        .fm-formation-row label {
            font-size: 0.82em;
            color: #aaa;
            white-space: nowrap;
        }
        .fm-formation-select {
            flex: 1;
            padding: 5px 8px;
            border-radius: 6px;
            border: 1px solid #555;
            background: #2a2a4a;
            color: #eee;
            font-size: 0.9em;
            font-weight: 600;
            cursor: pointer;
        }
        .fm-mode-label {
            text-align: center;
            font-size: 0.82em;
            color: #888;
            margin-bottom: 12px;
        }
        .fm-pos-section-label {
            font-size: 0.78em;
            color: #999;
            padding: 6px 0 4px;
            border-bottom: 1px solid #333;
            margin-bottom: 4px;
            font-weight: 600;
        }
        .fm-pos-sub-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 4px 8px;
            margin-bottom: 3px;
            background: #222240;
            border-radius: 8px;
            opacity: 0.7;
        }
        .fm-pos-swap-btn {
            padding: 2px 8px;
            font-size: 0.72em;
            border: 1px solid #555;
            border-radius: 4px;
            background: #333;
            color: #ccc;
            cursor: pointer;
            flex-shrink: 0;
        }
        .fm-pos-swap-btn:hover { background: #444; border-color: #667eea; }
        .fm-roster-player.is-sub { opacity: 0.5; font-style: italic; }
        .fm-sub-badge {
            display: inline-block;
            padding: 1px 4px;
            border-radius: 3px;
            font-size: 0.65em;
            font-weight: 700;
            background: #666;
            color: #ccc;
            margin-right: 3px;
        }
        .fm-pos-badge {
            display: inline-block;
            padding: 1px 5px;
            border-radius: 3px;
            font-size: 0.68em;
            font-weight: 700;
            margin-right: 3px;
            color: #fff;
        }
        .fm-pos-GK { background: #e67e22; }
        .fm-pos-DF { background: #3498db; }
        .fm-pos-MF { background: #2ecc71; }
        .fm-pos-FW { background: #e74c3c; }
        @media (max-width: 768px) {
            .fm-modal {
                align-items: stretch;
            }
            .fm-modal-content {
                width: 100%;
                height: 100vh;
                height: 100dvh;
                max-height: 100vh;
                max-height: 100dvh;
                border-radius: 0;
                max-width: 100%;
            }
            .fm-header { padding: 10px 16px; font-size: 1.05em; }
            .fm-score { font-size: 1.8em; letter-spacing: 4px; min-width: 70px; }
            .fm-scoreboard { padding: 10px 12px; gap: 8px; }
            .fm-team-name { font-size: 0.95em; }
            .fm-team-avg { font-size: 0.72em; }
            .fm-rosters { max-height: 90px; padding: 6px 10px; gap: 6px; }
            .fm-roster-player { padding: 2px 4px; font-size: 0.75em; }
            .fm-commentary { padding: 0 10px 8px; }
            .fm-commentary-title { padding: 8px 0 4px; }
            .fm-event { padding: 4px 8px; font-size: 0.82em; }
            .fm-pos-swap-btn { padding: 1px 6px; font-size: 0.68em; }
            .fm-pos-sub-row { padding: 3px 6px; }
            .fm-pos-section-label { font-size: 0.72em; }
            .fm-controls {
                padding: 8px 10px;
                padding-bottom: max(8px, env(safe-area-inset-bottom));
                gap: 6px;
            }
            .fm-controls .btn { padding: 7px 12px; font-size: 0.8em; min-height: 32px; }
            .fm-pos-teams { flex-direction: column; gap: 12px; }
            .fm-setup-content {
                max-height: 90vh;
                max-height: 90dvh;
                overflow-y: auto;
                width: 95%;
            }
            .fm-setup-content.fm-setup-wide { max-width: 95%; }
            .fm-result { padding: 14px 12px; }
            .fm-result h2 { font-size: 1.2em; }
            .fm-result-score { font-size: 1.8em; }
            .fm-result-mvp { padding: 10px; font-size: 0.9em; }
            .fm-result-stats { font-size: 0.82em; gap: 4px 10px; }
        }
    </style>
</head>
<body>
    <!-- 오프라인 배너 -->
    <div id="offlineBanner" class="offline-banner">인터넷 연결을 확인해주세요</div>

    <!-- 토스트 컨테이너 -->
    <div id="toastContainer" class="toast-container"></div>

    <!-- 커스텀 확인 모달 -->
    <div id="confirmModal" class="modal" role="dialog" aria-modal="true" aria-labelledby="confirmTitle">
        <div class="modal-content confirm-modal-content">
            <div class="modal-title" id="confirmTitle">확인</div>
            <div class="confirm-message" id="confirmMessage"></div>
            <div class="modal-buttons">
                <button class="btn btn-primary" id="confirmOk">확인</button>
                <button class="btn btn-secondary" id="confirmCancel">취소</button>
            </div>
        </div>
    </div>

    <!-- 관리자 코드 입력 모달 -->
    <div id="adminModal" class="modal" role="dialog" aria-modal="true" aria-labelledby="adminModalTitle">
        <div class="modal-content">
            <div class="modal-title" id="adminModalTitle">관리자 코드 입력</div>
            <input type="password" id="adminCodeInput" class="modal-input" placeholder="관리자 코드를 입력하세요">
            <div class="modal-buttons">
                <button class="btn btn-primary" onclick="enterAsAdmin()">관리자로 입장</button>
                <button class="btn btn-secondary" onclick="enterAsGuest()">일반 사용자로 입장</button>
            </div>
        </div>
    </div>

    <div class="container">
        <h1>⚽ 젓자FC</h1>
        
        <div class="top-buttons" style="text-align: center; margin-bottom: 20px; display: flex; flex-wrap: wrap; justify-content: center; gap: 10px;">
            <button id="resetBtn" class="btn btn-secondary" onclick="resetToDefault()" style="background: #dc3545; color: white;" disabled>
                초기값으로 되돌리기
            </button>
            <button id="voteBtn" class="btn btn-primary" onclick="openVoteModal()">
                티어 투표하기
            </button>
            <button id="voteHistoryBtn" class="btn btn-info" onclick="openVoteHistoryModal()" style="background: #17a2b8; color: white; display: none;">
                티어 투표 이력 보기
            </button>
        </div>

        <div class="tier-table">
            <div class="tier-table-title">티어 표</div>
            <div class="tier-list" id="tierList"></div>
        </div>

        <!-- 투표 모달 -->
        <div id="voteModal" class="modal" role="dialog" aria-modal="true" aria-labelledby="voteModalTitle">
            <div class="modal-content" style="max-width: 600px;">
                <div class="modal-title" id="voteModalTitle">티어 투표</div>
                <div id="voteContent"></div>
                <div class="modal-buttons">
                    <button class="btn btn-primary" onclick="submitVote()">투표 제출</button>
                    <button class="btn btn-secondary" onclick="closeVoteModal()">취소</button>
                </div>
            </div>
        </div>

        <!-- 투표 이력 모달 (관리자 전용) -->
        <div id="voteHistoryModal" class="modal" role="dialog" aria-modal="true" aria-labelledby="voteHistoryModalTitle">
            <div class="modal-content" style="max-width: 90%; max-height: 90vh;">
                <div class="modal-title" id="voteHistoryModalTitle">티어 투표 이력 (관리자 전용)</div>
                <div id="voteHistoryContent" style="overflow-y: auto; max-height: calc(90vh - 150px); padding: 20px;">
                    <div id="voteHistoryStats" style="margin-bottom: 20px; padding: 15px; background: #f8f9fa; border-radius: 8px;">
                        <h3 style="margin: 0 0 10px 0; font-size: 1.2em;">투표 통계</h3>
                        <p style="margin: 5px 0; font-size: 1em;"><strong>총 투표 수:</strong> <span id="totalVoteCount">0</span>명</p>
                    </div>
                    <div id="voteHistoryTable"></div>
                </div>
                <div class="modal-buttons">
                    <button class="btn btn-secondary" onclick="closeVoteHistoryModal()">닫기</button>
                </div>
            </div>
        </div>

        <div class="section">
            <h2 class="section-title">선수 관리</h2>

            <!-- 선수 검색/필터 -->
            <div class="search-filter-bar">
                <input type="text" id="playerSearchInput" class="search-input" placeholder="선수 이름 검색..." oninput="filterPlayers()">
                <div class="tier-filters" id="tierFilters">
                    <button class="tier-filter-btn active" onclick="toggleTierFilter('all', this)">전체</button>
                    <button class="tier-filter-btn" onclick="toggleTierFilter('S', this)">S</button>
                    <button class="tier-filter-btn" onclick="toggleTierFilter('A+', this)">A+</button>
                    <button class="tier-filter-btn" onclick="toggleTierFilter('A', this)">A</button>
                    <button class="tier-filter-btn" onclick="toggleTierFilter('B+', this)">B+</button>
                    <button class="tier-filter-btn" onclick="toggleTierFilter('B', this)">B</button>
                    <button class="tier-filter-btn" onclick="toggleTierFilter('C', this)">C</button>
                    <button class="tier-filter-btn" onclick="toggleTierFilter('D', this)">D</button>
                </div>
            </div>

            <div class="add-player-form" id="addPlayerForm" style="display: none;">
                <div class="form-row">
                    <div class="form-group">
                        <label>이름</label>
                        <input type="text" id="newPlayerName" placeholder="선수 이름">
                    </div>
                    <div class="form-group">
                        <label>티어</label>
                        <select id="newPlayerTier">
                            <option value="S">S</option>
                            <option value="A+">A+</option>
                            <option value="A">A</option>
                            <option value="B+">B+</option>
                            <option value="B" selected>B</option>
                            <option value="C">C</option>
                            <option value="D">D</option>
                        </select>
                    </div>
                    <button class="btn btn-success" onclick="addPlayer()">추가</button>
                </div>
            </div>

            <div class="players-grid" id="playersGrid"></div>
        </div>

        <div class="section">
            <h2 class="section-title">팀 구성 <span class="selection-counter" id="selectionCounter">선택: <span class="count">0</span>/<span id="totalPlayerCount">0</span>명</span></h2>
            <div class="controls">
                <button class="btn btn-secondary" onclick="selectAllPlayers()">전체 선택</button>
                <button class="btn btn-secondary" onclick="deselectAllPlayers()">전체 해제</button>
                <button class="btn btn-primary" id="futsalBtn" onclick="generateFutsalTeams()">풋살팀 구성</button>
                <button class="btn btn-primary" id="soccerBtn" onclick="generateSoccerTeams()">축구팀 구성</button>
                <label style="display: flex; align-items: center; gap: 8px; cursor: pointer; min-height: 44px;">
                    <input type="checkbox" id="hideTierCheckbox" onchange="toggleTierVisibility()" style="width: 22px; height: 22px; cursor: pointer;">
                    <span style="font-size: 0.95em; color: #333;">티어 숨기기</span>
                </label>
                <label style="display: none; align-items: center; gap: 8px; cursor: pointer; min-height: 44px;">
                    <input type="checkbox" id="winRateCheckbox" style="width: 22px; height: 22px; cursor: pointer;">
                    <span style="font-size: 0.95em; color: #333;">승률 가중치 반영</span>
                </label>
            </div>
            <div id="teamHistorySection" style="display: none;"></div>
            <div class="teams-container" id="teamsContainer"></div>
            <div id="teamActions" class="team-actions" style="display: none;">
                <button class="btn btn-secondary" onclick="copyTeamsToClipboard()">클립보드 복사</button>
                <button class="btn btn-secondary" onclick="showTeamHistory()">이전 팀 보기</button>
                <button class="btn btn-primary" onclick="openFutsalFMSetup()">시뮬레이션</button>
            </div>
        </div>
    </div>

    <!-- FM 셋업 모달 (팀 선택 + 포지션 설정) -->
    <div id="fmSetupModal" class="fm-modal" onclick="if(event.target===this)closeFmSetup()">

        // 토스트 알림
        function showToast(message, type = 'success') {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            toast.className = 'toast toast-' + type;
            toast.textContent = message;
            container.appendChild(toast);
            setTimeout(() => {
                toast.classList.add('toast-out');
                toast.addEventListener('animationend', () => toast.remove());
            }, 3000);
        }

        // 커스텀 확인 모달
        function showConfirm(message) {
            return new Promise((resolve) => {
                const modal = document.getElementById('confirmModal');
                document.getElementById('confirmMessage').textContent = message;
                modal.classList.add('active');
                document.body.style.overflow = 'hidden';
                const okBtn = document.getElementById('confirmOk');
                const cancelBtn = document.getElementById('confirmCancel');
                function cleanup() {
                    modal.classList.remove('active');
                    document.body.style.overflow = '';
                    okBtn.removeEventListener('click', onOk);
                    cancelBtn.removeEventListener('click', onCancel);
                }
                function onOk() { cleanup(); resolve(true); }
                function onCancel() { cleanup(); resolve(false); }
                okBtn.addEventListener('click', onOk);
                cancelBtn.addEventListener('click', onCancel);
            });
        }

        // 디바운스
        function debounce(fn, delay) {
            let timer;
            return function(...args) {
                clearTimeout(timer);
                timer = setTimeout(() => fn.apply(this, args), delay);
            };
        }

        // 모달 ESC/배경 클릭 닫기 + 포커스 트랩
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') {
                const modals = document.querySelectorAll('.modal.active');
                modals.forEach(modal => {
                    if (modal.id === 'adminModal') return; // admin modal은 ESC로 닫지 않음
                    if (modal.id === 'confirmModal') {
                        document.getElementById('confirmCancel').click();
                        return;
                    }
                    modal.classList.remove('active');
                    document.body.style.overflow = '';
                });
            }
            // 포커스 트랩
            if (e.key === 'Tab') {
                const activeModal = document.querySelector('.modal.active');
                if (!activeModal) return;
                const focusable = activeModal.querySelectorAll('button, input, select, textarea, [tabindex]:not([tabindex="-1"])');
                if (focusable.length === 0) return;
                const first = focusable[0];
                const last = focusable[focusable.length - 1];
                if (e.shiftKey && document.activeElement === first) {
                    e.preventDefault();
                    last.focus();
                } else if (!e.shiftKey && document.activeElement === last) {
                    e.preventDefault();
                    first.focus();
                }
            }
        });

        // 페이지 로드 완료 후 Firebase 초기화

            const maxAttempts = 50; // 5초간 시도

                if (typeof firebase !== 'undefined' && typeof firebaseConfig !== 'undefined') {

                    initializeFirebase();
                    // 초기화 후 init() 호출

                } else if (attempts >= maxAttempts) {

        // 투표 평균으로 티어 계산
        function calculateTierFromVotes(votes) {
            if (!votes || votes.length === 0) return 'B';

            // "모름" 투표는 제외하고 계산
            const validVotes = votes.filter(vote => vote.tier !== '모름');

            // 유효한 투표가 없으면 기본값 B 반환
            if (validVotes.length === 0) return 'B';

            // 가중치 배열로 변환
            let weights = validVotes.map(vote => tierWeights[vote.tier] || 4);

            // 5명 이상 투표 시 최고/최저 1표씩 제거 (trimmed mean)
            if (weights.length >= 5) {
                weights.sort((a, b) => a - b);
                weights = weights.slice(1, -1);
            }

            const avgWeight = weights.reduce((sum, w) => sum + w, 0) / weights.length;

            // 가장 가까운 가중치의 티어로 매칭
            const tiers = Object.entries(tierWeights);
            let closestTier = 'B';
            let closestDist = Infinity;
            for (const [tier, weight] of tiers) {
                const dist = Math.abs(avgWeight - weight);
                if (dist < closestDist) {
                    closestDist = dist;
                    closestTier = tier;
                }
            }
            return closestTier;
        }

        // 디바이스 ID 생성 (클라이언트 측)
        function getDeviceId() {
            // localStorage에 저장된 디바이스 ID 확인
            let deviceId = localStorage.getItem('deviceId');
            
            if (!deviceId) {
                // 새로운 디바이스 ID 생성 (User-Agent + 랜덤 값)
                const userAgent = navigator.userAgent || 'unknown';
                const screenInfo = `${screen.width}x${screen.height}`;
                const timezone = Intl.DateTimeFormat().resolvedOptions().timeZone;
                const combined = `${userAgent}-${screenInfo}-${timezone}-${Date.now()}-${Math.random()}`;
                
                // 간단한 해시 함수 (SHA-256 대신)
                let hash = 0;
                for (let i = 0; i < combined.length; i++) {
                    const char = combined.charCodeAt(i);
                    hash = ((hash << 5) - hash) + char;
                    hash = hash & hash; // 32bit 정수로 변환
                }
                
                deviceId = Math.abs(hash).toString(36) + Date.now().toString(36);
                localStorage.setItem('deviceId', deviceId);
            }
            
            return deviceId;
        }
