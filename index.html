            async showResult(gameId, score, detail) {
                if (this._showingResult) return;
                if (this._centerSession && gameId !== this.currentGameId) return;
                this._showingResult = true;
                if (this.currentGame && this.currentGame.cleanup) this.currentGame.cleanup();
                GameSprites.clearConfetti();
                GameSprites.clearFlash();
                const pauseBtn = document.getElementById('mgPauseBtn');
                if (pauseBtn) pauseBtn.style.display = 'none';
                this.paused = false;
                SoundManager.play('gameOver');
                this.hideAllScreens();
                if (this._centerSession) {
                    const session = this._centerSession;
                    this._centerSession = null;
                    this.currentGame = null;
                    this.currentGameId = null;
                    document.getElementById('mgOverlay').classList.remove('active');
                    session.finish(Math.floor(score), detail);
                    return;
                }
                const resultEl = document.getElementById('mgResultScreen');
                resultEl.style.display = 'block';
                resultEl.classList.add('mg-scalein');
                setTimeout(() => resultEl.classList.remove('mg-scalein'), 500);

                // Chibi character pose based on score
                const finalScore = Math.floor(score);
                const isGoodScore = finalScore >= 300;
                const resultExpr = isGoodScore ? 'celebrate' : (finalScore >= 100 ? 'happy' : 'sad');
                const resultPose = isGoodScore ? 'celebrate' : 'standing';
                const resultChibiColors = { penalty: '#1a73e8', pass: '#2ecc71', dribble: '#ff6b35', goalkeeper: '#ff9f43', donghyun: '#9b59b6' };
                const resultChibi = ChibiSprite.markup(52, { jersey: resultChibiColors[gameId] || '#1a73e8', pose: resultPose, expression: resultExpr, number: '10' });

                // Star rating (1-3)
                let starRating = 1;
                if (finalScore >= 500) starRating = 3;
                else if (finalScore >= 200) starRating = 2;
                const starsHtml = Array(3).fill(0).map((_, i) => {
                    const filled = i < starRating;
                    return `<span style="font-size:1.5em; color:${filled ? '#ffd700' : 'rgba(255,255,255,0.2)'}; text-shadow:${filled ? '0 0 10px rgba(255,215,0,0.5)' : 'none'}; animation:${filled ? `gsPopIn 0.4s ease-out ${0.5 + i * 0.15}s both` : 'none'};">${filled ? '★' : '☆'}</span>`;
                }).join('');

                // Insert chibi + stars at top of result
                const chibiContainer = document.getElementById('mgResultChibi');
                if (chibiContainer) {
                    chibiContainer.innerHTML = `<span style="display:inline-block;filter:drop-shadow(0 3px 8px rgba(0,0,0,0.3));animation:gsPopIn 0.5s ease-out 0.2s both;">${resultChibi}</span>
                        <div style="margin-top:8px;">${starsHtml}</div>`;
                    chibiContainer.style.display = 'block';
                }

                // Score count-up animation
                const scoreEl = document.getElementById('mgResultScore');
                scoreEl.textContent = '0점';
                GameAnim.countUp(0, finalScore, 1200, (v) => {
                    scoreEl.textContent = v.toLocaleString() + '점';
                });
                // detail can be string (legacy) or stats object
                const isStats = detail && typeof detail === 'object';
                document.getElementById('mgResultDetail').textContent = isStats ? (detail._summary || '') : (detail || '');
                if (isStats) { this.renderStatsGrid(gameId, detail); } else { const sg = document.getElementById('mgStatsGrid'); if(sg) sg.style.display='none'; }
                const info = this.gameList.find(g => g.id === gameId);
                document.getElementById('mgResultTitle').textContent = info.title;
                const bestKey = 'mgBest_' + gameId;
                const prevBest = Number(localStorage.getItem(bestKey) || 0);
                const isNewBest = score > prevBest && score > 0;
                if (isNewBest) localStorage.setItem(bestKey, Math.floor(score));
                const badgeEl = document.getElementById('mgNewBestBadge');
                if (badgeEl) {
                    badgeEl.style.display = isNewBest ? 'inline-block' : 'none';
                    if (isNewBest) {
                        badgeEl.style.animation = 'gsPopIn 0.5s ease-out 0.8s both';
                        // New best celebration effects
                        setTimeout(() => {
                            GameSprites.flashScreen('rgba(255,215,0,0.3)');
                            SoundManager.play('perfect');
                            const resultScreen = document.getElementById('mgResultScreen');
                            if (resultScreen) GameSprites.spawnConfetti(resultScreen, 30);
                        }, 1000);
                    }
                }
                await this.saveScore(gameId, score);
                await this.renderResultRanking(gameId);
                // 스크롤 힌트: 컨텐츠가 넘치면 표시
                this._setupScrollHint(resultEl);
            },
            _setupScrollHint(el) {
                const hint = document.getElementById('mgResultScrollHint');
                if (!hint) return;
                const checkScroll = () => {
                    const isScrollable = el.scrollHeight > el.clientHeight + 10;
                    const atBottom = el.scrollTop + el.clientHeight >= el.scrollHeight - 20;
                    hint.style.opacity = (isScrollable && !atBottom) ? '1' : '0';
                };
                checkScroll();
                el.onscroll = checkScroll;
            },
            async saveScore(gameId, score) {
                if (!db || !this.playerName) return;
                try {
                    const now = new Date();
                    const dateStr = now.getFullYear() + '-' + String(now.getMonth()+1).padStart(2,'0') + '-' + String(now.getDate()).padStart(2,'0');
                    await db.collection('miniGameScores').add({
                        playerName: this.playerName, gameId: gameId,
                        score: Math.floor(score),
                        timestamp: firebase.firestore.FieldValue.serverTimestamp(),
                        date: dateStr
                    });
                    // Friend beat notification
                    this._checkFriendBeat(gameId, Math.floor(score));
                } catch(e) {
                    console.error('미니게임 점수 저장 실패:', e);
                    showToast('점수 저장에 실패했습니다.', 'error');
                }
            },
            async _checkFriendBeat(gameId, score) {
                try {
                    const snap = await db.collection('miniGameScores')
                        .where('gameId', '==', gameId).get();
                    const best = {};
                    snap.forEach(doc => {
                        const d = doc.data();
                        if (d.playerName !== this.playerName) {
                            if (!best[d.playerName] || d.score > best[d.playerName]) best[d.playerName] = d.score;
                        }
                    });
                    const beaten = Object.entries(best)
                        .filter(([, s]) => score > s)
                        .sort((a, b) => b[1] - a[1]);
                    if (beaten.length > 0) {
                        const [friendName, prevScore] = beaten[0];
                        setTimeout(() => {
                            showToast(`${friendName}의 기록을 넘었다! (${prevScore.toLocaleString()} → ${score.toLocaleString()})`, 'success');
                        }, 500);
                    }
                } catch(e) { /* silent fail */ }
            },
            async fetchRanking(gameId, type) {
                if (!db) return [];
                try {
                    const snap = await db.collection('miniGameScores')
                        .where('gameId', '==', gameId).get();
                    let all = [];
                    snap.forEach(doc => all.push(doc.data()));
                    if (type === 'daily') {
                        const now = new Date();
                        const ds = now.getFullYear() + '-' + String(now.getMonth()+1).padStart(2,'0') + '-' + String(now.getDate()).padStart(2,'0');
                        all = all.filter(d => d.date === ds);
                    }
                    all.sort((a, b) => b.score - a.score);
                    const best = {};
                    all.forEach(d => { if (!best[d.playerName] || d.score > best[d.playerName].score) best[d.playerName] = d; });
                    return Object.values(best).sort((a,b) => b.score - a.score).slice(0, 10);
                } catch(e) { console.error('랭킹 조회 실패:', e); return []; }
            },
            renderRankTable(data, el) {
                if (typeof el === 'string') el = document.getElementById(el);
                if (!el) return;
                if (!data || !data.length) { el.innerHTML = '<div class="mg-ranking-empty">아직 기록이 없습니다</div>'; return; }
                el.innerHTML = `<table><thead><tr><th>#</th><th>이름</th><th>점수</th></tr></thead><tbody>

            renderStatsGrid(gameId, stats) {
                const grid = document.getElementById('mgStatsGrid');
                if (!grid || !stats || typeof stats === 'string') { if (grid) grid.style.display = 'none'; return; }
                let cards = '';
                let _statIdx = 0;
                const s = (icon, value, label, full) => { const i = _statIdx++; return `<div class="mg-stat-card${full?' full-width':''}" style="animation:gsSlideUp 0.3s ease-out ${0.3 + i * 0.08}s both;"><div class="mg-stat-icon">${icon}</div><div class="mg-stat-info"><div class="mg-stat-value">${value}</div><div class="mg-stat-label">${label}</div></div></div>`; };
                if (gameId === 'penalty') {
                    cards += s('🏟️', 'R' + (stats.round||0), '도달 라운드');
                    cards += s('⚽', (stats.goals||0) + '골', '골 수');
                    cards += s('🎯', (stats.accuracy||0) + '%', '정확도');
                    cards += s('🔥', (stats.maxCombo||0) + '연속', '최대 콤보');

                    if (stats.zoneDiversity) cards += s('🎲', stats.zoneDiversity, '존 다양성 보너스');

                        let mapHtml = '<div class="mg-stat-card full-width"><div class="mg-stat-icon">📊</div><div class="mg-stat-info"><div class="mg-stat-label" style="margin-bottom:4px;">슈팅 위치 분포</div><div class="mg-shot-map">';
                        for (let i = 0; i < 9; i++) {
                            const count = stats.shotMap[i] || 0;
                            const max = Math.max(1, ...Object.values(stats.shotMap));
                            const intensity = count > 0 ? 0.3 + (count/max)*0.7 : 0.05;
                            const bg = count > 0 ? `rgba(255,107,53,${intensity})` : 'rgba(200,200,200,0.2)';
                            mapHtml += `<div class="mg-shot-cell" style="background:${bg}">${count||''}</div>`;
                        }
                        mapHtml += '</div></div></div>';

                    cards += s('🛡️', stats.defenderIntercepts||0, '수비 차단');
                    cards += s('🔥', (stats.maxCombo||0) + '연속', '최대 콤보');

                    if (stats.throughPasses) cards += s('🎯', stats.throughPasses, '스루패스');
                } else if (gameId === 'dribble') {

                    cards += s('⭐', stats.coins||0, '코인 수집');
                    cards += s('📊', 'Lv.' + (stats.level||1), '도달 레벨');
                    cards += s('🔥', (stats.maxCombo||0) + '연속', '최대 콤보');
                    cards += s('❤️', stats.heartsLeft||0, '남은 하트');
                    if (stats.nearMisses) cards += s('😱', stats.nearMisses, '니어미스');

                    if (stats.maxDodgeStreak) cards += s('💫', stats.maxDodgeStreak, '최대 연속 회피');
                } else if (gameId === 'goalkeeper') {
                    cards += s('🧤', (stats.saves||0) + '/' + ((stats.saves||0)+(stats.goals||0)), '세이브/실점');
                    cards += s('📊', (stats.saveRate||0) + '%', '세이브율');
                    cards += s('🔥', (stats.maxCombo||0) + '연속', '최대 연속 세이브');

                    if (stats.lightning) cards += s('⚡', stats.lightning, 'LIGHTNING 반응');
                    if (stats.fast) cards += s('💨', stats.fast, 'FAST 반응');

            async renderMyStats() {
                const el = document.getElementById('mgHubMyStats');
                if (!el) return;
                el.innerHTML = '<div class="mg-mystats-container">' + this._skeletonHTML() + '</div>';
                if (!db || !this.playerName) {
                    el.innerHTML = '<div class="mg-ranking-empty">로그인 후 이용 가능합니다</div>';
                    return;
                }
                try {
                    const snap = await db.collection('miniGameScores')
                        .where('playerName', '==', this.playerName).get();
                    const records = [];
                    snap.forEach(doc => records.push(doc.data()));
                    if (records.length === 0) {
                        el.innerHTML = '<div class="mg-ranking-empty">아직 플레이 기록이 없습니다</div>';
                        return;

                    const byGame = {};

                    records.forEach(r => {
                        if (!byGame[r.gameId]) byGame[r.gameId] = { plays: 0, best: 0, total: 0, scores: [] };
                        const g = byGame[r.gameId];
                        g.plays++; g.total += r.score; g.scores.push(r.score);
                        if (r.score > g.best) g.best = r.score;
                        totalPlays++;
                        if (r.score > overallBest) overallBest = r.score;
                    });
                    Object.entries(byGame).forEach(([gid, g]) => {
                        if (g.plays > favCount) { favCount = g.plays; favGame = gid; }

                    const favInfo = this.gameList.find(g => g.id === favGame);
                    let html = '<div class="mg-mystats-container">';

                        </div></div>`;
                    this.gameList.forEach(g => {
                        const d = byGame[g.id];
                        if (!d) return;
                        const avg = Math.floor(d.total / d.plays);
                        html += `<div class="mg-mystats-game"><h4>${escapeHtml(g.title)}</h4>
                            <div class="mg-mystats-game-grid">
                                <div class="mg-mystats-game-item"><span class="lbl">플레이 횟수</span><span class="val">${d.plays}회</span></div>
                                <div class="mg-mystats-game-item"><span class="lbl">최고 점수</span><span class="val">${d.best.toLocaleString()}점</span></div>
                                <div class="mg-mystats-game-item"><span class="lbl">평균 점수</span><span class="val">${avg.toLocaleString()}점</span></div>
                                <div class="mg-mystats-game-item"><span class="lbl">총 점수</span><span class="val">${d.total.toLocaleString()}점</span></div>
                            </div></div>`;
                    });
                    html += '</div>';
                    el.innerHTML = html;
                } catch(e) {
                    console.error('내 전적 조회 실패:', e);
                    el.innerHTML = '<div class="mg-ranking-empty">아직 기록이 없습니다</div>';
                }
            }
        };

        // 커스텀 이름 드롭다운 로직
        const mgNameDd = {
            _names: [], _selected: '',
            populate(names, selected) {
                this._names = names; this._selected = selected || '';

                container.innerHTML = names.map(n =>

        document.addEventListener('click', function(e) {

        // 탭/창 닫힐 때 세션 정리

        // ====== 게임 1: 넣어보던가 (Penalty Kick) ======
        const keeperTaunts = {
            roundStart: ["한번 넣어봐~", "오늘은 내가 이긴다", "그 방향 알아~", "잘 노려봐~", "준비 됐어?"],
            afterSave: ["ㅋㅋ 그거 다 읽혔어", "문찬우를 무시하지 마", "다음 것도 막아줄게", "어림없지~", "쉽네 쉬워"],
            afterGoal: ["...운이 좋았네", "다음엔 안 넣어", "지금 워밍업 중이야", "한 골은 줄 수 있지", "ㅋ 그거 하나 갖고 좋아하냐"],
            afterMiss: ["ㅋㅋ 힘 빠졌어?", "게이지 맞추기 어렵지?", "슛이 하늘로 갔는데?", "ㅋㅋㅋ 어딜 차는 거야"],
            highRound: ["이제 읽기 시작했다", "슬슬 패턴이 보여", "7라운드부터가 진짜야", "이제 못 넣어~"]
        };
        const penaltyGame = {
            round: 0, score: 0, hearts: 3, combo: 0, maxCombo: 0, goalsScored: 0,
            phase: 'aim', powerPos: 0, powerDir: 1, selectedZone: -1,
            powerInterval: null, shotHistory: [], _keeperSpeechTimeout: null, _isBossRound: false,
            _shotTimeouts: [], _perfectCount: 0, _zoneDiversityBonus: 0,
            init() {
                this.round = 0; this.score = 0; this.hearts = 3; this.combo = 0;
                this.maxCombo = 0; this.goalsScored = 0; this._isBossRound = false;
                this.phase = 'aim'; this.shotHistory = []; this._shotTimeouts = [];
                this._perfectCount = 0; this._zoneDiversityBonus = 0; this._pausedPhase = null;
                this._stopped = false;
                this._clock?.clear();
                this._clock = new FootballGameRules.PausableClock();
                this.render();
                this.nextRound();
            },
            cleanup() {
                this._stopped=true;
                this._clock?.clear();
                this.powerInterval = null;
                if (this._keeperSpeechTimeout) { this._clock.cancel(this._keeperSpeechTimeout); this._keeperSpeechTimeout = null; }
                this._shotTimeouts.forEach(t => this._clock.cancel(t));
                this._shotTimeouts = [];
                this._cleanupTouchEvents();
                const field = document.querySelector('.gs-penalty-field');
                if (field) { field.classList.remove('gs-combo-glow', 'gs-camera-shake'); }
                document.querySelectorAll('.gs-combo-banner, .gs-trajectory-ball').forEach(el => el.remove());
                ParticleSystem.clear();
            },
            _keeperMarkup(state, isBoss) {
                const expr = state === 'save' ? 'happy' : state === 'smirk' ? 'angry' : state === 'miss' ? 'sad' : 'determined';
                const color = isBoss ? '#cc0000' : '#2c3e50';
                const pose = state === 'save' ? 'celebrate' : 'standing';
                return ChibiSprite.markup(160, { jersey: color, expression: expr, pose: pose, number: 'GK', gloves: true });
            },
            pause() { this._clock.pause(); },
            resume() { this._clock.resume(); },
            _startGaugeLoop() {
                if(this.powerInterval)this._clock.cancel(this.powerInterval);
                let previous=this._clock.now();
                const tick=()=>{
                    if(!['aim','power'].includes(this.phase)||this._stopped)return;
                    const now=this._clock.now(),dt=Math.min(.05,(now-previous)/1000);previous=now;
                    if(this.phase==='power') {
                        this.powerPos+=this._profile.gaugeSpeed*dt*this.powerDir;
                        if(this.powerPos>100){this.powerPos=200-this.powerPos;this.powerDir=-1;}
                        if(this.powerPos<0){this.powerPos=-this.powerPos;this.powerDir=1;}
                        const band=this.getGreenZone();
                        document.getElementById('penaltyGreen').style.left=band.start+'%';
                        document.getElementById('penaltyGreen').style.width=band.pct+'%';
                        document.getElementById('penaltyRed').style.left=band.redStart+'%';
                        document.getElementById('penaltyRed').style.width=band.redPct+'%';
                        document.getElementById('penaltyBar').style.left=this.powerPos+'%';
                    }
                    const label=document.getElementById('penaltyPowerLabel');
                    if(label)label.textContent=Math.max(0,(this._deadline-now)/1000).toFixed(1)+'초 · '+(this._guardZones.includes(this.selectedZone)?'수비 구역은 빨간 정타 구간!':'초록 구간에서 슛!');
                    this.powerInterval=this._clock.after(tick,16);
                };
                tick();
            },
            showKeeperSpeech(category) {
                const lines = category === 'highRound' && this.round >= 7 ? keeperTaunts.highRound : keeperTaunts[category];
                if (!lines || !lines.length) return;
                const text = lines[Math.floor(Math.random() * lines.length)];
                const el = document.getElementById('keeperSpeech');
                if (!el) return;
                el.textContent = text; el.style.display = 'block'; el.style.opacity = '1';
                if (this._keeperSpeechTimeout) this._clock.cancel(this._keeperSpeechTimeout);
                this._keeperSpeechTimeout = this._clock.after(() => { if (el) { el.style.opacity = '0'; this._clock.after(() => { el.style.display = 'none'; }, 300); } }, 2000);
            },
            render() {
                this.updateHud();
                document.getElementById('mgGameArea').innerHTML = `
                    <div class="mg-keeper-msg" id="penaltyMsg">골대를 선택하세요!</div>
                    <div style="text-align:center;">
                        <div class="mg-keeper" id="penaltyKeeper">${this._keeperMarkup('ready', false)}<div style="color:rgba(255,255,255,0.8);font-size:0.75em;font-weight:700;margin-top:2px;">GK 문찬우</div></div>
                    </div>
                    <div id="keeperSpeech" style="display:none; text-align:center; background:rgba(0,0,0,0.75); color:white; padding:3px 14px; border-radius:12px; font-size:0.8em; white-space:nowrap; margin:4px auto 2px; width:fit-content; max-width:90vw; overflow:hidden; text-overflow:ellipsis; transition:opacity 0.3s;"></div>
                    <div class="gs-penalty-field">
                        <div style="width:100%;max-width:308px;height:1px;background:rgba(255,255,255,0.12);margin-bottom:4px;"></div>
                        <div class="gs-goal-post-top"></div>
                        <div class="gs-goal-net" id="penaltyGoal">
                            ${[0,1,2,3,4,5,6,7,8].map(i => `<div class="gs-goal-zone" data-zone="${i}"></div>`).join('')}
                        </div>
                        <div class="gs-goal-post-bottom"></div>
                        <div style="width:80%;max-width:260px;margin-top:6px;border:1px solid rgba(255,255,255,0.08);border-top:none;height:14px;border-radius:0 0 4px 4px;"></div>
                    </div>
                    <div class="gs-power-gauge" id="penaltyGauge" style="display:none;">
                        <div class="gs-power-green" id="penaltyGreen"></div>
                        <div class="gs-power-red" id="penaltyRed"></div>
                        <div class="gs-power-bar" id="penaltyBar"></div>
                    </div>
                    <div class="mg-power-label" id="penaltyPowerLabel" style="color:white;"></div>`;
                this._bindTouchEvents();
            },
            _boundZoneHandlers: [],
            _boundGaugeHandler: null,
            _touchUsedPenalty: false,
            _bindTouchEvents() {
                this._cleanupTouchEvents();
                this._touchUsedPenalty = false;
                document.querySelectorAll('.gs-goal-zone').forEach(zone => {
                    const i = parseInt(zone.dataset.zone);
                    const handler = (e) => {
                        if (e.type === 'touchstart') { e.preventDefault(); this._touchUsedPenalty = true; }
                        if (e.type === 'click' && this._touchUsedPenalty) return;
                        this.selectZone(i);
                    };
                    zone.addEventListener('touchstart', handler, { passive: false });
                    zone.addEventListener('click', handler);
                    this._boundZoneHandlers.push({ el: zone, handler });
                });
                const gauge = document.getElementById('penaltyGauge');
                if (gauge) {
                    this._boundGaugeHandler = (e) => {
                        if (e.type === 'touchstart') { e.preventDefault(); this._touchUsedPenalty = true; }
                        if (e.type === 'click' && this._touchUsedPenalty) return;
                        this.stopPower();
                    };
                    gauge.addEventListener('touchstart', this._boundGaugeHandler, { passive: false });
                    gauge.addEventListener('click', this._boundGaugeHandler);
                }
            },
            _cleanupTouchEvents() {
                this._boundZoneHandlers.forEach(({ el, handler }) => {
                    el.removeEventListener('touchstart', handler);
                    el.removeEventListener('click', handler);
                });
                this._boundZoneHandlers = [];
                if (this._boundGaugeHandler) {
                    const gauge = document.getElementById('penaltyGauge');
                    if (gauge) {
                        gauge.removeEventListener('touchstart', this._boundGaugeHandler);
                        gauge.removeEventListener('click', this._boundGaugeHandler);
                    }
                    this._boundGaugeHandler = null;
                }
            },
            updateHud() {
                document.getElementById('mgHud').innerHTML = `
                    ${GameSprites.roundBadge(this.round)}
                    ${GameSprites.healthBar(this.hearts, 3)}
                    ${GameSprites.scorePanel(this.score)}
                    ${GameSprites.comboIndicator(this.combo)}`;
            },
            nextRound() {
                this.round++; this.phase = 'aim'; this.selectedZone = -1;
                this._profile=FootballGameRules.penalty(this._clock.now()/1000,this.round);
                this._deadline=this._clock.now()+this._profile.deadline*1000;
                const recent=this.shotHistory.slice(-3),guard=(this.round*2)%9;
                this._guardZones=[...new Set([...recent.reverse(),guard])].slice(0,this._profile.guards);
                for(let i=0;this._guardZones.length<this._profile.guards;i++){const zone=(guard+i+3)%9;if(!this._guardZones.includes(zone))this._guardZones.push(zone);}
                this._roundTimer=this._clock.after(()=>this.stopPower(true),this._profile.deadline*1000);
                this._isBossRound = this.round > 1 && this.round % 5 === 0;
                this.updateHud();
                const msg = document.getElementById('penaltyMsg');
                if (this._isBossRound) {
                    SoundManager.play('boss');
                    if (msg) msg.textContent = `⚠️ 라운드 ${this.round} - 분노한 문찬우!`;
                    this._clock.after(() => this.showKeeperSpeech('roundStart'), 300);
                    const keeper = document.getElementById('penaltyKeeper');
                    if (keeper) keeper.innerHTML = `<div style="position:relative;display:inline-block;">${this._keeperMarkup('ready', true)}<div style="position:absolute;bottom:-16px;left:50%;transform:translateX(-50%);color:#ff4757;font-size:0.7em;font-weight:800;white-space:nowrap;text-shadow:0 0 8px rgba(255,71,87,0.5);">분노한 문찬우</div></div>`;
                    const field = document.querySelector('.gs-penalty-field');
                    if (field) field.classList.add('gs-boss-active');
                } else {
                    if (msg) msg.textContent = `라운드 ${this.round} - 슈팅 위치를 선택하세요!`;
                    this._clock.after(() => this.showKeeperSpeech(this.round >= 7 ? 'highRound' : 'roundStart'), 300);
                    const keeper = document.getElementById('penaltyKeeper');
                    if (keeper) keeper.innerHTML = `${this._keeperMarkup('ready', false)}<div style="color:rgba(255,255,255,0.8);font-size:0.75em;font-weight:700;margin-top:2px;">GK 문찬우</div>`;
                    const field = document.querySelector('.gs-penalty-field');
                    if (field) field.classList.remove('gs-boss-active');
                }
                document.querySelectorAll('.gs-goal-zone').forEach((z, idx) => {
                    z.className = 'gs-goal-zone'; z.innerHTML = '';
                    z.setAttribute('aria-label',(idx+1)+'번 슈팅 구역'+(this._guardZones.includes(idx)?' · 키퍼 수비':''));
                    if (this._guardZones.includes(idx)) {
                        z.classList.add('warned');
                        z.innerHTML = `<span class="warn-icon">!</span>`;
                    }
                });
                const gauge = document.getElementById('penaltyGauge');
                if (gauge) gauge.style.display = 'none';
                const label = document.getElementById('penaltyPowerLabel');
                if (label) { label.textContent = ''; label.style.color = 'white'; }
                this._startGaugeLoop();
            },
            selectZone(i) {
                if (this.phase !== 'aim'||this._stopped||mgManager.paused||!Number.isInteger(i)||i<0||i>8) return;
                this.selectedZone = i; this.phase = 'power';
                document.querySelectorAll('.gs-goal-zone').forEach((z, idx) => {
                    z.classList.remove('warned');
                    z.innerHTML = idx === i ? `<img src="${GameSprites.svgBall(28)}" alt="ball" class="gs-ball-approach">` : '';
                });
                document.getElementById('penaltyMsg').textContent = '파워 게이지를 탭하세요!';
                this.startPowerGauge();
            },
            getGreenZone() {
                return FootballGameRules.penaltyBand(this._profile,this._clock.now()/1000*1.6+this.round*.7);
            },
            startPowerGauge() {
                const gauge = document.getElementById('penaltyGauge');
                gauge.style.display = 'block';
                const green = this.getGreenZone();
                document.getElementById('penaltyGreen').style.left = green.start + '%';
                document.getElementById('penaltyGreen').style.width = green.pct + '%';
                const redEl = document.getElementById('penaltyRed');
                if (redEl) { redEl.style.left = green.redStart + '%'; redEl.style.width = green.redPct + '%'; }
                document.getElementById('penaltyPowerLabel').textContent = '탭하여 슈팅!';
                this.powerPos = 0; this.powerDir = 1;
                this._startGaugeLoop();
            },
            stopPower(expired=false) {
                if(this._stopped||mgManager.paused)return;
                if(expired&&this.phase==='aim'){this.phase='power';this.selectedZone=4;}
                if(this.phase!=='power')return;
                if(expired)this.powerPos=-Infinity;
                this._clock.cancel(this._roundTimer);
                this.phase = 'shot';
                this._clock.cancel(this.powerInterval); this.powerInterval = null;
                const green = this.getGreenZone();
                const inGreen = this.powerPos >= green.start && this.powerPos <= green.end;
                const inRedZone = this.powerPos >= green.redStart && this.powerPos <= green.redEnd;
                const accuracy = Math.max(0, 50 - Math.abs(this.powerPos - green.center));
                // Power gauge result text
                const center = (green.start + green.end) / 2;
                const distFromCenter = Math.abs(this.powerPos - center);
                const greenHalf = green.pct / 2;
                const label = document.getElementById('penaltyPowerLabel');
                if (label) {
                    if (inRedZone) { label.textContent = '불가능한 슛!'; label.style.color = '#ff3232'; }
                    else if (inGreen && distFromCenter < greenHalf * 0.3) { label.textContent = '완벽!'; label.style.color = '#2ecc71'; }
                    else if (inGreen && distFromCenter < greenHalf * 0.7) { label.textContent = '좋아!'; label.style.color = '#f1c40f'; }
                    else if (inGreen) { label.textContent = '아슬아슬'; label.style.color = '#e67e22'; }
                    else { label.textContent = '빗나갈 수도...'; label.style.color = '#e74c3c'; }
                }
                const zone=this.selectedZone;
                const outcome=FootballGameRules.penaltyOutcome(this.powerPos,green,zone,this._guardZones);
                const miss=outcome.miss,saved=outcome.saved,isPerfect=outcome.perfect;
                const recentZones=new Set([...this.shotHistory.slice(-4),zone]);
                if(recentZones.size>=4)this._zoneDiversityBonus++;
                this.shotHistory.push(zone);
                if(expired&&label)label.textContent='시간 초과!';
                // Trajectory animation
                this._showTrajectory(zone, miss);
                this._shotTimeouts.push(this._clock.after(() => {
                    const zones = document.querySelectorAll('.gs-goal-zone');
                    if (miss) {
                        document.getElementById('penaltyMsg').textContent = '빗나갔다!';
                        document.getElementById('penaltyKeeper').innerHTML = `${this._keeperMarkup('smirk', this._isBossRound)}`;
                        this.hearts--; this.combo = 0;
                        const mField = document.querySelector('.gs-penalty-field');
                        if (mField) mField.classList.remove('gs-combo-glow');
                        SoundManager.play('miss');
                        this.showKeeperSpeech('afterMiss');
                    } else if (saved) {
                        if (zones[zone]) { zones[zone].classList.add('saved'); zones[zone].innerHTML = `<img src="${GameSprites.svgGlove(32, 'save')}" alt="save">`; }
                        document.getElementById('penaltyMsg').textContent = '문찬우 선방!';
                        document.getElementById('penaltyKeeper').innerHTML = `${this._keeperMarkup('save', this._isBossRound)}`;
                        this.hearts--; this.combo = 0;
                        const sField = document.querySelector('.gs-penalty-field');
                        if (sField) sField.classList.remove('gs-combo-glow');
                        SoundManager.play('save');
                        this.showKeeperSpeech('afterSave');
                    } else {
                        if (zones[zone]) { zones[zone].classList.add('scored'); zones[zone].innerHTML = `<img src="${GameSprites.svgBall(24)}" alt="goal">`; }
                        document.getElementById('penaltyMsg').textContent = '골!!';
                        document.getElementById('penaltyKeeper').innerHTML = `${this._keeperMarkup('miss', this._isBossRound)}`;
                        this.combo++;
                        this.goalsScored++;
                        if (isPerfect) this._perfectCount++;
                        if (this.combo > this.maxCombo) this.maxCombo = this.combo;
                        const mult = this.combo >= 5 ? 2.5 : this.combo >= 4 ? 2 : this.combo >= 3 ? 1.5 : 1;
                        const bossMult = this._isBossRound ? 2.0 : 1;
                        const perfectBossMult = (isPerfect && this._isBossRound) ? 1.3 : 1;
                        const pts = Math.floor((this.round * 100 + accuracy) * mult * bossMult * perfectBossMult);
                        this.score += pts;
                        let bonusText = '';
                        if (isPerfect && this._isBossRound) { bonusText = ' (퍼펙트+보스!)'; SoundManager.play('perfect'); }
                        else if (isPerfect) { bonusText = ' (퍼펙트 파워!)'; SoundManager.play('perfect'); }
                        else if (this._isBossRound) bonusText = ' (보스 보너스!)';
                        document.getElementById('penaltyPowerLabel').textContent = `+${pts}점!` + bonusText;
                        SoundManager.play('goal');
                        this.showKeeperSpeech('afterGoal');
                        // Enhanced combo effects
                        const field = document.querySelector('.gs-penalty-field');
                        if (this.combo >= 7) {
                            GameSprites.flashScreen('rgba(255,215,0,0.35)');
                            if (field) { GameSprites.spawnConfetti(field, 40); field.classList.add('gs-combo-glow'); field.classList.add('gs-camera-shake'); this._shotTimeouts.push(this._clock.after(() => field.classList.remove('gs-camera-shake'), 500)); }
                            this._showComboBanner('UNSTOPPABLE!');
                        } else if (this.combo >= 5) {
                            GameSprites.flashScreen('rgba(255,215,0,0.3)');
                            GameSprites.flashScreen('rgba(255,107,53,0.2)');
                            if (field) { GameSprites.spawnConfetti(field, 30); field.classList.add('gs-combo-glow'); }
                            this._showComboBanner('ON FIRE!');
                        } else if (this.combo === 4) {
                            GameSprites.flashScreen('rgba(255,215,0,0.28)');
                            if (field) { GameSprites.spawnConfetti(field, 25); field.classList.add('gs-combo-glow'); }
                            this._showComboBanner('연속 4골!');
                        } else if (this.combo === 3) {
                            GameSprites.flashScreen('rgba(255,215,0,0.25)');
                            if (field) GameSprites.spawnConfetti(field, 20);
                            this._showComboBanner('해트트릭!');
                        } else {
                            GameSprites.flashScreen('rgba(46,204,113,0.25)');
                            if (field) { GameSprites.spawnConfetti(field, 10); field.classList.remove('gs-combo-glow'); }
                        }
                    }
                    this.updateHud();
                    if (this.hearts <= 0) {
                        this._stopped = true;
                        const shotMap = {};
                        this.shotHistory.forEach(z => { shotMap[z] = (shotMap[z]||0) + 1; });
                        const accuracy = this.shotHistory.length > 0 ? Math.round(this.goalsScored / this.shotHistory.length * 100) : 0;
                        this._shotTimeouts.push(this._clock.after(() => mgManager.showResult('penalty', this.score, {
                            _summary: `라운드 ${this.round}까지 도달!`,
                            round: this.round, goals: this.goalsScored,
                            accuracy: accuracy, maxCombo: this.maxCombo, shotMap: shotMap,
                            perfectShots: this._perfectCount, zoneDiversity: this._zoneDiversityBonus
                        }), 1200));
                    } else {
                        this._shotTimeouts.push(this._clock.after(() => this.nextRound(), 1500));
                    }
                }, 500));
            },
            _showTrajectory(zone, miss) {
                const field = document.querySelector('.gs-penalty-field');
                if (!field) return;
                const zones = document.querySelectorAll('.gs-goal-zone');
                if (!zones[zone]) return;
                const ball = document.createElement('img');
                ball.src = GameSprites.svgBall(24);
                ball.className = 'gs-trajectory-ball ' + (miss ? 'miss' : 'goal');
                // Calculate position based on actual zone element
                const fieldRect = field.getBoundingClientRect();
                const zoneRect = zones[zone].getBoundingClientRect();
                const leftPx = zoneRect.left - fieldRect.left + zoneRect.width / 2;
                const topPx = zoneRect.top - fieldRect.top + zoneRect.height / 2;
                ball.style.left = leftPx + 'px';
                ball.style.top = topPx + 'px';
                field.style.position = 'relative';
                field.appendChild(ball);
                this._shotTimeouts.push(this._clock.after(() => ball.remove(), 600));
            },
            _showComboBanner(text) {
                const field = document.querySelector('.gs-penalty-field');
                if (!field) return;
                const banner = document.createElement('div');
                banner.className = 'gs-combo-banner';
                banner.textContent = text;
                field.appendChild(banner);
                this._shotTimeouts.push(this._clock.after(() => banner.remove(), 1300));
            }
        };

        // ====== 게임 2: 용혁이의 패스 연습 ======
        const passReactions = {
            hit: ["나이스패스!", "킬패스!", "완벽해!", "딱이야!"],
            defenderHit: ["수비수한테 걸렸네~", "패스 컷!", "아이고~"]
        };
        const passGame = {
            canvas: null, ctx: null, w: 0, h: 0,
            ball: null, targets: [], defenders: [], particles: [],
            score: 0, combo: 0, timer: 40, elapsed: 0,
            totalPasses: 0, successPasses: 0,
            centerHits: 0, defenderIntercepts: 0, maxCombo: 0,
            _longPasses: 0, _throughPasses: 0,
            dragging: false, dragStart: null, dragEnd: null,
            animFrame: null, timerInterval: null, spawnInterval: null, defenderTimeout: null, lastTime: 0,
            _lastTickTime: 0, _timerBonus: 0,
            _reactionText: '', _reactionTimer: 0, _reactionX: 0, _reactionY: 0,
            _timeBonusAnim: 0, _timeBonusText: '', _lastThroughPass: false,
            init() {
                this.score = 0; this.combo = 0; this.timer = 40; this.elapsed = 0;
                this.totalPasses = 0; this.successPasses = 0;
                this.centerHits = 0; this.defenderIntercepts = 0; this.maxCombo = 0;
                this._longPasses = 0; this._throughPasses = 0;
                this.targets = []; this.defenders = []; this.particles = [];
                this._motionTime = 0;this._physicsRemainder=0;this._targetSequence=0;
                this.dragging = false; this.defenderTimeout = null; this._ballTrail = [];
                this._reactionText = ''; this._reactionTimer = 0; this._stopped = false;
                this._timerBonus = 0; this._lastTickTime = Date.now();
                const area = document.getElementById('mgGameArea');
                this.w = Math.min(area.clientWidth - 10, 600);
                const maxH = Math.round(window.innerHeight * 0.65);
                this.h = Math.min(Math.round(this.w * 1.3), maxH);
                area.innerHTML = `<div class="mg-canvas-wrap" style="width:${this.w}px;"><canvas id="passCanvas" width="${this.w}" height="${this.h}"></canvas></div>`;
                this.canvas = document.getElementById('passCanvas');
                this.ctx = this.canvas.getContext('2d');
                this.ball = { x: this.w / 2, y: this.h - 60, r: 14, vx: 0, vy: 0, active: false };
                this.bindEvents();
                this._doResize = () => {
                    if (this._stopped) return;
                    const area = document.getElementById('mgGameArea');
                    if (!area || !this.canvas) return;
                    const oldW = this.w, oldH = this.h;
                    this.w = Math.min(area.clientWidth - 10, 600);
                    const maxH = Math.round(window.innerHeight * 0.65);
                    this.h = Math.min(Math.round(this.w * 1.3), maxH);
                    this.canvas.width = this.w; this.canvas.height = this.h;
                    this.canvas.parentElement.style.width = this.w + 'px';
                    const sx = this.w / oldW, sy = this.h / oldH;
                    this.ball.x *= sx; this.ball.y *= sy;
                    if (this.ball.active) { this.ball.vx *= sx; this.ball.vy *= sy; }
                    this.targets.forEach(t => { t.x *= sx; t.y *= sy; });
                    this.defenders.forEach(d => { d.x *= sx; d.y *= sy; });
                };
                this._resizeHandler = this._debounce(() => this._doResize(), 200);
                this._orientationHandler = () => setTimeout(() => this._doResize(), 50);
                window.addEventListener('resize', this._resizeHandler);
                window.addEventListener('orientationchange', this._orientationHandler);
                this.updateHud();
                this.spawnTarget();
                this.timerInterval = setInterval(() => this.updateHud(), 100);
                this.spawnInterval = setInterval(() => this.spawnTarget(), 3000);
                this.defenderTimeout = setTimeout(() => this.spawnDefender(), 8000);
                this.lastTime = performance.now();
                this.loop();
            },
            cleanup() {
                this._stopped = true;
                if (this.animFrame) cancelAnimationFrame(this.animFrame);
                if (this.timerInterval) clearInterval(this.timerInterval);
                if (this.spawnInterval) clearInterval(this.spawnInterval);
                if (this.defenderTimeout) clearTimeout(this.defenderTimeout);
                this.animFrame = null; this.timerInterval = null; this.spawnInterval = null; this.defenderTimeout = null;
                if (this.canvas) {
                    this.canvas.removeEventListener('mousedown', this._md);
                    this.canvas.removeEventListener('touchstart', this._ts);
                    this.canvas.removeEventListener('touchmove', this._tm);
                    this.canvas.removeEventListener('touchend', this._te);
                }
                window.removeEventListener('mousemove', this._mm);
                window.removeEventListener('mouseup', this._mu);
                if (this._resizeHandler) {
                    window.removeEventListener('resize', this._resizeHandler);
                    this._resizeHandler = null;
                }
                if (this._orientationHandler) {
                    window.removeEventListener('orientationchange', this._orientationHandler);
                    this._orientationHandler = null;
                }
                ParticleSystem.clear();
            },
            _debounce(fn, delay) {
                let timer = null;
                return () => { clearTimeout(timer); timer = setTimeout(fn, delay); };
            },
            bindEvents() {
                const getPos = (e) => {
                    const rect = this.canvas.getBoundingClientRect();
                    const sx = this.w / rect.width, sy = this.h / rect.height;
                    if (e.touches) return { x: (e.touches[0].clientX - rect.left) * sx, y: (e.touches[0].clientY - rect.top) * sy };
                    return { x: (e.clientX - rect.left) * sx, y: (e.clientY - rect.top) * sy };
                };
                this._md = (e) => {
                    if(this.ball.active||this._stopped||mgManager.paused)return;
                    const p = getPos(e);
                    if (Math.hypot(p.x - this.ball.x, p.y - this.ball.y) < 40) {
                        this.dragging = true;
                        this.dragStart = { x: this.ball.x, y: this.ball.y };
                        this.dragEnd = p;
                    }
                };
                this._mm = (e) => { if (this.dragging) this.dragEnd = getPos(e); };
                this._mu = (e) => {
                    if(!this.dragging||this._stopped||mgManager.paused)return;
                    this.dragging = false;
                    const dx = this.dragStart.x - this.dragEnd.x, dy = this.dragStart.y - this.dragEnd.y;
                    const dist = Math.hypot(dx, dy);
                    if (dist > 15) {
                        const power = Math.min(dist / 8, 18);
                        const angle = Math.atan2(dy, dx);
                        this.ball.vx = Math.cos(angle) * power;
                        this.ball.vy = Math.sin(angle) * power;
                        this.ball.active = true;
                        this.totalPasses++;
                    }
                };
                this._ts = (e) => { e.preventDefault(); this._md(e); };
                this._tm = (e) => { e.preventDefault(); this._mm(e); };
                this._te = (e) => { e.preventDefault(); this._mu(e); };
                this.canvas.addEventListener('mousedown', this._md);
                window.addEventListener('mousemove', this._mm);
                window.addEventListener('mouseup', this._mu);
                this.canvas.addEventListener('touchstart', this._ts, { passive: false });
                this.canvas.addEventListener('touchmove', this._tm, { passive: false });
                this.canvas.addEventListener('touchend', this._te, { passive: false });
            },
            updateHud() {
                document.getElementById('mgHud').innerHTML = `
                    ${GameSprites.timerBar(this.timer, 45)}
                    ${GameSprites.scorePanel(this.score)}
                    ${GameSprites.comboIndicator(this.combo)}`;
            },
            _pickPattern() {
                const patterns=FootballGameRules.passing(this.elapsed).patterns;
                return patterns[this._targetSequence%patterns.length];
            },
            spawnTarget() {
                const profile=FootballGameRules.passing(this.elapsed);
                if(this.targets.length>=profile.maxTargets)return;
                const sz=profile.radius,sp=profile.speed;
                const m = 40;
                let tx, ty, tries = 0;
                do {
                    tx = m + Math.random() * (this.w - m * 2);
                    ty = m + Math.random() * (this.h * 0.6);
                    tries++;
                } while (tries < 10 && this.defenders.some(d => Math.hypot(d.x - tx, d.y - ty) < d.r + sz + 20));
                const _pl = (typeof players !== 'undefined' && players.length > 0) ? players : defaultPlayers;
                const tName = _pl[Math.floor(Math.random() * _pl.length)].name;
                const pattern = this._pickPattern();
                this.targets.push({
                    x: tx, y: ty, r: sz,
                    vx: (Math.random() - 0.5) * sp * 2, vy: (Math.random() - 0.5) * sp * 2,
                    name: tName, pattern: pattern,
                    _t: Math.random() * Math.PI * 2,
                    _cx: tx, _cy: ty, _sp: sp, life:profile.targetLife, maxLife:profile.targetLife, golden:++this._targetSequence%4===0
                });
            },
            spawnDefender() {
                if (!this.timerInterval) return;
                const profile=FootballGameRules.passing(this.elapsed),count=profile.defenders;
                if (this.defenders.length < count) {
                    const dSpeed=profile.defenderSpeed;
                    this.defenders.push({
                        x: 30 + Math.random() * (this.w - 60), y: 50 + Math.random() * (this.h * 0.5),
                        r: 16, vx: (Math.random() - 0.5) * dSpeed, vy: (Math.random() - 0.5) * dSpeed, screen:profile.movingGate&&!this.defenders.some(d=>d.screen), phase:0
                    });
                }
                this.defenderTimeout = setTimeout(() => this.spawnDefender(), 3500);
            },
            loop() {
                if (this._stopped) return;
                const now = performance.now();
                const dt = Math.min((now - this.lastTime) / (1000/60), 3);
                this.lastTime = now;
                this._physicsRemainder+=dt;
                while(this._physicsRemainder>=.5&&!this._stopped){this.update(.5);this._physicsRemainder-=.5;}
                if(!this._stopped)this.draw();
                if (!this._stopped) this.animFrame = requestAnimationFrame(() => this.loop());
            },
            update(dt) {
                const seconds=dt/60,profile=FootballGameRules.passing(this.elapsed);
                this.elapsed+=seconds;this._motionTime+=seconds;
                this.timer=Math.max(0,this.timer-profile.drain*seconds);
                if(this.timer<=0){this.endGame();return;}
                for(const target of this.targets)target.life-=seconds;
                const expired=this.targets.filter(target=>target.life<=0).length;
                if(expired){this.targets=this.targets.filter(target=>target.life>0);this.combo=0;this.timer=Math.max(0,this.timer-expired*.6);}
                if(!this.targets.length)this.spawnTarget();
                if (this.ball.active) {
                    // Ball trail
                    if (!this._ballTrail) this._ballTrail = [];
                    this._ballTrail.push({ x: this.ball.x, y: this.ball.y });
                    if (this._ballTrail.length > 4) this._ballTrail.shift();
                    this.ball.x += this.ball.vx * dt; this.ball.y += this.ball.vy * dt;
                    this.ball.vx *= Math.pow(.98,dt); this.ball.vy *= Math.pow(.98,dt);
                    for (let i = this.targets.length - 1; i >= 0; i--) {
                        const t = this.targets[i];
                        const dist = Math.hypot(this.ball.x - t.x, this.ball.y - t.y);
                        if (dist < t.r + this.ball.r) {
                            // The receiver catches at the outer radius. Judge aim along the
                            // incoming path so a straight pass can still earn a center hit.
                            const velocity=Math.hypot(this.ball.vx,this.ball.vy);
                            const aimDistance=velocity>.01?Math.abs((t.x-this.ball.x)*this.ball.vy-(t.y-this.ball.y)*this.ball.vx)/velocity:dist;
                            const center = aimDistance < t.r * 0.5;
                            this.combo++;
                            if (this.combo > this.maxCombo) this.maxCombo = this.combo;
                            if (center) this.centerHits++;
                            const mult = this.combo >= 5 ? 2.5 : this.combo >= 4 ? 2 : this.combo >= 3 ? 1.5 : 1;
                            // Long pass bonus: >50% canvas height distance
                            const passDist = Math.hypot(t.x - (this.w / 2), t.y - (this.h - 60));
                            const isLongPass = passDist > this.h * 0.5;
                            const longPassMult = isLongPass ? 1.5 : 1;
                            if (isLongPass) this._longPasses++;
                            // Through pass detection: ball passed within 25px of a defender
                            let isThroughPass = false;
                            for (const d of this.defenders) {
                                if (this._ballTrail && this._ballTrail.some(bp => Math.hypot(bp.x - d.x, bp.y - d.y) < 25 + d.r)) {
                                    isThroughPass = true; break;
                                }
                            }
                            let throughPts = 0;
                            if (isThroughPass) { throughPts = 75; this._throughPasses++; }
                            this.score += Math.floor((center ? 100 : 50) * mult * longPassMult * (t.golden?1.75:1)) + throughPts;
                            this.successPasses++;
                            SoundManager.play('goal');
                            let timeBonus = profile.bonus;
                            if (isLongPass) timeBonus += 0.15;
                            if (isThroughPass) timeBonus += 0.25;
                            // Combo time bonus
                            if (this.combo >= 5) timeBonus += 0.25;
                            else if (this.combo >= 3) timeBonus += 0.15;
                            this.timer=Math.min(45,this.timer+timeBonus);
                            // Time bonus floating animation
                            this._timeBonusAnim = 30;
                            this._timeBonusText = '+' + timeBonus.toFixed(1) + 's';
                            // Sparkle particles on hit
                            ParticleSystem.emit('sparkle', t.x, t.y, isThroughPass ? 12 : 8, 20);
                            if (isThroughPass) { this._lastThroughPass = true; ParticleSystem.emit('confetti', t.x, t.y, 8, 30); }
                            else this._lastThroughPass = false;
                            let reactionText = passReactions.hit[Math.floor(Math.random() * passReactions.hit.length)];
                            if(t.golden)reactionText='골든 패스!';
                            else if (isThroughPass) reactionText = '스루패스!';
                            else if (isLongPass) reactionText = '롱패스!';
                            this._reactionText = reactionText;
                            this._reactionTimer = 60; this._reactionX = t.x; this._reactionY = t.y - t.r - 15;
                            const particleColor = isThroughPass ? '#ff6b35' : isLongPass ? '#70a1ff' : center ? '#ffd700' : '#2ed573';
                            for (let j = 0; j < 6; j++) this.particles.push({
                                x: t.x, y: t.y, vx: (Math.random()-0.5)*4, vy: (Math.random()-0.5)*4,
                                life: 20, color: particleColor
                            });
                            this.targets.splice(i, 1); this.resetBall(); this.spawnTarget(); this.updateHud(); break;
                        }
                    }
                    if(this.ball.active)for (const d of this.defenders) {
                        if (Math.hypot(this.ball.x - d.x, this.ball.y - d.y) < d.r + this.ball.r) {
                            if (this.combo >= 3) this._showComboBreak();
                            this.combo = 0; this.timer=Math.max(0,this.timer-3);
                            this.defenderIntercepts++;
                            SoundManager.play('miss');
                            GameAnim.shakeCanvas(6);
                            ParticleSystem.emit('impact', d.x, d.y, 6, 15);
                            this._reactionText = passReactions.defenderHit[Math.floor(Math.random() * passReactions.defenderHit.length)];
                            this._reactionTimer = 60; this._reactionX = d.x; this._reactionY = d.y - d.r - 15;
                            this.resetBall(); this.updateHud(); break;
                        }
                    }
                    const spd = Math.hypot(this.ball.vx, this.ball.vy);
                    if (this.ball.active && spd < 0.3) {
                        if (this.combo >= 3) this._showComboBreak();
                        this.combo = 0; this.resetBall(); this.updateHud();
                    } else if (this.ball.active && (this.ball.x < -20 || this.ball.x > this.w+20 || this.ball.y < -20 || this.ball.y > this.h+20)) {
                        if (this.combo >= 3) this._showComboBreak();
                        this.combo = 0; this.resetBall(); this.updateHud();
                    }
                }
                this.targets.forEach(t => {
                    t._t = (t._t || 0) + 0.03 * dt;
                    const sp = t._sp || 1;
                    const orbitR = 30 + sp * 15;
                    if (t.pattern === 'circular') {
                        t.x = t._cx + Math.cos(t._t) * orbitR;
                        t.y = t._cy + Math.sin(t._t) * orbitR;
                    } else if (t.pattern === 'zigzag') {
                        if (!t._zyDir) t._zyDir = 1;
                        t._cy += sp * 0.3 * dt * t._zyDir;
                        t.x = t._cx + Math.sin(t._t * 3) * orbitR;
                        t.y = t._cy;
                        if (t._cy > this.h * 0.65 || t._cy < t.r) { t._zyDir *= -1; t._cy = Math.max(t.r, Math.min(this.h * 0.65, t._cy)); }
                    } else if (t.pattern === 'figure8') {
                        t.x = t._cx + Math.sin(t._t) * orbitR;
                        t.y = t._cy + Math.sin(t._t * 2) * orbitR * 0.6;
                    } else {
                        t.x += t.vx * dt; t.y += t.vy * dt;
                        if (t.x < t.r || t.x > this.w - t.r) t.vx *= -1;
                        if (t.y < t.r || t.y > this.h * 0.7) t.vy *= -1;
                    }
                    t.x = Math.max(t.r, Math.min(this.w - t.r, t.x));
                    t.y = Math.max(t.r, Math.min(this.h * 0.7, t.y));
                });
                this.defenders.forEach(d => {
                    if(d.screen){d.phase+=seconds*(1+this.elapsed/180);d.x=this.w/2+Math.sin(d.phase)*this.w*.34;}
                    else d.x+=d.vx*dt;
                    d.y+=d.vy*dt;
                    if (d.x < d.r || d.x > this.w - d.r) d.vx *= -1;
                    if (d.y < d.r || d.y > this.h * 0.6) d.vy *= -1;
                });
                this.particles.forEach(p => { p.x += p.vx * dt; p.y += p.vy * dt; p.life -= dt; });
                this.particles = this.particles.filter(p => p.life > 0);
                if (this._reactionTimer > 0) this._reactionTimer -= dt;
                if (this._timeBonusAnim > 0) this._timeBonusAnim -= dt;
                // Update shared systems
                ParticleSystem.update(dt / 60);
                GameAnim.updateTweens(dt);
            },
            resetBall() {
                this.ball.x = this.w / 2; this.ball.y = this.h - 60;
                this.ball.vx = 0; this.ball.vy = 0; this.ball.active = false;
                this._ballTrail = []; this._lastThroughPass = false;
            },
            _showComboBreak() {
                const wrap = this.canvas.parentElement;
                if (!wrap) return;
                const el = document.createElement('div');
                el.className = 'mg-combo-break';
                el.textContent = 'COMBO BREAK';
                wrap.appendChild(el);
