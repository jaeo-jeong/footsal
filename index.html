        // 클립보드 복사
        function copyTeamsToClipboard() {
            if (!currentTeamsData) {
                showToast('팀 결과가 없습니다.', 'warning');
                return;
            }
            let text = '';
            currentTeamsData.forEach((team, i) => {
                const tierSum = team.reduce((sum, p) => sum + getEffectiveWeight(p), 0);
                const avg = team.length > 0 ? (tierSum / team.length).toFixed(1) : 0;
                text += `[팀 ${i + 1}] 평균 ${avg}\n`;
                text += team.map(p => showTier ? `${p.name}(${tierLabel(p.tier)})` : p.name).join(', ') + '\n\n';
            });
            const textToCopy = text.trim();
            if (navigator.clipboard && window.isSecureContext) {
                navigator.clipboard.writeText(textToCopy).then(() => {
                    showToast('클립보드에 복사되었습니다.', 'success');
                }).catch(() => {
                    showToast('복사에 실패했습니다.', 'error');
                });
            } else {
                const textarea = document.createElement('textarea');
                textarea.value = textToCopy;
                textarea.style.position = 'fixed';
                textarea.style.opacity = '0';
                document.body.appendChild(textarea);
                textarea.select();
                try {
                    document.execCommand('copy');
                    showToast('클립보드에 복사되었습니다.', 'success');
                } catch (e) {
                    showToast('복사에 실패했습니다.', 'error');
                }
                document.body.removeChild(textarea);
            }
        }

        // 팀 히스토리 보기
        function showTeamHistory() {
            const section = document.getElementById('teamHistorySection');
            if (section.style.display === 'block') { section.style.display = 'none'; return; }
            visibleTeamHistory = [
                ...teamPreviewHistory.map(entry => ({ ...entry, label: '재추첨 후보' })),
                ...readTeamHistory(CONFIRMED_TEAM_HISTORY_KEY).map(entry => ({ ...entry, label: '확정 경기' })),
                ...readTeamHistory(TEAM_HISTORY_KEY).map(entry => ({ ...entry, label: '이전 생성 기록' }))
            ];
            if (!visibleTeamHistory.length) { showToast('이전 팀 기록이 없습니다.', 'warning'); return; }
            section.style.display = 'block';
            section.innerHTML = '<div class="team-history-section"><h3>이 기기의 팀 기록</h3>' + visibleTeamHistory.map((entry, index) =>
                '<div class="history-item" onclick="restoreTeamHistory(' + index + ')"><div>' + escapeHtml(entry.label) + ' · ' + escapeHtml(entry.date || '') +
                '</div><div>' + entry.teams.map((team, i) => '팀 ' + (i + 1) + ' (' + team.length + '명)').join(' / ') + '</div></div>'
            ).join('') + '</div>';
        }

        function restoreTeamHistory(index) {
            if (teamGenerationRunning) return;
            const entry = visibleTeamHistory[index];
            if (!entry) return;
            // 당시 레이팅을 보존한다. 이름으로 현재 선수를 덮어쓰지 않는다.
            const teams = entry.teams.map(team => team.map(p => ({ ...p })));
            playerTeamLocks = Object.create(null);
            pendingPlayerSwap = null;
            teamConfigurationVersion++;
            currentTeamMeta = { mode: entry.mode || 'futsal', onFieldCount: entry.onFieldCount || Math.min(6, ...teams.map(t => t.length)), confirmed: false };
            renderTeams(teams, teams.map(t => t.length));
            markTeamsUnconfirmed();
            document.getElementById('teamActions').style.display = 'flex';
            document.getElementById('teamHistorySection').style.display = 'none';
            document.getElementById('teamGenerationSummary').textContent = '이전 명단을 복원하고 선수 잠금을 초기화했습니다. 실제 사용할 팀을 확정해주세요.';
            showToast('이전 팀이 복원되었습니다.');
        }

        // 초기값으로 되돌리기
        async function resetToDefault() {
            if (!isAdmin) {
                showToast('관리자만 초기값으로 되돌릴 수 있습니다.', 'error');
                return;
            }

            if (!db) {
                showToast('Firebase가 초기화되지 않았습니다.', 'error');
                return;
            }

            const confirmed = await showConfirm('모든 선수 데이터를 초기 상태로 되돌리시겠습니까?\n(추가/수정/삭제한 모든 내용이 초기값으로 복원됩니다)');
            if (confirmed) {
                try {
                    // 기존 선수 모두 삭제 (500개 제한 대응)
                    const playersSnapshot = await db.collection('players').get();
                    if (playersSnapshot.docs.length > 0) {
                        let batch1 = db.batch();
                        let count1 = 0;
                        for (const doc of playersSnapshot.docs) {
                            batch1.delete(doc.ref);
                            count1++;
                            if (count1 >= 499) {
                                await batch1.commit();
                                batch1 = db.batch();
                                count1 = 0;
                            }
                        }
                        if (count1 > 0) await batch1.commit();
                    }

                    // 투표 데이터 삭제 (500개 제한 대응)
                    const votesSnapshot = await db.collection('votes').get();
                    if (votesSnapshot.docs.length > 0) {
                        let batch2 = db.batch();
                        let count2 = 0;
                        for (const doc of votesSnapshot.docs) {
                            batch2.delete(doc.ref);
                            count2++;
                            if (count2 >= 499) {
                                await batch2.commit();
                                batch2 = db.batch();
                                count2 = 0;
                            }
                        }
                        if (count2 > 0) await batch2.commit();
                    }
                    
                    // 기본 선수 데이터 추가
                    await initializeDefaultPlayers();
                    
                    // 선택된 선수 목록 초기화
                    setSelectedPlayers([]);
                    
                    // 선수 목록 다시 로드
                    await loadPlayersFromFirebase();
                    
                    showToast('초기값으로 복원되었습니다.', 'success');
                } catch (error) {
                    console.error('초기화 실패:', error);
                    showToast('초기화에 실패했습니다: ' + error.message, 'error');
                }
            }
        }
        
        // 투표 모달 열기
        // 황제(👑) 투표는 1명만 가능 — 한 명을 황제로 선택하면 나머지 select의 황제 옵션 비활성화
        function enforceEmperorVoteLimit() {
            const selects = document.querySelectorAll('#voteGrid .vote-select');
            const emperorSelect = Array.from(selects).find(s => s.value === '황제');
            const emperorTaken = !!emperorSelect;
            const emperorName = emperorSelect ? (emperorSelect.dataset.playerName || '') : '';
            selects.forEach(s => {
                const isEmperor = s.value === '황제';
                // 옵션 잠금 + 자물쇠 표시 (드롭다운 열었을 때)
                for (const opt of s.options) {
                    if (opt.value === '황제') {
                        const lock = emperorTaken && !isEmperor;
                        opt.disabled = lock;
                        opt.textContent = lock ? '🔒 👑' : '👑';
                    }
                }
                // 황제로 선택된 행 강조 (드롭다운 안 열어도 보이게)
                const row = s.closest('.vote-item');
                if (row) row.classList.toggle('emperor-selected', isEmperor);
            });
            // 항상 보이는 안내 문구
            const notice = document.getElementById('emperorVoteNotice');
            if (notice) {
                notice.innerHTML = emperorTaken
                    ? `👑 황제는 1명만 투표 가능 — 현재 <b>${escapeHtml(emperorName)}</b> 선택됨 (다른 선수는 🔒 잠김)`
                    : '👑 황제 티어는 1명만 투표할 수 있어요';
            }
        }

            // 기존 투표 데이터 가져오기 (있으면 미리 채우기)

                        <option value="B+" ${selectedTier === 'B+' ? 'selected' : ''}>B+</option>
                        <option value="B" ${selectedTier === 'B' ? 'selected' : ''}>B</option>

            // 황제(👑) 투표는 1명만 — 모달 열 때 초기 상태 반영 (기존 투표 불러온 경우 포함)
            enforceEmperorVoteLimit();

            document.getElementById('voteModal').classList.add('active');
            // 모달이 열릴 때 body 스크롤 막기
            document.body.style.overflow = 'hidden';

            // 모달 내부 스크롤 영역에 터치 이벤트 핸들러 추가 (모바일)
            const voteContentEl = document.getElementById('voteContent');
            let startY = 0;

            // 기존 터치 핸들러 제거 후 재등록 (중복 방지)
            if (voteContentEl._touchStartHandler) {
                voteContentEl.removeEventListener('touchstart', voteContentEl._touchStartHandler);
                voteContentEl.removeEventListener('touchmove', voteContentEl._touchMoveHandler);
                voteContentEl.removeEventListener('touchend', voteContentEl._touchEndHandler);
            }

            voteContentEl._touchStartHandler = function(e) {
                startY = e.touches[0].clientY;
            };
            voteContentEl._touchMoveHandler = function(e) {
                const currentY = e.touches[0].clientY;
                const scrollTop = voteContentEl.scrollTop;
                const scrollHeight = voteContentEl.scrollHeight;
                const clientHeight = voteContentEl.clientHeight;

                const isAtTop = scrollTop === 0;
                const isAtBottom = scrollTop + clientHeight >= scrollHeight - 1;
                const isScrollingUp = currentY > startY;
                const isScrollingDown = currentY < startY;

                if ((isAtTop && isScrollingUp) || (isAtBottom && isScrollingDown)) {
                    e.preventDefault();
                }
            };
            voteContentEl._touchEndHandler = function() {};

            voteContentEl.addEventListener('touchstart', voteContentEl._touchStartHandler, { passive: true });
            voteContentEl.addEventListener('touchmove', voteContentEl._touchMoveHandler, { passive: false });
            voteContentEl.addEventListener('touchend', voteContentEl._touchEndHandler, { passive: true });
        }
        
        // 투표 모달 닫기

        // 투표 제출
        async function submitVote() {
            if (submitting['vote']) return;
            submitting['vote'] = true;
            // 버튼 비활성화
            const voteSubmitBtn = document.querySelector('#voteModal .btn-primary');
            if (voteSubmitBtn) { voteSubmitBtn.disabled = true; voteSubmitBtn.innerHTML = '<span class="btn-spinner"></span>제출 중...'; }

            const deviceId = getDeviceId();
            const votes = [];

            players.forEach((player, idx) => {
                const select = document.getElementById(`vote_idx_${idx}`);
                if (select) {
                    votes.push({
                        playerName: player.name,
                        tier: select.value
                    });
                }
            });
            
            // 안전장치: 황제(👑)는 1명만 투표 가능
            if (votes.filter(v => v.tier === '황제').length > 1) {
                showToast('황제(👑)는 1명만 투표할 수 있습니다.', 'warning');
                if (voteSubmitBtn) { voteSubmitBtn.disabled = false; voteSubmitBtn.innerHTML = '투표 제출'; }
                submitting['vote'] = false;
                return;
            }

            try {
                // 기존 투표 삭제 (이 디바이스의 모든 투표)
                const existingVotesSnapshot = await db.collection('votes')
                    .where('deviceId', '==', deviceId)
                    .get();
                
                const batch = db.batch();
                existingVotesSnapshot.docs.forEach(doc => {
                    batch.delete(doc.ref);
                });
                
                // 새 투표 추가
                const timestamp = firebase.firestore.FieldValue.serverTimestamp();
                votes.forEach(({ playerName, tier }) => {
                    const voteRef = db.collection('votes').doc();
                    batch.set(voteRef, {
                        playerName,
                        tier,
                        deviceId,
                        timestamp
                    });
                });
                
                await batch.commit();
                
                // 티어 업데이트 (투표 평균 계산)
                await updateTiersFromVotes(isAdmin);

                closeVoteModal();
                showToast('투표가 완료되었습니다.', 'success');
            } catch (error) {
                console.error('투표 제출 실패:', error);
                showToast('투표 제출에 실패했습니다.', 'error');
            } finally {
                submitting['vote'] = false;
                if (voteSubmitBtn) { voteSubmitBtn.disabled = false; voteSubmitBtn.textContent = '투표 제출'; }
            }
        }

        // 선수 추가
        async function addPlayer() {
            if (submitting['addPlayer']) return;

            if (!isAdmin) {
                showToast('관리자만 선수를 추가할 수 있습니다.', 'error');
                return;
            }

            if (!db || typeof db === 'undefined') {
                showToast('Firebase가 초기화되지 않았습니다. 페이지를 새로고침해주세요.', 'error');
                return;
            }

            const name = document.getElementById('newPlayerName').value.trim();
            const tier = document.getElementById('newPlayerTier').value;

            if (!name) {
                showToast('이름을 입력해주세요.', 'warning');
                return;
            }

            if (name.length > 20) {
                showToast('이름은 20자 이내로 입력해주세요.', 'warning');
                return;
            }

            if (players.some(p => p.name === name)) {
                showToast('이미 존재하는 선수입니다.', 'warning');
                return;
            }

            submitting['addPlayer'] = true;
            try {
                const docRef = await db.collection('players').add({
                    name,
                    tier,
                    baseTier: tier,
                    manualTier: null,
                    win: 0,
                    draw: 0,
                    loss: 0
                });
                // 로컬 배열에도 즉시 추가 (리스너 실패 시 대비)
                // 단, 실시간 리스너가 await 도중 이미 추가했을 수 있으므로 id 중복 방지
                if (!players.some(p => p.id === docRef.id)) {
                    players.push({ id: docRef.id, name, tier, baseTier: tier, manualTier: null, win: 0, draw: 0, loss: 0 });
                }
                sortPlayersByName();
                renderPlayers();
                renderTierTable();
                document.getElementById('newPlayerName').value = '';
                showToast(`${name} 선수가 추가되었습니다.`, 'success');
            } catch (error) {
                console.error('선수 추가 실패:', error);
                showToast('선수 추가에 실패했습니다: ' + error.message, 'error');
            } finally {
                submitting['addPlayer'] = false;
            }
        }

        // 선수 정보 업데이트 (ID로)
        async function updatePlayerById(playerId, field, value) {
            if (!isAdmin || !db) { showToast('관리자 연결 상태를 확인해주세요.', 'error'); return; }
            const player = players.find(p => p.id === playerId);
            if (!player || field !== 'tier' || (value !== 'auto' && !Object.hasOwn(tierWeights, value))) return;
            const baseTier = player.baseTier || 'B';
            const changes = value === 'auto'
                ? { manualTier: null, baseTier }
                : { manualTier: value, baseTier, tier: value, rating: tierWeights[value] };
            try {
                await db.collection('players').doc(playerId).update(changes);
                const current = players.find(p => p.id === playerId);
                if (current) Object.assign(current, changes);
                await updateTiersFromVotes(false, latestVotes);
                renderPlayers();
                showToast(value === 'auto' ? '투표 자동 평가로 변경했습니다.' : '관리자 지정 티어를 적용했습니다.');
            } catch (error) {
                console.error('선수 정보 업데이트 실패:', error);
                showToast('업데이트에 실패했습니다.', 'error');
                renderPlayers();
            }
        }

        // 선수 삭제 (ID로)
        async function deletePlayerById(playerId) {
            if (!isAdmin) {
                showToast('관리자만 선수를 삭제할 수 있습니다.', 'error');
                return;
            }

            if (!db) {
                showToast('Firebase가 초기화되지 않았습니다.', 'error');
                return;
            }

            if (!playerId) {
                showToast('선수 정보를 찾을 수 없습니다.', 'error');
                return;
            }

            const player = players.find(p => p.id === playerId);
            if (!player) {
                showToast('선수 정보를 찾을 수 없습니다.', 'error');
                return;
            }

            const playerName = player.name;
            const confirmed = await showConfirm(`${playerName} 선수를 삭제하시겠습니까?`);
            if (confirmed) {
                try {
                    // 선택 목록에서도 제거
                    setSelectedPlayers([...selectedPlayers].filter(name => name !== playerName));

                    await db.collection('players').doc(playerId).delete();

                    // 로컬 배열에서도 즉시 제거 (리스너 실패 시 대비)
                    players = players.filter(p => p.id !== playerId);
                    sortPlayersByName();
                    renderPlayers();
                    renderTierTable();

                    // 투표 데이터도 삭제
                    const votesSnapshot = await db.collection('votes')
                        .where('playerName', '==', playerName)
                        .get();

                    if (!votesSnapshot.empty) {
                        const batch = db.batch();
                        votesSnapshot.docs.forEach(doc => {
                            batch.delete(doc.ref);
                        });
                        await batch.commit();
                    }
                } catch (error) {
                    console.error('선수 삭제 실패:', error);
                    showToast('삭제에 실패했습니다: ' + error.message, 'error');
                }
            }
        }

        // 풋살팀 구성 규칙
        function getFutsalTeamSizes(totalPlayers) {
            const rules = {
                12: [6, 6],
                13: [7, 6],
                14: [7, 7],
                15: [5, 5, 5],
                16: [8, 8],
                17: [6, 6, 5],
                18: [6, 6, 6],
                19: [7, 6, 6],
                20: [7, 7, 6],
                21: [7, 7, 7],
                22: [6, 6, 5, 5],
                23: [6, 6, 6, 5],
                24: [6, 6, 6, 6],
                25: [7, 6, 6, 6],
                26: [7, 7, 6, 6],
                27: [7, 7, 7, 6],
                28: [7, 7, 7, 7]
            };
            
            if (rules[totalPlayers]) {
                return rules[totalPlayers];
            }
            
            // 10-11명인 경우 기본 처리 (2팀)
            if (totalPlayers < 12) {
                const teamSize = Math.floor(totalPlayers / 2);
                const remainder = totalPlayers % 2;
                if (remainder === 0) {
                    return [teamSize, teamSize];
                } else {
                    return [teamSize + 1, teamSize];
                }
            }

            return null;
        }

        // 지정한 팀 수로 인원을 최대한 균등하게 분배 (큰 팀 먼저)
        // 예: 20명 3팀 → [7,7,6], 20명 4팀 → [5,5,5,5], 16명 3팀 → [6,5,5]
        function computeEvenTeamSizes(totalPlayers, numTeams) {
            const base = Math.floor(totalPlayers / numTeams);
            const remainder = totalPlayers % numTeams;
            const sizes = [];
            for (let i = 0; i < numTeams; i++) {
                sizes.push(i < remainder ? base + 1 : base);
            }
            return sizes;
        }

        // 축구팀 구성 규칙 (2팀으로 나누기)
        function getSoccerTeamSizes(totalPlayers) {
            const teamSize = Math.floor(totalPlayers / 2);
            const remainder = totalPlayers % 2;
            if (remainder === 0) {
                return [teamSize, teamSize];
            } else {
                return [teamSize + 1, teamSize];
            }
        }

        // 풋살팀 구성 생성
        // 선수 가중치 (티어 점수 기반)
        function getEffectiveWeight(player) {
            return TeamBuilder.weight(player);
        }

        // 공통 팀 생성 로직 (로딩 스피너 포함)
        async function runTeamGeneration(selectedPlayersList, teamSizes, btnId, mode = 'futsal') {
            if (teamGenerationRunning) return;
            const selectedIds = new Set(selectedPlayersList.map(TeamBuilder.identity));
            if (Object.keys(playerTeamLocks).some(id => !selectedIds.has(id))) {
                resetPlayerLocks('선수 선택이 바뀌어 선수 잠금을 모두 해제했습니다.');
            }
            // Keep existing team capacities/labels when the roster size is unchanged.
            if (Object.keys(playerTeamLocks).length && currentTeamSizes &&
                JSON.stringify(teamSizes.slice().sort((a,b) => a-b)) === JSON.stringify(currentTeamSizes.slice().sort((a,b) => a-b))) {
                teamSizes = currentTeamSizes.slice();
            }
            const value = document.getElementById('onFieldCountSelect').value;
            const onFieldCount = value === 'auto' ? Math.min(mode === 'soccer' ? 11 : 6, ...teamSizes) : Number(value);
            if (!Number.isInteger(onFieldCount) || onFieldCount < 1 || teamSizes.some(size => size < onFieldCount)) {
                showToast('모든 팀에 출전 인원 이상의 선수가 필요합니다.', 'warning'); return;
            }
            const roster = selectedPlayersList.map(p => ({ ...p }));
            const largerTeamPlayer = roster.find(p => p.name.trim() === '문찬우');
            const signature = list => JSON.stringify(list.map(p => [p.id || p.name, p.tier, getEffectiveWeight(p)]).sort((a,b) => String(a[0]).localeCompare(String(b[0]))));
            const initialSignature = signature(roster);
            const initialConfigurationVersion = teamConfigurationVersion;
            const buttons = ['futsalBtn', 'soccerBtn'].map(id => document.getElementById(id));
            const previousText = buttons.map(button => button.textContent);
            teamGenerationRunning = true;
            clearPlayerSwapSelection();
            buttons.forEach(button => button.disabled = true);
            document.getElementById(btnId).innerHTML = '<span class="btn-spinner"></span>생성 중...';
            try {
                const resolveHistory = entry => ({ ...entry, teams: entry.teams.map(team => team.map(p => ({ ...p, id: p.id || players.find(x => x.name === p.name)?.id || p.name }))) });
                const options = {
                    onFieldCount,
                    locks: { ...playerTeamLocks },
                    largerTeamPlayerId: largerTeamPlayer ? TeamBuilder.identity(largerTeamPlayer) : undefined,
                    history: readTeamHistory(CONFIRMED_TEAM_HISTORY_KEY).filter(e => e.mode === mode && e.onFieldCount === onFieldCount).map(resolveHistory),
                    previews: teamPreviewHistory.map(resolveHistory),
                    lastKey: currentTeamsData ? TeamBuilder.teamKey(currentTeamsData) : ''
                };
                const result = await generateTeamsOffThread(roster, teamSizes, options);
                if (teamConfigurationVersion !== initialConfigurationVersion || signature(players.filter(p => selectedPlayers.has(p.name))) !== initialSignature) {
                    showToast('선택 선수나 편성 조건·평가가 변경되었습니다. 다시 편성해주세요.', 'warning'); return;
                }
                currentTeamMeta = { mode, onFieldCount, confirmed: false };
                renderTeams(result.teams, result.teamSizes);
                markTeamsUnconfirmed();
                teamPreviewHistory.unshift(makeTeamHistoryEntry(result.teams, currentTeamMeta));
                teamPreviewHistory = teamPreviewHistory.slice(0, 5);
                document.getElementById('teamActions').style.display = 'flex';
                document.getElementById('teamGenerationSummary').textContent = '티어 분산 우선 · 팀별 ' + onFieldCount + '명 출전 · 나머지는 교체 · 평균 차이 ' + result.metrics.spread.toFixed(2) +
                    (result.largerTeamPlayerId ? ' · 문찬우(GK)는 인원이 많은 팀에 배정했습니다.' : '') +
                    (result.metrics.tierScore > 0 ? ' · 현재 배정 조건에서는 티어를 완전히 고르게 나눌 수 없습니다.' : '') +
                    (result.repeated ? ' · 현재 조건에서 다른 후보를 찾지 못했습니다.' : '');
                showToast('팀 편성이 완료되었습니다. 최종 팀을 확정해주세요.');
            } catch (error) {
                console.error('팀 편성 실패:', error);
                showToast(error.message || '팀 편성에 실패했습니다.', 'error');
            } finally {
                teamGenerationRunning = false;
                updatePlayerSwapSelection();
                buttons.forEach((button, i) => { button.disabled = false; button.textContent = previousText[i]; });
            }
        }

        async function generateTeamsOffThread(roster, sizes, options) {
            if (typeof Worker !== 'undefined' && location.protocol !== 'file:') {
                try {
                    return await new Promise((resolve, reject) => {
                        const worker = new Worker('team-builder.js');
                        const timeout = setTimeout(() => { worker.terminate(); reject(new Error('편성 작업 시간 초과')); }, 10000);
                        const finish = () => { clearTimeout(timeout); worker.terminate(); };
                        worker.onmessage = event => { finish(); event.data.error ? reject(new Error(event.data.error)) : resolve(event.data.result); };
                        worker.onerror = event => { event.preventDefault(); finish(); reject(new Error('Worker 실행 실패')); };
                        worker.postMessage({ roster, sizes, options });
                    });
                } catch (error) { console.warn('기본 편성 방식으로 재시도:', error.message); }
            }
            return TeamBuilder.generate(roster, sizes, { ...options, yieldTask: () => new Promise(resolve => setTimeout(resolve, 0)) });
        }

        function generateFutsalTeams() {
            if (!prepareTeamGeneration('futsal')) return;
            const selectedPlayersList = players.filter(p => selectedPlayers.has(p.name));
            const totalPlayers = selectedPlayersList.length;

            if (totalPlayers < 10) {
                showToast('최소 10명의 선수를 선택해주세요.', 'warning');
                return;
            }
            if (totalPlayers >= 29) {
                showToast('그냥 축구를 하세요', 'warning');
                return;
            }

            // 팀 수 선택: '자동'이면 기존 고정 규칙, 숫자면 균등 분배
            const teamCountSel = document.getElementById('teamCountSelect');
            const teamCountValue = teamCountSel ? teamCountSel.value : 'auto';

            let teamSizes;
            if (teamCountValue === 'auto') {
                teamSizes = getFutsalTeamSizes(totalPlayers);
                if (!teamSizes) {
                    showToast('풋살팀 구성이 불가능한 인원 수입니다.', 'warning');
                    return;
                }
            } else {
                const numTeams = parseInt(teamCountValue, 10);
                if (![2, 3, 4].includes(numTeams) || totalPlayers < numTeams * 5) {
                    showToast('풋살은 팀별 최소 5명이 필요합니다.', 'warning');
                    return;
                }
                teamSizes = computeEvenTeamSizes(totalPlayers, numTeams);
            }

            return runTeamGeneration(selectedPlayersList, teamSizes, 'futsalBtn');
        }

        function generateSoccerTeams() {
            if (!prepareTeamGeneration('soccer')) return;
            const selectedPlayersList = players.filter(p => selectedPlayers.has(p.name));
            const totalPlayers = selectedPlayersList.length;

            if (totalPlayers < 2) {
                showToast('최소 2명의 선수를 선택해주세요.', 'warning');
                return;
            }
            const teamSizes = getSoccerTeamSizes(totalPlayers);
            return runTeamGeneration(selectedPlayersList, teamSizes, 'soccerBtn', 'soccer');
        }

        // 티어 표시/숨기기 토글
        function toggleTierVisibility() {
            showTier = !document.getElementById('hideTierCheckbox').checked;
            // 현재 표시된 팀이 있으면 다시 렌더링
            if (currentTeamsData && currentTeamSizes) {
                renderTeams(currentTeamsData, currentTeamSizes);
            }
        }
        
        // 잠금은 현재 편성 조건에만 유효하며 저장소에 보관하지 않는다.
        function resetPlayerLocks(message = '편성 조건이 바뀌어 선수 잠금을 모두 해제했습니다.') {
            const hadLocks = Object.keys(playerTeamLocks).length > 0;
            playerTeamLocks = Object.create(null);
            clearPlayerSwapSelection();
            // 계산 중 조건이 바뀌었다 되돌아와도 이전 잠금을 사용한 결과를 적용하지 않는다.
            teamConfigurationVersion++;
            if (hadLocks && currentTeamsData && currentTeamSizes) renderTeams(currentTeamsData, currentTeamSizes);
            if (hadLocks) showToast(message);
        }

        function prepareTeamGeneration(mode) {
            if (teamGenerationRunning) return false;
            clearPlayerSwapSelection();
            if (currentTeamMeta && currentTeamMeta.mode !== mode) {
                resetPlayerLocks('풋살·축구 경기 방식이 바뀌어 선수 잠금을 모두 해제했습니다.');
            }
            return true;
        }

        function togglePlayerLock(playerId, teamIndex) {
            if (teamGenerationRunning || !currentTeamsData || !currentTeamsData[teamIndex]?.some(p => TeamBuilder.identity(p) === playerId)) return;
            if (Object.hasOwn(playerTeamLocks, playerId)) delete playerTeamLocks[playerId];
            else playerTeamLocks[playerId] = teamIndex;
            pendingPlayerSwap = null;
            renderTeams(currentTeamsData, currentTeamSizes);
        }

        // 이름을 하나씩 선택해 서로 다른 팀의 두 선수를 한 번에 맞교환한다.
        function updatePlayerSwapSelection() {
            const selectedPlayer = isAdmin && !teamGenerationRunning && pendingPlayerSwap
                ? currentTeamsData?.[pendingPlayerSwap.teamIndex]?.find(p => TeamBuilder.identity(p) === pendingPlayerSwap.playerId)
                : null;
            if (!selectedPlayer || Object.hasOwn(playerTeamLocks, pendingPlayerSwap.playerId)) pendingPlayerSwap = null;
            document.getElementById('playerSwapControls').hidden = !isAdmin || !pendingPlayerSwap;
            document.getElementById('playerSwapSummary').textContent = teamGenerationRunning
                ? '팀 편성이 끝나면 선수를 맞교환할 수 있습니다.'
                : pendingPlayerSwap
                    ? '팀 ' + (pendingPlayerSwap.teamIndex + 1) + ' ' + selectedPlayer.name + ' 선택 · 다른 팀의 선수 이름을 누르면 맞교환합니다.'
                    : '↔ 서로 다른 팀의 선수 이름을 한 명씩 누르면 인원을 유지하며 맞교환합니다.';
            document.getElementById('cancelPlayerSwapBtn').hidden = !pendingPlayerSwap;
            document.querySelectorAll('#teamsContainer .player-swap').forEach(button => {
                const row = button.closest('.team-player');
                const selected = !!pendingPlayerSwap && row.dataset.playerId === pendingPlayerSwap.playerId && Number(row.dataset.teamIndex) === pendingPlayerSwap.teamIndex;
                button.setAttribute('aria-pressed', String(selected));
                button.setAttribute('aria-disabled', String(teamGenerationRunning || Object.hasOwn(playerTeamLocks, row.dataset.playerId)));
                row.classList.toggle('swap-selected', selected);
            });
        }

        function clearPlayerSwapSelection() {
            pendingPlayerSwap = null;
            updatePlayerSwapSelection();
        }

        function selectPlayerForSwap(playerId, teamIndex) {
            if (!isAdmin) { showToast('관리자만 선수를 맞교환할 수 있습니다.', 'error'); return; }
            if (teamGenerationRunning || !currentTeamsData || !currentTeamSizes) return;
            updatePlayerSwapSelection();
            if (!currentTeamsData[teamIndex]?.some(p => TeamBuilder.identity(p) === playerId)) return;
            if (Object.hasOwn(playerTeamLocks, playerId)) {
                showToast('고정된 선수는 자물쇠를 해제한 뒤 교환해주세요.', 'warning'); return;
            }
            if (pendingPlayerSwap && pendingPlayerSwap.teamIndex !== teamIndex) {
                swapTeamPlayers(pendingPlayerSwap.playerId, pendingPlayerSwap.teamIndex, playerId, teamIndex);
                return;
            }
            pendingPlayerSwap = pendingPlayerSwap?.playerId === playerId ? null : { playerId, teamIndex };
            updatePlayerSwapSelection();
        }

        function swapTeamPlayers(firstPlayerId, firstTeamIndex, secondPlayerId, secondTeamIndex) {
            if (!isAdmin) { showToast('관리자만 선수를 맞교환할 수 있습니다.', 'error'); return false; }
            if (teamGenerationRunning || !currentTeamsData || !currentTeamSizes || firstTeamIndex === secondTeamIndex || firstPlayerId === secondPlayerId) return false;
            const firstTeam = currentTeamsData[firstTeamIndex], secondTeam = currentTeamsData[secondTeamIndex];
            const firstIndex = firstTeam?.findIndex(p => TeamBuilder.identity(p) === firstPlayerId) ?? -1;
            const secondIndex = secondTeam?.findIndex(p => TeamBuilder.identity(p) === secondPlayerId) ?? -1;
            if (firstIndex < 0 || secondIndex < 0) { clearPlayerSwapSelection(); return false; }
            if (Object.hasOwn(playerTeamLocks, firstPlayerId) || Object.hasOwn(playerTeamLocks, secondPlayerId)) {
                showToast('고정된 선수는 자물쇠를 해제한 뒤 교환해주세요.', 'warning'); return false;
            }
            const firstPlayer = firstTeam[firstIndex], secondPlayer = secondTeam[secondIndex];
            // 두 자리를 바로 교체하므로 출전·교체 인원과 다른 선수의 잠금은 유지된다.
            firstTeam[firstIndex] = secondPlayer;
            secondTeam[secondIndex] = firstPlayer;
            finishManualTeamEdit();
            showToast(firstPlayer.name + ' ↔ ' + secondPlayer.name + ' 맞교환 완료');
            const target = [...document.querySelectorAll('#teamsContainer .player-swap')]
                .find(button => button.closest('.team-player').dataset.playerId === secondPlayerId);
            target?.focus({ preventScroll: true });
            return true;
        }

        function finishManualTeamEdit() {
            pendingPlayerSwap = null;
            // 수동 조정한 명단은 다시 확정해야 경기 이력에 반영된다.
            markTeamsUnconfirmed();
            renderTeams(currentTeamsData, currentTeamSizes);
            const needsPlayers = currentTeamMeta && currentTeamsData.some(team => team.length < currentTeamMeta.onFieldCount);
            document.getElementById('teamGenerationSummary').textContent = needsPlayers
                ? '선수 이동을 마친 뒤 팀별 출전 인원을 맞춰 확정해주세요.'
                : TeamBuilder.tierViolations(currentTeamsData) > 0 ? '수동 조정으로 티어가 몰린 팀이 있습니다. 확인 후 팀을 확정해주세요.' : '수동 조정한 팀을 확정해주세요.';
        }

                showToast('관리자만 선수를 이동할 수 있습니다.', 'error');

            if (teamGenerationRunning || fromTeamIndex === toTeamIndex || !currentTeamsData[fromTeamIndex] || !currentTeamsData[toTeamIndex]) return;
            // 선수 교환 도중의 인원 부족은 허용하고, 최종 확정 시 출전 인원을 확인한다.

            const fromTeam = currentTeamsData[fromTeamIndex];
            const playerIndex = fromTeam.findIndex(p => p.name === playerName);

            if (playerIndex === -1) {
                showToast('선수를 찾을 수 없습니다.', 'error');
                return;
            }
            
            const player = fromTeam[playerIndex];
            if (Object.hasOwn(playerTeamLocks, TeamBuilder.identity(player))) {
                showToast('고정된 선수는 자물쇠를 해제한 뒤 이동해주세요.', 'warning'); return;
            }
            
            // 선수 이동
            fromTeam.splice(playerIndex, 1);
            currentTeamsData[toTeamIndex].push(player);
            
            // 팀 크기 업데이트
            currentTeamSizes[fromTeamIndex]--;
            currentTeamSizes[toTeamIndex]++;
            
            finishManualTeamEdit();
